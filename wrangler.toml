# Cấu hình deploy site "Góc Học Tập" lên Cloudflare Workers.
#
# Deploy:  ./scripts/publish_cf.sh      (hoặc: npx wrangler deploy)
#
# Chuẩn bị một lần:
#   npx wrangler login
#   npx wrangler kv namespace create PROGRESS_KV     # rồi dán id vào dưới
#   npx wrangler secret put LMS_SECRET          # nhập mã bí mật
#
# Lưu ý: assets trỏ vào public/ (do scripts/prepare_cf.sh dựng từ dist/, đã lọc
# bỏ tài liệu). KHÔNG trỏ thẳng vào dist/ để không phải xoá file gốc.

name = "lms"
main = "worker/index.js"

# Ghim nơi Worker CHẠY về Singapore.
#
# Vì sao: `generativelanguage.googleapis.com` (Gemini) CHẶN THEO VỊ TRÍ NGƯỜI GỌI,
# và Google không hỗ trợ Hong Kong. Cloudflare chọn colo theo từng lượt, nên cùng
# một khoá lúc chạy lúc không — đã đo: colo SIN thì 200, colo HKG thì 400
# "User location is not supported for the API use". Việc thử-lại không cứu được vì
# colo ổn định suốt phiên (đo 10/10 lượt đều HKG).
#
# Chọn `asia-southeast1` chứ không phải vùng Mỹ: Gemini hỗ trợ Singapore, mà
# Singapore cũng chính là colo vốn đang phục vụ người dùng ở Việt Nam — nên gần
# như không đổi độ trễ. Ghim sang Mỹ thì mọi lượt /api/progress cũng chậm theo.
#
# Tệp tĩnh KHÔNG bị ảnh hưởng: Cloudflare luôn phục vụ chúng từ colo gần người
# dùng nhất, bất kể ghim ở đâu.
compatibility_date = "2026-08-20"

[placement]
# mode "targeted" = ghim vùng cụ thể. Không dùng "smart" (chế độ tự chọn theo
# độ trễ): ta cần CHẮC CHẮN không rơi vào Hong Kong, chứ không phải tối ưu tốc độ.
mode = "targeted"
region = "gcp:asia-southeast1"


[vars]
# Cột trạng thái trong bảng của lớp, đánh số từ 0 (E = 4).
# Không phải bí mật nên để var; SHEET_ID/SHEET_GID thì là secret vì sheet
# cho phép sửa ẩn danh, lộ id là ai cũng vào phá được.
SHEET_COL = "4"

[assets]
directory = "public"
binding = "ASSETS"
# Mặc định Cloudflare trả 307 từ "/pl/x.html" sang "/pl/x" — mỗi lần bấm vào một
# môn là một vòng đi-về thừa. Trang chủ trỏ tới link .html (phải vậy để dist/ còn
# chạy được trên GitHub Pages lẫn khi mở file cục bộ), nên tắt hẳn cơ chế này.
# Đổi lại, "/" không tự tìm index.html nữa — worker/index.js viết lại giúp.
html_handling = "none"

[[kv_namespaces]]
binding = "PROGRESS_KV"
id = "490c8ae7c319483d953f95f7855b6ad1"

# D1 lưu lịch sử ôn tập. KHÔNG dùng KV cho việc này: KV không có CAS nên một
# phiên luyện tập (chùm ghi dồn dập) dễ mất trắng, và truy vấn "câu nào hay sai"
# trên KV là parse toàn kho mỗi lần gọi — vượt trần 10ms CPU của gói free.
# Migration phải áp TAY từ máy dev, CI không có chỗ chạy:
#   npx wrangler d1 execute lms-study --remote --file=migrations/0001_study.sql
[[d1_databases]]
binding = "STUDY_DB"
database_name = "lms-study"
database_id = "8cc125df-56ea-46b2-ad33-e8069bd817c9"
