<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="Andika, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">
<title>A ball rolls straight, a push from the side hits it, and its path bends to a new direction.</title>
<!-- before: the ball rolled straight (dotted trail) -->
<path d="M26,215 H266" stroke="#94a3b8" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 18" fill="none"/>
<!-- the ball at the moment of the push -->
<circle cx="300" cy="215" r="30" fill="#f59e0b" stroke="#b45309" stroke-width="6"/>
<!-- the push comes from the side (below) -->
<path d="M300,292 V262" stroke="#dc2626" stroke-width="13" stroke-linecap="round" fill="none"/>
<path d="M276,266 L300,238 L324,266 Z" fill="#dc2626" stroke="#dc2626" stroke-width="4" stroke-linejoin="round"/>
<text x="340" y="282" font-size="30" font-weight="700" fill="#b91c1c" text-anchor="start">push</text>
<!-- after: the path bends to the new direction -->
<path d="M328,203 C372,194 396,172 414,138 L440,90" stroke="#334155" stroke-width="10" stroke-linecap="round" fill="none"/>
<g transform="translate(446,78) rotate(-62)"><path d="M-6,-24 L28,0 L-6,24 Z" fill="#334155" stroke="#334155" stroke-width="4" stroke-linejoin="round"/></g>
</svg>
