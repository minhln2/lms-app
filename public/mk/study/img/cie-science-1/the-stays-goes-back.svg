<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Andika, 'Segoe UI', system-ui, sans-serif"><title>Play dough: squash it and let go, it stays flat (stays the same). Sponge: squash it and let go, it goes back to its shape (goes back).</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<g><rect x="10" y="12" width="360" height="276" rx="24" fill="#fff7ed" stroke="#ea580c" stroke-width="6"/>
<text x="190" y="44" font-size="28" text-anchor="middle" fill="#9a3412" font-weight="700">play dough</text>
<circle cx="70" cy="150" r="38" fill="#fb923c" stroke="#9a3412" stroke-width="3"/>
<path d="M112 150 H142" stroke="#475569" stroke-width="5" marker-end="url(#ah)"/>
<path d="M190 62 V128" stroke="#334155" stroke-width="6" marker-end="url(#ah)"/><text x="204" y="98" font-size="18" text-anchor="start" fill="#475569">squash</text>
<ellipse cx="190" cy="168" rx="48" ry="16" fill="#fb923c" stroke="#9a3412" stroke-width="3"/>
<path d="M242 150 H272" stroke="#475569" stroke-width="5" marker-end="url(#ah)"/><text x="257" y="136" font-size="18" text-anchor="middle" fill="#475569">let go</text>
<ellipse cx="315" cy="168" rx="48" ry="16" fill="#fb923c" stroke="#9a3412" stroke-width="3"/>
<text x="190" y="262" font-size="34" text-anchor="middle" fill="#9a3412" font-weight="700">stays the same</text></g>
<g><rect x="390" y="12" width="360" height="276" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="6"/>
<text x="570" y="44" font-size="28" text-anchor="middle" fill="#1e40af" font-weight="700">sponge</text>
<rect x="420" y="112" width="64" height="76" rx="8" fill="#fde047" stroke="#a16207" stroke-width="3"/>
<g fill="#ca8a04"><circle cx="438" cy="132" r="5"/><circle cx="466" cy="146" r="6"/><circle cx="442" cy="168" r="5"/><circle cx="470" cy="176" r="4"/></g>
<path d="M492 150 H522" stroke="#475569" stroke-width="5" marker-end="url(#ah)"/>
<path d="M570 62 V136" stroke="#334155" stroke-width="6" marker-end="url(#ah)"/><text x="584" y="102" font-size="18" text-anchor="start" fill="#475569">squash</text>
<rect x="534" y="160" width="72" height="28" rx="6" fill="#fde047" stroke="#a16207" stroke-width="3"/>
<g fill="#ca8a04"><circle cx="552" cy="174" r="4"/><circle cx="578" cy="170" r="4"/><circle cx="594" cy="180" r="3"/></g>
<path d="M614 150 H644" stroke="#475569" stroke-width="5" marker-end="url(#ah)"/><text x="629" y="136" font-size="18" text-anchor="middle" fill="#475569">let go</text>
<rect x="660" y="112" width="64" height="76" rx="8" fill="#fde047" stroke="#a16207" stroke-width="3"/>
<g fill="#ca8a04"><circle cx="678" cy="132" r="5"/><circle cx="706" cy="146" r="6"/><circle cx="682" cy="168" r="5"/><circle cx="710" cy="176" r="4"/></g>
<text x="570" y="262" font-size="34" text-anchor="middle" fill="#1e40af" font-weight="700">goes back</text></g>
</svg>
