              </div>
              <p x-show="ws.note" class="mt-1.5 text-xs text-cyan-800 bg-cyan-100 rounded px-2.5 py-1" x-html="hl(ws.note)"></p>
            </div>
          </template>
          </div></template>

          <template x-if="show.sounds"><div class="px-5 pb-1 space-y-3">
          <template x-for="(sd, si) in sounds(sec)" :key="'s' + si">
            <div>
              <p class="text-[13px] font-bold uppercase tracking-wider text-amber-700 mb-1.5"><input x-show="canMark && sd.mark" x-cloak type="checkbox" title="Đã thuộc" :checked="isKnown(sd.mark)" @change="setKnown([{id: sd.mark, c: sd.concept || sec.concept}], $event.target.checked)" class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">🗣 <span x-html="hl(sd.title)"></span><span x-show="sd.page" class="font-normal normal-case text-slate-400" x-text="' · p.' + sd.page"></span></p>
              <div class="rounded-lg border border-amber-200 bg-amber-50/60 px-3 py-2.5 text-sm space-y-1.5">
                <p class="font-semibold text-slate-900" x-html="hl(sd.focus)"></p>
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="wd in (sd.words || []).filter(x => hit(x.en, x.ipa))" :key="wd.en">
                    <span class="inline-flex items-center gap-1 rounded-full border border-amber-300 bg-white px-2.5 py-1">
                      <span class="font-medium text-slate-800" x-html="hl(wd.en)"></span>
                      <span x-show="wd.ipa" class="text-xs text-slate-400 font-mono" x-text="wd.ipa"></span>
                      <button x-show="canSpeak" @click.stop="speak(wd.en)" type="button" title="Đọc to"
                              class="text-amber-500 hover:text-amber-800">🔊</button>
                    </span>
                  </template>
                </div>
                <p x-show="sd.note" class="text-xs text-amber-800" x-html="hl(sd.note)"></p>
              </div>
            </div>
          </template>
          </div></template>

          <template x-if="show.phrases"><div class="px-5 pb-1 space-y-3">
          <template x-for="(ph, pi) in phrasesets(sec)" :key="'p' + pi">
            <div>
              <p class="text-[13px] font-bold uppercase tracking-wider text-lime-700 mb-1.5"><input x-show="canMark && ph.mark" x-cloak type="checkbox" title="Đã thuộc" :checked="isKnown(ph.mark)" @change="setKnown([{id: ph.mark, c: ph.concept || sec.concept}], $event.target.checked)" class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">💬 <span x-html="hl(ph.title)"></span><span x-show="ph.page" class="font-normal normal-case text-slate-400" x-text="' · p.' + ph.page"></span></p>
              <div class="grid sm:grid-cols-3 gap-2">
                <template x-for="(gp, gi) in (ph.groups || [])" :key="gi">
                  <div x-show="fq(gp.lines.map(l => ({ l })), 'l').length" class="rounded-lg border border-lime-200 bg-lime-50/50 px-3 py-2">
                    <p class="text-xs font-semibold uppercase tracking-wide text-lime-800 mb-1" x-html="hl(gp.when)"></p>
                    <ul class="space-y-1 text-sm text-slate-700">
                      <template x-for="(ln, li) in gp.lines.filter(l => hit(l))" :key="li">
                        <li x-html="hl(ln)"></li>
                      </template>
                    </ul>
                  </div>
                </template>
              </div>
            </div>
          </template>
          </div></template>

          <template x-if="show.reading"><div class="px-5 pb-1 space-y-3">
          <template x-for="(rd, ri) in reads(sec)" :key="'r' + ri">
            <div>
              <p class="text-[13px] font-bold uppercase tracking-wider text-fuchsia-700 mb-1.5"><input x-show="canMark && rd.mark" x-cloak type="checkbox" title="Đã thuộc" :checked="isKnown(rd.mark)" @change="setKnown([{id: rd.mark, c: rd.concept || sec.concept}], $event.target.checked)" class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">📕 <span x-html="hl(rd.title)"></span><span x-show="rd.page" class="font-normal normal-case text-slate-400" x-text="' · p.' + rd.page"></span></p>
              <div class="rounded-lg border border-fuchsia-200 bg-fuchsia-50/50 px-3 py-2.5 text-sm space-y-1">
                <p x-show="rd.kind" class="text-xs uppercase tracking-wide text-fuchsia-700" x-html="hl(rd.kind)"></p>
                <p class="text-slate-800" x-html="hl(rd.about)"></p>
                <p x-show="(rd.words || []).length" class="text-xs text-slate-500">
                  <span class="font-semibold">Từ mới:</span> <span x-html="hl((rd.words || []).join(', '))"></span></p>
              </div>
            </div>
          </template>
          </div></template>

          <!-- ── Kiến thức học (môn Toán) ────────────────────────────────────
               Mỗi kiến thức MỘT THẺ ĐÁNH SỐ: quy tắc bên trái, ví dụ ngay bên
               phải. Trước đây quy tắc nằm ở "Điều cần nhớ" còn ví dụ ở tận khối
               "Bài mẫu" phía dưới — đọc phải nhảy qua lại, học sinh không nối
               được hai thứ với nhau. Ví dụ có 3 dạng, xem study/SPEC.md.       -->
          <template x-if="show.topics && tops(sec).length"><div class="px-5 pb-4 space-y-3">
          <template x-for="(tp, ti) in tops(sec)" :key="'t' + ti">
            <div class="rounded-xl border border-orange-200 overflow-hidden">
              <div class="flex items-center gap-2 px-3 py-2 bg-orange-50 border-b border-orange-200">
                <span class="shrink-0 w-6 h-6 rounded-full bg-orange-500 text-white text-xs font-bold grid place-items-center"
                      x-text="ti + 1"></span>
                <input x-show="canMark && tp.mark" x-cloak type="checkbox" title="Đã thuộc" :checked="isKnown(tp.mark)" @change="setKnown([{id: tp.mark, c: tp.concept || sec.concept}], $event.target.checked)" class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600"><h4 class="text-base font-bold text-orange-800 uppercase tracking-wide" x-html="hl(tp.title)"></h4>
                <span x-show="tp.subtitle" class="text-xs text-orange-500 normal-case" x-html="'(' + hl(tp.subtitle) + ')'"></span>
                <span class="ml-auto text-xs text-slate-400" x-text="tp.page ? 'p.' + tp.page : ''"></span>
              </div>
              <!-- Định nghĩa: infographic này để TỔNG HỢP kiến thức, không chỉ liệt kê
                   nội dung sẽ thi — nên mỗi thẻ mở đầu bằng một câu "cái này là gì". -->
              <p x-show="tp.def" class="px-3 pt-2.5 text-sm font-medium text-slate-900" x-html="hl(tp.def)"></p>
              <p x-show="tp.def_vi" x-cloak class="px-3 pt-0.5 text-sm text-cyan-700 leading-snug" x-html="hl(tp.def_vi)"></p>
              <div class="grid sm:grid-cols-2 gap-x-4 gap-y-2 px-3 py-2.5">
                <!-- TRÁI: chỉ quy tắc. Trước đây hình nhét chung ô này với quy tắc
                     nên ba thứ (hình, quy tắc, ví dụ) chen nhau trên một hàng. -->
                <ul class="space-y-1 text-sm text-slate-700 self-start">
                  <template x-for="(r, ri) in (tp.rules || [])" :key="ri">
                    <li class="flex gap-2"><span class="text-orange-400 shrink-0">•</span><span>
                      <span x-html="hl(r)"></span>
                      <span x-show="(tp.rules_vi || [])[ri]" x-cloak class="block text-cyan-700" x-html="hl((tp.rules_vi || [])[ri])"></span>
                    </span></li>
                  </template>
                </ul>
                <!-- PHẢI: ví dụ ở trên, hình ở dưới. Ví dụ trước vì nó là thứ đọc
                     cùng quy tắc; hình là chỗ đối chiếu, xuống dưới vẫn thấy ngay. -->
                <div class="space-y-2 self-start">
                <!-- ví dụ: 3 dạng, class viết literal để Tailwind quét thấy -->
                <template x-if="tp.example && tp.example.kind === 'calc'">
                  <div class="rounded-lg border border-slate-200 overflow-hidden">
                    <p x-show="tp.example.title" class="px-3 py-1.5 bg-slate-100 text-xs font-semibold text-slate-600" x-html="hl(tp.example.title)"></p>
                    <table class="w-full text-sm tabular-nums text-slate-800">
                      <tbody class="divide-y divide-slate-200">
                        <template x-for="(ln, li) in tp.example.lines" :key="li">
                          <tr class="align-top">
                            <template x-if="calcRow(ln)[0]">
                              <td class="w-2/5 px-3 py-1.5 bg-slate-50 text-slate-600" x-html="hl(calcRow(ln)[0])"></td>
                            </template>
                            <td class="px-3 py-1.5" :colspan="calcRow(ln)[0] ? 1 : 2" x-html="hl(calcRow(ln)[1])"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <template x-if="tp.example && tp.example.kind === 'grid'">
                  <div class="overflow-x-auto rounded-lg border border-slate-200">
                    <table class="w-full text-center text-xs tabular-nums">
                      <tbody>
                        <template x-for="(row, ri) in tp.example.rows" :key="ri">
                          <tr :class="ri === 0 ? 'bg-slate-100 font-semibold text-slate-600'
                                     : (ri === tp.example.rows.length - 1 ? 'bg-orange-50 font-bold text-orange-700' : 'text-slate-700')">
                            <template x-for="(cell, ci) in row" :key="ci">
                              <td class="px-1 py-1 border border-slate-200 whitespace-nowrap" x-html="hl(cell)"></td>
                            </template>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <template x-if="tp.example && tp.example.kind === 'ifthen'">
                  <div class="space-y-1.5">
                    <template x-for="(br, bi) in tp.example.branches" :key="bi">
                      <div class="rounded-lg bg-slate-50 border border-slate-200 px-3 py-1.5 text-sm">
                        <p class="text-slate-800"><span x-html="hl(br.when)"></span>
                          <span class="text-orange-500 font-bold"> → </span><span x-html="hl(br.then)"></span></p>
                        <p x-show="br.eg" class="text-xs text-slate-500 tabular-nums" x-html="hl(br.eg)"></p>
                      </div>
                    </template>
                  </div>
                </template>
                <!-- Có hình sách thì dùng hình sách; không thì mới rơi về biểu tượng
                     sprite. Sprite là nét trừu tượng chung chung, chỉ hơn không có gì. -->
                <template x-if="tp.image">
                  <img @click.stop="zoom = 'study/img/' + tp.image" :src="'study/img/' + tp.image" :alt="tp.title || ''" loading="lazy"
                       class="cursor-zoom-in block w-full max-h-52 rounded-md border border-orange-200 bg-white object-contain">
                </template>
                <template x-if="!tp.image && tp.figure">
                  <svg viewBox="0 0 24 24" class="w-14 h-14 text-orange-400"><use :href="'#m-' + tp.figure"/></svg>
                </template>
                </div>
              </div>
            </div>
          </template>
          </div></template>

          <!-- Từ vựng GỘP CHUNG cho mục có thẻ "kiến thức học": chia theo lá thì
               tiêu đề lá lặp lại y hệt tiêu đề thẻ ở trên, đọc rất rối. -->
          <!-- Bài mẫu ở CẤP MỤC. Chỉ vẽ khi mục bỏ vùng theo lá, để không vẽ hai lần. -->
          <template x-if="show.worked && ((sec.topics || []).length || (sec.words || []).length) && secWorks(sec).length">
          <div class="px-5 pb-1 space-y-3">
            <template x-for="(wk, wi) in secWorks(sec)" :key="'sw' + wi">
              <div>
                <p class="text-[13px] font-bold uppercase tracking-wider text-teal-700 mb-1.5"><input x-show="canMark && wk.mark" x-cloak type="checkbox" title="Đã thuộc" :checked="isKnown(wk.mark)" @change="setKnown([{id: wk.mark, c: wk.concept || sec.concept}], $event.target.checked)" class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">🧮 <span x-html="hl(wk.title || 'Bài mẫu')"></span><span x-show="wk.page" class="font-normal normal-case text-slate-400" x-text="' · p.' + wk.page"></span></p>
                <div class="rounded-lg border border-teal-200 bg-teal-50 px-3 py-2.5 flex gap-3 items-start">
                  <div class="min-w-0 flex-1 text-sm space-y-1.5">
                    <p class="font-semibold text-slate-900" x-html="hl(wk.problem)"></p>
                    <ol class="list-decimal pl-5 text-slate-700 space-y-0.5">
                      <template x-for="(st, si) in (wk.steps || [])" :key="si"><li x-html="hl(st)"></li></template>
                    </ol>
                    <p class="font-medium text-teal-900"><span class="font-semibold">Đáp số:</span> <span x-html="hl(wk.answer)"></span></p>
                    <p x-show="wk.why" class="text-xs text-slate-500 italic" x-html="hl(wk.why)"></p>
                  </div>
                  <template x-if="wk.image">
                  <img @click.stop="zoom = 'study/img/' + wk.image" :src="'study/img/' + wk.image" :alt="wk.title || ''" loading="lazy"
                       class="cursor-zoom-in w-36 sm:w-52 max-h-56 shrink-0 rounded-md border border-teal-200 bg-white object-contain">
                  </template>
                </div>
              </div>
            </template>
          </div>
          </template>

          <!-- Checklist ở CẤP MỤC, cùng lý do. -->
          <template x-if="show.list && ((sec.topics || []).length || (sec.words || []).length) && allLists(sec).length">
          <div class="px-5 pb-1 space-y-3">
            <template x-for="(ck, ci) in allLists(sec)" :key="'sl' + ci">
              <div>
                <p class="text-[13px] font-bold uppercase tracking-wider text-emerald-700 mb-1.5"><input x-show="canMark && ck.mark" x-cloak type="checkbox" title="Đã thuộc" :checked="isKnown(ck.mark)" @change="setKnown([{id: ck.mark, c: ck.concept || sec.concept}], $event.target.checked)" class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">☑ <span x-html="hl(ck.title)"></span></p>
                <ol class="rounded-lg border border-emerald-200 bg-emerald-50/50 divide-y divide-emerald-100 text-sm">
                  <template x-for="(it, ii) in itemsOf(ck)" :key="ii">
                    <li class="flex gap-2 px-3 py-1.5">
                      <span class="font-semibold text-emerald-900 shrink-0" x-html="hl(it.sign)"></span>
                      <span class="text-slate-700" x-html="hl(it.look_for)"></span>
                    </li>
                  </template>
                </ol>
                <p x-show="ck.note" class="mt-1.5 text-xs text-emerald-800 bg-emerald-100 rounded px-2.5 py-1" x-html="hl(ck.note)"></p>
              </div>
            </template>
          </div>
          </template>

          <template x-if="show.gloss && ((sec.topics || []).length || (sec.words || []).length) && secGloss(sec).length">
          <div class="px-5 pb-4">
            <p class="text-[13px] font-bold uppercase tracking-wider text-indigo-600 mb-1.5">📖 Từ vựng</p>
            <dl class="grid sm:grid-cols-2 gap-2">
              <template x-for="g in secGloss(sec)" :key="g.term">
                <div class="overflow-hidden rounded-lg border border-indigo-200 bg-indigo-50/40 px-3 py-2 flex gap-2.5">
                  <template x-if="g.icon">
                    <svg viewBox="0 0 24 24" class="w-7 h-7 shrink-0 mt-0.5 text-indigo-400"><use :href="'#m-' + g.icon"/></svg>
                  </template>
                  <div class="min-w-0">
                  <dt class="text-sm font-semibold text-indigo-900"><input x-show="canMark && g.card" type="checkbox" title="Đã thuộc"
                    :checked="isKnown(g.card)"
                    @change="setKnown([{id: g.card, c: g.concept || sec.concept}], $event.target.checked)"
                    class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600"><template x-if="g.image"><img @click.stop="zoom = 'study/img/' + g.image" :src="'study/img/' + g.image" alt="" loading="lazy" class="cursor-zoom-in float-right ml-2 -mt-0.5 max-w-[80px] max-h-[80px] w-auto h-auto rounded border border-indigo-200 bg-white object-contain"></template><span x-html="hl(g.term)"></span><button x-show="canSpeak" @click.stop="speak(g.term)" type="button" title="Đọc to"
                      class="ml-1 align-middle text-indigo-400 hover:text-indigo-700">🔊</button></dt>
                  <dd class="text-sm text-slate-700 leading-snug" x-html="hl(g.def)"></dd>
                  <dd x-show="g.def_vi" x-cloak class="text-sm text-cyan-700 leading-snug" x-html="hl(g.def_vi)"></dd>
                  <dd x-show="g.example" class="mt-0.5 text-xs text-slate-500 italic" x-html="hl(g.example)"></dd>
                  <dd x-show="g.example_vi" x-cloak class="text-xs text-cyan-700" x-html="hl(g.example_vi)"></dd>
                  </div>
                </div>
              </template>
            </dl>
          </div>
          </template>

          <!-- Mục nào dùng khối kiểu Toán (topics) hoặc kiểu ESL (words) thì KHÔNG
               vẽ thẻ theo lá nữa: từ vựng đã gộp ở trên, thẻ lá còn lại rỗng ruột. -->
          <template x-for="leaf in ((tops(sec).length || (sec.words || []).length) ? [] : shownLeaves(sec))" :key="leaf.id">
            <div class="mx-5 mb-4 rounded-xl border border-slate-200 overflow-hidden">
              <div class="flex items-center gap-2 px-4 py-2 bg-slate-50 border-b border-slate-200">
                <template x-if="canMark && knownState(leafAtoms(sec, leaf.id))">
                  <input type="checkbox" title="Đã thuộc cả phần này"
                         :checked="knownState(leafAtoms(sec, leaf.id)) === 'all'"
                         x-effect="$el.indeterminate = knownState(leafAtoms(sec, leaf.id)) === 'some'"
                         @change="setKnown(leafAtoms(sec, leaf.id), $event.target.checked)"
                         class="shrink-0 w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">
                </template>
                <span class="w-2 h-2 rounded-full shrink-0"
                      :class="branchStat(leaf.id).wrong > 0 ? 'bg-rose-400' : 'bg-indigo-400'"></span>
                <h4 class="text-base font-bold text-slate-800" x-html="hl(leaf.en)"></h4>
                <span class="ml-auto text-xs text-slate-400" x-text="leaf.pages ? 'p.' + leaf.pages : ''"></span>
              </div>

              <!-- từ vựng của lá -->
              <template x-if="show.gloss && tagged(sec.glossary, leaf.id).length">
              <div class="px-4 pt-3">
              <p class="text-[13px] font-bold uppercase tracking-wider text-indigo-600 mb-1.5">📖 Từ vựng</p>
              <dl class="grid gap-x-3 gap-y-1.5 sm:grid-cols-2">
                <template x-for="g in tagged(sec.glossary, leaf.id)" :key="g.term">
                  <div class="overflow-hidden rounded-lg bg-indigo-50/60 border border-indigo-100 px-3 py-2">
                    <dt class="text-sm font-semibold text-indigo-900"><input x-show="canMark && g.card" type="checkbox" title="Đã thuộc"
                    :checked="isKnown(g.card)"
                    @change="setKnown([{id: g.card, c: g.concept || sec.concept}], $event.target.checked)"
                    class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600"><template x-if="g.image"><img @click.stop="zoom = 'study/img/' + g.image" :src="'study/img/' + g.image" alt="" loading="lazy" class="cursor-zoom-in float-right ml-2 -mt-0.5 max-w-[80px] max-h-[80px] w-auto h-auto rounded border border-indigo-200 bg-white object-contain"></template><span x-html="hl(g.term)"></span><button x-show="canSpeak" @click.stop="speak(g.term)" type="button" title="Đọc to"
                        class="ml-1 inline-flex items-center justify-center w-6 h-6 rounded-full text-indigo-500 hover:bg-indigo-100 align-middle">🔊</button></dt>
                    <dd class="text-sm text-slate-700 leading-snug" x-html="hl(g.def)"></dd>
                    <dd x-show="g.def_vi" x-cloak class="text-sm text-cyan-700 leading-snug" x-html="hl(g.def_vi)"></dd>
                    <dd x-show="g.example" class="mt-0.5 text-xs text-slate-500 italic" x-html="hl(g.example)"></dd>
                    <dd x-show="g.example_vi" x-cloak class="text-xs text-cyan-700" x-html="hl(g.example_vi)"></dd>
                  </div>
                </template>
              </dl>
              </div>
              </template>

              <!-- ý của lá -->
              <template x-if="show.facts && tagged(points(sec), leaf.id).length">
              <div class="px-4 pt-3">
              <p class="text-[13px] font-bold uppercase tracking-wider text-sky-600 mb-1.5">✦ Điều cần nhớ</p>
              <div class="grid gap-2 sm:grid-cols-2">
                <template x-for="(pt, i) in tagged(points(sec), leaf.id)" :key="i">
                  <div class="flex gap-2.5 rounded-lg border border-sky-200 bg-sky-50/40 p-3">
                    <input x-show="canMark && pt.mark" x-cloak type="checkbox" title="Đã thuộc" :checked="isKnown(pt.mark)" @change="setKnown([{id: pt.mark, c: pt.concept || sec.concept}], $event.target.checked)" class="mt-1 shrink-0 w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600"><div class="flex-1"><p class="text-sm text-slate-700 leading-snug"><span class="font-semibold text-slate-900" x-html="hl(lead(pt.t)[0])"></span><span x-html="hl(lead(pt.t)[1])"></span></p>
                    <p x-show="pt.t_vi" x-cloak class="text-sm text-cyan-700 leading-snug" x-html="hl(pt.t_vi)"></p></div>
                    <template x-if="pt.image"><img @click.stop="zoom = 'study/img/' + pt.image" :src="'study/img/' + pt.image" alt="" class="cursor-zoom-in w-16 shrink-0 self-start rounded border border-sky-200 bg-white object-contain"></template>
                  </div>
                </template>
              </div>
              </div>
              </template>

              <!-- bảng/danh sách thuộc lá: có thể nhiều; mỗi mục một dòng, ví dụ khi bật Chi tiết -->
              <template x-if="show.list"><div>
              <template x-for="(ck, ci) in lists(sec, leaf.id)" :key="'l' + ci">
              <div class="px-4 pt-3">
                <p class="text-[13px] font-bold uppercase tracking-wider text-emerald-700 mb-1.5"><input x-show="canMark && ck.mark" x-cloak type="checkbox" title="Đã thuộc" :checked="isKnown(ck.mark)" @change="setKnown([{id: ck.mark, c: ck.concept || sec.concept}], $event.target.checked)" class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">☑ <span x-html="hl(ck.title)"></span></p>
                <ol class="grid gap-1.5 sm:grid-cols-2">
                  <template x-for="(it, i) in itemsOf(ck)" :key="i">
                    <li class="flex items-start gap-2 rounded-lg border border-emerald-200 bg-emerald-50/60 px-2.5 py-1.5">
                      <div class="min-w-0 text-sm leading-snug">
                        <span class="font-semibold text-slate-900" x-html="hl(it.sign)"></span>
                        <template x-if="it.look_for"><span><span class="text-slate-500"> — </span><span class="text-slate-700" x-html="hl(it.look_for)"></span></span></template>
                        <p x-show="it.book_example" class="text-xs text-slate-500 italic" x-html="hl(it.book_example)"></p>
                      </div>
                    </li>
                  </template>
                </ol>
                <p x-show="ck.note" class="mt-1.5 text-xs text-emerald-800 bg-emerald-100 rounded px-2.5 py-1" x-html="hl(ck.note)"></p>
              </div>
              </template>
              </div></template>

              <!-- ngộ nhận của lá -->
              <template x-if="show.watch && tagged(sec.watch_out, leaf.id).length">
              <div class="px-4 pt-3">
                <p class="text-[13px] font-bold uppercase tracking-wider text-amber-600 mb-1.5">⚠ Dễ nhầm chỗ này</p>
                <div class="space-y-2">
                  <template x-for="(w, i) in tagged(sec.watch_out, leaf.id)" :key="i">
                    <div class="rounded-lg border border-amber-200 bg-amber-50 overflow-hidden">
                      <p class="flex gap-2 px-3 py-2 text-sm text-slate-600">
                        <input x-show="canMark && w.mark" x-cloak type="checkbox" title="Đã thuộc"
                               :checked="isKnown(w.mark)"
                               @change="setKnown([{id: w.mark, c: w.concept || sec.concept}], $event.target.checked)"
                               class="mt-0.5 shrink-0 w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">
                        <span class="text-rose-500 font-bold shrink-0">✗</span>
                        <span class="line-through decoration-rose-300" x-html="hl(w.wrong)"></span>
                      </p>
                      <p class="flex gap-2 px-3 py-2 text-sm text-slate-800 bg-white border-t border-amber-200">
                        <span class="text-emerald-600 font-bold shrink-0">✓</span>
                        <span x-html="hl(w.right)"></span>
                      </p>
                    </div>
                  </template>
                </div>
              </div>
              </template>

              <!-- thí nghiệm thuộc lá: có thể nhiều. Chỉ 1–2 câu tóm tắt cách làm + 1 câu
                   kết quả (không liệt kê dụng cụ/bước), hình cắt rộng từ trang sách đặt cạnh. -->
              <template x-if="show.exp"><div>
              <template x-for="(ex, ei) in exps(sec, leaf.id)" :key="'e' + ei">
              <div class="px-4 pt-3">
                <p class="text-[13px] font-bold uppercase tracking-wider text-violet-600 mb-1.5"><input x-show="canMark && ex.mark" x-cloak type="checkbox" title="Đã thuộc" :checked="isKnown(ex.mark)" @change="setKnown([{id: ex.mark, c: ex.concept || sec.concept}], $event.target.checked)" class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">🔬 <span x-html="hl(ex.title || 'Thí nghiệm trong sách')"></span><span x-show="ex.page" class="font-normal normal-case text-slate-400" x-text="' · p.' + ex.page"></span></p>
                <div class="rounded-lg border border-violet-200 bg-violet-50 px-3 py-2.5 flex gap-3 items-start">
                  <div class="min-w-0 flex-1 text-sm space-y-1.5">
                    <p x-show="ex.summary" class="text-slate-700" x-html="hl(ex.summary)"></p>
                    <p x-show="ex.result" class="font-medium text-violet-900"><span class="font-semibold">Thấy:</span> <span x-html="hl(ex.result)"></span></p>
                  </div>
                  <!-- x-if chứ không x-show: :src vẫn bind khi ẩn → trình duyệt tải "img/null" (404) -->
                  <template x-if="ex.image">
                  <img @click.stop="zoom = 'study/img/' + ex.image" :src="'study/img/' + ex.image" :alt="ex.title || ''" loading="lazy"
                       class="cursor-zoom-in w-36 sm:w-52 max-h-56 shrink-0 rounded-md border border-violet-200 bg-white object-contain">
                  </template>
                </div>
              </div>
              </template>
              </div></template>

              <!-- bài mẫu thuộc lá (môn Toán): CÁC BƯỚC chính là kiến thức, nên ở đây
                   giữ nguyên từng bước — ngược hẳn với khối thí nghiệm của môn Science,
                   nơi các bước bị lược đi. Đừng gộp hai khối làm một. -->
              <template x-if="show.worked"><div>
              <template x-for="(wk, wi) in works(sec, leaf.id)" :key="'w' + wi">
              <div class="px-4 pt-3">
                <p class="text-[13px] font-bold uppercase tracking-wider text-teal-700 mb-1.5"><input x-show="canMark && wk.mark" x-cloak type="checkbox" title="Đã thuộc" :checked="isKnown(wk.mark)" @change="setKnown([{id: wk.mark, c: wk.concept || sec.concept}], $event.target.checked)" class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">🧮 <span x-html="hl(wk.title || 'Bài mẫu')"></span><span x-show="wk.page" class="font-normal normal-case text-slate-400" x-text="' · p.' + wk.page"></span></p>
                <div class="rounded-lg border border-teal-200 bg-teal-50 px-3 py-2.5 flex gap-3 items-start">
                  <div class="min-w-0 flex-1 text-sm space-y-1.5">
                    <p class="font-semibold text-slate-900" x-html="hl(wk.problem)"></p>
                    <ol class="list-decimal pl-5 text-slate-700 space-y-0.5">
                      <template x-for="(st, si) in (wk.steps || [])" :key="si"><li x-html="hl(st)"></li></template>
                    </ol>
                    <p class="font-medium text-teal-900"><span class="font-semibold">Đáp số:</span> <span x-html="hl(wk.answer)"></span></p>
                    <p x-show="wk.why" class="text-xs text-slate-500 italic" x-html="hl(wk.why)"></p>
                  </div>
                  <!-- Khung TO (w-52), không phải ô 80px của từ vựng: hình toán dày
                       chữ số và nhãn (bảng 100 ô, tia số 0–100), ở 80px đọc không ra.
                       x-if chứ không x-show: :src vẫn bind khi ẩn → tải "img/null". -->
                  <template x-if="wk.image">
                  <img @click.stop="zoom = 'study/img/' + wk.image" :src="'study/img/' + wk.image" :alt="wk.title || ''" loading="lazy"
                       class="cursor-zoom-in w-36 sm:w-52 max-h-56 shrink-0 rounded-md border border-teal-200 bg-white object-contain">
                  </template>
                </div>
              </div>
              </template>
              </div></template>

              <!-- so sánh thuộc lá: có thể nhiều -->
              <template x-if="show.compare"><div>
              <template x-for="(cp, pi) in comps(sec, leaf.id)" :key="'c' + pi">
              <div class="px-4 pt-3">
                <p class="text-[13px] font-bold uppercase tracking-wider text-slate-600 mb-1.5"><input x-show="canMark && cp.mark" x-cloak type="checkbox" title="Đã thuộc" :checked="isKnown(cp.mark)" @change="setKnown([{id: cp.mark, c: cp.concept || sec.concept}], $event.target.checked)" class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">⇄ <span x-html="hl(cp.title || 'So sánh')"></span></p>
                <div class="rounded-lg border border-slate-200 overflow-hidden">
                  <div class="grid grid-cols-[6.5rem_1fr_1fr] text-sm font-semibold">
                    <div class="bg-slate-100 px-2 py-2"></div>
                    <div class="bg-emerald-50 text-emerald-800 px-2 py-2 border-l border-slate-200" x-html="hl(cp.label_a)"></div>
                    <div class="bg-slate-50 text-slate-700 px-2 py-2 border-l border-slate-200" x-html="hl(cp.label_b)"></div>
                  </div>
                  <template x-for="(r, i) in rowsOf(cp)" :key="i">
                    <div class="grid grid-cols-[6.5rem_1fr_1fr] text-sm border-t border-slate-200">
                      <div class="bg-slate-50 px-2 py-2 font-medium text-slate-600" x-html="hl(r.aspect)"></div>
                      <div class="px-2 py-2 text-slate-700 border-l border-slate-200" x-html="hl(r.a)"></div>
                      <div class="px-2 py-2 text-slate-500 border-l border-slate-200" x-html="hl(r.b)"></div>
                    </div>
                  </template>
                </div>
              </div>
              </template>
              </div></template>
              <div class="h-3"></div>
            </div>
          </template>

          <!-- ── Phần thuộc CẢ mục (không gắn lá): bảng đối chiếu, và mọi thứ
               chưa gắn nhãn — để dữ liệu cũ vẫn hiện đủ.                       -->
          <template x-for="(cp, pi) in (show.compare ? secComps(sec) : [])" :key="'sc' + pi">
          <div class="px-5 pb-4">
            <p class="text-[13px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">⇄ So sánh</p>
            <div class="rounded-lg border border-slate-200 overflow-hidden">
              <div class="grid grid-cols-[6.5rem_1fr_1fr] text-sm font-semibold">
                <div class="bg-slate-100 px-2 py-2"></div>
                <div class="bg-emerald-50 text-emerald-800 px-2 py-2 border-l border-slate-200" x-html="hl(cp.label_a)"></div>
                <div class="bg-slate-50 text-slate-700 px-2 py-2 border-l border-slate-200" x-html="hl(cp.label_b)"></div>
              </div>
              <template x-for="(r, i) in rowsOf(cp)" :key="i">
                <div class="grid grid-cols-[6.5rem_1fr_1fr] text-sm border-t border-slate-200">
                  <div class="bg-slate-50 px-2 py-2 font-medium text-slate-600" x-html="hl(r.aspect)"></div>
                  <div class="px-2 py-2 text-slate-700 border-l border-slate-200" x-html="hl(r.a)"></div>
                  <div class="px-2 py-2 text-slate-500 border-l border-slate-200" x-html="hl(r.b)"></div>
                </div>
              </template>
            </div>
          </div>
          </template>

          <template x-if="untagged(sec).any">
          <div class="px-5 pb-4 space-y-3">
            <template x-if="show.gloss && untagged(sec).glossary.length">
            <dl class="grid gap-x-3 gap-y-1.5 sm:grid-cols-2">
              <template x-for="g in untagged(sec).glossary" :key="g.term">
                <div class="overflow-hidden rounded-lg bg-indigo-50/60 border border-indigo-100 px-3 py-2">
                  <dt class="text-sm font-semibold text-indigo-900"><input x-show="canMark && g.card" type="checkbox" title="Đã thuộc"
                    :checked="isKnown(g.card)"
                    @change="setKnown([{id: g.card, c: g.concept || sec.concept}], $event.target.checked)"
                    class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600"><template x-if="g.image"><img @click.stop="zoom = 'study/img/' + g.image" :src="'study/img/' + g.image" alt="" loading="lazy" class="cursor-zoom-in float-right ml-2 -mt-0.5 max-w-[80px] max-h-[80px] w-auto h-auto rounded border border-indigo-200 bg-white object-contain"></template><span x-html="hl(g.term)"></span><button x-show="canSpeak" @click.stop="speak(g.term)" type="button" title="Đọc to"
                        class="ml-1 inline-flex items-center justify-center w-6 h-6 rounded-full text-indigo-500 hover:bg-indigo-100 align-middle">🔊</button></dt>
                  <dd class="text-sm text-slate-700 leading-snug" x-html="hl(g.def)"></dd>
                  <dd x-show="g.def_vi" x-cloak class="text-sm text-cyan-700 leading-snug" x-html="hl(g.def_vi)"></dd>
                  <dd x-show="g.example" class="mt-0.5 text-xs text-slate-500 italic" x-html="hl(g.example)"></dd>
                  <dd x-show="g.example_vi" x-cloak class="text-xs text-cyan-700" x-html="hl(g.example_vi)"></dd>
                </div>
              </template>
            </dl>
            </template>
            <template x-if="show.facts && untagged(sec).points.length">
            <div class="grid gap-2 sm:grid-cols-2">
              <template x-for="(pt, i) in untagged(sec).points" :key="i">
                <!-- Thẻ là `flex` (chừa chỗ cho hình), nên hai dòng Anh–Việt phải
                     bọc chung một khối, không thì chúng nằm thành HAI CỘT. -->
                <div class="flex gap-2.5 rounded-lg border border-slate-200 p-3">
                  <!-- x-if chứ không x-show: :src vẫn bind khi ẩn → tải "img/null" (404) -->
                  <template x-if="pt.image">
                    <img @click.stop="zoom = 'study/img/' + pt.image" :src="'study/img/' + pt.image" alt="" loading="lazy"
                         class="cursor-zoom-in w-20 shrink-0 self-start rounded border border-slate-200 bg-white object-contain">
                  </template>
                  <div class="min-w-0">
                    <p class="text-sm text-slate-700 leading-snug"><span class="font-semibold text-slate-900" x-html="hl(lead(pt.t)[0])"></span><span x-html="hl(lead(pt.t)[1])"></span></p>
                    <p x-show="pt.t_vi" x-cloak class="text-sm text-cyan-700 leading-snug" x-html="hl(pt.t_vi)"></p>
                  </div>
                </div>
              </template>
            </div>
            </template>
            <template x-if="show.list && secLists(sec).length && (sec.checklist = secLists(sec)[0])">
            <div>
              <p class="text-xs font-bold uppercase tracking-wide text-emerald-700 mb-2">✅ <span x-html="hl(sec.checklist.title)"></span></p>
              <ol class="space-y-2">
                <template x-for="(it, i) in sec.checklist.items" :key="i">
                  <li class="flex gap-3 rounded-lg border border-emerald-200 bg-emerald-50/60 px-3 py-2.5">
                    <div class="min-w-0">
                      <p class="text-sm font-semibold text-slate-900" x-html="hl(it.sign)"></p>
                      <p class="text-sm text-slate-700" x-html="hl(it.look_for)"></p>
                      <p x-show="it.book_example" class="mt-0.5 text-xs text-slate-500 italic" x-html="hl(it.book_example)"></p>
                    </div>
                  </li>
                </template>
              </ol>
              <p x-show="sec.checklist.note" class="mt-2 text-xs text-emerald-800 bg-emerald-100 rounded px-3 py-1.5" x-html="hl(sec.checklist.note)"></p>
            </div>
            </template>
            <template x-if="show.watch && untagged(sec).watch.length">
            <div>
              <p class="text-xs font-bold uppercase tracking-wide text-amber-600 mb-2">⚠ Dễ nhầm chỗ này</p>
              <div class="space-y-2">
                <template x-for="(w, i) in untagged(sec).watch" :key="i">
                  <div class="rounded-lg border border-amber-200 bg-amber-50 overflow-hidden">
                    <p class="flex gap-2 px-3 py-2 text-sm text-slate-600"><span class="text-rose-500 font-bold shrink-0">✗</span><span class="line-through decoration-rose-300" x-html="hl(w.wrong)"></span></p>
                    <p class="flex gap-2 px-3 py-2 text-sm text-slate-800 bg-white border-t border-amber-200"><span class="text-emerald-600 font-bold shrink-0">✓</span><span x-html="hl(w.right)"></span></p>
                  </div>
                </template>
              </div>
            </div>
            </template>
            <template x-if="show.exp && secExps(sec).length && (sec.from_the_book = secExps(sec)[0])">
            <div class="rounded-lg border border-sky-200 bg-sky-50 px-4 py-3">
              <p class="text-xs font-bold uppercase tracking-wide text-sky-700">🔬 Thí nghiệm trong sách</p>
              <p class="mt-1.5 text-sm text-slate-700" x-text="sec.from_the_book.activity"></p>
              <p class="mt-1.5 text-sm font-medium text-sky-900" x-text="sec.from_the_book.what_it_shows"></p>
            </div>
            </template>
          </div>
          </template>

          <!-- ── Thuật ngữ ────────────────────────────────────────────────── -->
          <div x-show="(sec.terms || []).filter(t => hit(t)).length" x-cloak class="px-5 pb-5 flex flex-wrap gap-1.5">
            <template x-for="t in (sec.terms || []).filter(t => hit(t))" :key="t">
              <span class="px-2 py-0.5 text-xs rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100" x-html="hl(t)"></span>
            </template>
          </div>
        </section>
      </template>
    </div>
    </template>

    <!-- ── Kết thúc ─────────────────────────────────────────────────────── -->
    <div x-show="screen === 'done'" x-cloak class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 text-center">
      <p class="text-3xl font-bold text-slate-900"><span x-text="mode === 'cards' ? tStats.known : qStats.ok"></span>/<span x-text="mode === 'cards' ? tStats.n : qStats.n"></span></p>
      <p class="mt-1 text-sm text-slate-500" x-text="mode === 'cards' ? 'thẻ đã thuộc' : 'câu đúng'"></p>
      <p x-show="err" x-cloak class="mt-3 text-xs text-amber-700" x-text="err"></p>
      <div class="mt-5 flex justify-center gap-2">
        <button @click="screen = 'start'"
                class="px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
          Ôn tiếp
        </button>
        <a href="cie-esl-1.html"
           class="px-4 py-2 text-sm font-medium rounded-lg bg-white border border-slate-300 text-slate-700 hover:border-indigo-500">
          Về trang môn
        </a>
      </div>
    </div>
  </main>
  </div>

  <!-- ── Xem ảnh phóng to ────────────────────────────────────────────────────
       Bấm ảnh bất kỳ để phóng, bấm lần nữa (hoặc Esc, hoặc nút ✕) để bỏ. Phủ kín
       màn hình thay vì phóng tại chỗ: ảnh từ vựng chỉ 48px, phóng tại chỗ vẫn
       không đủ to để nhìn rõ, mà lại đẩy cả trang nhảy chỗ.
       x-if chứ không x-show: :src vẫn bind khi ẩn → tải "study/img/" (404). -->
  <template x-if="zoom">
    <div @click="zoom = ''" @keydown.escape.window="zoom = ''"
         class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 p-4 cursor-zoom-out">
      <!-- `zoom` giữ NGUYÊN đường dẫn của ảnh vừa bấm, không phải tên file: mỗi
           chỗ vẽ ảnh tự dựng src theo cách của nó, ghép tiền tố lần nữa ở đây là
           ra "study/img/study/img/…" và ảnh 404 mà lớp phủ vẫn hiện. -->
      <img :src="zoom" alt=""
           class="max-h-[88vh] max-w-full rounded-lg bg-white shadow-2xl object-contain">
      <button @click.stop="zoom = ''" type="button" title="Đóng"
              class="absolute top-3 right-3 w-10 h-10 rounded-full bg-white/90 text-slate-700 text-xl leading-none hover:bg-white">✕</button>
    </div>
  </template>
</body>
</html>
