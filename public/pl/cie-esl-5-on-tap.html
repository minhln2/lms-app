  <title>Ôn tập · CIE ESL 5</title>
  <!-- CSS dựng sẵn lúc build (tên file có hash). Thiếu Node thì builder tự
       thay dòng này bằng Tailwind CDN. -->
  <link rel="stylesheet" href="../assets/tw.3760865e.css">
  <script defer src="../assets/alpine.63d2636a.js"></script>
  <script>
    // ── Vỏ tĩnh, nội dung nạp bằng fetch ────────────────────────────────────
    // Trang này KHÔNG nhúng câu hỏi vào HTML: Tailwind quét dist/**/*.html lúc
    // build nên nhúng vào chỉ làm trang phình, còn class thì vẫn phải nằm sẵn
    // trong template dù nội dung đến từ đâu. Vì vậy MỌI class Tailwind ở dưới
    // đều là chuỗi literal — tuyệt đối không ghép kiểu 'bg-' + màu + '-100',
    // Tailwind không nhìn thấy và sẽ cắt mất.
    function studyStore(user, course) {
      return {
        user, course,
        data: null, err: '', ready: false, online: false,
        secret: localStorage.getItem('lms_key') || '',
        cards: {},              // item_id → {n, wrong, box, ease, due, last_ts}
        // Vào trang là thấy TÓM TẮT: đọc trước, làm bài sau. Hai chế độ kia phải
        // bấm mới vào, nên screen khởi tạo theo 'summary' cho khớp go('summary').
        screen: 'summary',      // start | quiz | done | summary
        mode: 'summary',        // quiz | cards | summary | map
        revealed: false,        // flashcard: đã lật chưa
        learnAt: 0,             // chế độ Học: đang xem thẻ thứ mấy
        seen: {},               // chế độ Kiểm tra: id → 'known' | 'again' (trong phiên)
        tStats: { n: 0, known: 0 },
        qStats: { n: 0, ok: 0 },
        lastId: null,
        openMap: {},            // cây bên trái: nhánh nào đang mở
        // Bộ lọc các phần trong tóm tắt. Mỗi loại một màu cố định (xem KINDS) để
        // nhìn là biết đang đọc loại gì, và bật/tắt được từng loại.
        // Chip lọc = LỰA CHỌN của người dùng, không phải trạng thái hiển thị.
        // Không chọn chip nào (mặc định) nghĩa là xem tất cả — xem getter `show`.
        filt: JSON.parse(localStorage.getItem('lms_pick') || 'null') || { gloss: false, facts: false, list: false, watch: false, exp: false, compare: false },
        // Chủ đề đang học. Bỏ mục "cả môn" nên sau khi nạp xong đây LUÔN là một
        // unit cụ thể — xem pickFirstUnit(). Giữ null lúc khởi tạo vì cây chủ đề
        // chưa có gì để chọn.
        scope: null,
        // Nhớ phạm vi đang xem, RIÊNG TỪNG MÔN. Chung một khoá thì mở môn khác lại
        // nhảy vào một unit không thuộc môn đó, hoặc tệ hơn là trang trắng.
        scopeKey: 'lms_scope:cie-esl-5',
        navOpen: false,         // ngăn kéo cây trên màn hình hẹp
        locMo: false,           // ngăn ⚙ (ADR 0054)
        queue: [], at: 0, picked: null, answered: false, wrongAgain: 0,
        log: [], shownAt: 0,

        async init() {
          try {
            const r = await fetch('study/cie-esl-5.json', { headers: { accept: 'application/json' } });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            this.data = await r.json();
            this.pickFirstUnit();   // không còn mục "cả môn"
          } catch (e) {
            this.err = 'Không tải được học liệu ôn tập.';
            this.ready = true;
            return;
          }
          // Lịch ôn: không có cũng học được, chỉ là không ghi lại (mở file cục
          // bộ, hoặc bản trên GitHub Pages). Không báo lỗi.
          try {
            const r = await fetch(`/api/study?user=${this.user}&course=${this.course}`,
                                  { headers: { accept: 'application/json' } });
            if (r.ok) {
              const d = await r.json();
              const ix = Object.fromEntries(d.cols.map((c, i) => [c, i]));
              for (const row of d.rows) {
                this.cards[row[ix.item_id]] = Object.fromEntries(d.cols.map((c, i) => [c, row[i]]));
              }
              this.online = true;
            }
          } catch (e) { /* chế độ chỉ đọc */ }
          this.flushBuffer();
          this.traGan();
          this.ready = true;
        },

        // ── Lịch ôn giãn cách (Leitner + SM-2 rút gọn) ────────────────────────
        // Tính bằng SỐ NGUYÊN từ đầu tới cuối: ease lưu ×100 để client và mọi
        // phép dựng lại phía máy chủ ra cùng kết quả từng bit. Máy chủ kẹp lại
        // mọi giá trị lần nữa, không tin client.
        sched(id, c, g, now) {
          const BOX = [0, 1, 2, 4, 8, 16, 32];   // số ngày theo bậc 1..6
          let box = c ? c.box : 1, ease = c ? c.ease : 250;
          if (g <= 1) {
            box = Math.max(1, box - 1);
            ease = Math.max(130, ease - 20);
            return { box, ease, due: now + 600 };   // gặp lại NGAY trong phiên
          }
          box = Math.min(6, box + 1);
          ease = Math.min(350, Math.max(130, ease + (g === 3 ? 10 : -10)));
          // Nhiễu ±10% suy TẤT ĐỊNH từ id: để các mốc ôn không dồn hết vào một
          // ngày, mà vẫn tính lại được y hệt khi phát lại lịch sử.
          let h = 0;
          for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
          const days = BOX[box] * ease / 250 * (1 + ((h % 21) - 10) / 100);
          return { box, ease, due: now + Math.max(1, Math.round(days)) * 86400 };
        },

        // ── Chọn câu cho phiên ────────────────────────────────────────────────
        get allItems() { return [...(this.data?.quiz || []), ...(this.data?.flashcards || [])]; },
        parentOf(cid) {
          const c = (this.data?.concepts || []).find(x => x.id === cid);
          return c ? c.parent : null;
        },
        // Tỉ lệ sai của một chủ đề, cộng dồn lên cây. Đây là phần thưởng của
        // việc để sơ đồ tư duy dạng cây: yếu ở "properties" nâng điểm của MỌI câu
        // nằm dưới nó, kể cả câu chưa gặp bao giờ — hệ thống khái quát hoá thay
        // vì chỉ nhai lại đúng câu đã sai.
        conceptErr(cid, seen) {
          if (!cid) return 0;
          seen = seen || new Set();
          if (seen.has(cid)) return 0;              // chặn cây bị vòng
          seen.add(cid);
          if (this._cerr && this._cerr[cid] !== undefined) return this._cerr[cid];
          let n = 0, wrong = 0;
          for (const q of this.allItems) {
            if (q.concept !== cid) continue;
            const c = this.cards[q.id];
            if (c) { n += c.n; wrong += c.wrong; }
          }
          const own = (wrong + 0.5) / (n + 1.0);
          const p = this.parentOf(cid);
          const v = p ? 0.65 * own + 0.35 * this.conceptErr(p, seen) : own;
          (this._cerr = this._cerr || {})[cid] = v;
          return v;
        },
        // ── Nghỉ hưu câu đã thuộc ─────────────────────────────────────────────
        // SUY RA từ card chứ không ghi vào file nội dung: thuộc bài là trạng thái
        // của NGƯỜI HỌC, không phải thuộc tính của câu hỏi. Ghi vào nội dung thì
        // một học sinh thuộc sẽ làm câu đó biến mất với học sinh khác.
        //
        // Câu đã thuộc vẫn được ôn, nhưng CHỈ khi thật sự đến hạn (bậc 6 ≈ 32
        // ngày) và không bao giờ chen vào phần ưu tiên. Thiếu bước này thì bộ
        // thẻ phình mãi và mỗi phiên càng lúc càng toàn bài đã thuộc.
        // Ngưỡng "đã nắm chắc". Ba điều kiện đánh vào ba kiểu may rủi khác nhau:
        // số lần chặn đúng-vài-lần-đầu, tỉ lệ sai chặn sai rải rác, bậc ôn chặn
        // đúng dồn trong MỘT buổi (muốn lên bậc phải đúng ở các lần cách nhau
        // nhiều ngày). Hạ ngưỡng thì hạ cả ba, đừng bỏ hẳn điều kiện nào.
        RETIRE: { n: 3, box: 3, err: 0.25 },

        // ── "Đã thuộc": cờ đánh dấu bằng TAY ────────────────────────────────
        // KHÔNG suy từ kết quả làm bài (khác `retired()` mà trắc nghiệm vẫn dùng)
        // — đây là tuyên bố của người học. Một từ vựng trong tóm tắt và thẻ ghi
        // nhớ sinh ra từ nó dùng CHUNG một item_id (src/study.py ghi sẵn trường
        // `card` cho từng thuật ngữ), nên tick ở đâu cũng là một trạng thái duy
        // nhất — để hai nơi thì chúng lệch nhau mà không có gì báo.
        isKnown(id) { return !!(id && this.cards[id] && this.cards[id].known); },
        // Ghi được thì mới hiện ô tick. Mở file cục bộ hay bản GitHub Pages không
        // có API: hiện ô mà bấm không lưu được còn tệ hơn là không có ô nào.
        get canMark() { return this.online && !!this.secret; },

        // Các mẩu tick được. CHỈ từ vựng/thuật ngữ — chúng là thứ duy nhất trong
        // phần tóm tắt có item_id ổn định. Ô của LÁ và của MỤC không có trạng thái
        // riêng, luôn suy từ đám này (đúng khuôn ô tick nhóm ở trang môn): bỏ tick
        // một từ là ô cha tự về "một phần" ngay, không bao giờ lệch nhau.
        // `card` là id thẻ ghi nhớ của một từ; `mark` là id tick của một khối nội
        // dung (điều cần nhớ, thí nghiệm, bảng so…). Cùng đi vào một kho trạng
        // thái, nên ô tick ở mục và ở lá gộp được cả hai loại.
        atomsOf(list, secId) {
          return (list || []).filter(x => x && (x.card || x.mark))
                             .map(x => ({ id: x.card || x.mark, c: x.concept || secId }));
        },
        // Mọi khối nội dung của một mục, để ô tick cấp mục/lá tính cả chúng.
        blockAtoms(sec, leafId) {
          const out = [];
          for (const b of ['points','topics','checklists','compares','watch_out',
                           'experiments','worked','grammar','phrases','readings','sounds']) {
            const items = (sec[b] || []).filter(x => !leafId || x.concept === leafId);
            out.push(...this.atomsOf(items, sec.concept));
          }
          return out;
        },
        leafAtoms(sec, leafId) {
          return this.atomsOf((sec.glossary || []).filter(g => g.concept === leafId), sec.concept)
                     .concat(this.blockAtoms(sec, leafId));
        },
        secAtoms(sec) {
          const out = this.atomsOf(sec.glossary, sec.concept);
          for (const ws of sec.words || []) {
            out.push(...this.atomsOf((ws.items || []).map(it => ({ ...it, concept: it.concept || ws.concept })),
                                     sec.concept));
          }
          out.push(...this.blockAtoms(sec, null));
          return out;
        },
        // null = không có gì để tick → KHÔNG vẽ ô. Lá chỉ có "điều cần nhớ" hay
        // thí nghiệm thì không có từ nào; vẽ ô ở đó là ô không bao giờ đổi được.
        knownState(atoms) {
          if (!atoms || !atoms.length) return null;
          const n = atoms.filter(a => this.isKnown(a.id)).length;
          return n === 0 ? 'none' : (n === atoms.length ? 'all' : 'some');
        },
        // Ghi cả cụm bằng ĐÚNG MỘT lượt POST, hỏng thì hoàn tác toàn bộ — cùng
        // khuôn với ô tick nhóm ở trang môn. Gọi lẻ từng từ là 40 vòng mạng, mà
        // từ Việt Nam mỗi vòng ~200ms.
        // Bản in bỏ thanh chế độ, mục lục, ô tìm, chip lọc, ô tick và nút loa —
        // xem khối @media print ở đầu file. Ở đây chỉ cần gọi hộp thoại in; giữ
        // nguyên bộ lọc đang bật để bản in khớp với màn hình.
        // Tiếng Anh, vì nội dung ôn tập là tiếng Anh. `label()` đã cho sẵn
        // "Unit 1 — The human body" / "1.1 The circulatory system", nên chỉ cần
        // ghép tiền tố — thêm unit hay đổi tên mục thì tiêu đề tự theo.
        get printTitle() {
          const cs = this.data?.concepts || [];
          const root = cs.find(c => !c.parent);
          const what = this.scope ? this.label(cs.find(x => x.id === this.scope))
                                  : (root?.en || '');
          return 'Summary: ' + what;
        },
        // Dòng nhỏ: tên môn, chỉ khi tiêu đề chính đã nói về một unit/mục cụ thể.
        get printSub() {
          const root = (this.data?.concepts || []).find(c => !c.parent);
          return this.scope ? (root?.en || '') : '';
        },
        printSheet() { window.print(); },
        async setKnown(atoms, v) {
          const list = (atoms || []).filter(a => this.isKnown(a.id) !== !!v);
          if (!list.length || !this.canMark) return;
          const prev = {};
          for (const a of list) {
            prev[a.id] = this.cards[a.id];
            this.cards[a.id] = { ...(this.cards[a.id] || {}), known: v ? 1 : 0 };
          }
          try {
            const r = await fetch(`/api/study?user=${this.user}&course=${this.course}`, {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-progress-key': this.secret },
              body: JSON.stringify({ known: list.map(a => ({ i: a.id, c: a.c, v: v ? 1 : 0 })) }),
            });
            if (r.status === 401) {
              this.secret = ''; localStorage.removeItem('lms_key');
              throw new Error('Mã bí mật không đúng');
            }
            if (!r.ok) throw new Error('HTTP ' + r.status);
            this.err = '';
          } catch (e) {
            for (const a of list) {
              if (prev[a.id] === undefined) delete this.cards[a.id]; else this.cards[a.id] = prev[a.id];
            }
            this.err = 'Chưa lưu được đánh dấu "đã thuộc" — thử lại. (' + e.message + ')';
          }
        },
        // Chỉ hiện phần CHƯA thuộc. Nhớ trong localStorage như các bộ lọc khác.
        onlyNew: localStorage.getItem('lms_only_new') === '1',
        toggleOnlyNew() {
          this.onlyNew = !this.onlyNew;
          localStorage.setItem('lms_only_new', this.onlyNew ? '1' : '0');
        },
        // Ẩn mẩu ĐÃ THUỘC. Mẩu không có `card` (điều cần nhớ, thí nghiệm, bảng…)
        // không tick được nên luôn giữ lại — lọc mất chúng là giấu nội dung mà
        // người học chưa hề nói là đã thuộc.
        fk(arr) {
          if (!this.onlyNew) return arr || [];
          return (arr || []).filter(x => !(x && x.card && this.isKnown(x.card)));
        },
        secGloss(sec) { return this.fk(this.fq(sec.glossary || [], 'term', 'def', 'example')); },
        wordItems(ws) { return this.fk(this.fq(ws.items || [], 'word', 'pos', 'def', 'example')); },
        // Bỏ qua mục đã nắm chắc — MẶC ĐỊNH TẮT: người mới vào chưa có mục nào
        // "nắm chắc", bật sẵn thì chẳng lọc gì mà lại giấu mất một lựa chọn.
        skipKnown: localStorage.getItem('lms_skip_known') === '1',
        toggleSkip() { this.skipKnown = !this.skipKnown; localStorage.setItem('lms_skip_known', this.skipKnown ? '1' : '0'); },
        showList: false,
        // Ảnh đang phóng to (tên file trong study/img/). Rỗng = không phóng.
        // Bấm ảnh để phóng, bấm lần nữa (hoặc Esc) để bỏ.
        zoom: '',
        // Ô tìm theo từ khoá trong phần tóm tắt. Lọc TỪNG MẨU nội dung, không
        // lọc cả mục: gõ "oxygen" thì chỉ những từ vựng / ý / hàng bảng có chữ
        // đó còn lại, mục nào không còn gì thì tự ẩn.
        // ⚠ ĐỪNG đặt tên `q`: đã có getter q() trả về câu hỏi đang hiện của phần
        // trắc nghiệm. Khoá sau ghi đè khoá trước trong object literal.
        kw: '',
        get qq() { return (this.kw || '').trim().toLowerCase(); },
timMo: false,
      timMoRa() { this.timMo = true; this.$nextTick(() => this.$refs.timO && this.$refs.timO.focus()); },
      timDong() { this.kw = ''; this.timMo = false; },
        // Số BỘ LỌC của chế độ đang mở (tuỳ chọn In/Tự đọc/sắp xếp không tính) — số trên ⚙
        // và dòng "Đang lọc" (ADR 0054). `kinds` chỉ gồm chip có trong phạm vi (ADR 0047).
        get soLoc() {
          if (this.mode === 'summary') return this.kinds.filter((kd) => this.filt[kd.k]).length + (this.onlyNew ? 1 : 0);
          if (this.mode === 'cards' || this.mode === 'quiz') return this.skipKnown ? 1 : 0;
          return 0;
        },
        get tenLoc() {
          if (this.mode === 'summary')
            return [...(this.onlyNew ? ['Chưa thuộc'] : []), ...this.kinds.filter((kd) => this.filt[kd.k]).map((kd) => kd.t)];
          return this.skipKnown && (this.mode === 'cards' || this.mode === 'quiz') ? ['Chưa thuộc'] : [];
        },
        boLoc() {
          if (this.mode === 'summary') {
            for (const k of Object.keys(this.filt)) this.filt[k] = false;
            localStorage.setItem('lms_pick', JSON.stringify(this.filt));
            if (this.onlyNew) this.toggleOnlyNew();
          } else if (this.skipKnown) this.toggleSkip();
        },
        // Số mẩu còn lại trong MỘT lá sau khi lọc. Chỉ đếm loại ĐANG HIỆN, nên
        // dùng được cho cả ô tìm lẫn chip. Danh sách dưới đây phải soi đúng các
        // khối mà lá thật sự vẽ ra (mỗi dòng ứng với một `x-if="show.…"` trong
        // vòng lặp lá); lệch một khối là lá rỗng vẫn hiện, hoặc lá có nội dung
        // bị giấu — cả hai đều im lặng.
        leafHits(sec, leafId) {
          const s = this.show;
          return (s.facts   ? this.tagged(this.points(sec), leafId).length : 0)
               + (s.gloss   ? this.tagged(sec.glossary, leafId).length : 0)
               + (s.watch   ? this.tagged(sec.watch_out, leafId).length : 0)
               + (s.list    ? this.lists(sec, leafId).length : 0)
               + (s.exp     ? this.exps(sec, leafId).length : 0)
               + (s.worked  ? this.works(sec, leafId).length : 0)
               + (s.compare ? this.comps(sec, leafId).length : 0);
        },
        // Số mẩu còn lại trong CẢ MỤC, kể cả phần không gắn lá.
        secHits(sec) {
          const s = this.show, u = this.untagged(sec);
          let n = (s.topics  ? this.tops(sec).length : 0)
                + (s.gloss   ? this.secGloss(sec).length : 0)
                + (s.words   ? this.wordsets(sec).reduce((k, ws) => k + this.wordItems(ws).length, 0) : 0)
                + (s.grammar ? this.grammars(sec).length : 0)
                + (s.phrases ? this.phrasesets(sec).length : 0)
                + (s.reading ? this.reads(sec).length : 0)
                + (s.sounds  ? this.sounds(sec).length : 0)
                // Khối cấp MỤC (không gắn lá nào) cũng phải tính: mục chỉ có
                // phần này mà bỏ sót là bị giấu oan.
                + (s.facts   ? u.points.length : 0)
                + (s.watch   ? u.watch.length : 0)
                + (s.list    ? this.allLists(sec).length : 0)
                + (s.exp     ? this.secExps(sec).length : 0)
                + (this.hit(sec.big_en) && this.qq ? 1 : 0);
          for (const leaf of this.leavesOf(sec)) n += this.leafHits(sec, leaf.id);
          return n;
        },
        // Đang lọc = có từ khoá HOẶC có chip được chọn. Cả hai phải ẩn HẲN mục và
        // lá rỗng, không chỉ ẩn nội dung bên trong: mục trơ mỗi tiêu đề trông y
        // như "phần này chưa soạn", mà trẻ thì không biết đó là do bộ lọc.
        get filtering() { return !!this.qq || this.anyPick || this.onlyNew; },
        // Tổng số mẩu còn lại sau khi lọc, gộp cả môn trong phạm vi. Không dùng
        // để vẽ (dòng "không có mục nào" soi thẳng shownSummary), nhưng là con số
        // duy nhất đo được bộ lọc từ ngoài — tests/test_study_search.py đọc nó.
        get nHits() { return this.scopedSummary.reduce((n, x) => n + this.secHits(x), 0); },
        // Mục nào không còn gì để hiện thì biến mất hẳn — kể cả câu chốt và sơ đồ.
        get shownSummary() {
          // Mục đã tick "đã thuộc" TOÀN BỘ thì biến mất kể cả khi bên trong còn
          // điều cần nhớ hay thí nghiệm: ô tick của mục là lời khẳng định về cả
          // mục, không riêng đám từ vựng.
          let S = this.onlyNew
            ? this.scopedSummary.filter(x => this.knownState(this.secAtoms(x)) !== 'all')
            : this.scopedSummary;
          return this.filtering ? S.filter(x => this.secHits(x)) : S;
        },
        // Bên trong một bảng/danh sách ĐÃ khớp: nếu có hàng nào khớp thì chỉ giữ
        // các hàng đó; nếu chỉ tiêu đề khớp thì giữ nguyên cả bảng, vì lúc đó
        // chính cái bảng mới là thứ người dùng đang tìm.
        rowsOf(cp) {
          const r = cp.rows || [];
          if (!this.qq) return r;
          const m = r.filter(x => this.hit(x.aspect, x.a, x.b));
          return m.length ? m : r;
        },
        itemsOf(ck) {
          const it = ck.items || [];
          if (!this.qq) return it;
          const m = it.filter(x => this.hit(x.sign, x.look_for, x.book_example));
          return m.length ? m : it;
        },
        // Số thứ tự của một bước trong danh sách CÓ THỨ TỰ (`ck.ordered`). Phải
        // đếm trên `ck.items` GỐC, không phải trên chỉ số vòng lặp: `itemsOf` lọc
        // bỏ hàng không khớp từ khoá, nên gõ tìm "transport" mà đánh số theo vòng
        // lặp thì bước 3 hiện ra là "1" — sai mà trông vẫn hợp lý.
        // `filter` giữ nguyên tham chiếu object nên `indexOf` tìm đúng.
        stt(ck, it) { return (ck.items || []).indexOf(it) + 1; },
        shownLeaves(sec) {
          let L = this.leavesOf(sec);
          if (this.onlyNew) L = L.filter(l => this.knownState(this.leafAtoms(sec, l.id)) !== 'all');
          return this.filtering ? L.filter(l => this.leafHits(sec, l.id)) : L;
        },
        // Tô sáng từ khoá. Tự escape rồi mới chèn <mark>, nên x-html ở đây an toàn.
        esc(v) {
          return String(v ?? '').replace(/[&<>"]/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
        },
        hl(v) {
          const t = this.esc(v);
          if (!this.qq) return t;
          const rx = new RegExp('(' + this.qq.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
          return t.replace(rx, '<mark class="bg-amber-200 text-slate-900 rounded px-0.5">$1</mark>');
        },
        hit(...parts) {
          if (!this.qq) return true;
          return parts.filter(Boolean).join(' ').toLowerCase().includes(this.qq);
        },
        // Lọc một mảng khối theo từ khoá; khối nào không khớp thì biến mất.
        fq(arr, ...keys) {
          if (!this.qq) return arr || [];
          return (arr || []).filter(x => this.hit(...keys.map(k => {
            const v = x[k];
            return Array.isArray(v) ? v.map(y => typeof y === 'object' ? Object.values(y).join(' ') : y).join(' ') : v;
          })));
        },
        // Nguồn của MỌI lượt chọn câu: bật lọc thì mục đã thuộc đứng ngoài hẳn.
        // HAI thước đo khác nhau, cố ý: thẻ ghi nhớ dùng CỜ TAY, còn trắc nghiệm
        // vẫn dùng ngưỡng RETIRE suy từ kết quả làm bài — phần trắc nghiệm giữ
        // nguyên cơ chế chấm điểm để còn nuôi được thống kê "câu nào hay sai".
        isDone(kind, q) { return kind === 'cards' ? this.isKnown(q.id) : this.retired(q); },
        pool(kind) {
          const all = kind === 'cards' ? this.scopedCards : this.scopedQuiz;
          return this.skipKnown ? all.filter(q => !this.isDone(kind, q)) : all;
        },
        get poolItems() { return this.pool(this.mode === 'cards' ? 'cards' : 'quiz'); },
        // Bảng trạng thái: một dòng mỗi mục, sắp mục yếu lên trước.
        get listRows() {
          const now = Math.floor(Date.now() / 1000);
          return this.modeItems.map(q => {
            const c = this.cards[q.id];
            const n = c?.n || 0, wrong = c?.wrong || 0;
            // Cờ tay thắng: đã tick "đã thuộc" thì bảng phải nói vậy, kể cả khi
            // thẻ đó chưa từng được lật lần nào.
            const st = this.isKnown(q.id) ? 'known'
                     : (!c || !n ? 'new' : (this.retired(q) ? 'known'
                     : (wrong / n > 0.34 ? 'weak' : 'learning')));
            return {
              id: q.id, text: q.stem_en || q.front_en || '', concept: this.conceptName(q.concept),
              n, wrong, box: c?.box || 0, st,
              due: c?.due ? Math.round((c.due - now) / 86400) : null,
            };
          }).sort((a, b) => ({ weak: 0, learning: 1, new: 2, known: 3 })[a.st]
                          - ({ weak: 0, learning: 1, new: 2, known: 3 })[b.st]
                          || (b.wrong / (b.n || 1)) - (a.wrong / (a.n || 1)));
        },
        ST: { weak:    { t: 'Hay sai',    c: 'bg-rose-100 text-rose-700' },
              learning:{ t: 'Đang học',   c: 'bg-amber-100 text-amber-700' },
              new:     { t: 'Chưa làm',   c: 'bg-slate-100 text-slate-500' },
              known:   { t: 'Nắm chắc',   c: 'bg-emerald-100 text-emerald-700' } },
        retired(q) {
          const c = this.cards[q.id], R = this.RETIRE;
          return !!c && c.n >= R.n && c.box >= R.box && c.wrong / c.n <= R.err;
        },
        get nRetired() { return this.scopedItems.filter(q => this.retired(q)).length; },
        // Thanh "đã nắm chắc" ở màn hình đầu tính theo ĐÚNG tab đang mở (trắc nghiệm
        // hay thẻ) — gộp cả hai thì con số không khớp thứ đang nhìn (9 câu mà /17).
        get modeItems() { return this.mode === 'cards' ? this.scopedCards : this.scopedQuiz; },
        get modeRetired() {
          const k = this.mode === 'cards' ? 'cards' : 'quiz';
          return this.modeItems.filter(q => this.isDone(k, q)).length;
        },
        get scopedItems() {
          return [...this.scopedQuiz, ...this.scopedCards];
        },
        // Đếm khái niệm THỰC SỰ có bài trong phạm vi, không đếm cả cây. Nút trung
        // gian (unit, mục) và khái niệm chưa có nội dung đều không tính — nếu tính,
        // chọn mục nào cũng ra cùng một con số của toàn môn.
        get scopedConcepts() {
          return new Set(this.scopedItems.map(x => x.concept)).size;
        },

        // Làm trơn (+0.5/+1.0) là bắt buộc: thiếu nó thì một câu mới sai đúng
        // một lần (tỉ lệ 1,0) sẽ xếp trên một chủ đề yếu thật sai 6/10, và
        // danh sách "điểm yếu" biến thành danh sách "câu mới gặp một lần".
        score(q, now) {
          const c = this.cards[q.id];
          const err = c ? (c.wrong + 0.5) / (c.n + 1.0) : 0.5;
          const overdue = c ? Math.max(0, Math.min((now - c.due) / 86400, 14) / 14) : 0;
          const fresh = c && (now - c.last_ts) < 600 ? -2.0 : 0;
          const novel = !c || c.n === 0 ? 0.35 : 0;
          return 1.6 * err + 1.0 * overdue + 0.6 * this.conceptErr(q.concept) + novel + fresh;
        },
        KINDS: [
          { k: 'gloss',   t: '📖 Từ vựng',     on: 'bg-indigo-600 text-white border-indigo-600',  off: 'bg-white text-indigo-700 border-indigo-300' },
          { k: 'facts',   t: '✦ Điều cần nhớ', on: 'bg-sky-600 text-white border-sky-600',        off: 'bg-white text-sky-700 border-sky-300' },
          { k: 'list',    t: '☑ Danh sách',    on: 'bg-emerald-600 text-white border-emerald-600', off: 'bg-white text-emerald-700 border-emerald-300' },
          { k: 'watch',   t: '⚠ Dễ nhầm',      on: 'bg-amber-500 text-white border-amber-500',    off: 'bg-white text-amber-700 border-amber-300' },
          { k: 'exp',     t: '🔬 Thí nghiệm',  on: 'bg-violet-600 text-white border-violet-600',  off: 'bg-white text-violet-700 border-violet-300' },
          { k: 'worked',  t: '🧮 Bài mẫu',     on: 'bg-teal-600 text-white border-teal-600',      off: 'bg-white text-teal-700 border-teal-300' },
          { k: 'topics',  t: '① Kiến thức học', on: 'bg-orange-600 text-white border-orange-600', off: 'bg-white text-orange-700 border-orange-300' },
          { k: 'words',   t: '🔤 Từ vựng',      on: 'bg-cyan-600 text-white border-cyan-600',      off: 'bg-white text-cyan-700 border-cyan-300' },
          { k: 'grammar', t: '📐 Ngữ pháp',     on: 'bg-rose-600 text-white border-rose-600',      off: 'bg-white text-rose-700 border-rose-300' },
          { k: 'sounds',  t: '🗣 Phát âm',      on: 'bg-amber-600 text-white border-amber-600',    off: 'bg-white text-amber-700 border-amber-300' },
          { k: 'phrases', t: '💬 Mẫu câu',      on: 'bg-lime-600 text-white border-lime-600',      off: 'bg-white text-lime-700 border-lime-300' },
          { k: 'reading', t: '📕 Bài đọc',      on: 'bg-fuchsia-600 text-white border-fuchsia-600', off: 'bg-white text-fuchsia-700 border-fuchsia-300' },
          { k: 'compare', t: '⇄ So sánh',      on: 'bg-slate-700 text-white border-slate-700',    off: 'bg-white text-slate-700 border-slate-300' },
        ],
        // ⚠ ĐỪNG đặt tên state này là `pick`: đã có method pick(c) chọn đáp án
        // trắc nghiệm, khoá sau ghi đè khoá trước trong object literal.
        toggleShow(k) { this.filt[k] = !this.filt[k]; localStorage.setItem('lms_pick', JSON.stringify(this.filt)); },
        // Chỉ tính chip CÓ MẶT trong phạm vi đang xem. `filt` lưu ở localStorage nên
        // một lựa chọn cũ (ví dụ Thí nghiệm) đi theo sang unit không có loại đó;
        // tính cả nó thì `show` cho ra false hết và cả trang trắng, không lý do.
        get anyPick() { return this.kinds.some(kd => this.filt[kd.k]); },
        // Hiển thị thật sự: chưa chọn gì thì hiện hết, chọn rồi thì chỉ hiện phần đã chọn.
        get show() {
          const on = this.anyPick;
          return Object.fromEntries(this.KINDS.map(kd => [kd.k, on ? !!this.filt[kd.k] : true]));
        },
        // Chip nào không có nội dung trong phạm vi đang xem thì ẩn hẳn: bấm vào
        // một bộ lọc rỗng chỉ làm trẻ tưởng trang hỏng. Tính theo scopedSummary
        // nên đổi phạm vi ở cây bên trái là chip tự hiện/ẩn theo.
        hasKind(k) {
          const F = { gloss: 'glossary', facts: null, list: 'checklists',
                      watch: 'watch_out', exp: 'experiments', worked: 'worked', topics: 'topics',
                      words: 'words', grammar: 'grammar', phrases: 'phrases', reading: 'readings',
                      sounds: 'sounds',
                      compare: 'compares' };
          return this.scopedSummary.some(sec =>
            (k === 'facts' ? this.points(sec) : (sec[F[k]] || [])).length);
        },
        get kinds() { return this.KINDS.filter(kd => this.hasKind(kd.k)); },

        // ── Phạm vi học ───────────────────────────────────────────────────────
        // Bấm vào Unit thì học cả Unit; bấm vào một mục con thì chỉ học mục đó.
        // Làm bằng cách lấy toàn bộ nhánh con của khái niệm được chọn.
        subtree(cid) {
          if (this._sub && this._sub[cid]) return this._sub[cid];
          const out = new Set([cid]);
          const walk = (id) => this.children(id).forEach(k => { out.add(k.id); walk(k.id); });
          walk(cid);
          (this._sub = this._sub || {})[cid] = out;
          return out;
        },
        inScope(cid) { return !this.scope || this.subtree(this.scope).has(cid); },
        // Không còn mục "cả môn": mở trang là vào thẳng unit đầu tiên.
        pickFirstUnit() {
          if (this.scope) return;
          const u = this.units;
          if (!u.length) return;
          // Unit ĐẦU TIÊN CÓ NỘI DUNG, không phải unit số 1: môn Science mới soạn
          // Unit 2, mở vào Unit 1 rỗng thì trang trông như hỏng.
          const has = new Set((this.data?.summary || []).map(x => x.concept));
          const inside = (id) => has.has(id) || this.children(id).some(k => has.has(k.id));
          // Khôi phục phạm vi lần trước — nhưng chỉ khi id đó CÒN TỒN TẠI và CÒN
          // NỘI DUNG. Nội dung được soạn lại thường xuyên; một id cũ đã biến mất mà
          // cứ khôi phục thì mở trang ra là trắng, không lý do, và người dùng không
          // có cách nào đoán được vì sao.
          const saved = localStorage.getItem(this.scopeKey);
          if (saved && (this.data?.concepts || []).some(c => c.id === saved) && inside(saved)) {
            this.scope = saved;
            this.openAncestors(saved);
            return;
          }
          const pick = u.find(x => inside(x.id)) || u[0];
          this.scope = pick.id;
          this.openMap[pick.id] = true;
        },
        // Bung mọi nhánh cha để mục đang chọn nhìn thấy được ở cây bên trái.
        openAncestors(cid) {
          const by = new Map((this.data?.concepts || []).map(c => [c.id, c]));
          let c = by.get(cid);
          while (c) {
            this.openMap[c.id] = true;
            c = c.parent ? by.get(c.parent) : null;
          }
        },
        setScope(cid) {
          this.scope = cid;
          this.navOpen = false;
          // CHỈ nhớ phạm vi đang đọc ở chế độ tóm tắt. Quiz và thẻ ghi nhớ cũng
          // dùng chung `scope`, nhưng ở đó đổi phạm vi là để chọn đề luyện, không
          // phải để đánh dấu chỗ đang đọc — ghi đè thì lần sau mở trang lại rơi
          // vào mục vừa luyện chứ không phải mục đang đọc dở.
          if (this.mode === 'summary') {
            try { localStorage.setItem(this.scopeKey, cid); } catch (e) { /* riêng tư/đầy */ }
          }
          // Đang giữa phiên mà đổi phạm vi thì quay về màn hình bắt đầu, không
          // thì hàng đợi cũ vẫn chạy tiếp với nội dung ngoài phạm vi vừa chọn.
          if (this.screen !== 'start' && (this.mode === 'quiz' || this.mode === 'cards')) {
            this.screen = 'start';
          }
        },
        get scopeName() {
          if (!this.scope) return 'Cả môn';
          return this.label((this.data?.concepts || []).find(x => x.id === this.scope)) || this.scope;
        },
        get scopedQuiz() { return (this.data?.quiz || []).filter(q => this.inScope(q.concept)); },
        get scopedCards() { return (this.data?.flashcards || []).filter(q => this.inScope(q.concept)); },
        get scopedSummary() { return (this.data?.summary || []).filter(x => this.inScope(x.concept)); },

        // ── Cây khái niệm ──────────────────────────────────────────────────────
        // Cây, KHÔNG phải ảnh: tìm kiếm được, diff được trong git, và chính nó
        // là phân loại khái niệm mà conceptErr() cộng dồn lên.
        // Dùng ?. ở mọi getter: Alpine ĐÁNH GIÁ biểu thức trong x-show dù đang
        // ẩn, nên cây bên trái chạy trước khi fetch xong và data vẫn là null.
        children(pid) { return (this.data?.concepts || []).filter(c => c.parent === pid); },
        // Con hiện trên menu chỉ khi bản thân nó có mục tóm tắt riêng.
        navKids(pid) {
          const has = new Set((this.data?.summary || []).map(x => x.concept));
          return this.children(pid).filter(c => has.has(c.id));
        },
        get roots() { return this.children(null); },
        // "Unit" = tầng ngay dưới gốc. Nếu cây chỉ có một gốc (một unit duy
        // nhất) thì lấy chính các con của nó, để menu không hiện đúng một dòng.
        get units() {
          const r = this.roots;
          return r.length === 1 ? this.children(r[0].id) : r;
        },
        // Số câu và tỉ lệ sai của một nhánh, tính gộp cả nhánh con
        branchStat(cid) {
          const out = { n: 0, wrong: 0, items: 0 };
          const walk = (id) => {
            for (const q of this.allItems) {
              if (q.concept !== id) continue;
              out.items++;
              const c = this.cards[q.id];
              if (c) { out.n += c.n; out.wrong += c.wrong; }
            }
            this.children(id).forEach(k => walk(k.id));
          };
          walk(cid);
          return out;
        },
        // Nhãn hiển thị: "2.1 Properties of substances". Số mục để RIÊNG trong
        // trường `no` chứ không nhét vào `en` — bảng khoá khái niệm tra theo `en`,
        // đổi nhãn là tách đôi lịch sử.
        // "Unit 2 — Materials…" cho unit, "2.1 Properties…" cho mục con.
        // Số mục đã tự mang dấu chấm nên đừng thêm dấu chấm nữa.
        label(c) {
          if (!c) return '';
          if (!c.no) return c.en;
          return c.no.includes('.') ? c.no + ' ' + c.en : 'Unit ' + c.no + ' — ' + c.en;
        },
        // Chấp nhận cả hai dạng: points_en là mảng chuỗi (bản cũ, môn khác),
        // points là mảng {t, icon}. Không ép migrate toàn bộ chỉ vì một môn.
        // Các khối tuỳ chọn — thí nghiệm, bảng, so sánh, dễ nhầm — là MẢNG: một lá
        // có thể có 0, 1 hay nhiều, tuỳ độ quan trọng. Nhận cả dạng cũ (một object)
        // để dữ liệu môn khác chưa gen lại vẫn hiện.
        arr(sec, many, one) { const a = sec[many]; if (Array.isArray(a)) return a; const o = sec[one]; return o ? [o] : []; },
        // Qua fq như exps/works: đếm và vẽ phải dùng CHUNG một phép lọc, lệch
        // nhau là lá rỗng vẫn hiện hoặc lá có nội dung bị giấu.
        lists(sec, leafId)  { return this.fq(this.arr(sec, 'checklists', 'checklist').filter(x => x.concept === leafId), 'title', 'note', 'items'); },
        exps(sec, leafId)   { return this.fq(this.arr(sec, 'experiments', 'from_the_book').filter(x => x.concept === leafId), 'title','summary','result'); },
        // Bản CẤP MỤC: mục dùng `topics` (Toán) hay `words` (ESL) bỏ hẳn vùng vẽ
        // theo lá, nên bài mẫu và checklist của nó không hiện ở đâu cả. Đã đo:
        // Toán 1 có 7 bài mẫu + 6 checklist viết ra mà chưa từng lên màn hình.
        secWorks(sec) { return this.fq(this.arr(sec, 'worked', null), 'title','problem','answer','steps'); },
        // TÊN KHÁC `secLists`: đã có một `secLists` khác ở dưới (checklist KHÔNG
        // gắn lá). Trong object literal thì định nghĩa sau thắng, nên trùng tên là
        // hàm của mình thành hàm chết mà không có lỗi nào.
        allLists(sec) { return this.fq(this.arr(sec, 'checklists', 'checklist'), 'title','note','items'); },
        works(sec, leafId)   { return this.fq(this.arr(sec, 'worked', null).filter(x => x.concept === leafId), 'title','problem','answer','steps'); },
        tops(sec)           { return this.fq(sec.topics || [], 'title', 'def', 'def_vi', 'rules', 'rules_vi', 'subtitle'); },
        // Ba khối riêng của môn ngoại ngữ. ESL dạy KỸ NĂNG DÙNG chứ không dạy
        // kiến thức để nhớ, nên "điều cần nhớ" và "thí nghiệm" không hợp:
        //   words   — bộ từ vựng, mỗi từ kèm loại từ và câu ví dụ thật trong bài
        //   grammar — mỗi hộp "Use of English" của sách một thẻ
        //   phrases — cụm câu chép ra dùng ngay (hộp "Speaking tip")
        wordsets(sec) { return this.fq(sec.words || [], 'title', 'note', 'items'); },
        grammars(sec) { return this.fq(sec.grammar || [], 'title', 'when', 'form', 'examples'); },
        phrasesets(sec) { return this.fq(sec.phrases || [], 'title', 'groups'); },
        reads(sec)    { return this.fq(sec.readings || [], 'title', 'kind', 'about', 'words'); },
        sounds(sec)   { return this.fq(sec.sounds || [], 'title', 'focus', 'words', 'note'); },
        // Một dòng ví dụ "calc" tách thành nhãn | giá trị để CĂN THẲNG CỘT.
        // Trước đây đổ vào lưới 2 cột theo thứ tự, dòng dài xuống dòng là hai
        // cột lệch nhau và không có kẻ nào để bám — đọc thành vô nghĩa.
        calcRow(line) {
          const i = String(line || '').indexOf(': ');
          return i > 0 && i < 32 ? [line.slice(0, i), line.slice(i + 2)] : [null, line];
        },
        comps(sec, leafId)   { return this.fq(this.arr(sec, 'compares', 'compare').filter(x => x.concept === leafId), 'title','label_a','label_b','rows'); },
        // Khối cấp MỤC = không gắn lá nào
        secLists(sec) { return this.arr(sec, 'checklists', 'checklist').filter(x => !x.concept); },
        // Lấy cả thí nghiệm mà KHÔNG LÁ NÀO nhận, không chỉ cái thiếu `concept`.
        // Mục của Science 1 Unit 2 không có lá nào, còn thí nghiệm thì mang concept
        // bằng chính id của mục — rơi đúng khe giữa hai đường vẽ: `exps(sec,leafId)`
        // không có lá để lặp, `secExps` cũ đòi `!x.concept`. Kết quả: 6 thí nghiệm
        // nằm trong dữ liệu, chip "🔬 Thí nghiệm" vẫn hiện, mà khối thì trống trơn.
        secExps(sec)  { const L = new Set(this.leavesOf(sec).map(l => l.id));
                        return this.arr(sec, 'experiments', 'from_the_book')
                                   .filter(x => !x.concept || !L.has(x.concept)); },
        secComps(sec) { return this.arr(sec, 'compares', 'compare').filter(x => !x.concept); },
        // Lá của một mục = con trực tiếp của chủ đề mục đó, theo thứ tự cây
        leavesOf(sec) { return this.children(sec.concept); },
        // Lọc theo lá VÀ theo ô tìm. Mọi khối trong tóm tắt đi qua đây nên chỉ
        // cần bọc một chỗ; khối nào lọc hết thì phần bao ngoài tự ẩn vì
        // template dùng `.length` để quyết định có vẽ hay không.
        tagged(list, leafId) {
          return this.fk(this.fq((list || []).filter(x => x && x.concept === leafId),
                         't', 'term', 'def', 'example', 'title', 'wrong', 'right',
                         'problem', 'answer', 'summary', 'result', 'rules', 'items', 'rows', 'lines'));
        },
        // Mọi thứ KHÔNG gắn vào lá nào của mục — dữ liệu cũ, hoặc ý thuộc cả mục
        untagged(sec) {
          const ids = new Set(this.leavesOf(sec).map(l => l.id));
          const f = (list) => (list || []).filter(x => !x || !ids.has(x.concept));
          const r = { glossary: this.fk(f(sec.glossary)), points: f(this.points(sec)), watch: f(sec.watch_out) };
          r.any = r.glossary.length || r.points.length || r.watch.length
                  || this.secLists(sec).length || this.secExps(sec).length;
          return r;
        },
        // Tách câu đầu của "điều cần nhớ" để in đậm: theo SPEC câu đầu LÀ kiến thức,
        // phần sau chỉ giải thích. Bỏ qua dấu chấm của "°C." và trong "(p.36)".
        lead(t) {
          t = t || '';
          const re = /[.!?](?=\s|$)/g; let m;
          while ((m = re.exec(t))) {
            const i = m.index, before = t.slice(0, i);
            if (before.endsWith('°C') || /\(p\.[^)]*$/.test(before) || /\bp$/.test(before)) continue;
            return [t.slice(0, i + 1), t.slice(i + 1)];
          }
          return [t, ''];
        },
        points(sec) {
          if (Array.isArray(sec.points)) return sec.points;
          return (sec.points_en || []).map(t => ({ t, icon: 'cube' }));
        },
        conceptName(id) {
          const c = (this.data?.concepts || []).find(x => x.id === id);
          return this.label(c) || id;
        },
        go(m) {
          this.mode = m; this.screen = m === 'quiz' || m === 'cards' ? 'start' : m;
          // Nạp mỗi lần MỞ tab, không nạp một lần rồi thôi: trẻ vừa tra thêm vài
          // từ ở tab tóm tắt xong quay lại đây mà thấy danh sách cũ thì trông
          // như tính năng không ghi gì.
          if (m === 'hist') this.loadHist();
        },
        start(n) {
          this._cerr = {};                       // xoá bộ nhớ đệm mỗi phiên
          const now = Math.floor(Date.now() / 1000);
          const seen = [], fresh = [];
          const pool = this.poolItems;
          for (const q of pool) {
            (this.cards[q.id] && this.cards[q.id].n > 0 ? seen : fresh).push(q);
          }
          const by = (a, b) => this.score(b, now) - this.score(a, now);
          const act = seen.filter(q => !this.retired(q));
          const due = act.filter(q => this.cards[q.id].due <= now).sort(by);
          const rest = act.filter(q => this.cards[q.id].due > now).sort(by);
          // Câu đã thuộc chỉ vào hàng đợi khi ĐẾN HẠN; chưa tới hạn thì đứng ngoài hẳn.
          const retDue = seen.filter(q => this.retired(q) && this.cards[q.id].due <= now).sort(by);
          // 60/25/15 là ràng buộc ĐỘNG LỰC, không phải sư phạm: top-N thuần tạo
          // ra phiên mà đứa trẻ 10 tuổi sai 18/20 rồi bỏ. Tính năng không ai mở
          // thì hiệu quả bằng 0.
          const pick = [
            ...due.slice(0, Math.ceil(n * 0.60)),
            ...fresh.slice(0, Math.ceil(n * 0.25)),
          ];
          for (const q of [...due, ...retDue, ...rest, ...fresh]) {
            if (pick.length >= n) break;
            if (!pick.includes(q)) pick.push(q);
          }
          // Giãn sao cho hai câu liền nhau không cùng chủ đề, nếu xếp được
          const q0 = pick.sort(() => Math.random() - 0.5);
          for (let i = 1; i < q0.length; i++) {
            if (q0[i].concept !== q0[i - 1].concept) continue;
            const j = q0.findIndex((x, k) => k > i && x.concept !== q0[i - 1].concept);
            if (j > 0) [q0[i], q0[j]] = [q0[j], q0[i]];
          }
          this.queue = q0;
          this.at = 0; this.log = []; this.picked = null; this.answered = false;
          this.wrongAgain = 0; this.revealed = false; this.qStats = { n: 0, ok: 0 };
          this.screen = 'quiz'; this.shownAt = Date.now();
          this.autoRead(this.q?.stem_en);
        },
        get q() { return this.queue[this.at] || null; },
        // Xáo phương án mỗi lần hiện: bộ sinh hay dồn đáp án vào một chữ cái
        // (lô đầu 13/20 là "b"), xáo thì không đoán mò theo vị trí được. An toàn
        // vì id băm theo NỘI DUNG đáp án đúng, không theo chữ cái.
        get choices() {
          const q = this.q;
          if (!q) return [];
          if (!q._shuffled) {
            q._shuffled = [...q.choices].sort(() => Math.random() - 0.5);
          }
          return q._shuffled;
        },
        // Phải chịu được null: khối phản hồi dùng x-show nên Alpine vẫn đánh giá
        // isCorrect(picked) lúc chưa chọn gì.
        isCorrect(c) { return !!c && !!this.q && c.key === this.q.answer; },

        pick(c) {
          if (this.answered) return;
          this.picked = c; this.answered = true;
          const okAns = this.isCorrect(c);
          const now = Math.floor(Date.now() / 1000);
          const g = okAns ? (Date.now() - this.shownAt > 20000 ? 2 : 3) : 0;
          const q = this.q;
          const st = this.sched(q.id, this.cards[q.id], g, now);
          this.qStats.n++; if (okAns) this.qStats.ok++;
          this.log.push({
            i: q.id, c: q.concept, ok: okAns ? 1 : 0, g,
            ms: Date.now() - this.shownAt,
            x: okAns ? null : c.key,
            t: now, box: st.box, ease: st.ease, due: st.due,
          });
          // Cập nhật ngay tại chỗ để câu sau trong cùng phiên tính đúng
          const prev = this.cards[q.id] || { n: 0, wrong: 0, streak: 0 };
          this.cards[q.id] = {
            ...prev, ...st, n: prev.n + 1,
            wrong: prev.wrong + (okAns ? 0 : 1),
            streak: okAns ? prev.streak + 1 : 0, last_ts: now,
          };
          // Sai thì đẩy lại CUỐI hàng đợi ngay trong phiên, không đợi hôm sau.
          // Giới hạn 5 lần để một câu khó không kéo phiên dài vô tận.
          if (!okAns && this.wrongAgain < 5) { this.queue.push(q); this.wrongAgain++; }
          // Làm tuỳ ý, dừng lúc nào cũng được → lưu định kỳ, đừng đợi hết phiên.
          if (this.log.length >= 5) this.save();
        },
        finishQuiz() { this.save(); this.screen = 'done'; },
        next() {
          this.at++; this.picked = null; this.answered = false; this.shownAt = Date.now();
          if (this.at >= this.queue.length) { this.screen = 'done'; this.save(); }
          else this.autoRead(this.q?.stem_en);
        },
        get nDone() { return this.log.filter(x => x.ok).length; },

        // ── Đọc to ─────────────────────────────────────────────────────────────
        // Web Speech API của trình duyệt: không file audio, không request, không
        // hạn mức. Giọng là của thiết bị nên chất lượng tuỳ máy; đặt en-US để
        // chọn giọng Mỹ. Không có API thì ẩn nút, không báo lỗi.
        // Đọc to: gọi /api/tts (Worker proxy Google Cloud TTS, sinh lúc bấm, cache
        // ở edge) rồi phát MP3; lỗi hay không có API thì lùi về Web Speech của máy.
        // Mở file:// hoặc bản GitHub Pages thì không có /api → luôn Web Speech.
        get canSpeak() { return typeof window !== 'undefined' && ('speechSynthesis' in window || 'Audio' in window); },
        autoSpeak: localStorage.getItem('lms_autospeak') === '1',
        _player: null,
        // Kho blob MP3. CÓ TRẦN và CÓ revoke: `URL.createObjectURL()` ghim blob
        // trong bộ nhớ tới khi trang đóng, nên bản đầu (giữ mọi blob, không bao
        // giờ revoke) là một buổi học dài nghe 100 từ = vài MB không nhả ra.
        // Không chết ai, nhưng trên điện thoại cũ thì thấy. Đuổi theo LRU, và
        // mục vừa dùng luôn được đẩy về cuối nên KHÔNG bao giờ đuổi nhầm cái
        // đang phát dở.
        _blobs: {}, _blobKeys: [], _BLOB_MAX: 50,
        _chamBlob(text) {
          const i = this._blobKeys.indexOf(text);
          if (i >= 0) { this._blobKeys.splice(i, 1); this._blobKeys.push(text); }
        },
        _nhoBlob(text, src) {
          this._blobs[text] = src;
          this._blobKeys.push(text);
          while (this._blobKeys.length > this._BLOB_MAX) {
            const cu = this._blobKeys.shift();
            URL.revokeObjectURL(this._blobs[cu]);
            delete this._blobs[cu];
          }
        },
        // `tinCay`: gửi kèm mã bí mật để đọc chuỗi NGOÀI học liệu (popup tra cứu
        // đọc từ trẻ vừa bôi đen — theo định nghĩa không nằm trong danh sách
        // trắng nào được). Chỉ popup truyền cờ này. Bật cho MỌI nút loa thì danh
        // sách trắng không bao giờ được dùng tới nữa, và nó sẽ mục ruỗng mà
        // không ai biết — đúng kiểu hỏng mà `tts.js` đã dặn.
        async speak(text, tinCay) {
          text = (text || '').trim(); if (!text) return;
          if (this._player) { this._player.pause(); this._player = null; }
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          try {
            let src = this._blobs[text];
            if (src) {
              this._chamBlob(text);
            } else {
              const h = (tinCay && this.secret) ? { headers: { 'x-progress-key': this.secret } } : undefined;
              const r = await fetch(`/api/tts?user=${this.user}&course=${this.course}&text=${encodeURIComponent(text)}`, h);
              if (!r.ok) throw new Error('HTTP ' + r.status);
              src = URL.createObjectURL(await r.blob());
              this._nhoBlob(text, src);
            }
            this._player = new Audio(src);
            await this._player.play();
          } catch (e) { this.speakLocal(text); }
        },
        speakLocal(text) {
          if (!('speechSynthesis' in window)) return;
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US'; u.rate = 0.9;
          const v = window.speechSynthesis.getVoices().find(x => /^en[-_]US/i.test(x.lang));
          if (v) u.voice = v;
          window.speechSynthesis.speak(u);
        },
        toggleAuto() {
          this.autoSpeak = !this.autoSpeak;
          localStorage.setItem('lms_autospeak', this.autoSpeak ? '1' : '0');
        },
        // Tự đọc mặt trước khi hiện thẻ/câu mới. Gọi sau khi state đã đổi.
        autoRead(text) { if (this.autoSpeak) setTimeout(() => this.speak(text), 50); },

        // ── Bốn hàm móc của `_tracuu.html` ───────────────────────────────────
        
      traNgonNgu() { return false ? 'en' : 'vi'; },
      traTen()    { return 'Môn: CIE ESL 5. Mục đang học: '
                             + (this.conceptName(this.scope) || '—') + '.'; },
        traMucCtx() { return this.scopedSummary || []; },
        traDoc()    { return this.data; },
        traSec()    { return this.scope || ''; },
        traKhoa()   { return this.secret; },


        // ── Tra cứu: bôi đen → nút 🔎 → popup ─────────────────────────────────
        // Nghĩa của một từ phụ thuộc CÂU chứa nó và BÀI đang học, nên không dựng
        // sẵn được: `sedimentary` trong bài về đá không giống ở chỗ khác. Vì vậy
        // gọi Gemini lúc bấm, kèm thuật ngữ của mục đang mở.
        moGoc: false,          // đoạn gốc trong popup đang mở rộng?
        nnTra: '',             // ngôn ngữ giải thích: 'vi' | 'en'
        tra: { btn: null, show: false, mode: 'word', text: '', goc: '', sent: '',
               chat: [], hoi: '', dangHoi: false,
               loading: false, err: '', ly_do: '', data: null },

        /** Nới vùng chọn ra nguyên từ: kéo lệch nửa chữ vẫn tra đúng từ. */
        _noRong(r) {
          // Chữ của TỪ gồm mọi chữ cái Unicode + dấu kết hợp: bản ASCII cũ dừng ở
          // "ệ" nên bôi từ dấu ":" của "chuyện:" ra "n: tình" (đo 2026-09-24).
          const W = /[\p{L}\p{M}\p{N}'’-]/u;
          try {
            let n = r.startContainer, o = r.startOffset;
            if (n.nodeType === 3) { while (o > 0 && W.test(n.data[o - 1])) o--; r.setStart(n, o); }
            n = r.endContainer; o = r.endOffset;
            if (n.nodeType === 3) {
              // ⚠ Chrome trên WINDOWS gộp luôn KHOẢNG TRẮNG CUỐI vào vùng chọn
              // khi nháy đúp — đó là quy ước chọn chữ của Windows; Chrome trên
              // Linux/macOS thì không. Không cắt nó đi trước khi nới thì phép
              // nới thấy ký tự kế tiếp là chữ và nuốt luôn từ sau: nháy đúp
              // `Properties` trong "2.1 Properties of substances" ra
              // **"Properties of"**. Người dùng báo; chạy trên Linux KHÔNG tái
              // hiện được, phải tự đặt vùng chọn có kèm dấu cách mới thấy.
              while (o > r.startOffset && /\s/.test(n.data[o - 1])) o--;
              while (o < n.data.length && W.test(n.data[o])) o++;
              r.setEnd(n, o);
            }
          } catch (e) { /* vùng chọn xuyên nhiều thẻ: giữ nguyên */ }
          return r;
        },

        /** Câu chứa vùng chọn — để Gemini biết từ đó đang mang nghĩa nào. */
        _cauChua(r, text) {
          const h = r.commonAncestorContainer;
          const t = ((h.nodeType === 3 ? h.parentElement : h)?.textContent || '').replace(/\s+/g, ' ');
          const i = t.indexOf(text);
          if (i < 0) return '';
          let a = i, b = i + text.length;
          while (a > 0 && !/[.!?]/.test(t[a - 1])) a--;
          while (b < t.length && !/[.!?]/.test(t[b])) b++;
          return t.slice(a, b + 1).trim().slice(0, 300);
        },

        /** Thuật ngữ của PHẠM VI đang mở. Đây là toàn bộ lý do dùng Gemini thay
            vì một máy dịch thường: thiếu nó thì `igneous rock` ra "đá nham thạch"
            chứ không phải "đá mácma" — vẫn trôi chảy, vẫn không ai thấy sai.

            Dùng `scopedSummary` chứ KHÔNG so `x.concept === this.scope`: `scope`
            là một UNIT, còn các mục tóm tắt là CON của unit đó. So bằng thì không
            khớp mục nào, `ctx` còn trơ mỗi dòng tiêu đề, và tính năng lặng lẽ tụt
            xuống đúng bằng một máy dịch thường. */
        _traCtx() {
          // Tên môn LUÔN có, kể cả khi chưa có học liệu ôn tập. Bản đầu thoát
          // sớm khi thiếu học liệu và trả về ctx RỖNG — 11/17 môn rơi vào đó, và
          // Gemini không biết đang học môn gì. Chỉ phần glossary mới phụ thuộc
          // vào học liệu.
          const tat = [];
          for (const s of this.traMucCtx()) {
            for (const g of s.glossary || []) tat.push([g.term, g.def || '']);
            for (const w of s.words || []) for (const it of w.items || [])
              tat.push([it.word, it.def || '']);
          }
          // Ưu tiên thuật ngữ CÓ MẶT ngay trong chỗ đang tra. Một unit có thể có
          // hàng trăm thuật ngữ mà chỉ 20 dòng đầu lọt vào ctx; cắt theo thứ tự
          // gốc thì đúng cái từ đang hỏi lại hay bị cắt mất.
          const cho = (this.tra.sent + ' ' + this.tra.text).toLowerCase();
          const hop = [], con = [];
          for (const x of tat) (cho.includes((x[0] || '').toLowerCase()) ? hop : con).push(x);
          // Dấu hai chấm, KHÔNG phải dấu bằng — và nhãn nói thẳng đây là ĐỊNH
          // NGHĨA TIẾNG ANH. Bản đầu viết `crystal = The particular shaped
          // structure of a mineral.` và trong một danh sách thuật ngữ thì `=`
          // đọc ra là "dịch thành", nên Gemini dịch nguyên câu định nghĩa vào ô
          // nghĩa: `crystal` ra "cấu trúc hình dạng đặc biệt của một loại khoáng
          // vật" thay vì "tinh thể". Bỏ hẳn ctx đi thì lại ra đúng — tức ngữ
          // cảnh đang LÀM HỎNG chính thứ nó sinh ra để cứu.
          const ds = [...hop, ...con].slice(0, 20).map((x) => x[0] + ': ' + x[1]);
          const dau = this.traTen();
          return (dau + (ds.length
            ? '\nĐịnh nghĩa TIẾNG ANH của các thuật ngữ trong mục (KHÔNG phải bản dịch):\n' + ds.join('\n')
            : '')).slice(0, 1200);
        },

        /** Không có mạng / không có mã: vẫn tra được nếu từ đó là thuật ngữ của
            bài. Lùi thầm, không báo lỗi — đúng nếp của cả dự án. */
        _traOffline() {
          const k = (this.tra.text || '').toLowerCase();
          // Trả về ĐÚNG hình dạng mà Gemini trả về (`phan[]`), không phải một
          // hình dạng riêng. Hai hình dạng thì phải có hai bộ vẽ, và hai bộ vẽ
          // thì sớm muộn lệch nhau — mà nhánh offline là nhánh ít ai mở ra xem
          // nhất, nên nó sẽ là cái lệch trước và lệch lâu nhất.
          const khoi = (td, nd, en, vi) => ({
            tieu_de: td, noi_dung: nd || '',
            vi_du: en ? [{ en: en, vi: vi || '' }] : [],
          });
          for (const s of (this.traDoc()?.summary || [])) {
            for (const g of s.glossary || []) if ((g.term || '').toLowerCase() === k)
              return { tu: g.term, phan: [khoi('Trong học liệu', g.def, g.example, '')],
                       _offline: true };
            for (const w of s.words || []) for (const it of w.items || [])
              if ((it.word || '').toLowerCase() === k)
                return { tu: it.word, loai: it.pos || '', ipa: it.ipa || '',
                         phan: [khoi('Trong học liệu', it.def, it.example, it.example_vi)],
                         _offline: true };
          }
          return null;
        },

        /** Chạy mỗi lần vùng chọn đổi. Quyết định CÓ hiện nút hay không. */
        /** Điểm vào CHUNG cho mọi cách chọn: bôi đen và chọn vùng đều đổ vào
            đây, nên popup, trần ký tự và lịch sử tra chỉ có một đường.

            Trả về LÝ DO thay vì true/false: đường bôi đen im lặng khi đoạn quá
            dài (nút không hiện là đủ), còn đường KÉO thì phải báo — người dùng
            vừa chủ động kéo một vùng to mà không thấy gì thì tưởng hỏng.
            `box` là hình chữ nhật vùng chọn theo toạ độ viewport. */
        _traDat({ text, goc, sent, box, rg = null, vung = null }) {
          // ⚠ 1000 ký tự phải KHỚP `MAX.text` trong `worker/lookup.js`. Lệch
          // nhau thì hỏng lặng lẽ: trang cho hiện nút, Worker cắt cụt đoạn.
          if (!text) return 'rong';
          if (!/[A-Za-z]/.test(text)) return 'rong';
          if (text.length > 1000) return 'dai';
          this.tra.text = text;
          this.tra.goc = goc;
          this.tra.sent = sent || '';
          this.tra.mode = text.split(/\s+/).length <= 3 ? 'word' : 'text';
          // Không có mã bí mật thì chỉ hiện nút khi tra offline ra được cái gì.
          if (!this.traKhoa() && !this._traOffline()) return 'khong-tra';
          this._traRg = rg;
          this._traVung = vung;
          // `box: null` = đường gọi tự lo chỗ đặt nút (chọn vùng: nút nằm ở
          // dải dưới đáy). ⚠ `bottom` có thể THIẾU nếu ai đó truyền một ô tự
          // dựng `{left, top, width, height}`: `undefined + 8` ra NaN, trình
          // duyệt bỏ `top:NaNpx` và nút rơi xuống CUỐI TÀI LIỆU (đo được:
          // top = 208.674px) — có trong DOM mà không ai nhìn thấy.
          const day = box ? (box.bottom ?? box.top + box.height) : NaN;
          this.tra.btn = Number.isFinite(day)
            ? { x: Math.min(Math.max(box.left + box.width / 2, 60), innerWidth - 60),
                y: Math.min(day + 8, innerHeight - 44) }
            : null;
          return 'ok';
        },

        chonDoi() {
          // ⚠ Đang ở CHẾ ĐỘ CHỌN VÙNG thì đường bôi đen đứng ngoài. Cả hai cùng
          // ghi vào `tra.*`, mà cú thả chuột của vùng kéo cũng bắn `mouseup` ở
          // mức document → `chonDoi()` chạy, xoá `tra.btn` vừa đặt rồi trả về
          // sớm (không có vùng chọn DOM nào để bôi), và nút 🔎 biến mất ngay
          // sau khi kéo. Trang ôn tập không có `chonHoat` nên vô hại ở đó.
          if (this.chonHoat) return;
          const sel = window.getSelection();
          this.tra.btn = null;
          // Trang nhúng có móc `traNhanChon` thì TỰ GOM vùng bôi đen (trang đọc:
          // bôi đen và kéo vùng đổ về MỘT tập ký tự, một nút 🔎 ở dải đáy — xem
          // `traNhanChon()` trong `docview.html`). Ở đây chỉ còn việc lọc vùng
          // nội dung và nắn biên từ; `r = null` nghĩa là vùng bôi đen vừa mất.
          if (this.traNhanChon) {
            if (this.tra.show || !sel) return;
            let r = null;
            if (!sel.isCollapsed && sel.rangeCount) {
              const r0 = sel.getRangeAt(0);
              const h = r0.commonAncestorContainer;
              const el = h.nodeType === 3 ? h.parentElement : h;
              // ⚠ cloneRange — cùng lý do như nhánh dưới (Range SỐNG).
              if (el && el.closest && el.closest('[data-tra]')) r = this._noRong(r0.cloneRange());
            }
            this.traNhanChon(r);
            return;
          }
          if (this.tra.show || !sel || sel.isCollapsed || !sel.rangeCount) return;
          const r0 = sel.getRangeAt(0);
          const h = r0.commonAncestorContainer;
          const el = h.nodeType === 3 ? h.parentElement : h;
          // Chỉ bắt trong vùng nội dung: bôi đen ở ô tìm kiếm hay thanh chế độ
          // mà cũng hiện nút thì nút chắn mất đúng thứ người ta đang gõ.
          if (!el || !el.closest || !el.closest('[data-tra]')) return;
          // ⚠ PHẢI nhân bản. `getRangeAt(0)` trả về Range SỐNG của vùng
          // chọn, nên `setStart`/`setEnd` trong `_noRong` sửa thẳng vùng
          // người dùng ĐANG kéo — và thao tác đó chuẩn hoá chiều thành xuôi,
          // tức lật điểm focus từ đầu xuống cuối. Kéo xuôi vô hại (focus vốn
          // ở cuối); kéo NGƯỢC thì cú kéo tiếp theo tính từ chỗ khác và vùng
          // chọn co lại. Người dùng báo: "kéo từ trên xuống thì được, từ dưới
          // lên thì không".
          //
          // ⚠ Chuột mô phỏng chạy liền tay KHÔNG tái hiện được: handler chờ
          // 120ms sau cú di chuyển CUỐI (mỗi `mousemove` gọi `clearTimeout`),
          // nên nó chỉ chạy sau khi nhả chuột. Phải kéo có khựng >120ms giữa
          // chừng, đúng nhịp tay người. Đo được: nghỉ 25ms/bước → hai chiều
          // đều 370 ký tự; nghỉ 200ms/bước → xuống 370, LÊN CÒN 65.
          const r = this._noRong(r0.cloneRange());
          // Hai bản của cùng một đoạn, cố ý:
          //  · `text`  — đã dồn khoảng trắng, dùng để GỌI API, đo độ dài, tra
          //    glossary và làm khoá lịch sử. Giữ nguyên hành vi cũ.
          //  · `goc`   — giữ nguyên xuống dòng, chỉ để HIỆN LẠI cho người đọc.
          // Trước đây chỉ có bản dồn, nên bôi đen một khổ thơ hay một danh sách
          // thì popup hiện một dòng dài dính liền, không còn nhận ra là đã chọn
          // đúng chỗ nào.
          const goc = (r.toString() || '').replace(/[ \t]+\n/g, '\n')
                        .replace(/\n{3,}/g, '\n\n').trim();
          const text = (r.toString() || '').replace(/\s+/g, ' ').trim();
          // ⚠ 1000 ký tự phải KHỚP `MAX.text` trong `worker/lookup.js`. Hai
          // con số ở hai file, và lệch nhau thì hỏng lặng lẽ: trang cho hiện
          // nút, Worker cắt cụt đoạn, model giải thích một câu bị chặt giữa
          // chừng mà không ai biết. Đổi một chỗ thì đổi cả chỗ kia.
          if (!text || !/[A-Za-z]/.test(text) || text.length > 1000) return;
          const b = r.getBoundingClientRect();
          if (!b.width && !b.height) return;
          this._traDat({ text, goc, sent: this._cauChua(r, text), box: b, rg: r.cloneRange() });
        },

        /** Có gì để hiện trong popup không?

            ⚠ KHÔNG hỏi `!tra.data`. Máy chủ có thể trả về 200 kèm một object
            mà mọi trường đều rỗng; lúc đó `tra.data` là truthy nên dòng "Không
            tìm thấy nghĩa" bị ẩn, mà cũng chẳng nhánh nào vẽ ra gì — popup chỉ
            còn cái khung và một cái nút. Người dùng gửi ảnh chụp đúng cảnh đó
            và hỏi "sao ấn giải thích không được". Im lặng kiểu này tệ hơn báo
            lỗi: không ai biết nên thử lại hay đã hỏng. */
        traRong() {
          const d = this.tra.data;
          if (!d) return true;
          return !(d.nghia || d.dich || d.luu_y
                   || (d.phan || []).length || (d.tu_kho || []).length);
        },

        /** Khoá nhớ lựa chọn ngôn ngữ — RIÊNG từng môn. Trẻ học Science
            bằng tiếng Anh nhưng Lịch sử bằng tiếng Việt; một khoá chung là
            đổi ở môn này thì môn kia cũng đổi theo. */
        _nnKhoa() { return 'tra_nn:' + (this.course || 'chung'); },

        /** Ngôn ngữ giải thích đang dùng. Thứ tự: lựa chọn đã lưu của MÔN NÀY
            → mặc định do trang cung cấp (`traNgonNgu()`, thường là ngôn ngữ
            dạy của môn) → tiếng Việt. */
        // Ngôn ngữ DẠY của môn — cố định, khác `nnHienTai()` là lựa chọn của
        // người học. Trang nhúng có thể không định nghĩa `traNgonNgu()`
        // (trang môn không định nghĩa), nên mặc định là tiếng Việt.
        /** Tách "a. … b. …" / "1. … 2. …" viết liền thành từng dòng.
            Prompt đã dặn mỗi ý một dòng; đây là lưới phụ khi model quên.
            Người dùng gửi ảnh khối 'Trả lời' + 'Vì sao' của một câu hỏi hai ý:
            "a. Từ được lặp lại là từ 'Tre'. b. Việc lặp lại…" dồn một khối chữ.
            Chỉ tách khi các dấu ý chạy ĐÚNG THỨ TỰ từ a (hoặc 1) và có ≥2 dấu —
            một chữ "a." hay "5." lạc trong câu thì không đủ để tách.
            Đã có sẵn `\n` thì model đã tự xuống dòng, để nguyên. */
        traXuong(s) {
          s = String(s ?? '');
          if (!s || s.includes('\n')) return s;
          for (const [re, dau] of [[/(^|\s)([a-h])[.)]\s/g, 'a'], [/(^|\s)(\d{1,2})[.)]\s/g, '1']]) {
            const cho = []; let can = dau;
            for (const m of s.matchAll(re)) {
              if (m[2] !== can) continue;
              cho.push(m.index + m[1].length);
              can = dau === 'a' ? String.fromCharCode(can.charCodeAt(0) + 1) : String(+can + 1);
            }
            if (cho.length < 2) continue;
            let r = s;
            for (let i = cho.length - 1; i >= 0; i--) {
              // Bỏ cả dấu phẩy/chấm phẩy nối ý: '1. think, 2. have' → dòng 'think' chứ không 'think,'.
              if (cho[i] > 0) r = r.slice(0, cho[i]).replace(/[\s,;]+$/, '') + '\n' + r.slice(cho[i]);
            }
            return r;
          }
          return s;
        },
        traMonNn() { return (this.traNgonNgu ? this.traNgonNgu() : 'vi') === 'en' ? 'en' : 'vi'; },
        nnHienTai() {
          // ⚠ Môn dạy bằng tiếng Việt thì KHÔNG có lựa chọn — luôn tiếng Việt.
          // Chốt ở ĐÂY chứ không chỉ ẩn nút: lựa chọn cũ có thể đã nằm trong
          // localStorage từ trước (khoá theo môn, mà một môn có thể đổi ngôn
          // ngữ dạy), và đọc lại nó thì nút biến mất nhưng phần giải thích
          // vẫn ra tiếng Anh — hỏng theo kiểu không có cách nào sửa từ giao diện.
          if (this.traMonNn() !== 'en') return 'vi';
          if (this.nnTra) return this.nnTra;
          let luu = null;
          try { luu = localStorage.getItem(this._nnKhoa()); } catch (e) {}
          if (luu === 'vi' || luu === 'en') return (this.nnTra = luu);
          return (this.nnTra = 'en');
        },

        /** Đổi ngôn ngữ và HỎI LẠI ngay — đổi mà không tra lại thì người dùng
            phải tự đoán là phải bấm gì nữa. */
        doiNn(v) {
          if (this.nnHienTai() === v) return;
          this.nnTra = v;
          try { localStorage.setItem(this._nnKhoa(), v); } catch (e) {}
          this.tra.chat = [];
          if (this.tra.show) this.traMo(this.tra.mode);
        },

        /** Đoạn gốc có dài quá 2 dòng không — chỉ khi đó mới hiện nút mở.
            Đếm theo KÝ TỰ chứ không đo chiều cao thật: đo chiều cao phải chờ
            vẽ xong rồi đọc lại DOM, tức một vòng layout nữa cho mỗi lần mở
            popup, mà sai sót ở đây chỉ là thừa/thiếu một cái nút nhỏ. */
        get daiGoc() {
          const t = this.tra.goc || this.tra.text || '';
          return t.length > 110 || t.includes('\n') || this.sentThem;
        },

        /** Câu chứa đoạn bôi đen có thêm gì NGOÀI chính đoạn đó không.
            Bôi đen một từ thì câu chứa nó là ngữ cảnh đáng xem. Bôi đen cả đoạn
            thì "câu chứa" chính là đoạn ấy, bị dàn phẳng rồi cắt ở 300 ký tự —
            hiện ra là một khối chữ xám lặp lại đúng thứ vừa đọc ở trên (người
            dùng gửi ảnh). Vẫn GỬI lên API như cũ; chỉ không vẽ lại. */
        get sentThem() {
          const n = (x) => (x || '').replace(/\s+/g, ' ').trim();
          const c = n(this.tra.sent);
          return !!c && !n(this.tra.goc || this.tra.text).includes(c);
        },

        async traHoi() {
          const q = (this.tra.hoi || '').trim();
          if (!q || this.tra.dangHoi || !this.traKhoa()) return;
          this.tra.chat.push({ ai: 'em', noi: q });
          this.tra.hoi = ''; this.tra.dangHoi = true;
          try {
            const r = await fetch('/api/lookup', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-progress-key': this.traKhoa() },
              // Gửi kèm ĐOẠN GỐC và lịch sử: Worker không giữ trạng thái, cùng
              // lý do đã buộc `ctx` phải do trình duyệt gửi lên.
              body: JSON.stringify({
                mode: 'chat', text: this.tra.text, sent: this.tra.sent,
                ctx: this._traCtx(), hoi: q, nn: this.nnHienTai(),
                mon_nn: this.traMonNn(),
                // Bỏ lượt vừa đẩy vào — nó chính là `hoi`.
                lich_su: this.tra.chat.slice(0, -1).slice(-6),
                user: this.user, course: this.course, sec: this.traSec(),
              }),
            });
            const b = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(b.error || ('HTTP ' + r.status));
            const t = (b.data && b.data.tra_loi) || '';
            // Trả về rỗng cũng phải NÓI RA, đừng đẩy một bong bóng trắng vào
            // cuộc trò chuyện — cùng bài học với `traRong()`.
            this.tra.chat.push({ ai: 'gs', noi: t || 'Chưa trả lời được câu này.' });
          } catch (e) {
            console.warn('hỏi tiếp hỏng:', String(e.message || e));
            this.tra.chat.push({ ai: 'gs', noi: 'Chưa trả lời được lúc này, thử lại sau nhé.' });
          }
          this.tra.dangHoi = false;
        },

        async traMo(mode) {
          if (mode) this.tra.mode = mode;
          this.tra.show = true; this.tra.btn = null;
          this.tra.chat = []; this.tra.hoi = ''; this.tra.dangHoi = false;
          this.moGoc = false;
          this.tra.err = ''; this.tra.ly_do = ''; this.tra.data = null; this.tra.loading = true;
          // Trang có thể cần nạp học liệu trước (trang môn nạp LƯỜI, vì file
          // study JSON tới ~200KB và phần lớn lượt vào trang môn không tra từ nào).
          if (this.traSanSang) { try { await this.traSanSang(); } catch (e) {} }
          if (!this.traKhoa()) {                      // chế độ chỉ đọc, không gọi API
            this.tra.data = this._traOffline(); this.tra.loading = false; return;
          }
          // Có nhận được phản hồi HTTP hay không — dùng để nói ĐÚNG LOẠI trục
          // trặc. Ném từ `fetch` là hỏng mạng; phản hồi không ok là dịch vụ lỗi.
          let coPhanHoi = false;
          try {
            const r = await fetch('/api/lookup', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-progress-key': this.traKhoa() },
              // `user`/`course`/`sec` chỉ để ghi dòng lịch sử trong D1 — Worker
              // KHÔNG đưa chúng vào prompt gửi Google (test_lookup_route chốt).
              body: JSON.stringify({ mode: this.tra.mode, text: this.tra.text,
                                     sent: this.tra.sent, ctx: this._traCtx(),
                                     nn: this.nnHienTai(),
                                     mon_nn: this.traMonNn(),
                                     user: this.user, course: this.course, sec: this.traSec() }),
            });
            coPhanHoi = true;
            const b = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(b.error || ('HTTP ' + r.status));
            this.tra.data = b.data;
          } catch (e) {
            // Lùi về glossary có sẵn. Chỉ báo lỗi khi lùi cũng không ra gì.
            this.tra.data = this._traOffline();
            // Hai yêu cầu kéo ngược nhau, và cả hai đều đúng:
            //  · đừng chìa câu lỗi kỹ thuật ("Gemini lỗi 412") ra cho một đứa trẻ;
            //  · đừng nói cứng "không có mạng" khi mạng vẫn tốt — nói sai lý do
            //    còn tệ hơn không nói, vì người ta đi kiểm wifi thay vì kiểm dịch vụ.
            // Giải bằng cách tách: hiện đúng LOẠI trục trặc bằng lời thường, còn
            // nguyên văn thì đẩy ra console cho người lớn soi.
            this.tra.ly_do = coPhanHoi ? 'tra cứu đang bận' : 'chưa có mạng';
            console.warn('tra cứu hỏng:', String(e.message || e));
            if (!this.tra.data) this.tra.err = 'Chưa tra được lúc này, thử lại sau nhé.';
          }
          this.tra.loading = false;
        },

        /** Đang có chữ được bôi đen? Thẻ ghi nhớ và ô đáp án là thẻ BẤM ĐƯỢC
            bọc quanh chính phần chữ, nên kéo chọn trên đó sẽ lật thẻ lộ đáp án —
            tức bôi đen để tra từ lại phá mất bài đang làm. */
        dangBoiDen() {
          const s = window.getSelection();
          return !!(s && !s.isCollapsed && (s.toString() || '').trim());
        },

        /** Đăng ký nghe vùng chọn. Trang phải TỰ GỌI (trong `init()` hoặc
            `x-init`) — để trong macro mà không gọi thì mọi thứ khác đều dựng
            đúng, nút chỉ đơn giản không bao giờ hiện, và không có lỗi nào. */
        // Nắn vùng chọn NHÌN THẤY ra biên từ. Trẻ kéo chuột hay thừa/thiếu
        // vài ký tự ở hai đầu; nắn ra cả từ thì đỡ hẳn thao tác lại.
        //
        // ⚠ CHỈ chạy lúc NHẢ chuột, tuyệt đối không giữa lúc kéo. Sửa vùng
        // chọn đang kéo làm nó chuẩn hoá chiều thành xuôi, tức lật điểm focus
        // — đó đúng là lỗi "kéo chậm từ dưới lên thì mất vùng chọn" đã phải
        // sửa bằng `cloneRange()`. Ở đây cú kéo đã xong nên đổi chiều vô hại.
        //
        // ⚠ `setTimeout(…, 0)`: để trình duyệt xử lý xong vùng chọn của chính
        // nó rồi mới đụng vào.
        //
        // ⚠ Không đổi gì thì ĐỪNG gọi `addRange`: mỗi lần gọi là một lượt
        // `selectionchange`, kéo theo một lượt `chonDoi()` vô ích.
        nanBienTu() {
          const sel = window.getSelection();
          if (!sel || sel.isCollapsed || !sel.rangeCount) return;
          const r0 = sel.getRangeAt(0);
          const h = r0.commonAncestorContainer;
          const el = h.nodeType === 3 ? h.parentElement : h;
          if (!el || !el.closest || !el.closest('[data-tra]')) return;
          const r = this._noRong(r0.cloneRange());
          if (r.startContainer === r0.startContainer && r.startOffset === r0.startOffset
              && r.endContainer === r0.endContainer && r.endOffset === r0.endOffset) return;
          try { sel.removeAllRanges(); sel.addRange(r); } catch (e) { /* bỏ qua */ }
        },

        traGan() {
          if (typeof document === 'undefined' || this._traDaGan) return;
          this._traDaGan = true;
          for (const ev of ['mouseup', 'touchend']) {
            document.addEventListener(ev, () => setTimeout(() => this.nanBienTu(), 0));
          }
          let hen = null;
          // Gộp nhịp 120ms: kéo chọn trên điện thoại bắn hàng chục lượt mỗi giây.
          // `selectionchange` bắn trên `document` và KHÔNG nổi lên window ở mọi
          // trình duyệt, nên đừng thay bằng @selectionchange.window.
          document.addEventListener('selectionchange', () => {
            clearTimeout(hen);
            hen = setTimeout(() => this.chonDoi(), 120);
          });
        },

        /** Đóng popup và TRẢ LẠI nút 🔎 cho chỗ vừa chọn.

            Trước đây đóng xong là nút biến mất, muốn xem lại phải bôi đen lại
            từ đầu. Cú bấm để đóng (dù vào ✕ hay ra nền) tự xoá vùng chọn, nên
            chỉ gọi `chonDoi()` thôi thì không đủ — phải ĐẶT LẠI vùng chọn đã
            nhớ ở `chonDoi()` rồi mới tính lại vị trí nút. */
        traDong() {
          this.tra.show = false; this.tra.btn = null; this.tra.data = null;
          this.tra.err = ''; this.tra.ly_do = '';
          this.tra.chat = []; this.tra.hoi = ''; this.moGoc = false;
          // ⚠ Chụp lại TRƯỚC khi xoá. Xoá `_traVung` ở đây rồi mới hỏi
          // `this._traVung` trong `setTimeout` bên dưới thì nhánh khôi phục
          // không bao giờ chạy — nút 🔎 mất hẳn sau khi đóng popup. Cùng lý do
          // `rg` được chụp thành biến cục bộ.
          const rg = this._traRg;
          const vung = this._traVung;
          this._traVung = null;
          setTimeout(() => {
            if (rg) {
              try {
                const s = window.getSelection();
                s.removeAllRanges(); s.addRange(rg);
              } catch (e) { return; }
              this.chonDoi();
            } else if (vung && this.traVungDong) {
              // Vùng KÉO không có Range nào để đặt lại (các ký tự được chọn
              // không liền mạch trong DOM), nên trang nhúng tự quyết đóng xong
              // làm gì. Xem `traVungDong()` trong `docview.html`.
              this.traVungDong();
            }
          }, 0);
        },


        // ── Từ đã tra ────────────────────────────────────────────────────────
        // Gộp theo TỪ chứ không phải nhật ký từng lượt: câu đáng trả lời là "con
        // hay phải tra lại từ nào", và từ tra đi tra lại chính là từ chưa thuộc.
        hist: { rows: [], loading: false, err: '', sort: 'n' },
        async loadHist() {
          if (!this.secret) { this.hist.err = 'Cần mã bí mật để xem.'; return; }
          this.hist.loading = true; this.hist.err = '';
          try {
            const r = await fetch(`/api/lookup/history?user=${this.user}&course=${this.course}`,
                                  { headers: { 'x-progress-key': this.secret } });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            this.hist.rows = (await r.json()).rows || [];
          } catch (e) { this.hist.err = String(e.message || e); }
          this.hist.loading = false;
        },
        get histRows() {
          const r = [...this.hist.rows];
          // Mặc định xếp theo SỐ LẦN TRA giảm dần — đó mới là thứ đáng nhìn
          // trước. Xếp theo thời gian thì từ vừa tra xong luôn đứng đầu, mà từ
          // vừa tra xong là từ ít thông tin nhất.
          return this.hist.sort === 'n'
            ? r.sort((a, b) => b.n - a.n || b.last_ts - a.last_ts)
            : r.sort((a, b) => b.last_ts - a.last_ts);
        },
        ngayGon(ts) {
          const d = Math.floor((Date.now() / 1000 - ts) / 86400);
          return d <= 0 ? 'hôm nay' : d === 1 ? 'hôm qua' : d + ' ngày trước';
        },


        // ── Thẻ ghi nhớ: HỌC ───────────────────────────────────────────────────
        // Xem lần lượt, hiện cả hai mặt, không chấm. Thứ tự XÁO NGẪU NHIÊN mỗi lần
        // vào (không cố định theo cây, kẻo học thuộc theo vị trí), nhưng giữ nguyên
        // trong lúc lật qua lại; nút 🔀 xáo lại.
        learnList: [],
        get learnDeck() { return this.learnList; },
        shuffleLearn() {
          const a = [...this.pool('cards')];
          for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
          this.learnList = a; this.learnAt = 0;
          this.autoRead(this.learnCard?.front_en);
        },
        startLearn() { this.shuffleLearn(); this.screen = 'learn'; },
        get learnCard() { return this.learnDeck[this.learnAt] || null; },

        // ── Thẻ ghi nhớ: KIỂM TRA ──────────────────────────────────────────────
        // Không chấm điểm, không lịch ôn giãn cách: mỗi thẻ chỉ có HAI trạng thái —
        // đã thuộc hay chưa. Hàng đợi là bộ thẻ đã xáo; thẻ nào phải "Xem đáp án"
        // thì xếp lại vào cuối ĐÚNG MỘT LẦN rồi thôi.
        //
        // Có điểm dừng, không quay vòng vô hạn như bản trước: phiên không bao giờ
        // kết thúc thì cách duy nhất để ra là bỏ dở, mà bỏ dở thì không có màn
        // tổng kết nào để thấy mình vừa thuộc thêm bao nhiêu.
        again: null,
        startTest() {
          const a = [...this.pool('cards')];
          for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
          this.queue = a; this.at = 0;
