                <template x-if="!tp.image && tp.figure">
                  <svg viewBox="0 0 24 24" class="w-14 h-14 text-orange-400"><use :href="'#m-' + tp.figure"/></svg>
                </template>
                </div>
              </div>
            </div>
            </template>
            </div>
          </template>
          </div></template>

          <!-- Từ vựng GỘP CHUNG cho mục có thẻ "kiến thức học": chia theo lá thì
               tiêu đề lá lặp lại y hệt tiêu đề thẻ ở trên, đọc rất rối. -->
          <!-- Bài mẫu ở CẤP MỤC. Chỉ vẽ khi mục bỏ vùng theo lá, để không vẽ hai lần. -->
          <template x-if="show.worked && (!leavesOf(sec).length || (sec.topics || []).length || (sec.words || []).length) && secWorks(sec).length">
          <div class="px-5 pb-1 space-y-3">
            <template x-for="(wk, wi) in secWorks(sec)" :key="'sw' + wi">
              <div>
                <p class="text-[13px] font-bold uppercase tracking-wider text-teal-700 mb-1.5"><input x-show="canMark && wk.mark" x-cloak type="checkbox" title="Đã thuộc" :checked="isKnown(wk.mark)" @change="setKnown([{id: wk.mark, c: wk.concept || sec.concept}], $event.target.checked)" class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">🧮 <span x-html="hl(wk.title || 'Bài mẫu')"></span><span x-show="wk.page" class="font-normal normal-case text-slate-400" x-text="' · ' + pg(wk.page)"></span></p>

                  <div class="min-w-0 flex-1 text-sm space-y-1.5">
                    <p class="font-semibold text-slate-900" x-html="hl(wk.problem)"></p>
                    <ol class="list-decimal pl-5 text-slate-700 space-y-0.5">
                      <template x-for="(st, si) in (wk.steps || [])" :key="si"><li x-html="hl(st)"></li></template>
                    </ol>
                    <p class="font-medium text-teal-900"><span class="font-semibold">Đáp số:</span> <span x-html="hl(wk.answer)"></span></p>
                    <p x-show="wk.why" class="text-xs text-slate-500 italic" x-html="hl(wk.why)"></p>
                  </div>
                  <template x-if="wk.image">
                  <img @click.stop="zoom = 'study/img/lich-su-va-dia-ly-5/' + wk.image" :src="'study/img/lich-su-va-dia-ly-5/' + wk.image" :alt="wk.title || ''" loading="lazy"
                       class="cursor-zoom-in w-36 sm:w-52 max-h-56 shrink-0 rounded-md border border-teal-200 bg-white object-contain">
                  </template>
                </div>
              </div>
            </template>
          </div>
          </template>

          <!-- Checklist ở CẤP MỤC, cùng lý do. -->
          <template x-if="show.list && (!leavesOf(sec).length || (sec.topics || []).length || (sec.words || []).length) && allLists(sec).length">
          <div class="px-5 pb-1 space-y-3">
            <template x-for="(ck, ci) in allLists(sec)" :key="'sl' + ci">
              <div>
                <p class="text-[13px] font-bold uppercase tracking-wider text-emerald-700 mb-1.5"><input x-show="canMark && ck.mark" x-cloak type="checkbox" title="Đã thuộc" :checked="isKnown(ck.mark)" @change="setKnown([{id: ck.mark, c: ck.concept || sec.concept}], $event.target.checked)" class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">☑ <span x-html="hl(ck.title)"></span></p>
                <ol class="rounded-lg border border-emerald-200 bg-emerald-50/50 divide-y divide-emerald-100 text-sm">
                  <template x-for="(it, ii) in itemsOf(ck)" :key="ii">
                    <li class="flex gap-2 px-3 py-1.5">
                      <template x-if="ck.ordered"><span class="shrink-0 w-4 text-right font-bold text-emerald-600 tabular-nums" x-text="stt(ck, it)"></span></template>
                      <span class="font-semibold text-emerald-900 shrink-0" x-html="hl(it.sign)"></span>
                      <span class="text-slate-700" x-html="hl(it.look_for)"></span>

                  </template>
                </ol>
                <p x-show="ck.note" class="mt-1.5 text-xs text-emerald-800 bg-emerald-100 rounded px-2.5 py-1" x-html="hl(ck.note)"></p>
              </div>
            </template>
          </div>
          </template>

          <template x-if="show.gloss && ((sec.topics || []).length || (sec.words || []).length) && secGloss(sec).length">
          <div class="px-5 pb-4">
            <p class="text-[13px] font-bold uppercase tracking-wider text-indigo-600 mb-1.5">📖 Từ vựng</p>
            <dl class="grid sm:grid-cols-2 gap-2">
              <template x-for="g in secGloss(sec)" :key="g.term">
                <div class="overflow-hidden rounded-lg border border-indigo-200 bg-indigo-50/40 px-3 py-2 flex gap-2.5">
                  <template x-if="g.icon">
                    <svg viewBox="0 0 24 24" class="w-7 h-7 shrink-0 mt-0.5 text-indigo-400"><use :href="'#m-' + g.icon"/></svg>
                  </template>
                  <div class="min-w-0">
                  <dt class="text-sm font-semibold text-indigo-900"><input x-show="canMark && g.card" type="checkbox" title="Đã thuộc"
                    :checked="isKnown(g.card)"
                    @change="setKnown([{id: g.card, c: g.concept || sec.concept}], $event.target.checked)"
                    class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600"><template x-if="g.image"><img @click.stop="zoom = 'study/img/lich-su-va-dia-ly-5/' + g.image" :src="'study/img/lich-su-va-dia-ly-5/' + g.image" alt="" loading="lazy" class="cursor-zoom-in float-right ml-2 -mt-0.5 max-w-[80px] max-h-[80px] w-auto h-auto rounded border border-indigo-200 bg-white object-contain"></template><template x-if="g.visual && g.visual.html_nho"><div role="button" tabindex="0" data-tu-hinh @click.stop="zoomHtml = g.visual.html" @keydown.enter.stop="zoomHtml = g.visual.html" :aria-label="g.term" class="cursor-zoom-in float-right ml-2 -mt-0.5 w-20 h-20 shrink-0 overflow-hidden rounded border border-indigo-200 bg-white p-0.5" x-html="g.visual.html_nho"></div></template><span x-html="hl(g.term)"></span><button x-show="canSpeak" @click.stop="speak(g.term)" type="button" title="Đọc to"

                  <dd x-show="g.def_vi" x-cloak class="text-sm text-cyan-700 leading-snug" x-html="hl(g.def_vi)"></dd>
                  <dd x-show="g.example" class="mt-0.5 text-xs text-slate-500 italic" x-html="hl(g.example)"></dd>
                  <dd x-show="g.example_vi" x-cloak class="text-xs text-cyan-700" x-html="hl(g.example_vi)"></dd>
                  </div>
                </div>
              </template>
            </dl>
          </div>
          </template>

          <!-- Mục nào dùng khối kiểu Toán (topics) hoặc kiểu ESL (words) thì KHÔNG

          <template x-for="leaf in ((tops(sec).length || (sec.words || []).length) ? [] : shownLeaves(sec))" :key="leaf.id">
            <div class="mx-5 mb-4 rounded-xl border border-slate-200 overflow-hidden">
              <div class="flex items-center gap-2 px-4 py-2 bg-slate-50 border-b border-slate-200">
                <template x-if="canMark && knownState(leafAtoms(sec, leaf.id))">
                  <input type="checkbox" title="Đã thuộc cả phần này"
                         :checked="knownState(leafAtoms(sec, leaf.id)) === 'all'"
                         x-effect="$el.indeterminate = knownState(leafAtoms(sec, leaf.id)) === 'some'"
                         @change="setKnown(leafAtoms(sec, leaf.id), $event.target.checked)"
                         class="shrink-0 w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">
                </template>
                <span class="w-2 h-2 rounded-full shrink-0"
                      :class="branchStat(leaf.id).wrong > 0 ? 'bg-rose-400' : 'bg-indigo-400'"></span>

                <template x-for="cd in codesOf(leaf.id)" :key="cd"><span class="shrink-0 rounded bg-slate-100 px-1.5 py-0.5 font-mono text-[11px] text-slate-500" x-text="cd"></span></template>
                <span class="ml-auto text-xs text-slate-400" x-text="leaf.pages ? pg(leaf.pages) : ''"></span>
              </div>

              <!-- từ vựng của lá -->
              <template x-if="show.gloss && tagged(sec.glossary, leaf.id).length">
              <div class="px-4 pt-3">
              <p class="text-[13px] font-bold uppercase tracking-wider text-indigo-600 mb-1.5">📖 Từ vựng</p>
              <dl class="grid gap-x-3 gap-y-1.5 sm:grid-cols-2">
                <template x-for="g in tagged(sec.glossary, leaf.id)" :key="g.term">
                  <div class="overflow-hidden rounded-lg bg-indigo-50/60 border border-indigo-100 px-3 py-2">
                    <dt class="text-sm font-semibold text-indigo-900"><input x-show="canMark && g.card" type="checkbox" title="Đã thuộc"
                    :checked="isKnown(g.card)"
                    @change="setKnown([{id: g.card, c: g.concept || sec.concept}], $event.target.checked)"
                    class="mr-1 align-middle w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600"><template x-if="g.image"><img @click.stop="zoom = 'study/img/lich-su-va-dia-ly-5/' + g.image" :src="'study/img/lich-su-va-dia-ly-5/' + g.image" alt="" loading="lazy" class="cursor-zoom-in float-right ml-2 -mt-0.5 max-w-[80px] max-h-[80px] w-auto h-auto rounded border border-indigo-200 bg-white object-contain"></template><template x-if="g.visual && g.visual.html_nho"><div role="button" tabindex="0" data-tu-hinh @click.stop="zoomHtml = g.visual.html" @keydown.enter.stop="zoomHtml = g.visual.html" :aria-label="g.term" class="cursor-zoom-in float-right ml-2 -mt-0.5 w-20 h-20 shrink-0 overflow-hidden rounded border border-indigo-200 bg-white p-0.5" x-html="g.visual.html_nho"></div></template><span x-html="hl(g.term)"></span><button x-show="canSpeak" @click.stop="speak(g.term)" type="button" title="Đọc to"

             Thay cho nút đổi chế độ cũ ("Giải nghĩa như một từ" / "Dịch cả cụm
             này"): đổi chế độ chỉ là hỏi lại cùng một câu theo kiểu khác, còn
             hỏi tiếp thì trả lời được thứ mà không schema cố định nào phủ hết.
             Mỗi lượt hỏi tính vào ĐÚNG trần 300/ngày như một lượt tra. -->
        <div x-show="!tra.loading && traKhoa() && tra.text" x-cloak class="px-4 pb-4 pt-1">
          <template x-for="(m, i) in tra.chat" :key="i">
            <p class="mb-2 text-sm leading-relaxed"
               :class="m.ai === 'em' ? 'text-right' : ''">
              <span class="inline-block px-3 py-2 rounded-2xl max-w-[85%] text-left whitespace-pre-line"
                    :class="m.ai === 'em' ? 'bg-indigo-50 text-indigo-900'
                                          : 'bg-slate-100 text-slate-700'"
                    x-text="traXuong(m.noi)"></span>
            </p>
          </template>
          <p x-show="tra.dangHoi" x-cloak class="mb-2 text-sm text-slate-400">Đang nghĩ…</p>
          <form @submit.prevent="traHoi()" class="flex gap-2">
            <input x-model="tra.hoi" data-mic-o="hoi" type="text" maxlength="300" enterkeyhint="send"
                   placeholder="Hỏi thêm về phần này…"
                   class="flex-1 min-w-0 px-3 py-2 text-sm rounded-lg border border-slate-300">
            <button type="button" data-mic="hoi" @mousedown.prevent @click="micBat('hoi')"
        x-show="micCo()" x-cloak
        :aria-pressed="String(micTT !== 'tat' && micDich === 'hoi')"
        :aria-label="micTT !== 'tat' && micDich === 'hoi' ? 'Dừng nghe' : 'Nói thay vì gõ'"
        :title="micTT !== 'tat' && micDich === 'hoi' ? 'Dừng nghe' : 'Nói thay vì gõ'"
        :class="micTT !== 'tat' && micDich === 'hoi'
                ? 'bg-rose-600 border-rose-600 text-white' + (micTT === 'noi' ? ' ring-4 ring-rose-200' : '')
                : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-50'"
        class="shrink-0 w-10 h-10 rounded-lg border grid place-items-center transition-shadow">
  <svg x-show="!(micTT !== 'tat' && micDich === 'hoi')" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"
       fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
  <svg x-show="micTT !== 'tat' && micDich === 'hoi'" x-cloak aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
    <rect x="5" y="5" width="14" height="14" rx="2"/></svg>
</button>
            <button type="submit" :disabled="tra.dangHoi || !tra.hoi.trim()"
                    class="shrink-0 px-3 py-2 text-sm rounded-lg bg-indigo-600 text-white
                           disabled:bg-slate-200 disabled:text-slate-400">Hỏi</button>
          </form>
          <p x-show="micNhan('hoi') || (micLoi && micTT === 'tat' && micDich === 'hoi')" x-cloak data-mic-tt="hoi"
   class="mt-1 text-xs" :class="micLoi && micTT === 'tat' ? 'text-amber-700' : 'text-rose-600'"
   x-text="micNhan('hoi') || micLoi"></p>
          <button x-show="tra.tuDo" x-cloak type="button" data-cau-khac @click="traCauKhac()"
                  class="mt-2 text-xs text-indigo-600 hover:underline py-1.5 -my-1.5">↺ Hỏi câu khác</button>
        </div>
      </div>
    </div>
  </template>


  <!-- ── Xem ảnh phóng to ────────────────────────────────────────────────────
       Bấm ảnh bất kỳ để phóng, bấm lần nữa (hoặc Esc, hoặc nút ✕) để bỏ. Phủ kín
       màn hình thay vì phóng tại chỗ: ảnh từ vựng chỉ 48px, phóng tại chỗ vẫn
       không đủ to để nhìn rõ, mà lại đẩy cả trang nhảy chỗ.
       x-if chứ không x-show: :src vẫn bind khi ẩn → tải "study/img/" (404). -->
  <template x-if="zoomHtml">
    <div data-zoom-html @click="zoomHtml = ''" @keydown.escape.window="zoomHtml = ''"
         class="fixed inset-0 z-50 flex items-center justify-center overflow-auto bg-slate-900/80 p-4 cursor-zoom-out">
      <div @click.stop class="m-auto w-full max-w-sm cursor-default rounded-xl bg-white p-4 shadow-2xl [&>*]:mx-auto" x-html="zoomHtml"></div>
      <button @click.stop="zoomHtml = ''" type="button" title="Đóng"
              class="fixed top-3 right-3 w-10 h-10 rounded-full bg-white/90 text-slate-700 text-xl leading-none hover:bg-white">✕</button>
    </div>
  </template>
  <template x-if="zoom">
    <div data-zoom-lop @click="zoom = ''" @keydown.escape.window="zoom = ''"
         :class="zoomRong ? 'overflow-auto' : 'items-center justify-center'"
         class="fixed inset-0 z-50 flex bg-slate-900/80 p-4 cursor-zoom-out">
      <!-- `zoom` giữ NGUYÊN đường dẫn của ảnh vừa bấm, không phải tên file: mỗi
           chỗ vẽ ảnh tự dựng src theo cách của nó, ghép tiền tố lần nữa ở đây là
           ra "study/img/study/img/…" và ảnh 404 mà lớp phủ vẫn hiện. -->
      <!-- zoomRong: ảnh ở KÍCH THƯỚC GỐC (`max-w-none shrink-0`), khung ngoài cuộn / kéo được; `m-auto` thay `justify-center` để ảnh hẹp vẫn ở giữa mà ảnh rộng không bị cụt cạnh trái. -->
      <img :src="zoom" alt=""
           :class="zoomRong ? 'm-auto h-auto w-auto max-w-none shrink-0' : 'max-h-[88vh] max-w-full object-contain'"
           class="rounded-lg bg-white shadow-2xl">
      <button @click.stop="zoom = ''" type="button" title="Đóng"
              class="fixed top-3 right-3 w-10 h-10 rounded-full bg-white/90 text-slate-700 text-xl leading-none hover:bg-white">✕</button>
      <span x-show="zoomRong" class="pointer-events-none fixed bottom-3 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-full bg-slate-900/70 px-3 py-1 text-xs text-white">Kéo để xem · chạm để đóng</span>
    </div>
  </template>
  <!-- Chiều cao khối dính ĐO bằng ResizeObserver, không viết cứng: tên môn dài
       xuống hai dòng, hay thanh chế độ ẩn đi lúc chưa nạp xong, đều đổi con số
       này. Viết cứng thì hỏng lặng lẽ — cây bên trái chui xuống dưới header và
       nhìn vẫn "gần đúng". Đặt trên <html> để mọi nơi dùng được var(--hdr).
       Mặc định 0px cho trường hợp JS chưa chạy. -->
  <script>
    (function () {
      var h = document.getElementById('hdr');
      if (!h) return;
      var r = document.documentElement;
      r.style.setProperty('--hdr', '0px');
      var do_ = function () { r.style.setProperty('--hdr', h.offsetHeight + 'px'); };
      do_();
      if (window.ResizeObserver) new ResizeObserver(do_).observe(h);
      else addEventListener('resize', do_);
    })();
  </script>
<div data-diem-bao role="status" aria-live="polite"
     class="hidden pointer-events-none fixed left-1/2 top-16 z-[70] -translate-x-1/2 max-w-[90vw] truncate rounded-full bg-amber-300 px-5 py-2 text-lg font-bold text-amber-950 shadow-lg"></div>
<script>
  (function () {
    var hen = 0;
    function hien(chu) {
      var el = document.querySelector('[data-diem-bao]');
      if (!el) return;
      el.textContent = chu;
      el.classList.remove('hidden');
      clearTimeout(hen);
      hen = setTimeout(function () { el.classList.add('hidden'); }, 2000);
    }
    window.baoDiem = function (n, chu) {
      n = Number(n);
      if (!(n > 0)) return;
      hien('+' + n + ' ⭐' + (chu ? ' ' + chu : ''));
    };
    window.baoTru = function (n, chu) {
      n = Number(n);
      if (!(n > 0)) return;
      hien('−' + n + ' ⭐' + (chu ? ' ' + chu : ''));
    };
    window.docSoDu = async function (user) {
      var k = localStorage.getItem('lms_key');
      if (!k) return null;
      try {
        var r = await fetch('/api/diem?gon=1&user=' + encodeURIComponent(user), { headers: { 'x-progress-key': k } });
        if (!r.ok) return null;
        var d = await r.json();
        return Number.isInteger(d.du) ? d.du : null;
      } catch (e) { return null; }
    };
  })();
</script>
<script>
  (function () {
    var vv = window.visualViewport;
    if (!vv) return;
    var hen = 0, cham = false, dung = 0;
    function dat() {
      hen = 0;
      var s = vv.scale, phong = s > 1.01;
      document.querySelectorAll('[data-bam]').forEach(function (e) {
        // Chỉ bám THANH (data-bam="thanh") và lớp phủ đang `fixed` (ngăn mở ở màn hẹp).
        // ≥1024px cột mục lục là cột cố định trong luồng: bám nó là một cột 256px đè lên
        // chính chữ vừa phóng (duyệt nhánh 2026-09-25).
        var ghim = phong && (e.dataset.bam === 'thanh' || getComputedStyle(e).position === 'fixed');
        if (!ghim) { e.style.transform = ''; e.style.transformOrigin = ''; e.style.opacity = ''; return; }
        e.style.transform = '';
        var r = e.getBoundingClientRect();
        e.style.transformOrigin = (-r.left) + 'px ' + (-r.top) + 'px';
        e.style.transform = 'translate(' + vv.offsetLeft + 'px,' + vv.offsetTop + 'px) scale(' + (1 / s) + ')';
        e.style.opacity = cham ? '0' : '';
      });
    }
    function lich() { if (!hen) hen = requestAnimationFrame(dat); }
    vv.addEventListener('resize', lich);
    vv.addEventListener('scroll', lich);
    addEventListener('scroll', lich, { passive: true });
    addEventListener('touchstart', function (e) {
      if (vv.scale <= 1.01 || (e.target.closest && e.target.closest('[data-bam]'))) return;
      cham = true; clearTimeout(dung); lich();
    }, { passive: true });
    addEventListener('touchend', function (e) {
      if (e.touches && e.touches.length) return;
      clearTimeout(dung);
      dung = setTimeout(function () { cham = false; lich(); }, 120);
    }, { passive: true });
    // Ngăn mở/đóng bằng đổi class → đặt lại (ngăn vừa hiện chưa có transform).
    new MutationObserver(lich).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });
    window.bamKhungNhin = dat;
    lich();
  })();
</script>
</body>
