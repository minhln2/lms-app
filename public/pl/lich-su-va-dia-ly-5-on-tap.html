  var _khop = { q: null, rx: null };
  function khopRx(q, co) {
    var e = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    // Từ khoá mở đầu bằng ký hiệu («+b», «(a)») thì chính nó đã là ranh giới.
    var dau = /^[\p{L}\p{N}]/u.test(q) ? '(^|[^\\p{L}\\p{N}\\p{M}])' : '()';
    return new RegExp(dau + '(' + e + ')', co || 'u');
  }
  function khopTu(t, q) {
    if (!q) return true;
    if (_khop.q !== q) _khop = { q: q, rx: khopRx(q) };
    return _khop.rx.test(t || '');
  }

<script>
window.LS = (function () {
  var ve = null, goc = '', dang = 0, henCuon = null, cho = null;
  // `popstate` kế tiếp do CHÍNH LS.dong() gây ra (code đóng lớp phủ) → KHÔNG khôi phục `cuon`.
  // Lớp phủ là `fixed`, trang dưới đứng yên; `cuon` của mục nền chỉ là ảnh cũ. Đóng xong trang
  // thường tự cuộn (bấm mục lục: `toiMuc(i); menuMo = false`) — popstate tới SAU, khôi phục là
  // kéo trang về chỗ cũ, đè lên cú cuộn đó (máy chậm: luôn thua; 2026-10-16). Back của người dùng
  // không qua đây ⇒ vẫn khôi phục như ADR 0067.
  var boCuon = 0;
  function token() {
    try { return decodeURI((location.hash || '').replace(/^#/, '')); } catch (e) { return ''; }
  }
  function url(tk) { return tk ? '#' + encodeURI(tk) : location.pathname + location.search; }
  function luuCuon() {
    var st = history.state;
    if (!st || !st.ls || st.cuon === window.scrollY) return;
    st.cuon = window.scrollY;
    history.replaceState(st, '', location.href);
  }
  // Lượt hẹn chưa chạy phải huỷ ở `popstate`: chạy SAU nó thì ghi scrollY của màn vừa rời vào mục vừa quay về
  // (Back trong 200 ms sau khi mở truyện → thư viện mất vị trí cuộn, `cuon` 600 → 0; tests/test_lichsu.py).
  // KHÔNG lưu cuộn trong `di()`: trang thường cuộn về đầu TRƯỚC khi gọi LS.di → sẽ ghi 0 vào mục cũ.
  function huyHen() { if (henCuon) { clearTimeout(henCuon); henCuon = null; } }
  function henLuu() {
    if (henCuon) return;
    henCuon = setTimeout(function () { henCuon = null; luuCuon(); }, 200);
  }
  function cuonLai(st) {
    if (!st || typeof st.cuon !== 'number') return;
    var y = st.cuon;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { window.scrollTo(0, y); });
    });
  }
  function chayVe(req) {
    dang++;
    Promise.resolve().then(function () { return ve(req.tk, req.st || {}); }).then(
      function () { dang--; cuonLai(req.st); tiep(); },
      function () { dang--; tiep(); });
  }
  function tiep() { if (cho) { var r = cho; cho = null; chayVe(r); } }
  function veLai(tk, st) {
    if (!ve) { cuonLai(st); return; }
    if (dang) { cho = { tk: tk, st: st }; return; }
    chayVe({ tk: tk, st: st });
  }
  function di(tk, day) {
    if (dang) return;
    if (tk === token()) return;
    var truoc = history.state || {};
    var sau = (truoc.ls ? (truoc.sau || 0) : 0) + (day ? 1 : 0);
    var st = { ls: 1, cuon: window.scrollY, token: tk, sau: sau };
    (day ? history.pushState : history.replaceState).call(history, st, '', url(tk));
  }
  addEventListener('popstate', function (e) {
    if (!boCuon) huyHen();      // popstate do LS.dong(): trang nền KHÔNG đổi → lượt hẹn còn treo là của chính nó, để nó lưu
    var st = e.state;
    if (boCuon) { boCuon = 0; if (st) { st = Object.assign({}, st); delete st.cuon; } }
    veLai(token(), st);
  });
  addEventListener('scroll', henLuu, { passive: true });
  addEventListener('load', function () { if (!ve) cuonLai(history.state); });
  return {
    ham: function () {
      try { history.scrollRestoration = 'manual'; } catch (e) {}
      try {
        var st = history.state;
        if (!st || !st.ls) {
          history.replaceState({ ls: 1, cuon: window.scrollY, token: token(), sau: 0 }, '', location.href);
        }
      } catch (e) {}
    },
    di: function (tk) { di(tk, true); },
    thay: function (tk) { di(tk, false); },
    mo: function (tk) { di(tk, true); },
    dong: function (tk) {
      var st = history.state || {};
      if (st.ls && (st.sau || 0) > 0) { boCuon = 1; history.back(); }
      else di(tk === undefined ? goc : tk, false);
    },
    nghe: function (fn, g0) { ve = fn; goc = g0 || ''; veLai(token(), history.state); },
    dang: function () { return dang > 0; },
  };
})();
window.LS.ham();
</script>

  <script>
    // ── Vỏ tĩnh, nội dung nạp bằng fetch ────────────────────────────────────
    // Trang này KHÔNG nhúng câu hỏi vào HTML: Tailwind quét dist/**/*.html lúc
    // build nên nhúng vào chỉ làm trang phình, còn class thì vẫn phải nằm sẵn
    // trong template dù nội dung đến từ đâu. Vì vậy MỌI class Tailwind ở dưới
    // đều là chuỗi literal — tuyệt đối không ghép kiểu 'bg-' + màu + '-100',
    // Tailwind không nhìn thấy và sẽ cắt mất.

    // ── Markup chữ của thẻ Toán định dạng mới (thẻ có `rule`) ─────────────────
    // BẢN JS của `src/study_hinh.py › chu()`: phải ra CÙNG HTML từng byte (tests/
    // test_study_the_toan.py so hai bản trên cùng bộ mẫu) — sửa một bản mà quên
    // bản kia là bài đỏ. Cùng regex (chữ số ASCII; `[^\n]` = `.` của Python, vì
    // `.` của JS còn từ chối CR và hai ký tự xuống dòng U+2028 / U+2029), cùng bộ escape của markupsafe
    // (& < > " ' → &amp; &lt; &gt; &#34; &#39;). Nằm NGOÀI object Alpine: regex
    // có trạng thái (lastIndex) không nên đi qua proxy phản ứng.
    var TX_RE = /\{(?:([0-9]+) )?([0-9]+)\/([0-9]+)(?:\|([abx]))?\}|==([^\n]+?)==|\*\*([^\n]+?)\*\*/g;
    var TX_ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&#34;', "'": '&#39;' };
    function txEsc(s) { return s.replace(/[&<>"']/g, function (c) { return TX_ESC[c]; }); }
    // Một đoạn CHỮ THƯỜNG: escape + tô từ khoá tìm kiếm (cùng luật khớp đầu từ
    // với hit(), xem hl()). Chỉ đoạn chữ thường đi qua đây, nên <mark> tìm kiếm
    // không bao giờ chen vào giữa thẻ HTML do máy sinh (phân số, tô sáng).
    function txTo(s, q) {
      if (!q || !s) return txEsc(s);
      var o = '', vt = 0;
      for (const m of s.matchAll(khopRx(q, 'giu'))) {
        const i = m.index + m[1].length;
        o += txEsc(s.slice(vt, i)) + '<mark class="bg-amber-200 text-slate-900 rounded px-0.5">' + txEsc(m[2]) + '</mark>';
        vt = i + m[2].length;
      }
      return o + txEsc(s.slice(vt));
    }
    function txChu(s, q) {
      if (s == null) return '';
      s = String(s);
      var o = '', vt = 0;
      for (const m of s.matchAll(TX_RE)) {
        o += txTo(s.slice(vt, m.index), q);
        vt = m.index + m[0].length;
        if (m[2] !== undefined) {
          o += (m[1] !== undefined ? '<b class="mfw">' + m[1] + '</b>' : '')
             + '<span class="mfr' + (m[4] !== undefined ? ' mfr-' + m[4] : '') + '"><span>' + m[2] + '</span><span>' + m[3] + '</span></span>';
        } else if (m[5] !== undefined) {
          o += '<mark class="mhl">' + txChu(m[5], q) + '</mark>';
        } else {
          o += '<b>' + txChu(m[6], q) + '</b>';
        }
      }
      return o + txTo(s.slice(vt), q);
    }
    // Chữ NHÌN THẤY của markup (để tìm kiếm): `{2 11/20|a}` → "2 11/20", `==x==` / `**x**` → "x".
    // Không bóc thì gõ "a" khớp chữ vai màu `|a` — thẻ còn lại mà trên màn hình chẳng có gì khớp.
    function txTho(s) {
      return String(s ?? '').replace(new RegExp(TX_RE), function (m, w, tu, ms, c, hl, dam) {
        return tu !== undefined ? (w !== undefined ? w + ' ' : '') + tu + '/' + ms : txTho(hl !== undefined ? hl : dam);
      });
    }

    // ── Tab "Bài tập" — màn của con (plan 2026-11-02-bai-tap-math5-3-1, Task 4) ────────────────────────────────────────────────
    // Nội dung: `study/<slug>.bai-tap.json` do `src/bai_tap.py › dung()` dựng (đáp số do MÁY tính, chữ đã qua chu(), hình đã vẽ sẵn).
    // Chấm: `window.baiTap` = CHÍNH worker/bai_tap.js (module, nạp ở <head> chỉ khi môn có bài tập). Chữ đưa lên màn hình CHỈ qua
    // các khoá `*_html`, `visual.html` và `hinh_de.html` (x-html); `nguon`, `nhan`, tên kiến thức, mã `lua_chon[].k` đi qua x-text. KHÔNG bao giờ
    // vẽ `so` của một ý `o` hay `mau` của ý `the`/`day` (chứa đáp án / lời giải mẫu).
    // Tài liệu giữ NGOÀI vùng phản ứng (BT.doc: đối tượng thô, không đổi sau khi nạp) — 1 MB JSON mà bọc Proxy là phí; chỉ
    // trạng thái làm bài (btTL, btKq, btB, btN, …) là phản ứng. Ghi sổ qua bộ đệm của quiz (save/flushBuffer), id nhóm tiền tố `b.`.

    var BT_MUC = [['focus', 'Focus'], ['practice', 'Practice'], ['challenge', 'Challenge']];
    // Mục (3.1, 8.1…) con đã chọn trong PHIÊN — nhớ theo tên mục, sessionStorage (đóng thẻ trình duyệt là quên; thêm mục mới không lệch chỉ số).
    var BT_MUC_KHOA = 'lms_bt_muc:' + location.pathname;
    // Màu theo cặp của bài nối: theo chỉ số bên TRÁI (cố định, không đổi khi nối lại). Mọi class là literal (Tailwind quét template).

    var BT_TEN_DK = { mean: 'mean', mode: 'mode', median: 'median', range: 'range', tong: 'total', n: 'số thẻ' };
    // Chấm câu viết bằng Gemini (plan 2026-11-03-cham-cau-viet-gemini, Task 4): trạng thái của MỖI ý `viet` nằm ở `btVV[y.id]`.
    //   tt null (chưa chấm) → 'cho' (đã gửi, nút khoá) → 'may' (Gemini đã chấm) | 'tu' (lùi về tự kiểm: tick như cũ).
    // BT_V0 = giá trị đọc khi ý chưa có trạng thái (đọc thì không tạo khoá: template gọi lúc vẽ).
    //   mayChua = ý này đã có ÍT NHẤT MỘT lượt máy chấm mà CHƯA đạt (trong lần mở trang này): bài mẫu mở ra sau đó, kể cả lúc đang tự kiểm, là «xem bài mẫu khi chưa đạt» → g 0.
    //   thayMau = bài mẫu đã HIỆN ra lúc ý này đang tự kiểm (dính suốt phiên trang): gọi máy lại sau đó phải gửi xem_mau true, không thì Gemini cho đạt là Worker ghi g 3 cho câu chép bài mẫu.
    var BT_V0 = Object.freeze({ tt: null, kq: null, luot: 0, con: null, ly: '', dat: false, xemMau: false, text: '', tuKq: null, mayChua: false, thayMau: false });
    var BT_LY_TU = ['nghi_lenh', 'het_cau', 'het_ngay', 'khong_co', 'loi'];   // mã lùi về tự kiểm mà route /api/cham-viet được phép trả (§5)
    var BT_LY_THOANG = ['loi', 'ngoai_tuyen'];      // lùi về tự kiểm vì lỗi THOÁNG QUA: con sửa chữ thì Kiểm tra gọi máy lại (hết lượt / hết ngày / lệnh / chưa có khoá thì không)
    var BT_CHO_MS = 15000;   // quá hạn này thì bỏ chờ → tự kiểm; Worker vẫn có thể đã ghi MỘT lượt máy (chấp nhận: plan, Review Focus #5)
    var BT_LUOT_CAU = 3;     // = LUOT_CAU của worker/cham_viet.js: «hết lượt» nghĩa là hôm nay đã có ĐỦ ngần ấy lượt máy
    // Đơn vị tiền in TRƯỚC số ($5, £15); mọi đơn vị khác là hậu tố (7.7 kg) — cùng luật với `chamO` / `TIEN_TO` của worker/bai_tap.js.
    var BT_DV_TRUOC = ['$', '£', '€'];

    function baiTapStore() {
      return {
        btCo: false,   // môn có tệp bài tập MATH (builder); fetch thành công mới hiện tab
        btOk: false, btMuc: 0, btTier: 'focus', btTierDat: false,
        btVi: localStorage.getItem('lms_bt_vi') !== '0',
        btTL: {},       // y.id → traLoi (hình dạng theo kiểu: xem đầu worker/bai_tap.js)
        btKq: {},       // y.id → kết quả hiển thị của lần Kiểm tra gần nhất {nhom, cells, ly, muc, cond, tuKiem}
        btB: {},        // bai.id → {kiem, giai (đã từng mở), mo (đang mở), fb, dung}
        btN: {},        // id nhóm ghi sổ → {first, dung, tung, out}
        btVV: {},       // y.id (ý `viet`) → {tt: null|'cho'|'may'|'tu', kq, luot, con, ly, dat, xemMau, text, tuKq, mayChua, thayMau}
        btCur: {},      // bài gốc → chỉ số đề đang hiện (0 = gốc, k = bien_the[k-1])
        btNoiSel: {}, btThe: {}, btMore: null, btDong: {},
        // Bốn kiểu ý điều kiện (cot · o_dk · the_o · noi_nhom): ô nhớ (nháp, KHÔNG chấm / lưu), thẻ·túi đang chọn, các cách đã tìm, ý đang ở chế độ «Tìm cách khác».
        btNho: {}, btSelThe: {}, btCach: {}, btCachThem: {},

        // ── Nạp + khởi tạo ────────────────────────────────────────────────────────────────────────────────────────────────
        async btNap() {
          if (!this.btCo || !window.baiTap) return;
          try {
            const r = await fetch('study/lich-su-va-dia-ly-5.bai-tap.json', { headers: { accept: 'application/json' } });
            if (!r.ok) return;                       // 404: không có tab, các tab khác chạy như cũ
            const d = await r.json();
            if (!d || !Array.isArray(d.muc) || !d.muc.length) return;
            this.btKhoiTao(d);
            this.btOk = true;
          } catch (e) { /* mạng / JSON hỏng: không có tab */ }
        },
        btKhoiTao(d) {
          BT.doc = d; BT.bai.clear(); BT.kt.clear(); BT.cell.clear(); BT.grid.clear(); BT.xep.clear(); BT.cot.clear(); BT.hang.clear();
          // Mặc định mở mục MỚI NHẤT (cuối `muc` — bài đang học); đã chọn mục trong phiên thì giữ (chủ dự án chốt 2026-11-03, D6).
          let mi = d.muc.length - 1;
          try { const j = d.muc.findIndex(m => m.ten === sessionStorage.getItem(BT_MUC_KHOA)); if (j >= 0) mi = j; } catch (e) { /* riêng tư */ }

          for (const k of d.kien_thuc || []) BT.kt.set(k.id, k);
          const tl = {};
          for (const m of d.muc) for (const g of m.bai || []) for (const b of [g, ...(g.bien_the || [])]) {
            BT.bai.set(b.id, { b, g });
            for (const y of b.y || []) tl[y.id] = this.btTLMoi(y);
          }
          this.btTL = tl;
        },
        btTLMoi(y) {
          switch (y.kieu) {
            case 'tick': return (y.cau || []).map(() => false);
            case 'dung_sai': return (y.cau || []).map(() => null);
            case 'the': return [];
            case 'day': return '';
            case 'viet': return { tick: (y.tu_kiem || []).map(() => false), text: '' };
            case 'the_o': return Array(y.so_o || 0).fill(null);                         // ô → chỉ số thẻ
            case 'noi_nhom': return { hop: (y.phai || []).map(() => []), go: '' };      // hộp → chỉ số túi; go = số ghi lên hộp cuối
            default: return {};     // o · bang · noi · chon · cot · o_dk
          }
        },

        // ── Danh sách hiện ra ─────────────────────────────────────────────────────────────────────────────────────────────
        btMucs() { return BT.doc ? BT.doc.muc : []; },
        btMucNow() { return BT.doc ? BT.doc.muc[this.btMuc] : { bai: [] }; },
        btGoc() { return this.btMucNow().bai || []; },
        btSlots(tier) { return this.btGoc().filter(g => g.tier === tier); },
        btInst(g) { const i = this.btCur[g.id] || 0; return i > 0 && (g.bien_the || [])[i - 1] ? g.bien_the[i - 1] : g; },
        btTenMuc(t) { return (BT_MUC.find(x => x[0] === t) || [t, t])[1]; },
        // "Bài xong" (số «x/y bài») = MỌI nhóm của bài đã TỪNG đúng — cùng định nghĩa với trang bố mẹ (có lượt g ≥ 2): đúng rồi làm lại sai vẫn là xong;
        // đúng SAU KHI xem lời giải (g 0, ok 0) thì chưa xong. Trong phiên: `N.ever`; từ các phiên trước (D1): có ít nhất một lượt đúng (`n > wrong`).
        btNhomXong(n) {
          const N = this.btN[n.id];
          if (N && N.ever) return true;
          const c = this.cards[n.id];
          return !!c && (c.n || 0) > (c.wrong || 0);
        },
        btBaiXong(b) { const ys = b.y || []; return ys.length > 0 && ys.every(y => (y.nhom || []).every(n => this.btNhomXong(n))); },
        // Thẻ bài hiện «✓ xong»: đang đúng ở lần Kiểm tra gần nhất VÀ đã tính là xong.
        btBaiDung(b) {
          const ys = b.y || [];
          return ys.length > 0 && ys.every(y => (y.nhom || []).every(n => { const N = this.btN[n.id]; return N && N.first !== null ? (N.dung && N.ever) : this.btNhomXong(n); }));
        },
        btDaKiem(b) { return !!b && ((this.btB[b.id] || {}).kiem || 0) > 0; },
        btDem(tier) { const sl = this.btSlots(tier); return { x: sl.filter(g => this.btBaiXong(g)).length, y: sl.length }; },
        btTiers() {
          return BT_MUC.filter(t => this.btSlots(t[0]).length).map(t => { const d = this.btDem(t[0]); return { k: t[0], ten: t[1], dem: d.x + '/' + d.y + ' bài' }; });
        },
        btMucDau() {
          const t = BT_MUC.find(x => { const d = this.btDem(x[0]); return d.y > 0 && d.x < d.y; });
          return t ? t[0] : (BT_MUC.find(x => this.btSlots(x[0]).length) || BT_MUC[0])[0];
        },
        btDatMuc(k) { this.btTier = k; this.btMore = null; },
        btSang(k) { this.btDatMuc(k); window.scrollTo(0, 0); },
        btDatBai(i) {
          this.btMuc = i; this.btMore = null; this.btTier = this.btMucDau();
          if (BT.doc.muc[i].concept) this.openAncestors(BT.doc.muc[i].concept);   // cây bên trái bung tới mục đang làm
          try { sessionStorage.setItem(BT_MUC_KHOA, BT.doc.muc[i].ten); } catch (e) { /* riêng tư */ }
        },
        btDoiVi() { this.btVi = !this.btVi; try { localStorage.setItem('lms_bt_vi', this.btVi ? '1' : '0'); } catch (e) { /* riêng tư/đầy */ } },
        // Đồng hồ `ms` của một đề chạy từ lần ĐẦU con chạm / gõ vào thẻ đó (không phải lúc thẻ được vẽ ra: thẻ thứ 6 của mức sẽ ôm cả thời gian làm 5 thẻ trước).
        btVao(b) { if (!BT.t0.has(b.id)) BT.t0.set(b.id, Date.now()); },
        btHien() {
          if (!this.btOk) return [];
          const ra = this.btSlots(this.btTier).map(g => { const b = this.btInst(g); return { key: 's' + b.id, b, g, extra: false }; });
          const gy = this.btGoiY();
          if (gy) ra.push({ key: 'goiy', goiy: gy });
          if (this.btMore) {
            ra.push({ key: 'them', dau: true, ten: this.btMore.ten, n: this.btMore.ids.length });
            for (const id of this.btMore.ids) ra.push({ key: 'x' + id, b: BT.bai.get(id).b, g: null, extra: true });
          }
          return ra;
        },
        // Cuối mức: khi MỌI bài gốc của mức đã Kiểm tra thì hiện MỘT lời gợi ý theo kiến thức sai nhiều nhất ở lần Kiểm tra ĐẦU.
        btGoiY() {
          const sl = this.btSlots(this.btTier);
          if (!sl.length || this.btDong[this.btMuc + ':' + this.btTier] || !sl.every(g => this.btDaKiem(g))) return null;
          const dem = {};
          for (const g of sl) for (const y of g.y || []) for (const n of y.nhom || []) {
            const N = this.btN[n.id];
            // Chỉ tính lỗi THẬT: sai ở lần Kiểm tra đầu (g 1) hoặc xem lời giải trước (g 0). Đúng ngay nhưng bị trần g 2 vì đã mở gợi ý thì KHÔNG phải «hay sai».
            if (N && N.first !== null && N.first < 2) dem[n.kt] = (dem[n.kt] || 0) + 1;
          }
          let kt = null;
          for (const k of BT.doc.kien_thuc || []) if (dem[k.id] && (kt === null || dem[k.id] > dem[kt])) kt = k.id;
          const i = BT_MUC.findIndex(t => t[0] === this.btTier);
          const tiep = BT_MUC.slice(i + 1).find(t => this.btSlots(t[0]).length);
          const kk = kt && BT.kt.get(kt);
          const f = kk && this.btTheTim(kk.the);
          return { muc: this.btTenMuc(this.btTier), kt, ten: kk ? kk.ten : '', the: f ? f.tp.title : '', tiep: tiep ? tiep[0] : '', tiepTen: tiep ? tiep[1] : '' };
        },
        btDongGoiY() { this.btDong[this.btMuc + ':' + this.btTier] = true; },
        // "Làm thêm 5 bài phần này": tối đa 5 biến thể có ý thuộc kiến thức `kt` — lần lượt từng bài gốc (mức đang xem trước), không
        // lấy biến thể đang nằm ở khe "Bài tương tự" của màn hình, ưu tiên đề chưa làm.
        btLamThem(kt) {
          const xep = [...this.btSlots(this.btTier), ...this.btGoc().filter(g => g.tier !== this.btTier)];
          const hien = new Set(this.btSlots(this.btTier).map(g => this.btInst(g).id));
          const ds = xep.map(g => (g.bien_the || []).filter(v => !hien.has(v.id) && (v.y || []).some(y => (y.nhom || []).some(n => n.kt === kt))));
          const lay = (chiMoi) => {
            const ids = [];
            for (let r = 0; ids.length < 5 && ds.some(l => r < l.length); r++) {
              for (const l of ds) {
                const v = l[r];
                if (v && ids.length < 5 && !ids.includes(v.id) && !(chiMoi && this.btDaKiem(v))) ids.push(v.id);
              }
            }
            return ids;
          };
          let ids = lay(true);
          if (ids.length < 5) ids = [...ids, ...lay(false).filter(id => !ids.includes(id))].slice(0, 5);
          const k = BT.kt.get(kt);
          this.btMore = { kt, ten: k ? k.ten : '', ids };
          this.btDong[this.btMuc + ':' + this.btTier] = true;
          this.$nextTick(() => { const e = document.querySelector('[data-bt-them-dau]'); if (e) e.scrollIntoView({ block: 'start' }); });
        },

        // ── Thẻ tóm tắt để xem lại ───────────────────────────────────────────────────────────────────────────────────────
        btTheTim(concept) {
          for (const s of (this.data && this.data.summary) || []) for (const t of s.topics || []) if (t.concept === concept) return { s, tp: t };
          return null;
        },
        // Nhóm đã Kiểm tra mà chưa đúng → thẻ của kiến thức đó (mỗi thẻ một lần, tối đa 2).
        btSaiThe(b) {
          const ra = [], thay = new Set();
          for (const y of (b && b.y) || []) for (const n of y.nhom || []) {
            const N = this.btN[n.id];
            if (!N || N.first === null || N.dung) continue;
            const k = BT.kt.get(n.kt), f = k && this.btTheTim(k.the);
            if (f && !thay.has(f.tp.concept)) { thay.add(f.tp.concept); ra.push({ kt: n.kt, title: f.tp.title }); }
          }
          return ra.slice(0, 2);
        },
        // Sang tab Tóm tắt, mở đúng mục chứa thẻ và cuộn tới thẻ. Bỏ ô tìm + bộ lọc (thẻ bị lọc thì không có trong trang).
        btXemThe(kt) {
          const k = BT.kt.get(kt), f = k && this.btTheTim(k.the);
          if (!f) return;
          this.kw = '';
          this.go('summary');
          if (this.anyPick || this.onlyNew) this.boLoc();
          this.setScope(f.s.concept);
          const id = this.theId(f.tp), t0 = Date.now();
          const toi = () => {
            const e = document.getElementById(id);
            if (e) {
              e.scrollIntoView({ block: 'start' });
              e.classList.add('ring-2', 'ring-indigo-400');
              setTimeout(() => e.classList.remove('ring-2', 'ring-indigo-400'), 1800);
            } else if (Date.now() - t0 < 4000) requestAnimationFrame(toi);
          };
          this.$nextTick(toi);
        },

        // ── Nhập liệu ───────────────────────────────────────────────────────────────────────────────────────────────────────
        btCell(y, id) {
          let m = BT.cell.get(y.id);
          if (!m) { m = new Map((y.o || []).map(c => [c.id, c])); BT.cell.set(y.id, m); }
          return m.get(id) || {};
        },
        btGrid(y) {      // bảng ô của ý `bang`: [hàng][cột] → ô (hoặc undefined)
          let g = BT.grid.get(y.id);
          if (!g) {
            g = (y.hang || []).map(() => (y.cot || []).map(() => undefined));
            for (const c of y.o || []) if (g[c.hang]) g[c.hang][c.cot] = c;
            BT.grid.set(y.id, g);
          }
          return g;
        },
        btYPhanSo(y) { return (y.o || []).some(c => String(c.dap || '').includes('/')); },
        // Ý có ô số ÂM (`am: true`, Unit 1/2/4/6): bàn phím SỐ (`decimal` / `numeric`) của iPhone / iPad KHÔNG có dấu trừ → cả ý dùng bàn phím chữ (`inputmode="text"`: «-» luôn gõ được).
        // Xét theo CẢ Ý như `btYPhanSo` — ô nào âm không lộ qua kiểu bàn phím. Không dùng `pattern`: nó chỉ kiểm hợp lệ form, không đổi bàn phím.
        btYAm(y) { return (y.o || []).some(c => c.am === true); },
        // Ô NHIỀU GIÁ TRỊ (`uoc_chung` · `boi_chung`: đáp số «1; 2; 4; 8») KHÔNG kể ô mode (`btLaMode`): ô mode không gợi ý để khỏi lộ «có hai mode». Gõ cách nhau dấu phẩy
        // (bàn phím số của iPhone ở vùng en không có dấu phẩy, cũng không có dấu cách) nên ô này cũng dùng bàn phím chữ. CÙNG luật với `coXDien` (worker/bai_tap.js: ý nào ghi «Con điền») — sửa một nơi thì sửa nơi kia.
        btNhieuGt(y, c) { return !!c && !this.btOChu(c) && String(c.dap || '').includes(';') && !this.btLaMode(y, c); },
        // Ô CHỮ: ô word form (`dap_chu`, `[[= chu(x)]]`) và ô CÂU SỐ / BIỂU THỨC CÓ CHỮ (`cau`, `[[= cau("x + 2 = y")]]`, M4a): cùng <textarea> tự giãn + bàn phím chữ (khớp `coXDien` ở worker/bai_tap.js).
        btOChu(c) { return !!c && (c.dap_chu !== undefined || c.cau !== undefined); },
        btLaMode(y, c) { return !!c && (c.bt === 'mode' || (c.cot !== undefined && ((y.cot || [])[c.cot] || {}).f === 'mode')); },
        btO(y, id) { const v = (this.btTL[y.id] || {})[id]; return v === 'none' || v == null ? '' : v; },
        btNhapO(y, id, v) {
          this.btTL[y.id][id] = v;
          const K = this.btKq[y.id];
          if (K && K.cells && id in K.cells) delete K.cells[id];
        },
        btNone(y, id) { this.btNhapO(y, id, this.btTL[y.id][id] === 'none' ? '' : 'none'); },
        // Ô CHỮ là <textarea rows=1> tự giãn: đặt chiều cao theo nội dung (scrollHeight + viền). Đang ẩn (tab khác) thì scrollHeight = 0 → để `auto` (min-h-10 giữ một dòng).
        btFit(el) { if (!el || !el.isConnected) return; el.style.height = 'auto'; const h = el.scrollHeight + el.offsetHeight - el.clientHeight; if (h > 0) el.style.height = h + 'px'; },
        // Ô dựng lúc khối đang ẨN (D4b): đo lại khi chính nó hiện ra / đổi bề rộng (xoay máy) — một ResizeObserver mỗi ô, đo trong rAF (không tự kích vòng «ResizeObserver loop»).
        btFitTheoDoi(el) {
          this.btFit(el);
          if (!el || el._btRo || typeof ResizeObserver === 'undefined') return;
          el._btRo = new ResizeObserver(() => requestAnimationFrame(() => { if (el.isConnected) this.btFit(el); else el._btRo.disconnect(); }));
          el._btRo.observe(el);
        },
        btCls(y, id) {   // viền + nền ô số theo kết quả
          const kq = ((this.btKq[y.id] || {}).cells || {})[id], tat = this.btTL[y.id][id] === 'none';
          if (kq === 'dung') return 'border-emerald-500 bg-emerald-50';
          if (kq === 'sai') return 'border-rose-500 bg-rose-50';
          if (kq === 'cach_viet') return 'border-amber-500 bg-amber-50';
          return tat ? 'border-slate-300 bg-slate-100' : 'border-slate-400 bg-white';
        },
        btClr(y) { const K = this.btKq[y.id]; if (K) { K.muc = null; K.cond = null; K.ct = null; K.them = null; if (K.nhom) K.nhom = {}; } },
        // nối: chạm trái rồi chạm phải (cột phải xáo CỐ ĐỊNH theo id của ý)
        btXepPhai(y) {
          let r = BT.xep.get(y.id);
          if (!r) {
            r = (y.phai || []).map((_, j) => j);
            let s = 2166136261;
            for (const ch of y.id) { s ^= ch.charCodeAt(0); s = Math.imul(s, 16777619) >>> 0; }
            const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            for (let i = r.length - 1; i > 0; i--) { const k = Math.floor(rnd() * (i + 1)); [r[i], r[k]] = [r[k], r[i]]; }
            BT.xep.set(y.id, r);
          }
          return r;
        },
        btNoiL(y, i) { this.btNoiSel[y.id] = this.btNoiSel[y.id] === i ? null : i; },
        btNoiR(y, j) {
          const i = this.btNoiSel[y.id];
          if (i === null || i === undefined) return;
          this.btTL[y.id] = window.baiTap.noiCap(this.btTL[y.id], i, j);
          this.btNoiSel[y.id] = null;
          this.btClr(y);
        },
        btTraiCua(y, j) { const tl = this.btTL[y.id] || {}; for (const k of Object.keys(tl)) if (tl[k] === j) return Number(k); return -1; },
        btClsNoi(y, ben, idx) {
          const l = ben === 'l' ? idx : this.btTraiCua(y, idx), muc = (this.btKq[y.id] || {}).muc;
          const noi = ben === 'l' ? (this.btTL[y.id] || {})[idx] !== undefined && (this.btTL[y.id] || {})[idx] !== null : l >= 0;
          let c = noi ? 'text-white ' + BT_MAU[l % BT_MAU.length] : 'bg-white border-slate-300 text-slate-900';
          if (ben === 'l' && this.btNoiSel[y.id] === idx) c += ' ring-4 ring-indigo-300 !border-indigo-600';
          if (muc && l >= 0 && muc[l] !== undefined) c += muc[l] ? ' ring-[3px] ring-emerald-500' : ' ring-[3px] ring-rose-500';
          else if (muc && ben === 'l' && !noi) c += ' ring-[3px] ring-rose-500';
          return c;
        },
        // chọn (+ lý do)
        btChon(y, truong, k) { this.btTL[y.id][truong] = k; this.btClr(y); },
        btClsChon(y, truong, k) {
          const chon = this.btTL[y.id][truong] === k, muc = (this.btKq[y.id] || {}).muc;
          if (!chon) return 'border-slate-300 bg-white';
          const kq = muc ? (truong === 'dap' ? muc.dap : muc.ly) : null;
          return kq === true ? 'border-emerald-500 bg-emerald-50' : kq === false ? 'border-rose-500 bg-rose-50' : 'border-indigo-600 bg-indigo-50';
        },
        btClsMuc(y, ci) { const m = (this.btKq[y.id] || {}).muc; return !m || m[ci] === undefined ? '' : m[ci] ? 'bg-emerald-50' : 'bg-rose-50'; },
        // Đúng / Sai
        btDS(y, ci, v) { this.btTL[y.id][ci] = v; this.btClr(y); },
        btClsDS(y, ci, v) {
          if (this.btTL[y.id][ci] !== v) return 'border-slate-300 bg-white';
          const m = (this.btKq[y.id] || {}).muc;
          return !m ? 'border-indigo-600 bg-indigo-50' : m[ci] ? 'border-emerald-500 bg-emerald-50' : 'border-rose-500 bg-rose-50';
        },
        // chọn thẻ (ý `the`): các ý a, b, c của MỘT bài dùng chung hàng thẻ, chọn ý bằng nút
        btTheYs(b) { return (b.y || []).filter(y => y.kieu === 'the'); },
        btTheY(b) { const ys = this.btTheYs(b); return ys[Math.min(this.btThe[b.id] || 0, ys.length - 1)] || null; },
        btTheChon(b, zi) { this.btThe[b.id] = zi; },
        btThePick(b, vi) {
          const y = this.btTheY(b);
          if (!y) return;
          const cu = this.btTL[y.id] || [];
          this.btTL[y.id] = cu.includes(vi) ? cu.filter(x => x !== vi) : (cu.length < y.chon ? [...cu, vi] : cu);
          this.btClr(y);
        },
        btTheOn(b, vi) { const y = this.btTheY(b); return !!y && (this.btTL[y.id] || []).includes(vi); },
        btYHien(b, y) { return y.kieu !== 'the' || y.id === (this.btTheYs(b)[0] || {}).id; },   // ý `the` thứ hai trở đi dùng chung khối của ý đầu
        btTheTxt(b) {
          const y = this.btTheY(b);
          if (!y) return '';
          const v = (this.btTL[y.id] || []).map(i => Number(b.the_so[i])).sort((p, q) => p - q);
          return v.length ? v.join(', ') + '  (' + v.length + '/' + y.chon + ')' : '—';
        },
        btCondThe(b) { const y = this.btTheY(b); return (y && (this.btKq[y.id] || {}).cond) || []; },
        btYDung(y) { const K = this.btKq[y.id]; return K && K.nhom && Object.keys(K.nhom).length ? Object.values(K.nhom).every(v => v === 'dung') : null; },
        btClsDay(y) {
          const r = Object.values((this.btKq[y.id] || {}).nhom || {})[0];
          return r === 'dung' ? 'border-emerald-500 bg-emerald-50' : r === 'sai' ? 'border-rose-500 bg-rose-50' : r === 'cach_viet' ? 'border-amber-500 bg-amber-50' : 'border-slate-400 bg-white';
        },
        btClsFb(b) {
          const f = (this.btB[b.id] || {}).fb;
          return !f ? '' : f.loai === 'ok' ? 'bg-emerald-50 text-emerald-800' : f.loai === 'bad' ? 'bg-rose-50 text-rose-800' : 'bg-amber-50 text-amber-900';
        },

        // ── Bốn kiểu ý điều kiện: cot · o_dk · the_o · noi_nhom ─────────────────────────────────────────────────────────────
        // Máy chấm theo ĐIỀU KIỆN (thay số của con vào đề rồi tính lại), nên nhiều nghiệm đều đúng và máy không biết con sai ô nào. Markup ở
        // templates/_bt_dang_moi.html; chấm / phản hồi / «con điền gì» ở worker/bai_tap.js (`chuaXong` · `chiTiet` · `xDien` · `khoaCach` · `datThe` · `datTui`).
        btLaDien(y) { return !!window.baiTap && (window.baiTap.KIEU_DIEN || []).includes(y.kieu); },
        btCT(y) { return (this.btKq[y.id] || {}).ct || null; },                       // {dong: [{ok, t}], o? hang? hop? lech?} của lần Kiểm tra gần nhất
        btClsCT(y) { const c = this.btCT(y); return c && c.dong.every(d => d.ok) ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-800'; },
        btCtHon(y) { const c = this.btCT(y); return !!c && c.dong.some(d => d.ok) && c.dong.some(d => !d.ok); },   // vừa có dòng ✅ vừa có dòng ❌ (o_dk: «— đúng» cạnh điều kiện vi phạm)
        btLech(y) { const c = this.btCT(y); return c && c.lech ? c.lech : ''; },        // cột lệch của `cot` — CHỈ hiện trong khối 💡 (quyết định a)
        btYGoiYHien(b, y) { return !!(this.btB[b.id] || {}).gyHien && this.btLaDien(y) && this.btYCoGoiY(y); },
        btNhapDien(y, id, v) { this.btTL[y.id][id] = v; this.btClr(y); },
        // Lời nhắc khi ý chưa làm xong (`chuaXong`): chỉ nhắc, không chấm, không ghi sổ.
        btNhac(y, cx) {
          switch (cx.ly) {
            case 'dien_du': return (y.kieu === 'cot' ? 'Điền đủ các chữ số nhé (còn ' : 'Điền đủ các ô nhé (còn ') + cx.con + ' ô trống).';
            case 'mot_chu_so': return 'Mỗi ô chỉ một chữ số 0–9.';
            case 'doc_so': return 'Chưa đọc được — chỉ gõ số (ví dụ 0.25 hoặc 3).';
            case 'dat_du': return 'Đặt đủ ' + y.so_o + ' thẻ nhé (còn ' + cx.con + ' ô trống).';
            case 'du_tui': return 'Mỗi hộp cần đủ ' + y.moi_nhom + ' túi.';
            case 'go_tong': return 'Ghi tổng của các túi còn lại lên hộp cuối.';
            case 'cach_viet': return 'Chưa đọc được hộp cuối — chỉ gõ số (ví dụ 5.5), kèm đơn vị nếu cần.';
            default: return 'Con làm cho xong ý này rồi bấm Kiểm tra nhé.';
          }
        },
        // Viền + nền ô gõ: sai → CHỈ ô vi phạm (`chiTiet().o`) đỏ; đúng → mọi ô xanh; `cot` sai thì KHÔNG tô ô nào.
        btClsDien(y, id) {
          const c = this.btCT(y);
          if (c && c.o && c.o[id] === 'sai') return 'border-rose-500 bg-rose-50';
          return this.btYDung(y) === true ? 'border-emerald-500 bg-emerald-50' : 'border-slate-400 bg-white';
        },
        btDienIM(y, id) {      // bàn phím số cho ô chữ số / số nguyên; ô thập phân dùng `decimal`, còn phân số cần «/» thì bàn phím chữ (iPad không có «/» ở decimal)
          if (this.btCell(y, id).kieu === 'nguyen') return 'numeric';
          return y.cay && [...y.cay.trai, ...y.cay.phai].some(h => h.mau) ? 'text' : 'decimal';
        },
        btRongO(y, id, trongPhan) { return trongPhan ? 'w-12' : this.btCell(y, id).kieu === 'nguyen' ? 'w-14' : 'w-[68px]'; },
        // Bảng `luoi` HẸP (CC-13): ô phép tính `[[= 50 − 10]]` thường rộng w-24 (96 px); trong BẢNG 9–10 cột thế là ~1000 px, tràn khung ở iPad dọc (820 px) và khuất hai ô cuối. Khi MỌI ô phép tính (không đơn vị, không phải
        // ô chữ) của ý có đáp số ≤ 4 ký tự (kể dấu −, dấu chấm) thì các ô đó dùng w-14 như ô số thường → bảng 9 cột vừa 754 px. Xét theo CẢ Ý (không từng ô) để bề rộng không lộ ô nào có đáp số dài hơn; chỉ `luoi` (macro `phan_o(true)`), `dong` không đổi.
        btLuoiHep(y) {

        btTenO(o) { return typeof o === 'string' && /^[A-Za-z]$/.test(o) ? o : ''; },
        btCayNhan(y) { return y.kieu === 'o_dk' && !!y.cay && [...y.cay.trai, ...y.cay.phai].some(h => this.btTenO((h.tu || {}).o) || this.btTenO(((h.mau || {})).o)); },

        btCotCau(y) {

            const base = [];
            hang.forEach((h, r) => {

              h.forEach((x, j) => {
                const key = 'r' + r + 'c' + j;

        btHangOk(y, ri) { const c = this.btCT(y); return c && c.hang && c.hang.length ? !!c.hang[ri] : null; },
        btClsCard(y, vi) {

          if (ok === true) return 'border-emerald-500 bg-emerald-50';

        // noi_nhom: chạm túi rồi chạm hộp. `btSelThe[y.id]` = túi đang chọn; hộp cuối (nhãn null) có ô gõ tổng — chạm vào ô đó không đặt túi.
        btKem(y, v) { const dv = y.don_vi; return !dv ? v : BT_DV_TRUOC.includes(dv) ? dv + v : v + ' ' + dv; },

        btHopTui(y, k) { return (((this.btTL[y.id] || {}).hop || [])[k]) || []; },

        // «↻ Tìm cách khác» (bài nhiều cách, sau khi ĐÚNG): lưu cách hiện tại, xoá ô, chấm lượt thêm nhưng KHÔNG ghi sổ (không ⭐, không đổi g / «bài xong»).
        btCachDu(y) { return y.so_nghiem !== null && y.so_nghiem !== undefined && (this.btCach[y.id] || []).length >= y.so_nghiem; },
        btCachNut(y) { return !!y.nhieu_cach && this.btYDung(y) === true && !this.btCachDu(y); },

        btCachKhac(y, b) {

          if (b && this.btB[b.id]) this.btB[b.id].fb = null;

        btKiemThem(y, tl, K) {      // chấm một lượt thêm; kết quả nằm dưới ý (K.ct / K.them), không đụng btN

          const khoa = bt.khoaCach(y, tl);

          this.btCach[y.id].push({ khoa, chu: bt.xDien(y, tl) });

        // ── Kiểm tra + ghi sổ ───────────────────────────────────────────────────────────────────────────────────────────────
        btBS(b) { if (!this.btB[b.id]) this.btB[b.id] = { kiem: 0, giai: false, mo: false, fb: null, dung: false, gy: false, gyHien: false }; return this.btB[b.id]; },
        // 💡 Gợi ý (ý `o` có `goi_y_manh`): các dòng giàn giáo nằm sau nút, KHÔNG vào nhóm ghi sổ (chamY bỏ qua ô `goi_y`).
        // Nút 💡 hiện khi bài có ý để gợi ý. Riêng `cot` KHÔNG có `goi_y_html` thì gợi ý duy nhất là «Cột … chưa khớp» (cột lệch), chỉ có sau lần Kiểm tra sai → ẨN nút tới lần
        // Kiểm tra đầu. (Không xét `btLech(y)` ở đây: sửa một ô là `btClr` xoá kết quả, nên lúc ghi sổ lần đúng cột lệch đã mất mà con VẪN đã xem gợi ý → lọt trần g 2.)
        btCoGoiY(b) { return (b.y || []).some(y => this.btYCoGoiY(y) && (y.kieu !== 'cot' || (y.goi_y_html || []).length > 0 || this.btDaKiem(b))); },
        // Ý có gợi ý để mở: ý `o` có dòng giàn giáo `goi_y_manh`; ý điều kiện có `goi_y_html`, riêng `cot` luôn có (cột lệch sau lần Kiểm tra sai). Cũng là điều kiện trần g 2.
        btYCoGoiY(y) { return (y.kieu === 'o' && (y.goi_y_manh || []).length > 0) || (this.btLaDien(y) && (y.kieu === 'cot' || (y.goi_y_html || []).length > 0)); },
        btMoGoiY(b) { const S = this.btBS(b); S.gyHien = !S.gyHien; S.gy = true; },     // `gy` = đã từng mở (dính): khoá trần điểm g ≤ 2 của nhóm đó
        btDongHien(b, y) {      // dòng chính + (khi đang mở gợi ý) dòng gợi ý, mỗi dòng {ln, gy, dau}
          const ra = (y.dong_manh || []).map(ln => ({ ln, gy: false, dau: false }));
          if ((this.btB[b.id] || {}).gyHien) (y.goi_y_manh || []).forEach((ln, i) => ra.push({ ln, gy: true, dau: i === 0 }));
          return ra;
        },
        btNN(n) { if (!this.btN[n.id]) this.btN[n.id] = { first: null, dung: false, tung: false, out: false, ever: false }; return this.btN[n.id]; },
        // Ý đã được làm (có gì để chấm)? Ý bỏ trống không chấm và không ghi sổ — khỏi phạt cái con chưa đụng tới.
        btDaLam(y, tl) {
          switch (y.kieu) {
            // Ô của dòng gợi ý KHÔNG tính là "đã làm": điền mỗi ô gợi ý rồi bấm Kiểm tra không được ghi sổ ý đó là sai.
            case 'o': case 'bang': return Object.entries(tl || {}).some(([id, v]) => !this.btCell(y, id).goi_y && String(v == null ? '' : v).trim() !== '');
            case 'noi': return Object.values(tl || {}).some(v => v !== null && v !== undefined && v !== '');
            case 'chon': return !!(tl && tl.dap);
            case 'tick': return (tl || []).some(Boolean);
            case 'dung_sai': return (tl || []).some(v => v === true || v === false);
            case 'the': return Array.isArray(tl) && tl.length > 0;
            case 'day': return typeof tl === 'string' && tl.trim() !== '';
            case 'viet': return !!(tl && String(tl.text || '').trim());
            case 'cot': case 'o_dk': return Object.values(tl || {}).some(v => String(v == null ? '' : v).trim() !== '');
            case 'the_o': return Array.isArray(tl) && tl.some(v => v !== null && v !== undefined);
            case 'noi_nhom': return !!tl && ((tl.hop || []).some(h => h.length > 0) || String(tl.go || '').trim() !== '');
            default: return false;
          }
        },
        // Chi tiết để TÔ MÀU (đúng/sai từng ô, từng cặp, từng câu); nhóm ghi sổ do chamY quyết.
        btChiTiet(y, tl, b) {
          const bt = window.baiTap, K = {};
          if (y.kieu === 'o' || y.kieu === 'bang') {
            K.cells = {}; K.ly = {};
            for (const c of y.o || []) { if (c.goi_y) continue; const r = bt.chamO(c, tl[c.id]); K.cells[c.id] = r.kq; if (r.ly) K.ly[c.id] = r.ly; }
            if (bt.chamGoiY) Object.assign(K.cells, bt.chamGoiY(y, tl));      // ô gợi ý: chỉ để TÔ MÀU, không vào nhóm
          } else if (y.kieu === 'noi') {
            const dich = new Map(y.ghep || []);
            K.muc = (y.trai || []).map((_, i) => tl[i] === dich.get(i));
          } else if (y.kieu === 'chon') {
            K.muc = { dap: tl.dap === y.dap, ly: y.ly_do ? tl.ly_do === y.ly_do.dap : null };
          } else if (y.kieu === 'tick') {
            K.muc = (y.cau || []).map((c, i) => !!tl[i] === c.dung);
          } else if (y.kieu === 'dung_sai') {
            K.muc = (y.cau || []).map((c, i) => tl[i] === c.dung);
          } else if (y.kieu === 'the') {
            try {
              const vals = tl.map(i => b.the_so[i]), s = bt.thongKe(vals), d = bt.dat(vals, y.dk);
              K.cond = Object.keys(y.dk).map(k => {
                const co = k === 'n' ? s.dem : s[k], can = y.dk[k];
                const cs = (x) => Array.isArray(x) ? (x.length ? x.join(' & ') : 'none') : String(x);
                const tg = co === null || co === undefined ? '≈ ' + (vals.reduce((p, q) => p + Number(q), 0) / vals.length).toFixed(2) : cs(co);
                return { ok: !!d[k], t: BT_TEN_DK[k] + ' của tập con chọn = ' + tg + ' (cần ' + cs(can) + ')' };
              });
            } catch (e) { K.cond = []; }
          } else if (this.btLaDien(y)) {

          }
          return K;
        },
        btKiem(b) {
          if (this.btNutKiem(b).tat) return;      // máy đang chấm câu viết: không gửi đôi (nút cũng khoá; đây là hàng rào thứ hai)
          const bt = window.baiTap, S = this.btBS(b);
          const now = Math.floor(Date.now() / 1000);
          const ms = Math.max(0, Date.now() - (BT.t0.get(b.id) || Date.now()));
          const rows = [], tin = [], goiy = new Set(), chua = [];
          let sai = false, canh = false, cham = 0, them = 0, saiDien = false;
          const ghi = (n, g, ok, x) => rows.push({ i: n.id, c: n.kt, ok: ok ? 1 : 0, g, ms, x: x || null, t: now });
          (b.y || []).forEach((y, yi) => {
            const ten = y.nhan || String(yi + 1), tl = this.btTL[y.id];
            const K = { nhom: {}, tuKiem: !!(this.btKq[y.id] || {}).tuKiem };
            const dien = this.btLaDien(y);      // bốn kiểu ý điều kiện
            // «↻ Tìm cách khác»: lượt thêm được chấm và báo ngay dưới ý, KHÔNG ghi sổ, KHÔNG đụng btN / S.dung (không ⭐, không đổi g / «bài xong»).
            if (dien && this.btCachThem[y.id]) { them++; this.btKiemThem(y, tl, K); this.btKq[y.id] = K; return; }
            if (!this.btDaLam(y, tl)) { chua.push(ten); this.btKq[y.id] = K; return; }
            if (y.kieu === 'viet') {
              // Câu viết: Gemini chấm (route /api/cham-viet, bất đồng bộ); lỗi / hết lượt / ngoại tuyến → tự kiểm bằng tick như trước tính năng.
              // Lời nhắc của ý này (đang chấm, chưa đạt, chưa tick đủ) do btTongKet dựng từ btVV, vì kết quả đến SAU lúc bấm.
              const n = y.nhom[0], text = String(tl.text || '').trim().slice(0, 600);
              if (text.length < 15) { tin.push('Phần ' + ten + ': viết ít nhất một câu rồi bấm Kiểm tra.'); canh = true; this.btKq[y.id] = K; return; }

            // Đề MỚI chỉ mở khi đề gốc đã nộp ≥ 1 lần (cùng khoá «🔒 Chưa mở» của ①): gõ / dán link thẳng không vượt được. Sổ chưa về (tải trang ngay tại hash, máy khác) thì chờ sổ ≤ 3 s trước khi quyết.
            const de = this.beDeTheoMa(p[2]);
            if (de && this.beDeKhoa(de) && BE.soCho && !BE.soXong) {
              // `ve()` KHÔNG await hàm này nên lúc chờ trang vẫn tương tác được và mọi chuyển màn của con vào lịch sử như thường. Sổ về (hoặc quá 3 s) mà màn hình đã khác lúc bắt đầu chờ
              // thì con đã đi nơi khác → bỏ, không ghi đè (Back / hash mới tự gọi `ve()` lại với sổ mới).
              // Hai dấu hiệu: màn hình khác lúc bắt đầu chờ (thao tác của con) HOẶC đã có `ve()` khác chạy (`veN` đổi: Back/Forward/hash — kể cả Back về ĐÚNG màn cũ, token trùng t0 nhưng ý định đã khác).
              const t0 = this.tokenCua(), n0 = this.veN;
              let hen;
              await Promise.race([BE.soCho, new Promise(r => { hen = setTimeout(r, 3000); })]);
              clearTimeout(hen);
              if (this.tokenCua() !== t0 || this.veN !== n0) return;
            }
            if (de && this.beDeKhoa(de)) {
              this.beScr = 'tong';
              try { history.replaceState({ ...(history.state || {}), token: 'bai-tap' }, '', '#bai-tap'); } catch (e) { /* trang nhúng / hạn chế: giữ hash */ }   // THAY mục hiện tại (ADR 0067), không đẩy mục mới
              window.scrollTo(0, 0);
              return;
            }
            if (this.beMoDe(p[2])) return;
          }
          if (p[1] === 'kq' && p[2] && this.beKdMo(p[2], false)) return;
          this.beScr = 'tong';
        },
        beMo(kt) { this.beKt = kt; this.beScr = 'luyen'; this.beDung(); },
        beVeTong() { this.beScr = 'tong'; window.scrollTo(0, 0); },
        // ① → ②, cuộn tới bài ĐẦU của kiểu `kieu` (chờ theo điều kiện, ≤ 4 s).
        beVaoLuyen(kt, kieu) {
          this.beMo(kt);
          window.scrollTo(0, 0);
          if (!kieu) return;
          const t0 = Date.now();
          const toi = () => {
            const e = Array.from(document.querySelectorAll('[data-be-luyen] [data-be-bai]')).find(x => x.getAttribute('data-kieu') === kieu);
            if (e) e.scrollIntoView({ block: 'start' });
            else if (Date.now() - t0 < 4000) requestAnimationFrame(toi);
          };
          this.$nextTick(toi);
        },
        // Danh sách ② = bài Luyện của mảng, rồi bài của ĐỀ có câu con từng làm sai (cuối, dưới tiêu đề riêng). Không nhãn gốc / soạn thêm / nguồn.
        beDung() {
          const sai = new Set(this.beSaiDe), ra = [];
          let dau = true;
          for (const e of window.baiTapEsl.luyenCua(BE.doc, this.beKt, sai)) {
            const de = !BE.luyen.has(e.bai.id);
            ra.push({ key: e.bai.id, bai: e.bai, ids: e.chiCau, de, dau: de && dau });
            if (de) dau = false;
          }
          this.beDs = ra;
        },
        beCauHien(e) {
          const r = e.ids ? e.bai.cau.filter(c => e.ids.includes(c.id)) : e.bai.cau;
          return e.bai.chiXem && this.beChiSai ? r.filter(c => this.beKq[c.id] !== 'dung') : r;      // ④ «Chỉ xem câu sai»: câu đúng của bài tách biến mất
        },
        // «📐 xem luật»: sang Tóm tắt, mở đúng khung ngữ pháp của mảng (toiKhoi: bỏ ô tìm + bộ lọc, thu phạm vi chỉ khi cần, chờ khung ≤ 4 s, viền nháy).
        beXemLuat(m) {
          if (!m || !m.xem_luat) return;

          this.toiKhoi({ concept: m.xem_luat.concept, khung: m.xem_luat.khung });
        },

        // ── Nhập liệu ─────────────────────────────────────────────────────────────────────────────────────────────────────
        beVao(bai) { if (!BE.t0.has(bai.id)) BE.t0.set(bai.id, Date.now()); },     // đồng hồ `ms` chạy từ lần chạm đầu vào bài
        beKhoa(c) { return this.beKq[c.id] !== undefined; },
        beChu(i) { return String.fromCharCode(65 + i); },
        beNhap(bai, c, v) { if (this.beKhoa(c)) return; this.beVao(bai); this.beTL[c.id] = v; },
        beChon(bai, c, chu) { if (this.beKhoa(c)) return; this.beVao(bai); this.beTL[c.id] = chu; },
        // khung / chuỗi: chạm từ rồi chạm ô; chạm ô đã điền = gỡ
        beChipDung(bai, w) { return (bai.cau || []).some(c => this.beTL[c.id] === w); },
        beChipBam(bai, w) {
          if (bai.chiXem || this.beChipDung(bai, w)) return;                           // ④ chỉ-đọc
          this.beChip[bai.id] = this.beChip[bai.id] === w ? null : w;
        },
        beSlotBam(bai, c) {
          if (this.beKhoa(c)) return;
          if (this.beTL[c.id]) { delete this.beTL[c.id]; return; }
          const w = this.beChip[bai.id];
          if (!w) return;
          this.beVao(bai); this.beTL[c.id] = w; this.beChip[bai.id] = null;
        },
        // nối: chạm vế trái rồi vế phải (1–1); cột phải xáo CỐ ĐỊNH theo id bài
        beXepPhai(bai) {
          let r = BE.xep.get(bai.id);
          if (!r) {
            const n = (bai.phai || []).length;
            r = beXao(bai.rid || bai.id, n);                                  // hạt = id THẬT: ② ③ ④ xếp cột phải giống nhau
            if (n > 1 && r.every((v, i) => v === i)) r.push(r.shift());      // đừng để cột phải y hệt thứ tự cặp
            BE.xep.set(bai.id, r);
          }
          return r;
        },
        beNoiL(bai, c) { if (this.beKhoa(c)) return; this.beNoiSel[bai.id] = this.beNoiSel[bai.id] === c.id ? null : c.id; },
        beNoiR(bai, j) {
          const id = this.beNoiSel[bai.id];
          if (!id) return;
          for (const c of bai.cau) if (c.id !== id && this.beTL[c.id] === j && this.beKhoa(c)) return;       // vế đã thuộc một cặp đã chấm
          for (const c of bai.cau) if (c.id !== id && this.beTL[c.id] === j) delete this.beTL[c.id];       // vế phải chỉ nối với MỘT vế trái
          this.beVao(bai); this.beTL[id] = j; this.beNoiSel[bai.id] = null;
        },
        beTraiCua(bai, j) { return (bai.cau || []).findIndex(c => this.beTL[c.id] === j); },
        beClsNoiL(bai, c, i) {
          const noi = this.beTL[c.id] !== undefined, k = this.beKq[c.id];
          let s = noi ? 'text-white ' + BT_MAU[i % BT_MAU.length] : 'bg-white border-slate-300 text-slate-900';
          if (this.beNoiSel[bai.id] === c.id) s += ' ring-4 ring-indigo-300 !border-indigo-600';
          if (k === 'dung') s += ' ring-[3px] ring-emerald-500'; else if (k === 'sai') s += ' ring-[3px] ring-rose-500';
          return s;
        },
        beClsNoiR(bai, j) {
          const i = this.beTraiCua(bai, j);
          if (i < 0) return 'bg-white border-slate-300 text-slate-900';
          const k = this.beKq[bai.cau[i].id];
          return 'text-white ' + BT_MAU[i % BT_MAU.length] + (k === 'dung' ? ' ring-[3px] ring-emerald-500' : k === 'sai' ? ' ring-[3px] ring-rose-500' : '');
        },
        // Chữ của MỘT vế (chữ / «hình a» / «hình 2» theo thứ tự ảnh trong bài) — KHÔNG BAO GIỜ tên tệp ảnh; chỗ nào vẽ được thì vẽ hình (macro ve_nho)
        beVeChu(x, bai) { return window.baiTapEsl.chuVe(x, bai); },
        // hai vế của câu nối `c`: trái theo vị trí câu, phải = vế số j (j không phải số nguyên → chưa nối → phai undefined)
        beNoiVe(bai, c, j) {
          const i = (bai.cau || []).findIndex(x => x.id === c.id);
          return { trai: (bai.trai || [])[i], phai: Number.isInteger(j) ? (bai.phai || [])[j] : undefined };
        },
        // sửa lỗi: chạm chữ → ô sửa hiện ngay sau chữ; chạm lại = bỏ; chữ KHÔNG sai → nhắc, không chấm, không ghi sổ
        beTuBam(bai, t) {
          if (bai.chiXem) return;                                                      // ④ chỉ-đọc
          if (bai.trongDe) { this.beTuBamDe(bai, t); return; }
          const tu = bai.tu[t];
          if (!tu || tu.vd !== undefined) return;                                  // câu ví dụ đã làm sẵn
          const nh = this.beNham[bai.id] || [];
          if (tu.loi === undefined) {
            const co = nh.includes(t);
            this.beNham[bai.id] = co ? nh.filter(x => x !== t) : [...nh, t];
            this.beFb[bai.id] = co ? null : { loai: 'warn', tin: '«' + String(tu.t).replace(/[.,!?;:]+$/, '') + '» không sai — tìm chữ khác nhé.' };
            return;
          }
          const c = bai.cau[tu.loi];
          if (!c || this.beKhoa(c)) return;
          this.beVao(bai);
          this.beFb[bai.id] = null;
          if (this.beTL[c.id]) { delete this.beTL[c.id]; return; }                 // chạm lại chữ đã chọn = bỏ chọn
          this.beTL[c.id] = { chon: true, sua: '' };
          this.$nextTick(() => { const i = document.querySelector('input[data-be-sua][data-cau="' + c.id + '"]'); if (i) i.focus(); });
        },
        beSuaNhap(bai, c, v) { if (this.beKhoa(c)) return; this.beVao(bai); this.beTL[c.id] = { chon: true, sua: v }; },
        beSoChon(bai) { return (bai.cau || []).filter(c => this.beTL[c.id] && this.beTL[c.id].chon).length; },
        beClsTu(bai, t) {
          if (bai.trongDe) return this.beClsTuDe(bai, t);
          const tu = bai.tu[t], c = tu.loi !== undefined ? bai.cau[tu.loi] : null;
          if (c && this.beKq[c.id] === 'dung') return 'bg-emerald-100 text-emerald-800 line-through';
          if (c && this.beKq[c.id] === 'sai') return 'bg-rose-100 text-rose-800';
          if (c && this.beTL[c.id]) return 'bg-amber-200 ring-2 ring-amber-500';
          if ((this.beNham[bai.id] || []).includes(t)) return 'bg-slate-200 text-slate-500';
          return 'hover:bg-indigo-100';
        },
        // sắp xếp: chạm mảnh theo thứ tự; chạm mảnh đã xếp = trả lại. Ngân hàng mảnh xáo cố định theo id câu (và không bao giờ sẵn đúng thứ tự).
        beNganHang(c) {
          let r = BE.xep.get(c.id);
          if (!r) {
            const n = (c.manh || []).length, E = window.baiTapEsl;
            r = beXao(c.rid || c.id, n);
            for (let k = 0; k < n && n > 1 && E.chamCau(c, r, { kieu: 'sap_xep' }) === 'dung'; k++) r.push(r.shift());
            BE.xep.set(c.id, r);
          }
          const da = this.beTL[c.id] || [];
          return r.filter(m => !da.includes(m));
        },
        beXepBam(bai, c, m) { if (this.beKhoa(c)) return; this.beVao(bai); this.beTL[c.id] = [...(this.beTL[c.id] || []), m]; },
        beXepGo(bai, c, pos) { if (this.beKhoa(c)) return; const a = [...(this.beTL[c.id] || [])]; a.splice(pos, 1); this.beTL[c.id] = a; },

        // ── Chữ + class hiện ra ───────────────────────────────────────────────────────────────────────────────────────────
        beDapHien(bai, c) {
          switch (bai.kieu) {
            case 'abc': { const k = String(c.dap || ''), t = (c.lc || [])[k.charCodeAt(0) - 65]; return t ? k + '. ' + t : k; }
            case 'hoi_thoai': { const m = (bai.lc || []).find(x => x.k === c.dap); return m ? m.k + '. ' + m.t : String(c.dap || ''); }
            case 'noi': return this.beVeChu((bai.trai || [])[bai.cau.indexOf(c)], bai) + ' → ' + this.beVeChu((bai.phai || [])[c.dap], bai);
            case 'sua_loi': return String(c.sai || '') + ' → ' + String((c.dap || [])[0] || '');
            default: return String((c.dap || [])[0] || '');
          }
        },
        beNhanCau(bai, c) {
          if (bai.tach || (bai.cau || []).length < 2) return '';
          const i = bai.cau.indexOf(c) + 1;
          return bai.kieu === 'sua_loi' ? 'Lỗi ' + i : bai.kieu === 'noi' ? 'Cặp ' + i : 'Ô ' + i;
        },
        beClsFb(c) {
          const k = this.beKq[c.id];
          return k === 'dung' ? 'bg-emerald-50 text-emerald-800' : k === 'sai' ? 'bg-rose-50 text-rose-800' : k === 'khong_khop' ? 'bg-amber-50 text-amber-900' : 'bg-slate-100 text-slate-600';
        },
        beClsBaiFb(bai) {
          const f = this.beFb[bai.id], l = f && f.loai;
          return l === 'ok' ? 'bg-emerald-50 text-emerald-800' : l === 'bad' ? 'bg-rose-50 text-rose-800' : 'bg-amber-50 text-amber-900';
        },
        beClsO(c) {
          const k = this.beKq[c.id];
          return k === 'dung' ? 'border-emerald-500 bg-emerald-50' : k === 'sai' ? 'border-rose-500 bg-rose-50' : k === 'khong_khop' ? 'border-amber-500 bg-amber-50' : 'border-slate-400 bg-slate-50';
        },
        beClsLc(c, k) {
          const chon = this.beTL[c.id] === k, kq = this.beKq[c.id];
          if (chon) return kq === 'dung' ? 'border-emerald-500 bg-emerald-50' : kq === 'sai' ? 'border-rose-500 bg-rose-50' : 'border-indigo-600 bg-indigo-50';
          return kq === 'sai' && k === c.dap ? 'border-emerald-400 bg-white' : 'border-slate-300 bg-white';
        },
        beClsChip(bai, w) {
          if (this.beChipDung(bai, w)) return 'border-slate-200 bg-slate-100 text-slate-400 line-through';

        },

        // ── Kiểm tra + ghi sổ ─────────────────────────────────────────────────────────────────────────────────────────────
        // Một dòng sổ cho câu `c` vừa chấm. `x` = «Con điền» (xCau) hoặc JSON khuôn viết khi Gemini chấm.
        beDong(bai, c, dung, x) {
          const E = window.baiTapEsl, g = E.gCau(dung, this.beTungSai(c.id));
          return { i: c.id, c: c.kt || bai.kt, ok: g >= 2 ? 1 : 0, g, ms: Math.max(0, Date.now() - (BE.t0.get(bai.id) || Date.now())),
                   x: x !== undefined ? x : E.xCau(c, this.beTL[c.id], bai), t: Math.floor(Date.now() / 1000) };
        },
        beLuu(rows) {
          if (!rows.length) return;
          this.beRows.push(...rows);
          try { localStorage.setItem('lms_study_buf', JSON.stringify([...this.buf(), ...rows])); } catch (e) {
            // Bộ nhớ trình duyệt đầy / bị chặn nên không có đệm: thử gửi THẲNG; gửi không được (chưa có khoá, ngoại tuyến, lỗi) thì NHẮC — lượt này chỉ còn trong trang (review cuối M7)
            this.beGuiThang(rows).then((ok) => { this.beLuuCanh = ok ? '' : 'Bộ nhớ trình duyệt đã đầy nên kết quả vừa rồi chưa được lưu. Con đừng đóng trang, nhờ bố mẹ xoá bớt dữ liệu của trang rồi làm lại nhé.'; });
            this.beTinh();
            return;
          }
          this.beLuuCanh = '';
          this.flushBuffer();
          this.beTinh();
        },
        async beGuiThang(rows) {
          if (!this.online || !this.secret) return false;
          try {
            const r = await fetch(`/api/study?user=${this.user}&course=${this.course}`, { method: 'POST', headers: { 'content-type': 'application/json', 'x-progress-key': this.secret }, body: JSON.stringify({ attempts: rows }) });
            if (r.status === 401) {                                              // như flushOnce: khoá sai thì xoá + báo (ô nhập mã hiện lại) — không để «bộ nhớ đầy» là lời nhắc duy nhất
              this.secret = ''; localStorage.removeItem('lms_key'); window.dispatchEvent(new Event('lms-key'));
              return false;
            }
            const d = r.ok ? await r.json().catch(() => null) : null, cong = Number(d && d.cong) || 0;
            if (cong > 0 && window.baoDiem) window.baoDiem(cong);                // như flushOnce: «+N ⭐» vẫn hiện
            return r.ok;
          } catch (e) { return false; }
        },
        async beKiem(bai, ids) {
          if (this.beBan[bai.id]) return;
          if (bai.kieu === 'mo') return this.beMoKiem(bai, ids);
          const E = window.baiTapEsl, cs = this.beCauHien({ bai, ids }), rows = [], cho = [];
          let trong = 0;
          for (const c of cs) {
            if (this.beKq[c.id] !== undefined) continue;                              // đã chấm (đúng / sai khoá tới «Làm lại»)
            const kq = E.chamCau(c, this.beTL[c.id], bai);
            if (kq === 'trong') { trong++; continue; }                                // ô trống: không chấm, không ghi
            if (kq === 'cho_may') { cho.push(c); continue; }
            this.beKq[c.id] = kq;
            rows.push(this.beDong(bai, c, kq === 'dung'));
          }
          this.beLuu(rows);
          if (cho.length) {
            for (const c of cho) this.beKq[c.id] = 'cho';
            this.beBan[bai.id] = true;
            this.beFb[bai.id] = null;
            try { await this.beHoiMay(bai, cho); } finally { delete this.beBan[bai.id]; }
          }
          this.beTongKet(bai, cs, trong);
        },
        // «khong_khop» (máy chưa xem được câu viết lại) KHÔNG phải sai: không đếm vào «Đúng d/n», không tô đỏ (A7 review #2).
        beTongKet(bai, cs, trong) {
          const kq = (c) => this.beKq[c.id];
          const chamXong = cs.filter(c => kq(c) === 'dung' || kq(c) === 'sai'), dung = chamXong.filter(c => kq(c) === 'dung').length, kk = cs.filter(c => kq(c) === 'khong_khop').length;
          const con = trong ? 'Còn ' + trong + ' ' + (BE_CON[bai.kieu] || 'ô trống') + ' — điền rồi bấm Kiểm tra tiếp.' : '';
          const may = kk ? kk + ' câu máy chưa xem được — so với đáp án mẫu.' : '';
          if (!chamXong.length) { this.beFb[bai.id] = { loai: 'warn', tin: [may, con].filter(Boolean).join(' ') || 'Con chưa làm gì — làm rồi bấm Kiểm tra.' }; return; }
          if (dung === chamXong.length && !trong && !kk && chamXong.length === cs.length) { this.beFb[bai.id] = { loai: 'ok', tin: '✓ Đúng hết rồi!' }; return; }
          const sai = chamXong.length - dung;
          this.beFb[bai.id] = { loai: sai ? 'bad' : 'warn', tin: ['Đúng ' + dung + '/' + chamXong.length + '.', sai ? 'Câu sai đã hiện đáp án — bấm «Làm lại» để thử lại.' : '', may, con].filter(Boolean).join(' ') };
        },
        beLamLai(bai, ids) {
          if (this.beBan[bai.id]) return;
          for (const c of this.beCauHien({ bai, ids })) { delete this.beTL[c.id]; delete this.beKq[c.id]; delete this.beLyMay[c.id]; delete this.beV[c.id]; delete this.beMoS[c.id]; }
          delete this.beNham[bai.id]; delete this.beFb[bai.id]; delete this.beChip[bai.id]; delete this.beNoiSel[bai.id];
          BE.t0.delete(bai.id);
        },
        // Câu viết lại KHÁC mọi đáp án chấp nhận: nhờ Gemini xem MỘT lần cho cả lượt (POST /api/cham-lai). Kết quả nhớ theo (idCâu, chuan(chữ)) để gõ lại y hệt không gọi lại.
        beLaiKho() { try { return JSON.parse(localStorage.getItem(BE_LAI_KHOA) || '{}') || {}; } catch (e) { return {}; } },
        beLaiNho(kho) {
          try {
            const k = Object.keys(kho);
            if (k.length > BE_LAI_MAX) for (const x of k.slice(0, k.length - BE_LAI_MAX)) delete kho[x];
            localStorage.setItem(BE_LAI_KHOA, JSON.stringify(kho));
          } catch (e) { /* riêng tư / đầy: bỏ nhớ */ }
        },
        // Hỏi máy một lô câu viết lại: items = [{id, text}] → {[id]: {dat, ly}} CHỈ cho câu có kết luận (cache lms_be_lai hoặc /api/cham-lai ≤ 15 s). Không ném.
        // Dùng chung cho ② (beHoiMay) và ③ (nộp đề, mở lại ④).
        async beLaiHoi(items) {
          const E = window.baiTapEsl, kho = this.beLaiKho(), ket = {}, hoi = [];
          for (const it of items) {
            const text = String(it.text || ''), khoa = it.id + '|' + E.chuan(text);
            if (E.doDaiLai(text) < E.LAI_TEXT_MIN) ket[it.id] = { dat: false, ly: '' };           // quá ngắn không thể là câu: «chưa đạt» ngay, KHÔNG hỏi máy (chamCau đã chấm sai; đây là lượt chờ cũ còn sót)
            else if (kho[khoa] && typeof kho[khoa].dat === 'boolean') ket[it.id] = kho[khoa]; else hoi.push({ id: it.id, text, khoa });
          }
          if (hoi.length && this.online && this.secret && navigator.onLine !== false) {
            const ac = new AbortController(), han = setTimeout(() => ac.abort(), BE_CHO_MS);
            try {
              const r = await fetch('/api/cham-lai', {
                method: 'POST', signal: ac.signal,
                headers: { 'content-type': 'application/json', 'x-progress-key': this.secret },
                body: JSON.stringify({ user: this.user, course: this.course, cau: hoi.map(h => ({ i: h.id, text: Array.from(h.text.trim()).slice(0, 300).join('') })) }),
              });
              const d = r.ok ? await r.json() : null;
              for (const k of (d && Array.isArray(d.kq) ? d.kq : [])) {
                const h = k && hoi.find(x => x.id === k.i);
                if (h && typeof k.dat === 'boolean') {
                  const ly = k.dat ? '' : String(k.ly || '').slice(0, 200);       // ly của Gemini CHỈ dùng khi chưa đạt (kiemLai có thể trả ly cả khi dat true)
                  ket[h.id] = { dat: k.dat, ly }; kho[h.khoa] = ket[h.id];
                } else if (h && k.loai === 'tu') ket[h.id] = { dat: false, ly: BE_LY_THAY, tu: true };   // Worker cũ: câu không chấm được. Không nhớ vào kho; ② vẫn là «chưa khớp» (beHoiMay), ③ ④ coi là chưa đạt để đóng câu lại
              }
              this.beLaiNho(kho);
            } catch (e) { /* mạng / quá hạn / không phải JSON: «Chưa khớp đáp án» */ } finally { clearTimeout(han); }
          }
          return ket;
        },
        async beHoiMay(bai, cho) {
          const ket = await this.beLaiHoi(cho.map(c => ({ id: c.id, text: String(this.beTL[c.id] || '') })));
          const rows = [];
          for (const c of cho) {
            const k = ket[c.id], text = String(this.beTL[c.id] || '').trim();
            if (!k || k.tu) { this.beKq[c.id] = 'khong_khop'; continue; }             // KHÔNG ghi sổ: máy chưa có kết luận (hoặc câu không chấm được)
            this.beKq[c.id] = k.dat ? 'dung' : 'sai';
            if (k.ly) this.beLyMay[c.id] = k.ly;
            rows.push(this.beDong(bai, c, k.dat, window.baiTap.goiX({ v: 1, t: text, l: 1, m: { d: k.dat ? 1 : 0, k: {}, q: {}, c: {}, s: [], n: k.ly || '' } })));
          }
          this.beLuu(rows);
        },

        // ── Câu mở `mo` (đợt 3, Task 6): Gemini chấm NGAY từng câu qua POST /api/cham-mo; câu mẫu hiện sau lượt chấm đầu; tự kiểm khi hết lượt / lỗi ─────────────
        // Trạng thái `beMoS[idCâu]` (BE_MO0). Worker đếm lượt + ghi sổ + ⭐; trang chỉ đẩy `row` khi Worker báo ghi hỏng (`ghi: false`).
        beMoV(c) { if (!this.beMoS[c.id]) this.beMoS[c.id] = { ...BE_MO0 }; return this.beMoS[c.id]; },
        beMoR(c) { return this.beMoS[c.id] || BE_MO0; },
        beMoKhoa(c) { const S = this.beMoR(c); return S.tt === 'cho' || (S.tt === 'may' && S.dat); },
        beMoNhap(bai, c, v) { if (this.beMoKhoa(c)) return; this.beVao(bai); this.beMoV(c).text = v; },
        // Đã có lượt chấm: dòng của câu trong sổ ∪ đệm ∪ phiên, hoặc máy vừa kết luận → câu mẫu hiện (cả sau khi tải lại trang: Review Focus 3).
        beMoDaCham(c) { return this.beMoR(c).tt === 'may' || this.beLuot().some(a => a.i === c.id); },
        beMoHienMau(c) { return this.beMoDaCham(c) || this.beMoR(c).tt === 'tu'; },
        beMoTuTit(c) {
          const ly = this.beMoR(c).ly;
          return ly === 'het_cau' ? 'Hôm nay máy đã chấm câu này đủ lượt — con tự kiểm theo các ý dưới đây nhé'
            : ly === 'het_ngay' ? 'Hôm nay máy chấm đã hết lượt — con tự kiểm theo các ý dưới đây nhé'
            : ly === 'ngoai_tuyen' || ly === 'khoa' ? 'Chưa kết nối được máy chấm — con tự kiểm theo các ý dưới đây nhé'
            : 'Máy chấm đang bận — con tự kiểm theo các ý dưới đây nhé';
        },
        beClsMoKq(c) {
          const S = this.beMoR(c);
          return S.tt === 'may' ? (S.dat ? 'border-emerald-300 bg-emerald-50 text-emerald-900' : 'border-rose-300 bg-rose-50 text-rose-900')
            : S.tt === 'chan' ? 'border-amber-300 bg-amber-50 text-amber-900' : 'border-slate-200 bg-slate-50 text-slate-700';
        },
        // «Kiểm tra» của bài `mo`: câu có chữ → chặn tại trang (moChan) HOẶC gửi máy song song; câu đã đạt / chữ không đổi / hết lượt thì để nguyên.
        async beMoKiem(bai, ids) {
          const E = window.baiTapEsl, cs = this.beCauHien({ bai, ids }), gui = [];
          let trong = 0;
          for (const c of cs) {
            const S = this.beMoR(c), text = String(S.text || '').trim();
            if (E.chamCau(c, text, bai) === 'trong') { trong++; continue; }          // ô trống: không chấm, không ghi
            if (S.tt === 'cho' || (S.tt === 'may' && S.dat)) continue;                // đang chờ / đã đạt (khoá tới «Làm lại»)
            if (S.tt === 'tu' && BE_MO_HET.includes(S.ly)) continue;                  // hết lượt câu / hết ngày / máy không có câu: tự kiểm cả phiên
            if (S.tt && S.tt !== 'tu' && text === S.gui) continue;                   // chữ không đổi: kết luận cũ còn nguyên (không gọi lại, không ghi lại); `tu` (loi / khoa / ngoai_tuyen — mã hết lượt đã lọc ở trên) thì bấm lại là gọi lại
            const V = this.beMoV(c);
            V.gui = text; V.dat = false; V.ma = '';
            const ma = E.moChan(text, c.t);                                           // chặn TRƯỚC (một nguồn với Worker): chamCau trả cho_may cả câu ngắn
            if (ma) { V.tt = 'chan'; V.ma = ma; V.ly = BE_MO_CHAN[ma] || BE_LY_THAY; continue; }
            if (!this.secret || !this.online || navigator.onLine === false) { V.tt = 'tu'; V.ly = !this.online || navigator.onLine === false ? 'ngoai_tuyen' : 'khoa'; continue; }
            if (V.con === 0) { V.tt = 'tu'; V.ly = 'het_cau'; continue; }             // máy đã báo hết lượt hôm nay: khỏi gọi
            V.tt = 'cho'; V.ly = '';
            gui.push(c);
          }
          if (gui.length) {
            this.beBan[bai.id] = true;
            this.beFb[bai.id] = null;
            try { await Promise.all(gui.map(c => this.beMoGui(bai, c))); } finally { delete this.beBan[bai.id]; }
          }
          this.beMoTongKet(bai, cs, trong);
        },
        async beMoGui(bai, c) {
          const V = this.beMoV(c), text = Array.from(V.gui).slice(0, 300).join(''), ac = new AbortController(), han = setTimeout(() => ac.abort(), BE_CHO_MS);
          let r = null, d = null;
          try {
            r = await fetch('/api/cham-mo', {
              method: 'POST', signal: ac.signal,
              headers: { 'content-type': 'application/json', 'x-progress-key': this.secret },
              body: JSON.stringify({ user: this.user, course: this.course, i: c.id, text }),
            });
            d = await r.json().catch(() => null);
          } catch (e) { d = null; } finally { clearTimeout(han); }
          if (r && r.status === 401) {                                               // như beGuiThang: khoá sai thì xoá + báo (ô nhập mã hiện lại)
            this.secret = ''; localStorage.removeItem('lms_key'); window.dispatchEvent(new Event('lms-key'));
            V.tt = 'tu'; V.ly = 'khoa'; return;
          }
          if (r && r.ok && d && d.loai === 'may' && typeof d.dat === 'boolean') {
            V.tt = 'may'; V.dat = d.dat; V.ly = String(d.ly || '').slice(0, 200);
            V.con = Number.isInteger(d.con) ? d.con : null;
            const g = Number.isInteger(d.g) && d.g >= 0 && d.g <= 3 ? d.g : window.baiTapEsl.gCau(d.dat, this.beTungSai(c.id));
            if (d.ghi === false && d.row && typeof d.row === 'object') this.beLuu([d.row]);   // Worker ghi hỏng: trang tự đẩy qua /api/study (đúng MỘT lần: chữ không đổi thì không gửi lại)
            else { this.beRows.push({ i: c.id, c: c.kt || bai.kt, g, ts: Math.floor(Date.now() / 1000) }); this.beTinh(); }
            if (Number(d.cong) > 0 && window.baoDiem) window.baoDiem(Number(d.cong));
            return;
          }
          if (r && r.ok && d && d.loai === 'chan') { V.tt = 'chan'; V.ma = String(d.ma || ''); V.ly = BE_MO_CHAN[d.ma] || BE_LY_THAY; return; }   // Worker chặn (vd lệnh): như chặn tại trang
          V.tt = 'tu'; V.ly = d && d.loai === 'tu' && BE_LY_TU.includes(d.ly) ? d.ly : 'loi';      // het_cau · het_ngay · khong_co · loi; mạng / quá hạn / lạ → loi (thoáng qua)
          if (d && d.ly === 'het_cau') V.con = 0;
        },
        // Lời nhắc cấp bài: chỉ câu MÁY đã kết luận đếm vào «Đúng d/n»; chặn / tự kiểm / chờ thì không.
        beMoTongKet(bai, cs, trong) {
          const may = cs.filter(c => this.beMoR(c).tt === 'may'), dung = may.filter(c => this.beMoR(c).dat).length;
          const khac = cs.filter(c => ['tu', 'chan'].includes(this.beMoR(c).tt)).length;
          const con = trong ? 'Còn ' + trong + ' ' + BE_CON.mo + ' — viết rồi bấm Kiểm tra tiếp.' : '';
          const xem = khac ? 'Xem lời nhắc dưới từng câu.' : '';
          if (!may.length) { this.beFb[bai.id] = { loai: 'warn', tin: [xem, con].filter(Boolean).join(' ') || 'Con chưa viết gì — viết rồi bấm Kiểm tra.' }; return; }
          if (dung === may.length && may.length === cs.length) { this.beFb[bai.id] = { loai: 'ok', tin: '✓ Đúng hết rồi!' }; return; }
          const sai = may.length - dung;
          this.beFb[bai.id] = { loai: sai ? 'bad' : 'warn', tin: ['Đúng ' + dung + '/' + may.length + '.', sai ? 'Câu chưa đạt: đọc lời nhắc, sửa rồi bấm Kiểm tra lại.' : '', xem, con].filter(Boolean).join(' ') };
        },

        // ── Bài viết (Gemini nhận xét; lỗi → con tự kiểm theo tiêu chí) ───────────────────────────────────────────────────
        beVV(c) { if (!this.beV[c.id]) this.beV[c.id] = { ...BE_V0, tick: [] }; return this.beV[c.id]; },
        beVR(c) { return this.beV[c.id] || BE_V0; },
        beDem(bai, c) {
          const n = window.baiTapEsl.demTu(this.beVR(c).text), r = bai.so_tu || [0, 0];   // CHÍNH phép đếm của tiêu chí độ dài ở /api/cham-viet (worker/cham_viet.js)
          return n + ' / ' + r[0] + '–' + r[1] + ' từ';
        },
        beVietNhap(bai, c, v) { const V = this.beVV(c); if (V.tt === 'cho' || V.dat) return; this.beVao(bai); V.text = v; },
        beNhanTc(bai, ma) { const i = (bai.tu_kiem_ma || []).indexOf(ma); return i < 0 ? '(tiêu chí cũ)' : window.baiTap.nhanTieuChi((bai.tu_kiem || [])[i]); },
        beVietTit(c) { const V = this.beVR(c), k = V.kq; if (!k) return ''; return V.dat ? '✅ Đạt — đủ cả ' + k.tc.length + ' ý' : '🟡 Gần được rồi — còn thiếu ' + k.tc.filter(t => !t.dat).length + ' ý'; },
        beVietChan(c) { const V = this.beVR(c); return V.dat ? '🤖 Máy chấm (Gemini) · ghi sổ: đạt' : '🤖 Máy chấm (Gemini) · có thể nhầm — bố mẹ sẽ xem lại' + (V.con === null ? '' : ' · còn ' + V.con + ' lượt chấm câu này hôm nay'); },
        beTuTit(c) { const ly = this.beVR(c).ly; return ly === 'het_cau' ? 'Hôm nay máy đã chấm câu này đủ lượt — con tự kiểm nhé' : ly === 'ngoai_tuyen' || ly === 'khoa' ? 'Chưa kết nối được máy chấm — con tự kiểm nhé' : 'Máy chấm đang bận — con tự kiểm nhé'; },
        beVietTick(c, i, v) { const V = this.beVV(c); const a = [...V.tick]; a[i] = !!v; V.tick = a; },
        // Đang tự kiểm vì lỗi THOÁNG QUA (loi · ngoai_tuyen) mà con đã SỬA chữ và máy gọi được → gửi máy lại được (như Math: BT_LY_THOANG). Hết lượt / hết ngày / lệnh / chưa khoá thì không.
        beVietThoang(c) {
          const V = this.beVR(c);
          return V.tt === 'tu' && BE_LY_THOANG.includes(V.ly) && String(V.text || '').trim() !== V.gui && !!this.secret && !!this.online && navigator.onLine !== false;
        },
        beVietKhoaGui(c) { const V = this.beVR(c); return V.tt === 'cho' || !!V.dat || (V.tt === 'tu' && !this.beVietThoang(c)); },
        async beVietGui(bai, c) {
          const V = this.beVV(c), text = String(V.text || '').trim(), rid = c.rid || c.id;       // `rid`: id THẬT khi `c` là bản sao của ③ / ④
          if (V.tt === 'cho' || V.dat) return;
          if (text.length < 15) { this.beFb[bai.id] = { loai: 'warn', tin: 'Viết ít nhất một câu rồi bấm gửi.' }; return; }
          this.beFb[bai.id] = null;
          this.beVao(bai);
          if (V.tt === 'tu') {
            if (!this.beVietThoang(c)) return;                                       // đang tự kiểm (lỗi không thoáng qua / chưa sửa chữ): dùng nút «Xong»
            V.tt = null; V.ly = ''; V.tuKq = null;                                   // thử máy lại
          }
          V.gui = text;
          if (!this.secret || !this.online || navigator.onLine === false) {           // không gọi được máy: mở danh sách tự kiểm, chưa ghi gì
            V.tt = 'tu'; V.ly = !this.online ? 'ngoai_tuyen' : 'khoa'; V.tick = (bai.tu_kiem || []).map(() => false); return;
          }
          V.tt = 'cho'; V.ly = '';
          const ms = Math.max(0, Date.now() - (BE.t0.get(bai.id) || Date.now())), ac = new AbortController(), han = setTimeout(() => ac.abort(), BE_CHO_MS);
          let r = null, d = null;
          try {
            r = await fetch('/api/cham-viet', {
              method: 'POST', signal: ac.signal,
              headers: { 'content-type': 'application/json', 'x-progress-key': this.secret },
              body: JSON.stringify({ user: this.user, course: this.course, i: rid, text, lan: V.luot + 1, ms, xem_mau: false, goi_y: false }),
            });
            d = await r.json();
          } catch (e) { d = null; } finally { clearTimeout(han); }
          const may = !!d && r.ok && d.loai === 'may' && typeof d.dat === 'boolean' && Array.isArray(d.tc) && Array.isArray(d.so_sai);
          if (may) {
            const ch = (v) => (typeof v === 'string' ? v : '');
            V.kq = {
              tc: d.tc.filter(t => t && typeof t === 'object').map(t => ({ ma: ch(t.ma), dat: t.dat === true, trich: ch(t.trich), ghi: ch(t.ghi) })),
              so_sai: d.so_sai.filter(e => e && typeof e === 'object').map(e => ({ trich: ch(e.trich), goi_y: ch(e.goi_y) })),
              nx: ch(d.nx),
            };
            V.tt = 'may'; V.dat = d.dat; V.con = Number.isInteger(d.con) ? d.con : null;
            V.luot = Math.max(V.luot + 1, Number(d.lan) || 0);
            const g = Number.isInteger(d.g) && d.g >= 0 && d.g <= 3 ? d.g : window.baiTap.gViet({ dat: d.dat, lan: V.luot });
            if (d.ghi === false && d.row && typeof d.row === 'object') this.beLuu([d.row]);   // Worker ghi hỏng: trang tự đẩy qua /api/study
            else { this.beRows.push({ i: rid, c: c.kt || bai.kt, g, ts: Math.floor(Date.now() / 1000) }); this.beTinh(); }
            if (Number(d.cong) > 0 && window.baoDiem) window.baoDiem(Number(d.cong));
          } else {
            V.tt = 'tu'; V.tuKq = null;
            V.ly = r && r.status === 401 ? 'khoa' : (d && d.loai === 'tu' && BE_LY_TU.includes(d.ly) ? d.ly : 'loi');
            V.tick = (bai.tu_kiem || []).map(() => false);
          }
        },
        // Tự kiểm xong: ghi MỘT dòng (đạt khi tick đủ); chưa đạt thì cho sửa chữ + tick lại, đúng rồi mới ghi thêm.
        beVietXong(bai, c) {
          const V = this.beVV(c), B = window.baiTap, text = String(V.text || '').trim();
          const dungHet = (bai.tu_kiem || []).length > 0 && (bai.tu_kiem || []).every((_, i) => V.tick[i]);
          const lan = V.luot + 1, g = B.gViet({ dat: dungHet, lan });
          V.tuKq = dungHet ? 'dung' : 'sai';
          if (V.daGhi && !dungHet) return;
          if (V.daGhi === 'dung') return;
          V.luot = lan; V.daGhi = dungHet ? 'dung' : true;
          if (dungHet) V.dat = true;
          const tk = {};
          (bai.tu_kiem_ma || []).forEach((ma, i) => { tk[ma] = V.tick[i] ? 1 : 0; });
          this.beLuu([{ i: c.rid || c.id, c: c.kt || bai.kt, ok: g >= 2 ? 1 : 0, g, ms: Math.max(0, Date.now() - (BE.t0.get(bai.id) || Date.now())),
                        x: B.goiX({ v: 1, t: text, l: lan, tk, ly: V.ly || 'loi' }), t: Math.floor(Date.now() / 1000) }]);
        },

        // ══ Đề: ① «Bước 2» · ③ làm trọn đề · ④ kết quả (Task A8) ═══════════════════════════════════════════════════════════════════
        // localStorage (theo học sinh + id đề THẬT): `lms_be_do:<user>:<DE.id>` = bài đang làm {v, ts, t0, tl: {idCâu: trảLời}, nham: {idBài: {chỉ số chữ: chữ gõ}}} (ghi mỗi lần đổi, xoá khi nộp);
        // `lms_be_kq:<user>:<DE.id>` = lần nộp gần nhất {v, ts, lan, kq: chamDe(…), tl, may: {idCâu: bool}, ly: {idCâu: lý do Gemini}, cho: [idCâu], viet: {idCâu: trạng thái bài viết}}.
        // Sổ: mỗi câu một dòng (c = kt, t = tsNop chung), thêm dòng tổng {i: DE.id, c: 'de', ok 0, g 0, x: JSON {v, de, ma, lan, tn: tsNop, diem: [[d, tối đa]…], cho: [id…]}}.
        // `tn` = tsNop NGUYÊN: D1 kẹp `ts` của dòng vào [now − 24 h, now] nên `ts` dòng tổng có thể ≠ tsNop, còn dòng câu chấm muộn mang `lu` = tsNop → khớp lượt bằng `tn` (chamMuon).
        beKyDo(de) { return 'lms_be_do:' + this.user + ':' + de.id; },

        beGhiLs(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* riêng tư / đầy */ } },

        // ── Lượt đã nộp (từ sổ + đệm + phiên) ────────────────────────────────────────────────────────────────────────────────────

        // Giờ nộp = `x.tn` nếu có (ts của dòng ở sổ có thể bị D1 kẹp, còn đệm / phiên giữ ts nguyên — cùng lượt thì `tn` bằng nhau), không thì `ts`.
        beTn(r) { return r && r.x && Number.isFinite(Number(r.x.tn)) && r.x.tn !== null && r.x.tn !== '' ? Number(r.x.tn) : (r ? r.ts : 0); },
        beDeRows(de) {
          const seen = new Set(), ra = [];
