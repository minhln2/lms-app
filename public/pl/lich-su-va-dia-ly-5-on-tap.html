          const r0 = sel.getRangeAt(0);
          const h = r0.commonAncestorContainer;
          const el = h.nodeType === 3 ? h.parentElement : h;
          // Chỉ bắt trong vùng nội dung: bôi đen ở ô tìm kiếm hay thanh chế độ
          // mà cũng hiện nút thì nút chắn mất đúng thứ người ta đang gõ.
          if (!el || !el.closest || !el.closest('[data-tra]')) return;
          // ⚠ PHẢI nhân bản. `getRangeAt(0)` trả về Range SỐNG của vùng
          // chọn, nên `setStart`/`setEnd` trong `_noRong` sửa thẳng vùng
          // người dùng ĐANG kéo — và thao tác đó chuẩn hoá chiều thành xuôi,
          // tức lật điểm focus từ đầu xuống cuối. Kéo xuôi vô hại (focus vốn
          // ở cuối); kéo NGƯỢC thì cú kéo tiếp theo tính từ chỗ khác và vùng
          // chọn co lại. Người dùng báo: "kéo từ trên xuống thì được, từ dưới
          // lên thì không".
          //
          // ⚠ Chuột mô phỏng chạy liền tay KHÔNG tái hiện được: handler chờ
          // 120ms sau cú di chuyển CUỐI (mỗi `mousemove` gọi `clearTimeout`),
          // nên nó chỉ chạy sau khi nhả chuột. Phải kéo có khựng >120ms giữa
          // chừng, đúng nhịp tay người. Đo được: nghỉ 25ms/bước → hai chiều
          // đều 370 ký tự; nghỉ 200ms/bước → xuống 370, LÊN CÒN 65.
          const r = this._noRong(r0.cloneRange());
          // Hai bản của cùng một đoạn, cố ý:
          //  · `text`  — đã dồn khoảng trắng, dùng để GỌI API, đo độ dài, tra
          //    glossary và làm khoá lịch sử. Giữ nguyên hành vi cũ.
          //  · `goc`   — giữ nguyên xuống dòng, chỉ để HIỆN LẠI cho người đọc.
          // Trước đây chỉ có bản dồn, nên bôi đen một khổ thơ hay một danh sách
          // thì popup hiện một dòng dài dính liền, không còn nhận ra là đã chọn
          // đúng chỗ nào.
          const goc = (r.toString() || '').replace(/[ \t]+\n/g, '\n')
                        .replace(/\n{3,}/g, '\n\n').trim();
          const text = (r.toString() || '').replace(/\s+/g, ' ').trim();
          // ⚠ 1000 ký tự phải KHỚP `MAX.text` trong `worker/lookup.js`. Hai
          // con số ở hai file, và lệch nhau thì hỏng lặng lẽ: trang cho hiện
          // nút, Worker cắt cụt đoạn, model giải thích một câu bị chặt giữa
          // chừng mà không ai biết. Đổi một chỗ thì đổi cả chỗ kia.
          if (!text || !/[A-Za-z]/.test(text) || text.length > 1000) return;
          const b = r.getBoundingClientRect();
          if (!b.width && !b.height) return;
          this._traDat({ text, goc, sent: this._cauChua(r, text), box: b, rg: r.cloneRange() });
        },

        /** Có gì để hiện trong popup không?

            ⚠ KHÔNG hỏi `!tra.data`. Máy chủ có thể trả về 200 kèm một object
            mà mọi trường đều rỗng; lúc đó `tra.data` là truthy nên dòng "Không
            tìm thấy nghĩa" bị ẩn, mà cũng chẳng nhánh nào vẽ ra gì — popup chỉ
            còn cái khung và một cái nút. Người dùng gửi ảnh chụp đúng cảnh đó
            và hỏi "sao ấn giải thích không được". Im lặng kiểu này tệ hơn báo
            lỗi: không ai biết nên thử lại hay đã hỏng. */
        traRong() {
          const d = this.tra.data;
          if (!d) return true;
          return !(d.nghia || d.dich || d.luu_y
                   || (d.phan || []).length || (d.tu_kho || []).length);
        },

        /** Khoá nhớ lựa chọn ngôn ngữ — RIÊNG từng môn. Trẻ học Science
            bằng tiếng Anh nhưng Lịch sử bằng tiếng Việt; một khoá chung là
            đổi ở môn này thì môn kia cũng đổi theo. */
        _nnKhoa() { return 'tra_nn:' + (this.course || 'chung'); },

        /** Ngôn ngữ giải thích đang dùng. Thứ tự: lựa chọn đã lưu của MÔN NÀY
            → mặc định do trang cung cấp (`traNgonNgu()`, thường là ngôn ngữ
            dạy của môn) → tiếng Việt. */
        // Ngôn ngữ DẠY của môn — cố định, khác `nnHienTai()` là lựa chọn của
        // người học. Trang nhúng có thể không định nghĩa `traNgonNgu()`
        // (trang môn không định nghĩa), nên mặc định là tiếng Việt.
        /** Tách "a. … b. …" / "1. … 2. …" viết liền thành từng dòng.
            Prompt đã dặn mỗi ý một dòng; đây là lưới phụ khi model quên.
            Người dùng gửi ảnh khối 'Trả lời' + 'Vì sao' của một câu hỏi hai ý:
            "a. Từ được lặp lại là từ 'Tre'. b. Việc lặp lại…" dồn một khối chữ.
            Chỉ tách khi các dấu ý chạy ĐÚNG THỨ TỰ từ a (hoặc 1) và có ≥2 dấu —
            một chữ "a." hay "5." lạc trong câu thì không đủ để tách.
            Đã có sẵn `\n` thì model đã tự xuống dòng, để nguyên. */
        traXuong(s) {
          s = String(s ?? '');
          if (!s || s.includes('\n')) return s;
          for (const [re, dau] of [[/(^|\s)([a-h])[.)]\s/g, 'a'], [/(^|\s)(\d{1,2})[.)]\s/g, '1']]) {
            const cho = []; let can = dau;
            for (const m of s.matchAll(re)) {
              if (m[2] !== can) continue;
              cho.push(m.index + m[1].length);
              can = dau === 'a' ? String.fromCharCode(can.charCodeAt(0) + 1) : String(+can + 1);
            }
            if (cho.length < 2) continue;
            let r = s;
            for (let i = cho.length - 1; i >= 0; i--) {
              // Bỏ cả dấu phẩy/chấm phẩy nối ý: '1. think, 2. have' → dòng 'think' chứ không 'think,'.
              if (cho[i] > 0) r = r.slice(0, cho[i]).replace(/[\s,;]+$/, '') + '\n' + r.slice(cho[i]);
            }
            return r;
          }
          return s;
        },
        traMonNn() { return (this.traNgonNgu ? this.traNgonNgu() : 'vi') === 'en' ? 'en' : 'vi'; },
        nnHienTai() {
          // ⚠ Môn dạy bằng tiếng Việt thì KHÔNG có lựa chọn — luôn tiếng Việt.
          // Chốt ở ĐÂY chứ không chỉ ẩn nút: lựa chọn cũ có thể đã nằm trong
          // localStorage từ trước (khoá theo môn, mà một môn có thể đổi ngôn
          // ngữ dạy), và đọc lại nó thì nút biến mất nhưng phần giải thích
          // vẫn ra tiếng Anh — hỏng theo kiểu không có cách nào sửa từ giao diện.
          if (this.traMonNn() !== 'en') return 'vi';
          if (this.nnTra) return this.nnTra;
          let luu = null;
          try { luu = localStorage.getItem(this._nnKhoa()); } catch (e) {}
          if (luu === 'vi' || luu === 'en') return (this.nnTra = luu);
          return (this.nnTra = 'en');
        },

        /** Đổi ngôn ngữ và HỎI LẠI ngay — đổi mà không tra lại thì người dùng
            phải tự đoán là phải bấm gì nữa. */
        doiNn(v) {
          if (this.nnHienTai() === v) return;
          this.nnTra = v;
          try { localStorage.setItem(this._nnKhoa(), v); } catch (e) {}
          this.tra.chat = [];
          if (this.tra.show) this.traMo(this.tra.mode);
        },

        /** Đoạn gốc có dài quá 2 dòng không — chỉ khi đó mới hiện nút mở.
            Đếm theo KÝ TỰ chứ không đo chiều cao thật: đo chiều cao phải chờ
            vẽ xong rồi đọc lại DOM, tức một vòng layout nữa cho mỗi lần mở
            popup, mà sai sót ở đây chỉ là thừa/thiếu một cái nút nhỏ. */
        get daiGoc() {
          const t = this.tra.goc || this.tra.text || '';
          return t.length > 110 || t.includes('\n') || this.sentThem;
        },

        /** Câu chứa đoạn bôi đen có thêm gì NGOÀI chính đoạn đó không.
            Bôi đen một từ thì câu chứa nó là ngữ cảnh đáng xem. Bôi đen cả đoạn
            thì "câu chứa" chính là đoạn ấy, bị dàn phẳng rồi cắt ở 300 ký tự —
            hiện ra là một khối chữ xám lặp lại đúng thứ vừa đọc ở trên (người
            dùng gửi ảnh). Vẫn GỬI lên API như cũ; chỉ không vẽ lại. */
        get sentThem() {
          const n = (x) => (x || '').replace(/\s+/g, ' ').trim();
          const c = n(this.tra.sent);
          return !!c && !n(this.tra.goc || this.tra.text).includes(c);
        },

        async traHoi() {
          if (this.micTT !== 'tat') this.micTat('dong');
          const q = (this.tra.hoi || '').trim();
          if (!q || this.tra.dangHoi || !this.traKhoa()) return;
          this.tra.chat.push({ ai: 'em', noi: q });
          this.tra.hoi = ''; this.tra.dangHoi = true;
          try {
            const r = await fetch('/api/lookup', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-progress-key': this.traKhoa() },
              // Gửi kèm ĐOẠN GỐC và lịch sử: Worker không giữ trạng thái, cùng
              // lý do đã buộc `ctx` phải do trình duyệt gửi lên.
              body: JSON.stringify({
                mode: 'chat', text: this.tra.text, sent: this.tra.sent,
                ctx: this._traCtx(), hoi: q, nn: this.nnHienTai(),
                mon_nn: this.traMonNn(),
                // Bỏ lượt vừa đẩy vào — nó chính là `hoi`.
                lich_su: this.tra.chat.slice(0, -1).slice(-6),
                user: this.user, course: this.course, sec: this.traSec(),
              }),
            });
            const b = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(b.error || ('HTTP ' + r.status));
            const t = (b.data && b.data.tra_loi) || '';
            // Trả về rỗng cũng phải NÓI RA, đừng đẩy một bong bóng trắng vào
            // cuộc trò chuyện — cùng bài học với `traRong()`.
            this.tra.chat.push({ ai: 'gs', noi: t || 'Chưa trả lời được câu này.' });
          } catch (e) {
            console.warn('hỏi tiếp hỏng:', String(e.message || e));
            this.tra.chat.push({ ai: 'gs', noi: 'Chưa trả lời được lúc này, thử lại sau nhé.' });
          }
          this.tra.dangHoi = false;
        },

        async traMo(mode) {
          if (mode) this.tra.mode = mode;
          this.tra.show = true; this.tra.btn = null;
          this.tra.chat = []; this.tra.hoi = ''; this.tra.dangHoi = false;
          this.moGoc = false;
          this.tra.err = ''; this.tra.ly_do = ''; this.tra.data = null; this.tra.loading = true;
          // Trang có thể cần nạp học liệu trước (trang môn nạp LƯỜI, vì file
          // study JSON tới ~200KB và phần lớn lượt vào trang môn không tra từ nào).
          if (this.traSanSang) { try { await this.traSanSang(); } catch (e) {} }
          if (!this.traKhoa()) {                      // chế độ chỉ đọc, không gọi API
            this.tra.data = this._traOffline(); this.tra.loading = false; return;
          }
          // Có nhận được phản hồi HTTP hay không — dùng để nói ĐÚNG LOẠI trục
          // trặc. Ném từ `fetch` là hỏng mạng; phản hồi không ok là dịch vụ lỗi.
          let coPhanHoi = false;
          try {
            const r = await fetch('/api/lookup', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-progress-key': this.traKhoa() },
              // `user`/`course`/`sec` chỉ để ghi dòng lịch sử trong D1 — Worker
              // KHÔNG đưa chúng vào prompt gửi Google (test_lookup_route chốt).
              body: JSON.stringify({ mode: this.tra.mode, text: this.tra.text,
                                     sent: this.tra.sent, ctx: this._traCtx(),
                                     nn: this.nnHienTai(),
                                     mon_nn: this.traMonNn(),
                                     user: this.user, course: this.course, sec: this.traSec() }),
            });
            coPhanHoi = true;
            const b = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(b.error || ('HTTP ' + r.status));
            this.tra.data = b.data;
          } catch (e) {
            // Lùi về glossary có sẵn. Chỉ báo lỗi khi lùi cũng không ra gì.
            this.tra.data = this._traOffline();
            // Hai yêu cầu kéo ngược nhau, và cả hai đều đúng:
            //  · đừng chìa câu lỗi kỹ thuật ("Gemini lỗi 412") ra cho một đứa trẻ;
            //  · đừng nói cứng "không có mạng" khi mạng vẫn tốt — nói sai lý do
            //    còn tệ hơn không nói, vì người ta đi kiểm wifi thay vì kiểm dịch vụ.
            // Giải bằng cách tách: hiện đúng LOẠI trục trặc bằng lời thường, còn
            // nguyên văn thì đẩy ra console cho người lớn soi.
            this.tra.ly_do = coPhanHoi ? 'tra cứu đang bận' : 'chưa có mạng';
            console.warn('tra cứu hỏng:', String(e.message || e));
            if (!this.tra.data) this.tra.err = 'Chưa tra được lúc này, thử lại sau nhé.';
          }
          this.tra.loading = false;
        },

        /** Đang có chữ được bôi đen? Thẻ ghi nhớ và ô đáp án là thẻ BẤM ĐƯỢC
            bọc quanh chính phần chữ, nên kéo chọn trên đó sẽ lật thẻ lộ đáp án —
            tức bôi đen để tra từ lại phá mất bài đang làm. */
        dangBoiDen() {
          const s = window.getSelection();
          return !!(s && !s.isCollapsed && (s.toString() || '').trim());
        },

        /** Đăng ký nghe vùng chọn. Trang phải TỰ GỌI (trong `init()` hoặc
            `x-init`) — để trong macro mà không gọi thì mọi thứ khác đều dựng
            đúng, nút chỉ đơn giản không bao giờ hiện, và không có lỗi nào. */
        // Nắn vùng chọn NHÌN THẤY ra biên từ. Trẻ kéo chuột hay thừa/thiếu
        // vài ký tự ở hai đầu; nắn ra cả từ thì đỡ hẳn thao tác lại.
        //
        // ⚠ CHỈ chạy lúc NHẢ chuột, tuyệt đối không giữa lúc kéo. Sửa vùng
        // chọn đang kéo làm nó chuẩn hoá chiều thành xuôi, tức lật điểm focus
        // — đó đúng là lỗi "kéo chậm từ dưới lên thì mất vùng chọn" đã phải
        // sửa bằng `cloneRange()`. Ở đây cú kéo đã xong nên đổi chiều vô hại.
        //
        // ⚠ `setTimeout(…, 0)`: để trình duyệt xử lý xong vùng chọn của chính
        // nó rồi mới đụng vào.
        //
        // ⚠ Không đổi gì thì ĐỪNG gọi `addRange`: mỗi lần gọi là một lượt
        // `selectionchange`, kéo theo một lượt `chonDoi()` vô ích.
        nanBienTu() {
          const sel = window.getSelection();
          if (!sel || sel.isCollapsed || !sel.rangeCount) return;
          const r0 = sel.getRangeAt(0);
          const h = r0.commonAncestorContainer;
          const el = h.nodeType === 3 ? h.parentElement : h;
          if (!el || !el.closest || !el.closest('[data-tra]')) return;
          const r = this._noRong(r0.cloneRange());
          if (r.startContainer === r0.startContainer && r.startOffset === r0.startOffset
              && r.endContainer === r0.endContainer && r.endOffset === r0.endOffset) return;
          try { sel.removeAllRanges(); sel.addRange(r); } catch (e) { /* bỏ qua */ }
        },

        traGan() {
          if (typeof document === 'undefined' || this._traDaGan) return;
          this._traDaGan = true;
          for (const ev of ['mouseup', 'touchend']) {
            document.addEventListener(ev, () => setTimeout(() => this.nanBienTu(), 0));
          }
          let hen = null;
          // Gộp nhịp 120ms: kéo chọn trên điện thoại bắn hàng chục lượt mỗi giây.
          // `selectionchange` bắn trên `document` và KHÔNG nổi lên window ở mọi
          // trình duyệt, nên đừng thay bằng @selectionchange.window.
          document.addEventListener('selectionchange', () => {
            clearTimeout(hen);
            hen = setTimeout(() => this.chonDoi(), 120);
          });
        },

        /** Đóng popup và TRẢ LẠI nút 🔎 cho chỗ vừa chọn.

            Trước đây đóng xong là nút biến mất, muốn xem lại phải bôi đen lại
            từ đầu. Cú bấm để đóng (dù vào ✕ hay ra nền) tự xoá vùng chọn, nên
            chỉ gọi `chonDoi()` thôi thì không đủ — phải ĐẶT LẠI vùng chọn đã
            nhớ ở `chonDoi()` rồi mới tính lại vị trí nút. */
        traDong() {
          this.micTat('dong'); this.micLoi = '';
          this.tra.tuDo = false; this.tra.cau = '';
          this.tra.show = false; this.tra.btn = null; this.tra.data = null;
          this.tra.err = ''; this.tra.ly_do = '';
          this.tra.chat = []; this.tra.hoi = ''; this.moGoc = false;
          // ⚠ Chụp lại TRƯỚC khi xoá. Xoá `_traVung` ở đây rồi mới hỏi
          // `this._traVung` trong `setTimeout` bên dưới thì nhánh khôi phục
          // không bao giờ chạy — nút 🔎 mất hẳn sau khi đóng popup. Cùng lý do
          // `rg` được chụp thành biến cục bộ.
          const rg = this._traRg;
          const vung = this._traVung;
          this._traVung = null;
          setTimeout(() => {
            if (rg) {
              try {
                const s = window.getSelection();
                s.removeAllRanges(); s.addRange(rg);
              } catch (e) { return; }
              this.chonDoi();
            } else if (vung && this.traVungDong) {
              // Vùng KÉO không có Range nào để đặt lại (các ký tự được chọn
              // không liền mạch trong DOM), nên trang nhúng tự quyết đóng xong
              // làm gì. Xem `traVungDong()` trong `docview.html`.
              this.traVungDong();
            }
          }, 0);
        },


      /** 🖍 BÚT — "BẮT DÒNG THEO CỘT rồi KHOÁ" (2026-09-25, người dùng duyệt sau khi thu 12
       *  nét THẬT bằng `?soinet=1`; luật "bắt dòng rồi bám" trước đó đúng 7/12, luật này
       *  12/12 — `tests/test_but_net_that.py`). Máy trạng thái trên toạ độ TRANG; `buoc` =
       *  trung vị bước dòng của trang; LÕI dòng = ±0,3·buoc quanh tâm dòng.
       *   · VÙNG CHỮ: mỗi dòng tách thành KHÚC ở khe rộng > 1,5·buoc (hai cột đứng ngang
       *     nhau bị gộp chung một hàng). Điểm ở trong một khúc (bề ngang) và cách tâm dòng
       *     ≤ 1·buoc là ở vùng chữ. Lề, khe giữa hai cột, hình: KHÔNG dùng để chọn dòng.
       *   · BẮT (chỉ xét các dòng của CỘT bút đang ở):
       *     – chuột/bút cảm ứng: ngay lúc vào vùng chữ, theo dòng gần nhất với độ cao lúc
       *       BẤM (lần bắt đầu tiên — người dùng đặt con trỏ ngang dòng ở lề rồi kéo vào;
       *       TV5 tr.126 nét 1 tay trôi xuống trước khi tới chữ). Nằm ở dải 30% giữa khe
       *       hai dòng thì chờ như ngón tay;
       *     – ngón tay: đi ngang 2·buoc trong vùng chữ rồi lấy TRUNG VỊ độ cao (chỗ đặt
       *       ngón lệch nhất — tr.90 nét 2). Trong lúc chờ: tô TẠM dòng gần trung vị; chữ đi
       *       qua được tô bù. Đi dọc > 1·buoc trước khi đủ ngang → nét DỐC: không khoá.
       *   · KHOÁ: góc chung của nét (từ chỗ bắt) ≤ 20° và đã đi ≥ 2·buoc → không chuyển
       *     dòng, không tô cắt lõi. Bỏ luật "trôi lâu thì chuyển" (hai ca sai: tr.126 nét 3,
       *     tr.82 nét 5). Chưa khoá: chuyển sang dòng E cùng cột khi vào LÕI của E, đã rời
       *     dải dòng cũ, và từ lần cuối trong lõi cũ dịch dọc ≥ ½ dịch ngang (cố ý).
       *   · SANG CỘT KHÁC (vào vùng chữ mà không khúc nào chồng bề ngang với khúc đang
       *     bám): nhả dòng, bắt lại từ đầu; phần đã tô giữ nguyên (người dùng: nét vắt sang
       *     cột bên kia thì bôi cả cột đó — tr.87, tr.88).
       *   · TÔ (a) NGANG: đoạn bám một dòng mà đi NGANG (dịch dọc ≤ 0,4·dịch ngang, hoặc dài
       *     ≥ 2·buoc) phủ tới NỬA GIỮA từ nào thì tô từ đó.
       *   · TÔ (b) CẮT LÕI (chỉ khi KHÔNG khoá): đoạn nét trong lõi đủ SÂU và DỐC → xem `_butCat`.
       *   · ZÍC-ZẮC (2026-09-26, nét 13): đang bám dòng mà QUAY ĐẦU (`_butQuay`) → từ đó bỏ
       *     máy trạng thái trên, mỗi LƯỢT ngang là một dòng (không bao giờ hai — người dùng
       *     chốt), tô trọn bề ngang lượt. Khoá đo góc từ chỗ bắt nên lượt quay về ở dòng dưới
       *     vẫn "≤ 20°" và bị giữ ở dòng cũ: tô 4 dòng được 2.
       *     Dòng của lượt = BÁM ĐẦU LƯỢT (2026-09-27, `_butLuotDiem`/`_butLuotChon`): 2·buoc
       *     đầu tiên trong vùng chữ; dòng đã tô nhường dòng chưa tô gần ≤ 0,8·buoc. Trung vị
       *     CẢ lượt thì đoạn chéo lúc chuyển dòng kéo lệch (tr.84: lọt dòng 8 hai lần).
       *  Đã tô là giữ; xem trước theo từng từ; ↶ bỏ đúng nét vừa tô. Chạm theo Ô chữ của lớp
       *  chữ (chữ nhìn thấy là ẢNH). Hình học đo MỘT lần lúc đặt bút, ở `kh._but` (không để
       *  vào state của Alpine). */
      /** Vùng của từ (el/er) theo hàng + bước dòng. `tu`: {hang, l, r, h}; `tam[hang]`. Trả `buoc`. */
      _butChuan(tu, tam) {
        const kc = [], cao = tu.map((w) => w.h).sort((a, b) => a - b), ds0 = tam.map((c, j) => [j, c]).filter((v) => v[1] !== undefined);
        for (let j = 1; j < ds0.length; j++) { const d = ds0[j][1] - ds0[j - 1][1]; if (d > 0.5) kc.push(d); }
        kc.sort((a, b) => a - b);
        // Vùng của từ cho luật CẮT LÕI: tới nửa khoảng trắng với từ kề bên trong cùng hàng
        // (trần một chiều cao dòng — không vươn qua khe giữa hai cột). Phía KHÔNG có từ kề
        // (đầu/cuối dòng) chỉ nới NỬA khoảng trắng giữa các từ của dòng (trung vị): bên
        // trái từ đầu dòng là phần THỤT đầu dòng, không phải khoảng trắng giữa hai từ —
        // nới cả chiều cao dòng thì nét chéo neo ở chỗ thụt (LS&ĐL tr.10 "Quốc ca") tô luôn
        // từ đầu dòng khi chưa kéo tới nó.
        const theoHang = new Map();
        tu.forEach((w, n) => { if (!theoHang.has(w.hang)) theoHang.set(w.hang, []); theoHang.get(w.hang).push(n); });
        for (const ds of theoHang.values()) {
          ds.sort((a, b) => tu[a].l - tu[b].l);
          const khe = ds.slice(1).map((n, k) => tu[n].l - tu[ds[k]].r).filter((g) => g > 0).sort((a, b) => a - b);
          ds.forEach((n, k) => {
            const w = tu[n], tr = k ? tu[ds[k - 1]] : null, sau = k + 1 < ds.length ? tu[ds[k + 1]] : null;
            const nua = (khe.length ? khe[khe.length >> 1] : 0.3 * w.h) / 2;
            w.el = tr ? Math.max((tr.r + w.l) / 2, w.l - w.h) : w.l - nua;
            w.er = sau ? Math.min((w.r + sau.l) / 2, w.r + w.h) : w.r + nua;
          });
        }
        return kc.length ? kc[kc.length >> 1] : 1.8 * (cao.length ? cao[cao.length >> 1] : 16);
      },
      /** Trạng thái nét từ hình học THUẦN (từ: hang, l, r, gl, gr, el, er; `tam[hang]`) —
       *  tách khỏi DOM để chạy lại nét thật trong test. `kieu`: pointerType. */
      _butHinh(tu, tam, buoc, kieu) {
        const theoHang = new Map();
        tu.forEach((w, n) => { if (!theoHang.has(w.hang)) theoHang.set(w.hang, []); theoHang.get(w.hang).push(n); });
        // KHÚC: dòng tách ở khe THẬT giữa hai từ > 1,5·buoc (khoảng trắng giữa hai từ, kể cả
        // dòng dàn đều, dưới 1·buoc; khe giữa hai cột ~2·buoc — LS&ĐL tr.88).
        const khuc = [];
        for (const [h, ds] of theoHang) {
          let a = null, tr = null;
          for (const n of [...ds].sort((p, q) => tu[p].l - tu[q].l)) {
            const w = tu[n];
            if (tr && w.l - tr.r > 1.5 * buoc) a = null;
            if (!a) { a = { h, l: w.el, r: w.er }; khuc.push(a); }
            a.r = Math.max(a.r, w.er); tr = w;
          }
        }
        return { tu, tam, buoc, theoHang, khuc, chinhXac: kieu === 'mouse' || kieu === 'pen',
                 dong: null, lan: 0, gom: [], ug: [], x0: null, y0: null, O: null, moc: null, tt: null,
                 hop: null, doan: new Map(), vao: new Map(), catTo: new Set(), catCho: new Set(), prev: null, kq: new Set(), khoa: '',
                 dinh: null, chieu: 0, sau: [], zz: false, luot: [], lg: null };
      },
      /** Máy trạng thái bút trên toạ độ TRANG (xem khối chú thích ở `_butBatDau`). Bước
       *  dài (chuột vắt một bước qua cả dòng, máy bận) chia nhỏ ≤ ½·buoc — không thì điểm
       *  rơi hết ra ngoài vùng chữ và không bắt được gì. */
      _butDiem(B, x, y) {
        const p = B.prev;
        if (p) {
          const n = Math.ceil(Math.hypot(x - p.x, y - p.y) / (0.5 * B.buoc));
          for (let k = 1; k < n; k++) this._butBuoc(B, p.x + (x - p.x) * k / n, p.y + (y - p.y) * k / n);
        }
        this._butBuoc(B, x, y);
        const khoaKq = [...B.kq].sort((a, b) => a - b).join(',');
        if (khoaKq === B.khoa) return false;
        B.khoa = khoaKq;
        return true;
      },
      _butBuoc(B, x, y) {
        const { tam, buoc, khuc } = B, prev = B.prev;
        // Vùng chữ: khúc nới một bước dòng mỗi đầu (dòng THỤT đầu đoạn vẫn là ứng viên khi
        // bút ở chỗ thụt — không thì bắt nhầm dòng dưới, dòng bắt đầu xa hơn về bên trái).
        const ung = (xx, yy) => khuc.filter((k) => k.l - buoc <= xx && xx <= k.r + buoc && Math.abs(tam[k.h] - yy) <= buoc);
        const cot = (a, b) => Math.min(a.r, b.r) > Math.max(a.l, b.l);
        const gan = (ks, yy) => ks.reduce((m, k) => (!m || Math.abs(tam[k.h] - yy) < Math.abs(tam[m.h] - yy) ? k : m), null);
        const loi = (h) => [tam[h] - 0.3 * buoc, tam[h] + 0.3 * buoc];
        const trungVi = (a) => { const s = [...a].sort((u, v) => u - v); return s[s.length >> 1]; };
        const moDoan = (h, d) => { if (!B.doan.has(h)) B.doan.set(h, []); B.doan.get(h).push(d); };
        const chot = (k, x0, x1, O, doc) => {
          B.lan++; B.dong = k; B.O = O; B.moc = { x, y };
          // Đoạn tô tính cả quãng từ lúc đặt bút / sang cột (độ cao thật): kéo chếch từ chỗ
          // thụt xuống dòng dưới là nét DỐC ngắn, không phải nét ngang (LS&ĐL tr.10).
          const y0 = Math.min(B.hop.y0, y), y1 = Math.max(B.hop.y1, y), dai = (yy) => Math.abs(yy - tam[k.h]) <= 0.5 * buoc;
          moDoan(k.h, [x0, y0, x1, y1, false, ...(dai(y0) && dai(y1) ? [x0, x1, y0, y1] : dai(y) ? [x, x, y, y] : [null, null, null, null])]);
          if (doc) for (const n of B.catCho) B.catTo.add(n);
          B.catCho = new Set(); B.gom = []; B.ug = []; B.tt = null;
        };
        if (B.zz) {                                               // ZÍC-ZẮC: mỗi lượt một dòng
          const s = this._butQuay(B, x, y);
          if (s) { this._butLuot(B, B.luot.slice(0, B.luot.length - s.length + 1), true); this._butLuotMoi(B, s); }
          else { B.luot.push({ x, y }); this._butLuotDiem(B, x, y); }
          B.prev = { x, y };
          B.kq = this._butKq(B, x, y);
          return;
        }
        if (B.x0 === null) { B.x0 = x; B.y0 = y; B.hop = { y0: y, y1: y }; }
        B.hop.y0 = Math.min(B.hop.y0, y); B.hop.y1 = Math.max(B.hop.y1, y);
        const C = ung(x, y);
        if (B.dong && C.length && !C.some((k) => cot(k, B.dong))) {   // sang cột khác
          B.dong = null; B.x0 = prev.x; B.hop = { y0: Math.min(prev.y, y), y1: Math.max(prev.y, y) }; B.vao.clear();
        }
        let khoa = false;
        if (!B.dong) {                                            // BẮT
          if (C.length) {
            if (B.gom.length && !C.some((k) => B.ug.some((q) => cot(k, q)))) { B.gom = []; B.ug = []; B.x0 = prev.x; }
            B.gom.push({ x, y });
            for (const k of C) if (!B.ug.includes(k)) B.ug.push(k);
            const g = B.gom, xs = g.map((q) => q.x), ys = g.map((q) => q.y);
            const x0 = Math.min(B.x0, ...xs), xMax = Math.max(...xs);
            B.tt = { k: gan(B.ug, trungVi(ys)), x0, x1: xMax };
            if (B.chinhXac && g.length === 1) {
              const tim = (yy) => khuc.filter((k) => k.l - buoc <= x && x <= k.r + buoc && Math.abs(tam[k.h] - yy) <= buoc);
              let yb = B.lan ? y : B.y0, ks = tim(yb);
              if (!ks.length) { yb = y; ks = C; }
              const tr = ks.map((k) => tam[k.h]).filter((c) => c <= yb), du = ks.map((k) => tam[k.h]).filter((c) => c > yb);
              const moHo = tr.length && du.length
                && Math.abs(yb - (Math.max(...tr) + Math.min(...du)) / 2) <= 0.15 * (Math.min(...du) - Math.max(...tr));
              if (!moHo) chot(gan(ks, yb), x0, x, { x, y: yb }, false);
              else { B.ug = ks; g[0] = { x, y: yb }; }
            } else if (Math.max(...ys) - Math.min(...ys) > buoc) chot(gan(C, y), x0, xMax, g[0], true);
            else if (xMax - Math.min(...xs) >= 2 * buoc) chot(B.tt.k, x0, xMax, g[0], false);
          }
        } else {                                                  // BÁM
          const dx = Math.abs(x - B.O.x);
          khoa = dx >= 2 * buoc && Math.abs(y - B.O.y) <= Math.tan(Math.PI / 9) * dx;   // ≤ 20°
          const j = gan(C.filter((k) => cot(k, B.dong)), y);
          if (!khoa && j && j.h !== B.dong.h) {
            const [lt, lb] = loi(j.h);
            if (y >= lt && y <= lb && Math.abs(y - tam[B.dong.h]) > 0.5 * buoc
                && Math.abs(y - B.moc.y) >= Math.tan(Math.PI / 9) * Math.abs(x - B.moc.x)) {   // dốc hơn ngưỡng khoá
              B.dong = j; B.O = { x, y }; moDoan(j.h, [x, y, x, y, false, x, x, y, y]);
            }
          }
          const [l0, b0] = loi(B.dong.h);
          if (y >= l0 && y <= b0) B.moc = { x, y };
          const d = B.doan.get(B.dong.h).at(-1);
          d[0] = Math.min(d[0], x); d[2] = Math.max(d[2], x); d[1] = Math.min(d[1], y); d[3] = Math.max(d[3], y);
          if (khoa) d[4] = true;
          if (Math.abs(y - tam[B.dong.h]) <= 0.5 * buoc) {        // phần nét trong DẢI dòng
            if (d[5] === null) { d[5] = d[6] = x; d[7] = d[8] = y; }
            d[5] = Math.min(d[5], x); d[6] = Math.max(d[6], x); d[7] = Math.min(d[7], y); d[8] = Math.max(d[8], y);
          }
        }
        // (b) CẮT LÕI — theo dõi vào/ra lõi các dòng CÙNG CỘT quanh điểm, nội suy tại MÉP
        // lõi. Chỉ khi KHÔNG khoá; lúc đang chờ bắt thì để riêng (`catCho`): nét hoá ra
        // ngang thì bỏ, hoá ra dốc thì nhận.
        if (khoa) B.vao.clear();
        else if (!prev) {                     // điểm ĐẶT bút đã nằm trong lõi: tính là vào lõi
          for (const k of C) { const [l, bb] = loi(k.h); if (y >= l && y <= bb) B.vao.set(k.h, { x, y }); }
        } else {
          const dich = B.dong ? B.catTo : B.catCho;
          const tai = (m) => ({ x: prev.x + (m - prev.y) / (y - prev.y) * (x - prev.x), y: m });
          for (const h of new Set([...C, ...ung(prev.x, prev.y)].map((k) => k.h))) {
            const [l, bb] = loi(h), cin = y >= l && y <= bb, pin = prev.y >= l && prev.y <= bb;
            if (cin && !B.vao.has(h)) B.vao.set(h, pin ? { x: prev.x, y: prev.y } : tai(prev.y < l ? l : bb));
            if (pin && !cin && B.vao.has(h)) { this._butCat(B, h, B.vao.get(h), tai(y < l ? l : bb), dich); B.vao.delete(h); }
            if (!pin && !cin && (prev.y - l) * (y - l) < 0 && (prev.y - bb) * (y - bb) < 0) this._butCat(B, h, tai(l), tai(bb), dich);
          }
        }
        B.prev = { x, y };
        const s = this._butQuay(B, x, y);
        if (s && B.dong) { B.vao.clear(); B.kq = this._butKq(B, x, y); B.zz = true; this._butLuotMoi(B, s); }
        B.kq = this._butKq(B, x, y);
      },
      /** Kết quả = (b) đã cắt ∪ (b) đang dở (nét dừng TRONG lõi) ∪ (a) các đoạn đi ngang
       *  ∪ lúc đang chờ bắt: dòng TẠM + phần cắt lõi đang để riêng ∪ lượt zíc-zắc đang dở. */
      _butKq(B, x, y) {
        const { buoc } = B, kq = new Set(B.catTo);
        if (!B.dong) for (const n of B.catCho) kq.add(n);
        for (const [h, v] of B.vao) this._butCat(B, h, v, { x, y }, kq);
        const doan = [...B.doan];
        if (B.zz) { const l = this._butLuot(B, B.luot, false); if (l) doan.push([l[0], [l[1]]]); }
        else if (!B.dong && B.tt && B.tt.k)
          doan.push([B.tt.k.h, [[B.tt.x0, B.hop.y0, B.tt.x1, B.hop.y1, false, B.tt.x0, B.tt.x1, B.hop.y0, B.hop.y1]]]);
        for (const [h, ds] of doan) {
          // Đoạn đã KHOÁ (nét ngang): tô trọn bề ngang. Chưa khoá: chỉ tính phần nét trong
          // DẢI ±½·buoc của dòng, và bỏ nếu phần đó DỐC mà ngắn (nét chéo/dọc — luật (b)
          // lo). ⚠ Không lấy bề ngang cả đoạn: dòng dưới không có chữ chỗ bút đi qua thì
          // nét chéo ở lại một dòng suốt và tô thừa từ bên cạnh (đo: chéo 3 dòng nhầm 3% →
          // 8%); cũng không bỏ hẳn đoạn dốc: nét chéo thoải ~21° (dốc hơn ngưỡng khoá, thoải
          // hơn luật cắt lõi) thì không tô được gì.
          for (const [x0, , x1, , daKhoa, bx0, bx1, by0, by1] of ds) {
            let a = x0, b = x1;
            if (!daKhoa) {
              if (bx0 === null || (by1 - by0 > 0.4 * Math.max(bx1 - bx0, 1e-9) && bx1 - bx0 < 2 * buoc)) continue;
              a = bx0; b = bx1;
            }
            for (const n of B.theoHang.get(h) || []) { const w = B.tu[n]; if (b >= w.gl && a <= w.gr) kq.add(n); }
          }
        }
        return kq;
      },
      /** Chiều ngang của nét. QUAY ĐẦU = lùi ≥ 2·buoc so với điểm xa nhất theo chiều đang đi
       *  (rung tay, nét lượn sóng không tới) → trả các điểm từ đỉnh tới giờ: đầu lượt mới. */
      _butQuay(B, x, y) {
        const q = { x, y };
        if (!B.dinh) { B.dinh = q; B.sau = []; return null; }
        if (!B.chieu) { if (Math.abs(x - B.dinh.x) < B.buoc) return null; B.chieu = Math.sign(x - B.dinh.x); }
        if ((x - B.dinh.x) * B.chieu >= 0) { B.dinh = q; B.sau = []; return null; }
        B.sau.push(q);
        if ((B.dinh.x - x) * B.chieu < 2 * B.buoc) return null;
        const s = [B.dinh, ...B.sau];
        B.chieu = -B.chieu; B.dinh = q; B.sau = [];
        return s;
      },
      /** Lượt zíc-zắc mới bắt đầu từ các điểm `s` (từ đỉnh quay đầu tới giờ). */
      _butLuotMoi(B, s) {
        B.luot = s; B.lg = { dong: null, vao: [] };
        for (const q of s) this._butLuotDiem(B, q.x, q.y);
      },
      /** BÁM ĐẦU LƯỢT: dòng của lượt chọn theo 2·buoc ĐẦU TIÊN bút đi trong vùng chữ (đầu
       *  lượt người ta đặt bút chính xác nhất; cuối lượt tay trôi sang dòng kế — tr.83, tr.84),
       *  rồi giữ cả lượt. Ứng viên = mọi dòng của CỘT gần độ cao bút, kể cả dòng không có chữ
       *  ngay chỗ bút (dòng ngắn: lượt còn đi tiếp qua chữ của nó — tr.84 lượt 2). */
      _butLuotDiem(B, x, y) {

          for (const n of B.kq) { const w = B.tu[n]; for (let k = w.i; k < w.e; k++) ra.push(this._chonKyTu(w.tn, k)); }
          return ra;
        },
        /** Xem trước theo TỪNG TỪ trong lúc tô. */
        _butVe(main) {
          const lop = this._chonLop(main);
          lop.querySelectorAll('.chon-but').forEach((e) => e.remove());
          const B = main._but;
          if (!B) return;
          for (const n of B.kq) {
            const w = B.tu[n], d = document.createElement('div');
            d.className = 'chon-but';
            d.style.cssText = `left:${w.l}px;top:${w.t}px;width:${w.r - w.l}px;height:${w.h}px`;
            lop.appendChild(d);
          }
        },
        _butXong(main) {
          if (!main) return;
          main.querySelectorAll(':scope > .chon-lop > .chon-but').forEach((e) => e.remove());
          main._but = null;
        },
        /** Khung nét đứt (⬚) + dấu chế độ cạnh ngón tay — vẽ bằng JS, không cần markup. */
        _chonDangVe() {
          const d = this.chonDang;
          let o = document.querySelector('.chon-dang'), dau = document.querySelector('.chon-dau');
          if (!d) { o?.remove(); dau?.remove(); return; }
          if (!dau) { dau = document.createElement('div'); dau.className = 'chon-dau'; document.body.appendChild(dau); }
          dau.textContent = d.kieu === 'khung' ? '⬚' : '🖍';
          dau.style.left = (d.x1 + 14) + 'px'; dau.style.top = (d.y1 - 36) + 'px';
          if (d.kieu !== 'khung') { o?.remove(); return; }
          if (!o) { o = document.createElement('div'); o.className = 'chon-dang'; document.body.appendChild(o); }
          const x0 = Math.min(d.x0, d.x1), y0 = Math.min(d.y0, d.y1);
          o.style.cssText = `left:${x0}px;top:${y0}px;width:${Math.abs(d.x1 - d.x0)}px;height:${Math.abs(d.y1 - d.y0)}px`;
        },
        _trongTam() {
          let x = 0, y = 0, n = 0;
          for (const p of (this._ngon || new Map()).values()) { x += p.x; y += p.y; n++; }
          return n ? { x: x / n, y: y / n } : null;
        },

        /** Đặt bút. Kéo NGAY = 🖍 bút; GIỮ YÊN ~0,4s rồi kéo = ⬚ khung (cùng trang đọc). */
        chonDown(e) {
          this._kieuConTro = e.pointerType;
          if (!this.chonHoat) { this._cham = { x: e.clientX, y: e.clientY }; this._chanClick = 0; return; }
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          const main = this._chonMain();
          if (!main) return;
          this._ngon = this._ngon || new Map();
          this._ngon.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (this._ngon.size > 1) {          // ngón thứ hai: huỷ nét dở, sang cuộn
            this.chonDang = null; this._chonDangVe();
            this._butXong(main);
            clearTimeout(this._hGiu);
            this._cuon = true;
            this._tam = this._trongTam();
            return;
          }
          this._diChuyen = false;
          this.chonDang = { x0: e.clientX, y0: e.clientY, x1: e.clientX, y1: e.clientY, kieu: 'but' };
          this._butBatDau(main);
          this._butThem(main, { x: e.clientX, y: e.clientY });
          this._chonDangVe();
          clearTimeout(this._hGiu);
          this._hGiu = setTimeout(() => {
            const d = this.chonDang;
            if (!d || this._diChuyen || this._cuon) return;
            d.kieu = 'khung';
            this._butXong(main);
            this._chonDangVe();
            try { if (navigator.vibrate) navigator.vibrate(15); } catch (err) {}
          }, 400);
          try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
        },
        chonMove(e) {
          if (!this.chonHoat && this._cham && !this._cham.di
              && Math.hypot(e.clientX - this._cham.x, e.clientY - this._cham.y) > 6) this._cham.di = true;
          if (!this._ngon || !this._ngon.has(e.pointerId)) return;
          this._ngon.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (this._cuon) {                   // hai ngón: cuộn theo TRỌNG TÂM
            const tam = this._trongTam();
            if (this._tam) window.scrollBy(0, -(tam.y - this._tam.y));
            this._tam = tam;
            return;
          }
          const d = this.chonDang;
          if (!d) return;
          d.x1 = e.clientX; d.y1 = e.clientY;
          if (!this._diChuyen && Math.hypot(d.x1 - d.x0, d.y1 - d.y0) > 8) { this._diChuyen = true; clearTimeout(this._hGiu); }
          const main = this._chonMain();
          if (d.kieu === 'but' && main) {
            // Đọc cả các điểm trình duyệt đã GỘP (máy bận / vuốt nhanh — nét thưa lọt chữ).
            const ds = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
            let doi = false;
            for (const c of ds.length ? ds : [e]) doi = this._butThem(main, { x: c.clientX, y: c.clientY }) || doi;
            if (doi) this._butVe(main);
          }
          this._chonDangVe();
        },
        chonUp(e) {
          if (!this.chonHoat) { this._chamThuong(e); return; }
          if (!this._ngon || !this._ngon.has(e.pointerId)) return;
          this._ngon.delete(e.pointerId);
          if (this._cuon) { if (this._ngon.size < 2) this._cuon = false; return; }
          const d = this.chonDang, main = this._chonMain();
          this.chonDang = null; this._chonDangVe();
          clearTimeout(this._hGiu);
          if (!d || !main) return;
          // Chặn cú `click` theo sau: thả tay trên thẻ ghi nhớ / phương án trắc nghiệm
          // không được lật thẻ hay chọn đáp án (xem `chonGan`).
          this._chanClick = Date.now();
          const daTo = d.kieu === 'but' && main._but && main._but.kq.size;
          if (!daTo && Math.abs(d.x1 - d.x0) < 6 && Math.abs(d.y1 - d.y0) < 6) {
            this._butXong(main);
            // MỘT CÚ CHẠM (chưa hề di chuyển) = bỏ vùng đã chọn, vẫn ở trong chế độ.
            if (!this._diChuyen && d.kieu !== 'khung' && e.type === 'pointerup' && this.chonText) this.chonXoa();
            return;
          }
          let ky;
          if (d.kieu === 'khung') {
            const b = main.getBoundingClientRect();
            ky = this._chonTrongO({ left: Math.max(Math.min(d.x0, d.x1), b.left), right: Math.min(Math.max(d.x0, d.x1), b.right),
                                    top: Math.max(Math.min(d.y0, d.y1), b.top), bottom: Math.min(Math.max(d.y0, d.y1), b.bottom) });
          } else { ky = this._butKy(main); this._butXong(main); }
          if (!ky.length) { this.chonNoi('Vùng này không có chữ'); return; }
          const cu = this._ky || {};
          this._ky = { ...cu };
          for (const r of ky) this._ky[r.k] = r;
          const them = ky.map((r) => r.k).filter((k) => !cu[k]);
          if (them.length) this.chonLui = [...this.chonLui, them];
          // `_traDat` là chốt DUY NHẤT của trần 1.000 ký tự: quá thì lùi về như trước nét.
          const kq = this._chonCapNhat();
          if (kq === 'dai') { this._ky = cu; this.chonLui = this.chonLui.slice(0, -1); this._chonCapNhat(); }
          if (kq !== 'ok') this.chonNoi(this._chonLyDo(kq));
        },
        /** Tầng thường: một cú CHẠM (không kéo) lên nội dung = bỏ chọn. Chờ 350ms: cú bấm
            đầu của nháy đúp / nhấn giữ cũng là một cú chạm. Chạm lên nút, thẻ, phương án
            thì KHÔNG bỏ — đó là thao tác học bài, không phải dọn vùng chọn. */
        _chamThuong(e) {
          const c = this._cham; this._cham = null;
          if (!c || c.di || e.type !== 'pointerup' || !this.chonText) return;
          if (Math.abs(e.clientX - c.x) > 6 || Math.abs(e.clientY - c.y) > 6) return;
          if (e.target.closest && e.target.closest('a, button, [role="button"], input, label, summary, select')) return;
          setTimeout(() => {
            const s = getSelection();
            if (!this.tra.show && (!s || s.isCollapsed)) this.chonXoa();
          }, 350);
        },
        /** Gắn sự kiện lên vùng nội dung — trang nhúng gọi MỘT lần lúc khởi tạo. */
        chonGan() {
          if (this._chonDaGan) return;
          const main = this._chonMain();
          if (!main) { setTimeout(() => this.chonGan(), 200); return; }
          this._chonDaGan = true;
          main.addEventListener('pointerdown', (e) => this.chonDown(e));
          main.addEventListener('pointermove', (e) => this.chonMove(e));
          main.addEventListener('pointerup', (e) => this.chonUp(e));
          main.addEventListener('pointercancel', (e) => this.chonUp(e));
          main.addEventListener('contextmenu', (e) => { if (this.chonHoat) e.preventDefault(); });
          // Đang ở chế độ chọn: mọi cú bấm trong nội dung là để TÔ, không để lật thẻ /
          // chọn đáp án / mở mục. Chặn ở pha BẮT (trước handler của Alpine).
          main.addEventListener('click', (e) => {
            // `_chanClick`: cú click theo sau nét vừa thả (kể cả khi vừa tắt chế độ giữa chừng)
            // — chặn MỘT lần; cú đặt tay mới ngoài chế độ chọn cũng xoá nó (`chonDown`).
            if (this.chonHoat || Date.now() - (this._chanClick || 0) < 400) {
              e.preventDefault(); e.stopPropagation(); this._chanClick = 0;
            }
          }, true);
          addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && (this.chonHoat || this.chonText) && !this.tra.show) this.chonTat();
          });
          // Nội dung đổi (lật thẻ, câu mới, lọc) → bản ghi hết dùng được thì rơi, ô màu vẽ lại.
          let hen = null;
          const lai = () => { clearTimeout(hen); hen = setTimeout(() => { if (this.chonText || Object.keys(this._ky || {}).length) this._chonCapNhat(); }, 120); };
          new MutationObserver((ms) => {
            if (ms.every((m) => (m.target.nodeType === 1 ? m.target : m.target.parentElement)?.closest('.chon-lop'))) return;
            lai();
          }).observe(main, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['style', 'class', 'hidden'] });
          if (window.ResizeObserver) new ResizeObserver(lai).observe(main);
          addEventListener('resize', lai);
        },


        // ── Từ đã tra ────────────────────────────────────────────────────────
        // Gộp theo TỪ chứ không phải nhật ký từng lượt: câu đáng trả lời là "con
        // hay phải tra lại từ nào", và từ tra đi tra lại chính là từ chưa thuộc.
        hist: { rows: [], loading: false, err: '', sort: 'n' },
        async loadHist() {
          if (!this.secret) { this.hist.err = 'Cần mã bí mật để xem.'; return; }
          this.hist.loading = true; this.hist.err = '';
          try {
            const r = await fetch(`/api/lookup/history?user=${this.user}&course=${this.course}`,
                                  { headers: { 'x-progress-key': this.secret } });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            this.hist.rows = (await r.json()).rows || [];
          } catch (e) { this.hist.err = String(e.message || e); }
          this.hist.loading = false;
        },
        get histRows() {
          const r = [...this.hist.rows];
          // Mặc định xếp theo SỐ LẦN TRA giảm dần — đó mới là thứ đáng nhìn
          // trước. Xếp theo thời gian thì từ vừa tra xong luôn đứng đầu, mà từ
          // vừa tra xong là từ ít thông tin nhất.
          return this.hist.sort === 'n'
            ? r.sort((a, b) => b.n - a.n || b.last_ts - a.last_ts)
            : r.sort((a, b) => b.last_ts - a.last_ts);
        },
        ngayGon(ts) {
          const d = Math.floor((Date.now() / 1000 - ts) / 86400);
          return d <= 0 ? 'hôm nay' : d === 1 ? 'hôm qua' : d + ' ngày trước';
        },


        // ── Thẻ ghi nhớ: HỌC ───────────────────────────────────────────────────
        // Xem lần lượt, hiện cả hai mặt, không chấm. Thứ tự XÁO NGẪU NHIÊN mỗi lần
        // vào (không cố định theo cây, kẻo học thuộc theo vị trí), nhưng giữ nguyên
        // trong lúc lật qua lại; nút 🔀 xáo lại.
        learnList: [],
        get learnDeck() { return this.learnList; },
        shuffleLearn() {
          const a = [...this.pool('cards')];
          for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
          this.learnList = a; this.learnAt = 0;
          this.autoRead(this.learnCard?.front_en);
        },
        startLearn() { this.shuffleLearn(); this.screen = 'learn'; },
        get learnCard() { return this.learnDeck[this.learnAt] || null; },

        // ── Thẻ ghi nhớ: KIỂM TRA ──────────────────────────────────────────────
        // Không chấm điểm, không lịch ôn giãn cách: mỗi thẻ chỉ có HAI trạng thái —
        // đã thuộc hay chưa. Hàng đợi là bộ thẻ đã xáo; thẻ nào phải "Xem đáp án"
        // thì xếp lại vào cuối ĐÚNG MỘT LẦN rồi thôi.
        //
        // Có điểm dừng, không quay vòng vô hạn như bản trước: phiên không bao giờ
        // kết thúc thì cách duy nhất để ra là bỏ dở, mà bỏ dở thì không có màn
        // tổng kết nào để thấy mình vừa thuộc thêm bao nhiêu.
        again: null,
        startTest() {
          const a = [...this.pool('cards')];
          for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
          this.queue = a; this.at = 0;
          this.seen = {}; this.again = new Set(); this.tStats = { n: 0, known: 0 };
          this.revealed = false; this.shownAt = Date.now(); this.screen = 'test';
          this.autoRead(this.q?.front_en);
        },
        // Ghi thẳng cờ "đã thuộc" — CÙNG trạng thái với ô tick cạnh từ đó trong
        // phần tóm tắt, vì thẻ và từ chung một item_id.
        mark(q, known) {
          if (this.seen[q.id] === undefined) this.tStats.n++;
          const was = this.seen[q.id] === 'known';
          this.seen[q.id] = known ? 'known' : 'again';
          if (known && !was) this.tStats.known++;
          if (!known && was) this.tStats.known--;
          this.setKnown([{ id: q.id, c: q.concept }], known);
        },
        markKnown() {
          const q = this.q; if (!q) return;
          this.mark(q, true);
          this.advance();
        },
        // Phải xem đáp án nghĩa là CHƯA thuộc — kể cả khi trước đó đã tick. Bỏ
        // bước hạ cờ này thì thẻ đã tick nhầm không có đường nào quay lại.
        reveal() {
          if (this.revealed) return;
          this.revealed = true;
          const q = this.q; if (!q) return;
          this.mark(q, false);
          if (!this.again.has(q.id)) { this.again.add(q.id); this.queue.push(q); }
        },
        advance() {
          this.revealed = false;
          this.at++;
          this.shownAt = Date.now();
          if (this.at >= this.queue.length) { this.screen = 'done'; return; }
          this.autoRead(this.q?.front_en);
        },
        get nAgain() { return Object.values(this.seen).filter(v => v === 'again').length; },
        get nLeft() { return Math.max(0, this.queue.length - this.at - 1); },
        finishTest() { this.screen = 'done'; },

        // ── Ghi kết quả ───────────────────────────────────────────────────────
        // Đệm vào localStorage TRƯỚC khi gửi. Mất mạng ở câu 19 mà mất cả phiên
        // là mất đúng thứ có giá trị nhất của tính năng này.
        buf() { try { return JSON.parse(localStorage.getItem('lms_study_buf') || '[]'); } catch { return []; } },
        async save() {
          if (!this.log.length) return;
          const pending = [...this.buf(), ...this.log];
          this.log = [];   // ĐÃ chuyển sang buffer — không xoá thì lần save sau ghi trùng
          localStorage.setItem('lms_study_buf', JSON.stringify(pending));
          await this.flushBuffer();
        },
        // MỌI lần gọi đi qua MỘT chuỗi promise (init, save, askSecret, lượt Kiểm tra của tab Bài tập): lần gọi sau chờ lần trước xong rồi mới đọc đệm
        // (đọc LẠI, không dùng ảnh chụp cũ) — nên mỗi lượt gửi đúng một lần, và chỉ lượt ĐÃ gửi mới bị xoá khỏi đệm.
        flushBuffer() {
          this.flP = (this.flP || Promise.resolve()).then(() => this.flushOnce());
          return this.flP;
        },
        // Gửi hết đệm theo lô ≤ MAX_ATTEMPTS (worker/study.js writeSession chỉ giữ 200 lượt đầu của mỗi POST — lô to hơn là mất phần sau
        // mà vẫn được trả 200). Lỗi → giữ nguyên phần chưa gửi. Không bao giờ ném lỗi, để chuỗi không đứt.
        async flushOnce() {
          const LO = 200;
          let cong = 0;
          try {
            for (;;) {
              const pending = this.buf();
              if (!pending.length || !this.online || !this.secret) break;
              const lo = pending.slice(0, LO);
              const r = await fetch(`/api/study?user=${this.user}&course=${this.course}`, {
                method: 'POST',
                headers: { 'content-type': 'application/json', 'x-progress-key': this.secret },
                body: JSON.stringify({ attempts: lo }),
              });
              if (r.status === 401) {
                this.secret = ''; localStorage.removeItem('lms_key'); window.dispatchEvent(new Event('lms-key'));
                throw new Error('Mã bí mật không đúng');
              }
              if (!r.ok) throw new Error('HTTP ' + r.status);
              // Chỉ xoá khi CHẮC đã ghi, và chỉ xoá ĐÚNG phần đã gửi: lượt thêm vào đệm trong lúc POST còn bay (lần Kiểm tra / Lời giải kế tiếp
              // của tab Bài tập, hay câu kế của quiz) nằm SAU phần đã gửi nên sống sót để lô sau gửi.
              const con = this.buf().slice(lo.length);
              if (con.length) localStorage.setItem('lms_study_buf', JSON.stringify(con)); else localStorage.removeItem('lms_study_buf');
              this.err = '';
              // Điểm thưởng (ADR 0061): `cong` = tổng điểm của CẢ lô (writeSession ghi theo lô); nhiều lô thì cộng lại, báo MỘT lần.
              const d = await r.json().catch(() => null);
              cong += Number(d && d.cong) || 0;
            }
          } catch (e) {
            this.err = 'Chưa lưu được kết quả — sẽ thử lại lần sau. (' + e.message + ')';
          }
          if (window.baoDiem && cong > 0) window.baoDiem(cong);
        },
        // Chủ đề yếu nhất, ngưỡng n>=2 để không kết luận từ một lần sai
        weakConcepts() {
          const by = {};
          for (const q of this.allItems) {
            const c = this.cards[q.id];
            if (!c || !c.n) continue;
            (by[q.concept] = by[q.concept] || { id: q.concept, n: 0, wrong: 0 });
            by[q.concept].n += c.n; by[q.concept].wrong += c.wrong;
          }
          return Object.values(by).filter(x => x.n >= 2 && x.wrong > 0)
            .sort((a, b) => (b.wrong + 1) / (b.n + 3) - (a.wrong + 1) / (a.n + 3))
            .slice(0, 3);
        },
        async askSecret() {
          const v = (prompt('Nhập mã bí mật để lưu kết quả ôn tập:') || '').trim();
          if (!v) return;
          this.secret = v; localStorage.setItem('lms_key', v); window.dispatchEvent(new Event('lms-key'));
          await this.flushBuffer();
        },
      };
    }
  </script>
  <style>

    main[data-tra] { position: relative; }
    .chon-lop { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
    .chon-o, .chon-but { position: absolute; background: #6366f166; border-radius: 2px; }
    main.chon-bat, main.chon-bat * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    /* Một ngón = tô; hai ngón = cuộn (tự làm, xem `chonMove`) + phóng to (trình duyệt). */
    main.chon-bat { touch-action: pinch-zoom; }
    .chon-dang { position: fixed; border: 2px dashed #4f46e5; background: #6366f11a; border-radius: 4px;

          <button @click="start(poolItems.length)" :disabled="!poolItems.length"
                  class="px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-40">
            ✍️ Bắt đầu kiểm tra
          </button>
          <button x-show="false" @click="start(10)"
                  :disabled="!(mode === 'cards' ? scopedCards : scopedQuiz).length"
                  class="px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-40">
            Làm 10
          </button>
        </div>
      </div>

      <!-- ── Bảng trạng thái từng mục ────────────────────────────────────
           Trả lời "tôi đang đứng ở đâu": mục nào hay sai, mục nào chưa đụng tới.
           Sắp hay-sai lên đầu; trạng thái suy từ cards[] nên luôn khớp lịch ôn. -->
      <template x-if="showList && modeItems.length">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="flex flex-wrap items-center gap-3 px-4 py-2.5 border-b border-slate-200 bg-slate-50 text-xs">
          <span class="font-semibold text-slate-700" x-text="modeItems.length + (mode === 'cards' ? ' thẻ' : ' câu hỏi')"></span>
          <template x-for="k in ['weak','learning','new','known']" :key="k">
            <span class="flex items-center gap-1">
              <span class="px-1.5 py-0.5 rounded font-medium" :class="ST[k].c" x-text="ST[k].t"></span>
              <span class="text-slate-500" x-text="listRows.filter(r => r.st === k).length"></span>
            </span>
          </template>
        </div>
        <div class="max-h-[28rem] overflow-y-auto divide-y divide-slate-100">
          <template x-for="r in listRows" :key="r.id">
            <div class="flex items-start gap-3 px-4 py-2.5 text-sm">
              <span class="shrink-0 mt-0.5 px-1.5 py-0.5 rounded text-[11px] font-medium"
                    :class="ST[r.st].c" x-text="ST[r.st].t"></span>
              <div class="min-w-0 flex-1">
                <p class="text-slate-800 leading-snug" x-text="r.text"></p>
                <p class="text-xs text-slate-400 truncate" x-text="r.concept"></p>
              </div>
              <div class="shrink-0 text-right text-xs text-slate-500 tabular-nums">
                <p x-show="r.n"><span x-text="r.n - r.wrong"></span>/<span x-text="r.n"></span> đúng</p>
                <p x-show="r.n" class="text-slate-400">
                  bậc <span x-text="r.box"></span><template x-if="r.due !== null"><span
                    x-text="r.due > 0 ? ' · ôn sau ' + r.due + 'ng' : ' · đến hạn'"></span></template>
                </p>
                <p x-show="!r.n" class="text-slate-400">chưa làm</p>
              </div>
            </div>
          </template>
        </div>
      </div>
      </template>

      <!-- Điểm yếu, chỉ hiện khi đã có dữ liệu làm bài -->
      <template x-if="online && Object.keys(cards).length">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
          <h3 class="text-xs font-bold uppercase tracking-wide text-slate-400">Hay sai nhất</h3>
          <ul class="mt-2 space-y-1">
            <template x-for="c in weakConcepts()" :key="c.id">
              <li class="text-sm text-slate-600 flex items-center justify-between gap-2">
                <span class="flex items-center gap-2 min-w-0">
                  <span class="w-1.5 h-1.5 rounded-full bg-rose-400 shrink-0"></span>
                  <span class="truncate" x-text="conceptName(c.id)"></span>
                </span>
                <span class="text-xs text-slate-400 shrink-0" x-text="c.wrong + '/' + c.n + ' sai'"></span>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </div>
    </div>
    </template>

    <!-- ── Làm bài ──────────────────────────────────────────────────────── -->
    <template x-if="screen === 'quiz' && q && mode === 'quiz'">
    <div class="space-y-4">
      <div class="flex items-center gap-3 text-xs text-slate-500">
        <div class="flex-1 h-1.5 rounded-full bg-slate-200 overflow-hidden">
          <div class="h-full bg-indigo-500 transition-all duration-300"
               :style="'width:' + Math.round(at / queue.length * 100) + '%'"></div>
        </div>
        <span x-text="(at + 1) + '/' + queue.length"></span>
        <button @click="finishQuiz()" class="text-slate-500 hover:text-indigo-600 underline">Kết thúc</button>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <p class="text-xs text-slate-400" x-text="conceptName(q.concept)"></p>
        <template x-if="passageOf(q)">
          <div class="mt-2 rounded-lg border border-fuchsia-200 bg-fuchsia-50/50 px-3 py-2 text-sm" x-data="{ mo: true }">
            <button type="button" @click="mo = !mo" class="py-2 -my-1 font-semibold text-fuchsia-700 hover:underline" x-text="(mo ? '▾ 📕 ' : '▸ 📕 ') + passageOf(q).title"></button>
            <div x-show="mo" class="mt-1 max-h-72 overflow-y-auto whitespace-pre-line leading-relaxed text-slate-800" x-text="passageOf(q).text"></div>
          </div>
        </template>
        <p class="mt-1 font-medium text-slate-900"><span x-text="q.stem_en"></span><button x-show="canSpeak" @click.stop="speak(q.stem_en)" type="button" title="Đọc to"
                        class="ml-1 inline-flex items-center justify-center w-8 h-8 rounded-full text-indigo-500 hover:bg-indigo-100 align-middle">🔊</button></p>
        <p x-show="q.stem_vi" class="mt-1 text-sm text-slate-500" x-text="q.stem_vi"></p>

        <div class="mt-4 space-y-2">
          <template x-for="c in choices" :key="c.key">
            <button @click="if (!dangBoiDen()) pick(c)" :disabled="answered"
                    class="w-full text-left px-4 py-3 rounded-lg border transition-colors"
                    :class="!answered ? 'bg-white border-slate-300 hover:border-indigo-500 hover:bg-indigo-50'
                            : (isCorrect(c) ? 'bg-emerald-50 border-emerald-400'
                               : (picked === c ? 'bg-rose-50 border-rose-400' : 'bg-white border-slate-200 opacity-60'))">
              <span class="text-sm text-slate-800" x-text="c.en"></span>
              <span x-show="c.vi" class="block text-xs text-slate-500" x-text="c.vi"></span>
            </button>
          </template>
        </div>
      </div>

      <div x-show="answered" x-cloak class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <p class="font-medium" :class="isCorrect(picked) ? 'text-emerald-700' : 'text-rose-700'"
           x-text="isCorrect(picked) ? '✓ Đúng rồi!' : '✗ Chưa đúng'"></p>
        <p class="mt-1 text-sm text-slate-700" x-text="q.why_en"></p>
        <p x-show="q.why_vi" class="mt-0.5 text-sm text-slate-500" x-text="q.why_vi"></p>
        <button @click="next()"
                class="mt-4 px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
          Câu tiếp →
        </button>
      </div>
    </div>
    </template>

    <!-- ── Thẻ ghi nhớ: HỌC ─────────────────────────────────────────────── -->
    <template x-if="screen === 'learn' && learnCard">
    <div class="space-y-4">
      <div class="flex items-center gap-3 text-xs text-slate-500">
        <div class="flex-1 h-1.5 rounded-full bg-slate-200 overflow-hidden">
          <div class="h-full bg-indigo-500 transition-all duration-300"
               :style="'width:' + Math.round((learnAt + 1) / learnDeck.length * 100) + '%'"></div>
        </div>
        <span x-text="(learnAt + 1) + '/' + learnDeck.length"></span>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        <div class="flex items-start gap-3">
          <p class="text-xs text-slate-400 flex-1" x-text="conceptName(learnCard.concept)"></p>
          <!-- Cùng một cờ với ô tick cạnh từ đó trong phần tóm tắt: thẻ và từ
               chung item_id, nên bấm ở đây là tóm tắt cũng đổi theo. -->
          <button x-show="canMark" x-cloak type="button"
                  @click="setKnown([{ id: learnCard.id, c: learnCard.concept }], !isKnown(learnCard.id))"
                  :class="isKnown(learnCard.id) ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-emerald-700 border-emerald-300'"
                  class="shrink-0 px-2.5 py-1 text-xs font-medium rounded-full border transition-colors"
                  x-text="isKnown(learnCard.id) ? '✓ Đã thuộc' : 'Đánh dấu đã thuộc'"></button>
        </div>
        <p class="mt-2 text-lg font-medium text-slate-900"><span x-text="learnCard.front_en"></span><button x-show="canSpeak" @click.stop="speak(learnCard.front_en)" type="button" title="Đọc to"
                        class="ml-1 inline-flex items-center justify-center w-8 h-8 rounded-full text-indigo-500 hover:bg-indigo-100 align-middle">🔊</button></p>
        <p x-show="learnCard.ipa" x-cloak class="text-sm text-slate-400 font-mono" x-text="learnCard.ipa"></p>
        <!-- Ảnh minh hoạ là của ĐÁP ÁN (cùng chỗ với màn Kiểm tra). Màn Học không có
             bước lật nên `revealed` luôn false — phóng to không được chặn theo nó. -->
        <div class="mt-4 pt-4 border-t border-slate-100">
          <template x-if="learnCard.visual && learnCard.visual.html">
            <div data-fc-hinh class="mb-3 max-w-full overflow-x-auto rounded-lg border border-slate-200 bg-white p-2 [&>*]:mx-auto" x-html="learnCard.visual.html"></div>
          </template>
          <template x-if="learnCard.image">
            <img @click.stop="zoom = 'study/img/lich-su-va-dia-ly-5/' + learnCard.image" :src="'study/img/lich-su-va-dia-ly-5/' + learnCard.image" alt="" loading="lazy"
                 class="cursor-zoom-in mb-3 max-h-44 rounded-lg border border-slate-200 bg-white object-contain">
          </template>
          <p class="text-slate-700" x-text="learnCard.back_en"></p>
          <p x-show="learnCard.back_vi" x-cloak class="text-cyan-700" x-text="learnCard.back_vi"></p>
          <p x-show="learnCard.example_en" class="mt-2 text-sm text-slate-500 italic" x-text="learnCard.example_en"></p>
          <p x-show="learnCard.example_vi" class="text-sm text-cyan-700" x-text="learnCard.example_vi"></p>
        </div>
      </div>
      <div class="flex gap-2">
        <button @click="learnAt = Math.max(0, learnAt - 1); autoRead(learnCard?.front_en)" :disabled="learnAt === 0"
                class="px-4 py-2 text-sm font-medium rounded-lg bg-white border border-slate-300 text-slate-700 hover:border-indigo-500 disabled:opacity-40">← Trước</button>
        <button x-show="learnAt < learnDeck.length - 1" @click="learnAt++; autoRead(learnCard?.front_en)"
                class="flex-1 px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Tiếp →</button>
        <button x-show="learnAt >= learnDeck.length - 1" x-cloak @click="startTest()"
                class="flex-1 px-4 py-2 text-sm font-medium rounded-lg bg-emerald-600 text-white hover:bg-emerald-700">✍️ Bắt đầu kiểm tra</button>
        <button @click="shuffleLearn()" title="Xáo lại" class="px-3 py-2 text-sm text-slate-500 hover:text-indigo-600">🔀</button>
        <button @click="screen = 'start'" class="px-3 py-2 text-sm text-slate-500 hover:text-indigo-600">Thoát</button>
      </div>
    </div>
    </template>

    <!-- ── Thẻ ghi nhớ: KIỂM TRA (quay vòng vô hạn, ngẫu nhiên có trọng số) ── -->
    <template x-if="screen === 'test' && q">
    <div class="space-y-4">
      <div class="flex items-center justify-between text-xs text-slate-500">
        <span><span class="font-semibold text-slate-700" x-text="tStats.known"></span>/<span x-text="tStats.n"></span> đã thuộc</span>
        <span><span class="font-semibold text-rose-600" x-text="nAgain"></span> cần xem lại · <span x-text="nLeft"></span> còn lại</span>
      </div>
      <!-- Bấm vào thẻ để lật -->
      <!-- Bấm vào thẻ = "Xem đáp án" (chấm 0, lật). div role=button chứ không
           phải <button>: bên trong có nút loa, <button> lồng nhau là HTML sai. -->
      <div role="button" tabindex="0" @click="if (dangBoiDen()) return; reveal()" @keydown.enter="reveal()"
           class="w-full text-left bg-white rounded-xl shadow-sm border border-slate-200 p-6 min-h-44 flex flex-col transition-colors"
           :class="revealed ? 'border-rose-200 cursor-default' : 'cursor-pointer hover:border-indigo-400'">
        <p class="text-xs text-slate-400" x-text="conceptName(q.concept)"></p>
        <p class="mt-2 text-lg font-medium text-slate-900"><span x-text="q.front_en"></span><button x-show="canSpeak" @click.stop="speak(q.front_en)" type="button" title="Đọc to"
                        class="ml-1 inline-flex items-center justify-center w-8 h-8 rounded-full text-indigo-500 hover:bg-indigo-100 align-middle">🔊</button></p>
        <p x-show="q.ipa" x-cloak class="text-sm text-slate-400 font-mono" x-text="q.ipa"></p>
        <!-- Ảnh minh hoạ nằm TRONG mặt sau: hiện ở mặt trước là lộ đáp án. x-if theo
             `revealed` (không chỉ x-show) để ảnh cũng chưa tải trước khi lật. -->
        <div x-show="revealed" x-cloak class="mt-4 pt-4 border-t border-slate-100">
          <template x-if="revealed && q.visual && q.visual.html">
            <div data-fc-hinh class="mb-3 max-w-full overflow-x-auto rounded-lg border border-slate-200 bg-white p-2 [&>*]:mx-auto" x-html="q.visual.html"></div>
          </template>
          <template x-if="revealed && q.image">
            <img @click.stop="zoom = 'study/img/lich-su-va-dia-ly-5/' + q.image" :src="'study/img/lich-su-va-dia-ly-5/' + q.image" alt="" loading="lazy"
                 class="cursor-zoom-in mb-3 max-h-44 rounded-lg border border-slate-200 bg-white object-contain">
          </template>
          <p class="text-slate-700" x-text="q.back_en"></p>
          <p x-show="q.back_vi" x-cloak class="text-cyan-700" x-text="q.back_vi"></p>
          <p x-show="q.example_en" class="mt-2 text-sm text-slate-500 italic" x-text="q.example_en"></p>
          <p x-show="q.example_vi" class="text-sm text-cyan-700" x-text="q.example_vi"></p>
        </div>
      </div>
      <!-- Hai nút hiện SẴN. Bấm một trong hai thì đổi thành Tiếp theo (Đã thuộc
           thì sang luôn nên thực tế Tiếp theo chỉ xuất hiện sau Xem đáp án). -->
      <div x-show="!revealed" class="grid grid-cols-2 gap-2">
        <button @click="reveal()"     class="px-3 py-3 text-sm font-medium rounded-lg bg-rose-100 text-rose-700 hover:bg-rose-200">👁 Xem đáp án</button>
        <button @click="markKnown()"  class="px-3 py-3 text-sm font-medium rounded-lg bg-emerald-100 text-emerald-700 hover:bg-emerald-200">✓ Đã thuộc</button>
      </div>
      <div x-show="revealed" x-cloak>
        <button @click="advance()" class="w-full px-3 py-3 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Tiếp theo →</button>
      </div>
      <div class="text-center">
        <button @click="finishTest()" class="text-sm text-slate-500 hover:text-indigo-600 underline">Kết thúc</button>
      </div>
    </div>
    </template>

    <!-- ── Tóm tắt dạng trực quan ────────────────────────────────────────
         Không dựng tên class từ JSON: Tailwind quét HTML lúc build, class ghép
         chuỗi sẽ bị cắt mất. JSON chỉ mang TÊN biểu tượng và TÊN sơ đồ; markup
         nằm sẵn ở đây.                                                        -->
    <template x-if="ready && data && mode === 'summary'">
    <div class="space-y-5">
      <p x-show="filtering && !shownSummary.length" x-cloak
         class="rounded-lg bg-amber-50 border border-amber-200 px-3 py-2 text-sm text-amber-800">
        Không có mục nào khớp<template x-if="qq"><span> «<span x-text="kw"></span>»</span></template>.
      </p>

      <div x-show="soLoc" x-cloak data-dong-loc
     class="no-print flex items-center gap-2 px-3 py-2 rounded-xl bg-indigo-50 border border-indigo-200 text-xs text-indigo-900">
  <span class="min-w-0"><b>Đang lọc:</b> <span x-text="(tenLoc).join(' · ')"></span></span>
  <button type="button" data-bo-loc @click="boLoc()" class="ml-auto shrink-0 px-2 py-2 -my-2 font-semibold hover:text-indigo-600">✕ Bỏ lọc</button>
</div>
      <p x-show="!scopedSummary.length" x-cloak
         class="rounded-lg bg-slate-50 border border-slate-200 px-4 py-3 text-sm text-slate-500">
        Chưa có tóm tắt cho phần này.
      </p>

      <template x-for="sec in shownSummary" :key="sec.concept">
        <div>
        <!-- ── 🎯 «… what you need to know» (ESL 5 Unit 3): khối ĐIỀU HƯỚNG của CẢ UNIT, đứng riêng TRÊN mục đầu đang hiện (cbTruoc) — không có
             ô «đã thuộc» (không có gì để thuộc: mỗi dòng là lối tắt tới khung / thẻ từ, tick ở đích). -->
        <template x-for="cb in [cbTruoc(sec)].filter(Boolean)" :key="'cbu'">
          <div data-can-biet class="no-print mb-5">
            <div class="rounded-xl border border-indigo-200 bg-indigo-50/60 px-4 py-3">
              <p class="text-[13px] font-bold tracking-wide text-indigo-900" x-text="cb.title"></p>
              <template x-for="(nh, ni) in (cb.nhom || [])" :key="'cb' + ni">
                <div class="mt-2">
                  <p class="text-[11px] font-bold uppercase tracking-wider text-slate-500" x-text="nh.ten"></p>
                  <ul>
                    <template x-for="(dg, di) in (nh.dong || [])" :key="di">
                      <li>
                        <template x-if="dg.toi">
                          <button type="button" data-can-biet-dong @click="toiKhoi(dg.toi)"
                                  class="flex min-h-8 w-full items-center justify-between gap-2 py-1 text-left text-sm font-medium text-indigo-800 hover:underline">
                            <span x-text="dg.t"></span><span class="shrink-0 text-indigo-400" aria-hidden="true">›</span>
                          </button>
                        </template>
                        <template x-if="!dg.toi">
                          <p class="py-1 text-sm text-slate-800" x-text="dg.t"></p>
                        </template>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>
          </div>
        </template>
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="px-5 py-3 bg-indigo-50 border-b border-indigo-100 flex items-center gap-2.5">
            <!-- Ô của mục KHÔNG có trạng thái riêng: luôn suy từ các từ bên trong
                 (xong hết / một phần / chưa gì), đúng khuôn ô tick nhóm ở trang
                 môn. Nhờ vậy bỏ tick một từ là ô này tự về "một phần" ngay, không
                 bao giờ có cảnh mục báo "đã thuộc" mà bên trong còn từ chưa thuộc. -->
            <template x-if="canMark && knownState(secAtoms(sec))">
              <input type="checkbox" title="Đã thuộc cả mục"
                     :checked="knownState(secAtoms(sec)) === 'all'"
                     x-effect="$el.indeterminate = knownState(secAtoms(sec)) === 'some'"
                     @change="setKnown(secAtoms(sec), $event.target.checked)"
                     class="shrink-0 w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600">
            </template>
            <h3 class="text-lg font-bold text-indigo-900" x-html="hl(conceptName(sec.concept))"></h3>
            <p x-show="codesOf(sec.concept).length" class="mt-1 flex flex-wrap gap-1"><template x-for="cd in codesOf(sec.concept)" :key="cd"><span class="shrink-0 rounded bg-slate-100 px-1.5 py-0.5 font-mono text-[11px] text-slate-500" x-text="cd"></span></template></p>
          </div>

          <!-- Ý lớn: một câu, chữ to, để nhớ được cả mục -->
          <div x-show="sec.big_en && (!qq || hit(sec.big_en))" x-cloak class="px-5 py-4">
            <p class="text-base font-medium text-slate-800 leading-snug" x-html="hl(sec.big_en)"></p>
            <!-- Dòng tiếng Việt chỉ hiện khi học liệu CÓ bản dịch. Môn của PL dựng
                 kèm --no-gloss nên không có trường *_vi, các dòng này tự ẩn hết. -->
            <p x-show="sec.big_vi" x-cloak class="text-sm text-cyan-700 leading-snug" x-html="hl(sec.big_vi)"></p>
          </div>

          <!-- ── Sơ đồ: ba trạng thái của chất, theo mô hình hạt ────────────
               Vẽ thẳng, KHÔNG dùng x-for: <template> bên trong <svg> nằm ở không
               gian tên SVG nên không phải HTMLTemplateElement, Alpine không clone
               được và ném "importNode: parameter 1 is not of type 'Node'".      -->
          <div x-show="sec.diagram === 'particles' && !qq" x-cloak class="px-5 pb-4">
            <div class="grid grid-cols-3 gap-2 text-center">
              <div class="rounded-lg border border-slate-200 bg-slate-50 p-2">

                <div data-hinh class="rounded-xl border border-dashed border-slate-200 bg-neutral-50 p-2.5">
                  <img @click.stop="zoom = 'study/img/lich-su-va-dia-ly-5/' + tp.image" :src="'study/img/lich-su-va-dia-ly-5/' + tp.image" :alt="tp.title || ''" loading="lazy"
                       class="cursor-zoom-in mx-auto block max-h-52 max-w-full rounded-md bg-white object-contain">
                </div>
              </template>
              <template x-if="tp.example">
                <div>
                  <p class="mb-1 mt-3 text-[11px] font-bold uppercase tracking-wider text-slate-500">Example</p>

                  <div class="ml-1 mt-1 border-l-[3px] border-indigo-200 pl-3">
                    <template x-for="(st, si) in (tp.example?.steps || [])" :key="si">

                  <template x-if="tp.note?.visual?.html">

              </template>
              <template x-if="tp.mistake">
                <div>
                  <p class="mb-1 mt-3 text-[11px] font-bold uppercase tracking-wider text-slate-500">Common mistake</p>
                  <div data-loi class="grid grid-cols-1 gap-2 min-[421px]:grid-cols-2">

                  </div>

              <template x-if="(tp.terms || []).length">
                <div>

              <template x-if="tp.try || nCua('cards', tp.concept) || nCua('quiz', tp.concept)">

                            class="min-h-8 text-[13px] font-semibold text-fuchsia-800 hover:underline" x-text="'📝 ' + nMo('quiz', sec.concept) + (nMo('quiz', sec.concept) === 1 ? ' question' : ' questions')"></button>
                  </div>
                </div>
              </template>
            </div>
            </template>
            <!-- ── Thẻ khuôn cũ (def / rules / example calc·grid·ifthen) — giữ nguyên ── -->
            <template x-if="!tp.rule">
            <div class="rounded-xl border border-orange-200 overflow-hidden">
              <div class="flex items-center gap-2 px-3 py-2 bg-orange-50 border-b border-orange-200">

              </div>
              <!-- Định nghĩa: infographic này để TỔNG HỢP kiến thức, không chỉ liệt kê
                   nội dung sẽ thi — nên mỗi thẻ mở đầu bằng một câu "cái này là gì". -->
              <p x-show="tp.def" class="px-3 pt-2.5 text-sm font-medium text-slate-900" x-html="hl(tp.def)"></p>
              <p x-show="tp.def_vi" x-cloak class="px-3 pt-0.5 text-sm text-cyan-700 leading-snug" x-html="hl(tp.def_vi)"></p>
              <div class="grid sm:grid-cols-2 gap-x-4 gap-y-2 px-3 py-2.5">
                <!-- TRÁI: chỉ quy tắc. Trước đây hình nhét chung ô này với quy tắc
                     nên ba thứ (hình, quy tắc, ví dụ) chen nhau trên một hàng. -->
                <ul class="space-y-1 text-sm text-slate-700 self-start">
                  <template x-for="(r, ri) in (tp.rules || [])" :key="ri">
                    <li class="flex gap-2"><span class="text-orange-400 shrink-0">•</span><span>
                      <span x-html="hl(r)"></span>
                      <span x-show="(tp.rules_vi || [])[ri]" x-cloak class="block text-cyan-700" x-html="hl((tp.rules_vi || [])[ri])"></span>
                    </span></li>
                  </template>
                </ul>
                <!-- PHẢI: ví dụ ở trên, hình ở dưới. Ví dụ trước vì nó là thứ đọc
                     cùng quy tắc; hình là chỗ đối chiếu, xuống dưới vẫn thấy ngay. -->
                <div class="space-y-2 self-start">
                <!-- ví dụ: 3 dạng, class viết literal để Tailwind quét thấy -->
                <template x-if="tp.example && tp.example.kind === 'calc'">
                  <div class="rounded-lg border border-slate-200 overflow-hidden">

                            <template x-if="calcRow(ln)[0]">
                              <td class="w-2/5 px-3 py-1.5 bg-slate-50 text-slate-600" x-html="hl(calcRow(ln)[0])"></td>
                            </template>
                            <td class="px-3 py-1.5" :colspan="calcRow(ln)[0] ? 1 : 2" x-html="hl(calcRow(ln)[1])"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <template x-if="tp.example && tp.example.kind === 'grid'">
                  <div class="overflow-x-auto rounded-lg border border-slate-200">
                    <table class="w-full text-center text-xs tabular-nums">
                      <tbody>
                        <template x-for="(row, ri) in tp.example.rows" :key="ri">
                          <tr :class="ri === 0 ? 'bg-slate-100 font-semibold text-slate-600'
                                     : (ri === tp.example.rows.length - 1 ? 'bg-orange-50 font-bold text-orange-700' : 'text-slate-700')">
                            <template x-for="(cell, ci) in row" :key="ci">
                              <td class="px-1 py-1 border border-slate-200 whitespace-nowrap" x-html="hl(cell)"></td>
                            </template>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <template x-if="tp.example && tp.example.kind === 'ifthen'">
                  <div class="space-y-1.5">
                    <template x-for="(br, bi) in tp.example.branches" :key="bi">
                      <div class="rounded-lg bg-slate-50 border border-slate-200 px-3 py-1.5 text-sm">
                        <p class="text-slate-800"><span x-html="hl(br.when)"></span>
                          <span class="text-orange-500 font-bold"> → </span><span x-html="hl(br.then)"></span></p>

                  <img @click.stop="zoom = 'study/img/lich-su-va-dia-ly-5/' + tp.image" :src="'study/img/lich-su-va-dia-ly-5/' + tp.image" :alt="tp.title || ''" loading="lazy"
                       class="cursor-zoom-in block w-full max-h-52 rounded-md border border-orange-200 bg-white object-contain">
