  <!-- CSS dựng sẵn lúc build (tên file có hash). Thiếu Node thì builder tự
       thay dòng này bằng Tailwind CDN. -->

  <style>
    [x-cloak] { display: none !important; }
    .lms-content img { max-width: 100%; height: auto; border-radius: 0.5rem; }
    .lms-content iframe { max-width: 100%; }

    .lms-content p { margin: 0.5rem 0; }
    .lms-content ul, .lms-content ol { margin: 0.5rem 0 0.5rem 1.5rem; list-style: revert; }
    .lms-content table { border-collapse: collapse; margin: 0.5rem 0; }
    .lms-content td, .lms-content th { border: 1px solid #e2e8f0; padding: 0.375rem 0.625rem; }

  <script>
    // Tìm kiếm không phân biệt dấu tiếng Việt
    function vnorm(s) {
      return (s || '').toLowerCase().normalize('NFD')
        .replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
    }
    // ── Mốc "7 ngày gần nhất" ───────────────────────────────────────────────
    // So bằng giờ trình duyệt nên luôn đúng tương đối với lúc người xem mở trang.
    // `data-ts` nằm trên thẻ bọc [data-item], KHÔNG nằm trên thẻ tiêu đề bên
    // trong — từ Alpine phải truyền $el.closest('[data-item]'), không thì
    // dataset.ts là undefined và mục nào cũng bị coi là cũ (hỏng không báo lỗi).
    var RECENT_WINDOW_MS = 7 * 24 * 60 * 60 * 1000;
    function isRecentEl(el) {
      var ts = el && +el.dataset.ts;
      return !!ts && (Date.now() - ts) <= RECENT_WINDOW_MS;
    }
    function recentItems() {
      return Array.from(document.querySelectorAll('[data-item][data-ts]')).filter(isRecentEl);
    }
    function recentStats(done) {
      var els = recentItems();
      return {
        total: els.length,
        done: els.filter(function (el) { return done[el.dataset.pkey]; }).length
      };
    }
    function recentPct(done) {
      var s = recentStats(done);
      return s.total ? Math.round(s.done / s.total * 100) : 0;
    }
    // box phải là chính thẻ [data-module] (dùng $el.closest), vì hàm tìm mục con
    function moduleIsRecent(box) {
      return Array.from(box.querySelectorAll('[data-item][data-ts]')).some(isRecentEl);
    }
    // Lọc loại nội dung (OR trong nhóm); Homework và "chưa học" nhân AND với nhóm đó
    function typeOk(el, f) {
      if (f.hw && el.dataset.hw !== '1') return false;
      if (f.todo && f.done[el.dataset.pkey]) return false;
      if (f.recent7 && !isRecentEl(el)) return false;
      return !f.types.length || f.types.includes(el.dataset.type);
    }
    function itemMatches(el, f) {
      return typeOk(el, f) && (!f.q || vnorm(el.dataset.title).includes(vnorm(f.q)));
    }
    // Đề mục (SubHeader) chỉ hiện khi còn ít nhất 1 mục thuộc nó đang hiển thị
    function headingMatches(el, f) {
      if (!f.q && !f.types.length && !f.hw && !f.todo && !f.recent7) return true;
      const box = el.closest('[data-module]');
      if (!box) return true;
      return Array.from(box.querySelectorAll('[data-sec="' + el.dataset.sec + '"][data-item]'))
        .some(c => itemMatches(c, f));
    }
    function moduleMatches(el, f) {
      const items = Array.from(el.querySelectorAll('[data-item]'));
      const pass = items.filter(c => typeOk(c, f));
      if (!pass.length) return false;
      if (!f.q) return true;
      if (vnorm(el.dataset.title).includes(vnorm(f.q))) return true;
      return pass.some(c => vnorm(c.dataset.title).includes(vnorm(f.q)));
    }
    // ---- Menu bên trái -------------------------------------------------------
    /** Mục menu có hiện không. Dùng CHÍNH `moduleMatches` mà thân trang dùng —
        chép lại luật lọc sang đây là tạo hai bản sẽ lệch nhau, và lệch theo
        hướng menu chỉ tới một học phần đang bị ẩn. */
    function mucHien(i, f) {
      const el = document.getElementById('mod-' + i);
      return !el || moduleMatches(el, f);
    }
    /** Nhảy tới học phần: phải MỞ nó ra trước, không thì cuộn tới một cái hộp
        đang gập và người dùng tưởng bấm hụt. */
    function toiMuc(i) {
      const el = document.getElementById('mod-' + i);
      if (!el) return;
      try { Alpine.$data(el).open = true; } catch (e) {}
      // ⚠ Phải chờ khối GIÃN RA XONG rồi mới cuộn. Lúc bấm thì mọi khối còn
      // gập nên trang ngắn, `scrollTo` bị kẹp vào đáy trang và dừng giữa chừng
      // — đo được hụt 471px. Khối mở ra làm trang cao thêm, nhưng lúc đó đã
      // cuộn rồi, và không có gì cuộn tiếp.
      //
      // ⚠ Cũng KHÔNG dùng `scroll-margin-top` cố định: header dính cao khác
      // nhau theo bề rộng (đo: 175px ở 1280px, 259px ở 390px vì chip lọc xuống
      // dòng). Một con số CSS thì hoặc thừa chỗ, hoặc để tiêu đề chui xuống
      // dưới header — mà cái sau trông y như bấm hụt.
      const han = performance.now() + 800;      // trần, để không chờ mãi
      let truoc = -1;
      const thu = () => {
        const cao = document.body.scrollHeight;
        if (cao !== truoc && performance.now() < han) {
          truoc = cao;
          return requestAnimationFrame(thu);
        }
        const h = document.querySelector('header');
        const off = h ? h.getBoundingClientRect().height : 0;
        const y = el.getBoundingClientRect().top + window.scrollY - off - 8;
        window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
      };
      requestAnimationFrame(thu);
    }

    // ---- Checkbox của tiêu đề nhóm ------------------------------------------
    // Mọi mục con thuộc cùng data-sec trong cùng tuần/bài. Tiêu đề kiểu Page CÓ
    // nội dung cũng là một mục nên tự nằm trong danh sách — tick nhóm là tick cả
    // nó. Page rỗng thì không có [data-item] nên đứng ngoài phép đếm.
    function secEntries(head) {
      const box = head.closest('[data-module]');
      if (!box) return [];
      return Array.from(box.querySelectorAll('[data-item][data-sec="' + head.dataset.sec + '"]'))
        .map(c => ({ key: c.dataset.pkey, hash: c.dataset.hash || '' }));
    }
    // Ba trạng thái: xong hết → tick; xong một phần → gạch ngang; chưa gì → trống
    function syncSecBox(el, done) {
      const e = secEntries(el.closest('[data-sechead]'));
      const n = e.filter(x => done[x.key]).length;
      el.checked = e.length > 0 && n === e.length;
      el.indeterminate = n > 0 && n < e.length;
      return e.length;
    }

    // Đếm số mục đã học trong một tuần/bài
    function moduleDone(el, done) {
      const items = Array.from(el.querySelectorAll('[data-item]'));
      return items.filter(c => done[c.dataset.pkey]).length;
    }

    // ---- Tiến độ học tập ----------------------------------------------------
    // Đọc/ghi qua /api/progress (Cloudflare Pages Function + Workers KV).
    // Mã bí mật chỉ cần khi GHI, lưu trong localStorage của trình duyệt.
    // Nếu không có backend (mở file cục bộ, hoặc bản trên GitHub Pages) thì
    // trang vẫn xem được bình thường, chỉ tắt phần đánh dấu.

    /* ── Tra cứu khi bôi đen ────────────────────────────────────────────────
       Phải là HÀM trong <script>, không được nhét thẳng vào thuộc tính `x-data`:
       `x-data` là một thuộc tính HTML, mà phần logic dùng chung dài ~160 dòng và
       có cả dấu nháy kép — nhét vào là vỡ cú pháp HTML và TOÀN BỘ Alpine của
       trang chết theo (đã dính: 70 lỗi "p is not defined"). `study.html` không
       gặp vì logic của nó vốn nằm trong `studyStore()`. */
    function progressStore() {
      return {
        done: {}, hashes: {}, ready: false, online: false, saving: 0, err: '',
        secret: localStorage.getItem('lms_key') || '',

        async init() {
          try {
            const r = await fetch('/api/progress', { headers: { accept: 'application/json' } });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const d = await r.json();
            const items = d.items || {};
            // Ba trạng thái, KHÔNG phải hai. `redo` do hệ thống đặt khi nội dung bài
            // đổi sau lúc đánh dấu; người dùng không tự đặt được. Nó KHÔNG nằm trong
            // `done`, nhờ vậy ô tick của nhóm và mọi phép đếm tự coi là chưa xong —
            // không phải sửa chỗ nào khác.
            this.redo = Object.fromEntries(Object.entries(items)
              .filter(([, v]) => v && v.redo).map(([k]) => [k, true]));
            this.done = Object.fromEntries(Object.keys(items)
              .filter(k => !this.redo[k]).map(k => [k, true]));
            // Vân tay nội dung lúc đánh dấu, để phát hiện bài bị sửa sau đó
            this.hashes = Object.fromEntries(
              Object.entries(items).filter(([, v]) => v && v.hash && !v.redo)
                .map(([k, v]) => [k, v.hash]));
            this.online = true;
          } catch (e) {
            this.online = false;   // không có backend → chế độ chỉ đọc
          }
          this.ready = true;
        },

        // Bài đã học nhưng nội dung đổi từ sau lúc đánh dấu.
        // Mục đánh dấu trước khi có tính năng này không có hash → không báo.
        redo: {},

        stale(key, hash) {
          return !!this.done[key] && !!this.hashes[key] && !!hash && this.hashes[key] !== hash;
        },

        async toggle(key, hash) {
          if (!this.online) return;
          if (!this.secret) { if (!(await this.askSecret())) return; }
          const next = !this.done[key];
          const prevHash = this.hashes[key];
          const prevRedo = this.redo[key];
          // Bấm vào ô "đang thực hiện" là xác nhận đã học lại → hoàn thành. Người
          // dùng chỉ đi được giữa HOÀN THÀNH và CHƯA THỰC HIỆN; trạng thái giữa
          // chỉ hệ thống đặt.
          delete this.redo[key];
          if (next) { this.done[key] = true; if (hash) this.hashes[key] = hash; }
          else { delete this.done[key]; delete this.hashes[key]; }
          this.saving++; this.err = '';
          try {
            const r = await fetch('/api/progress', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-progress-key': this.secret },
              body: JSON.stringify({ key, done: next, hash: hash || '' }),
            });
            if (r.status === 401) {
              this.secret = ''; localStorage.removeItem('lms_key');
              throw new Error('Mã bí mật không đúng');
            }
            if (!r.ok) throw new Error('Không lưu được (HTTP ' + r.status + ')');
          } catch (e) {
            // hoàn tác cả trạng thái, vân tay LẪN cờ đang-thực-hiện. Thiếu vế
            // cuối thì ghi hỏng mạng sẽ âm thầm nuốt mất trạng thái giữa.
            if (next) { delete this.done[key]; delete this.hashes[key]; }
            else { this.done[key] = true; if (prevHash) this.hashes[key] = prevHash; }
            if (prevRedo) { this.redo[key] = true; delete this.done[key]; }
            this.err = e.message;
            setTimeout(() => (this.err = ''), 4000);
          } finally {
            this.saving--;
          }
        },

        // Tick/bỏ tick cả một nhóm trong một lượt gọi — tránh bắn N request
        async setMany(entries, want) {
          if (!this.online || !entries.length) return;
          if (!this.secret) { if (!(await this.askSecret())) return; }
          const prevDone = { ...this.done }, prevHash = { ...this.hashes };
          const updates = {};
          for (const e of entries) {
            if (want) {
              this.done[e.key] = true;
              if (e.hash) this.hashes[e.key] = e.hash;
              updates[e.key] = { hash: e.hash };
            } else {
              delete this.done[e.key]; delete this.hashes[e.key];
              updates[e.key] = false;
            }
          }
          this.saving++; this.err = '';
          try {
            const r = await fetch('/api/progress', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-progress-key': this.secret },
              body: JSON.stringify({ updates }),
            });
            if (r.status === 401) {
              this.secret = ''; localStorage.removeItem('lms_key');
              throw new Error('Mã bí mật không đúng');
            }
            if (!r.ok) throw new Error('Không lưu được (HTTP ' + r.status + ')');
          } catch (e) {
            this.done = prevDone; this.hashes = prevHash;   // hoàn tác cả nhóm
            this.err = e.message;
            setTimeout(() => (this.err = ''), 4000);
          } finally {
            this.saving--;
          }
        },

        // Xác nhận đã xem lại bài vừa được cập nhật: giữ nguyên "đã học",
        // chỉ ghi đè vân tay bằng nội dung mới nhất
        async seen(key, hash) {
          if (!this.online || !hash) return;
          if (!this.secret) { if (!(await this.askSecret())) return; }
          const prev = this.hashes[key];
          this.hashes[key] = hash;
          this.saving++;
          try {
            const r = await fetch('/api/progress', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-progress-key': this.secret },
              body: JSON.stringify({ key, done: true, hash }),
            });
            if (!r.ok) throw new Error('Không lưu được (HTTP ' + r.status + ')');
          } catch (e) {
            this.hashes[key] = prev;
            this.err = e.message;
            setTimeout(() => (this.err = ''), 4000);
          } finally {
            this.saving--;
          }
        },

        async askSecret() {
          const v = (prompt('Nhập mã bí mật để đánh dấu tiến độ:') || '').trim();
          if (!v) return false;
          try {
            const r = await fetch('/api/progress?check=1', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-progress-key': v },
              body: '{}',
            });
            if (!r.ok) { alert('Mã không đúng.'); return false; }
          } catch { alert('Không kết nối được máy chủ.'); return false; }
          this.secret = v; localStorage.setItem('lms_key', v);
          return true;
        },
      };
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen"
      x-data="{ q: '', types: [], hw: false, todo: false, recent7: false, menuMo: false, p: progressStore(),
                toggle(t) { this.types.includes(t) ? this.types.splice(this.types.indexOf(t), 1) : this.types.push(t) },
                get filtering() { return this.types.length > 0 || this.hw || this.todo || this.recent7 },
                get f() { return { q: this.q, types: this.types, hw: this.hw, todo: this.todo, recent7: this.recent7, done: this.p.done } } }"
      x-init="p.init()">

       phần đầu mục lục chui xuống dưới header — vẫn thấy mục lục, chỉ mất mấy

  <!-- Chiều cao header dính ĐO bằng ResizeObserver, không viết cứng: chip lọc
       xuống dòng ở màn hẹp và tên môn dài hai dòng đều đổi con số này (đo: 175px
       ở 1280px, 259px ở 390px). Cùng khuôn với study.html. -->
  <script>
    (function () {
      var h = document.getElementById('hdr');
      if (!h) return;
      var r = document.documentElement;
      r.style.setProperty('--hdr', '0px');
      var do_ = function () { r.style.setProperty('--hdr', h.offsetHeight + 'px'); };
      do_();
      if (window.ResizeObserver) new ResizeObserver(do_).observe(h);
      else addEventListener('resize', do_);
    })();
  </script>
