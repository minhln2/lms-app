<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 220" font-size="13" text-anchor="middle">
  <!-- boiling beaker -->
  <text x="130" y="18" font-weight="700" fill="#dc2626">BOILING</text>
  <path d="M70,40 L70,160 Q70,170 80,170 L180,170 Q190,170 190,160 L190,40" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="72" y="70" width="116" height="98" fill="#bae6fd"/>
  <g fill="#fff" stroke="#0284c7"><circle cx="95" cy="150" r="6"/><circle cx="130" cy="125" r="8"/><circle cx="165" cy="145" r="5"/><circle cx="110" cy="100" r="7"/><circle cx="155" cy="95" r="6"/><circle cx="125" cy="155" r="5"/></g>
  <g stroke="#94a3b8" fill="none" stroke-width="2"><path d="M105,62 q-6,-10 0,-20"/><path d="M130,62 q-6,-10 0,-20"/><path d="M155,62 q-6,-10 0,-20"/></g>
  <text x="130" y="192">🔥🔥🔥</text>
  <text x="130" y="212" font-size="12" fill="#334155">bubbles of gas form ALL through the liquid</text>
  <!-- evaporation -->
  <text x="390" y="18" font-weight="700" fill="#0369a1">EVAPORATION</text>
  <path d="M330,40 L330,160 Q330,170 340,170 L440,170 Q450,170 450,160 L450,40" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="332" y="90" width="116" height="78" fill="#bae6fd"/>
  <g fill="#0284c7"><circle cx="360" cy="70" r="4"/><circle cx="405" cy="55" r="4"/><circle cx="425" cy="78" r="4"/></g>
  <g stroke="#0284c7" stroke-width="1.5"><path d="M360,88 L360,78"/><path d="M405,88 L405,62"/><path d="M425,88 L425,85"/></g>
  <text x="390" y="192">☀ any temperature</text>
  <text x="390" y="212" font-size="12" fill="#334155">particles leave ONLY from the surface</text>
</svg>
