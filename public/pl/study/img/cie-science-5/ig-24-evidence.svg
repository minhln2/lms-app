<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 190" font-size="13" text-anchor="middle">
  <text x="260" y="20" font-weight="700" fill="#0f172a">3 signs a reaction happened (p.58–59)</text>
  <rect x="10" y="35" width="160" height="145" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="90" y="80" font-size="34">🫧</text><text x="90" y="110" font-weight="700">A gas</text>
  <text x="90" y="135" font-size="11" fill="#475569">vinegar +</text><text x="90" y="150" font-size="11" fill="#475569">bicarbonate of soda</text>
  <rect x="180" y="35" width="160" height="145" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <circle cx="240" cy="70" r="16" fill="#d97706"/><text x="262" y="76" font-size="16">→</text><circle cx="285" cy="70" r="16" fill="#1e1b4b"/>
  <text x="260" y="110" font-weight="700">A colour change</text>
  <text x="260" y="135" font-size="11" fill="#475569">iodine solution +</text><text x="260" y="150" font-size="11" fill="#475569">cornstarch</text>
  <rect x="350" y="35" width="160" height="145" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="430" y="80" font-size="34">🌡️</text><text x="430" y="110" font-weight="700">A temperature change</text>
  <text x="430" y="135" font-size="11" fill="#475569">vinegar on</text><text x="430" y="150" font-size="11" fill="#475569">wire wool</text>
</svg>
