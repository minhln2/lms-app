<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 220" font-size="13">
  <text x="10" y="18" font-weight="700" fill="#0f172a">How well they conduct (book table, p.47)</text>
  <rect x="300" y="28" width="12" height="12" fill="#f97316"/><text x="317" y="39" font-size="12">heat</text>
  <rect x="370" y="28" width="12" height="12" fill="#eab308"/><text x="387" y="39" font-size="12">electricity ⚡</text>
  <g>
    <text x="10" y="68">copper</text><rect x="100" y="56" width="386" height="9" fill="#f97316"/><rect x="100" y="67" width="236" height="9" fill="#eab308"/>
    <text x="10" y="103">aluminium</text><rect x="100" y="91" width="237" height="9" fill="#f97316"/><rect x="100" y="102" width="148" height="9" fill="#eab308"/>
    <text x="10" y="138" font-weight="700" fill="#b91c1c">graphite</text><rect x="100" y="126" width="168" height="9" fill="#f97316"/><rect x="100" y="137" width="4" height="9" fill="#eab308"/><text x="112" y="146" font-size="11" fill="#b91c1c">← heat yes, electricity hardly</text>
    <text x="10" y="173">brass</text><rect x="100" y="161" width="150" height="9" fill="#f97316"/><rect x="100" y="172" width="64" height="9" fill="#eab308"/>
    <text x="10" y="208">steel</text><rect x="100" y="196" width="80" height="9" fill="#f97316"/><rect x="100" y="207" width="40" height="9" fill="#eab308"/>
  </g>
