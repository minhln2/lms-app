<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 230" font-size="13">
  <text x="10" y="18" font-weight="700" fill="#0f172a">Melting point — each substance has its own (p.36, p.62)</text>
  <defs><linearGradient id="hot" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs>
  <g fill="#0f172a">
    <text x="10" y="48">🧊 ice</text>       <rect x="120" y="36" width="3" height="16" fill="#60a5fa"/><text x="130" y="48" font-weight="700">0 °C</text>
    <text x="10" y="78">candle wax</text><rect x="120" y="66" width="18" height="16" rx="3" fill="url(#hot)"/><text x="145" y="78" font-weight="700">60 °C</text>
    <text x="10" y="108">aluminium</text>   <rect x="120" y="96" width="198" height="16" rx="3" fill="url(#hot)"/><text x="325" y="108" font-weight="700">660 °C</text>
    <text x="10" y="138">silver</text>      <rect x="120" y="126" width="289" height="16" rx="3" fill="url(#hot)"/><text x="416" y="138" font-weight="700">962 °C</text>
    <text x="10" y="168">gold</text>        <rect x="120" y="156" width="319" height="16" rx="3" fill="url(#hot)"/><text x="446" y="168" font-weight="700">1064 °C</text>
    <text x="10" y="198">copper</text>      <rect x="120" y="186" width="325" height="16" rx="3" fill="url(#hot)"/><text x="452" y="198" font-weight="700">1083 °C</text>
  </g>
  <text x="10" y="224" font-size="11" fill="#64748b">Boiling point: pure water 100 °C · vinegar 118 °C · gold 2856 °C</text>
</svg>
