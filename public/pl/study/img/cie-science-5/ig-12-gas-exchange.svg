<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 200" font-size="13" text-anchor="middle">
<defs>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
 <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
 <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
 <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
 <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
</defs>

<text x="260" y="20" font-weight="700" fill="#0f172a">In the lungs, gases swap between the air and the blood (p.14)</text>
<rect x="20" y="38" width="170" height="120" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
<text x="105" y="62" font-weight="700" fill="#075985">AIR in the lungs</text><text x="105" y="140" font-size="11.5" fill="#475569">breathed in and out</text>
<rect x="330" y="38" width="170" height="120" rx="14" fill="#fee2e2" stroke="#dc2626"/>
<text x="415" y="62" font-weight="700" fill="#b91c1c">BLOOD</text><text x="415" y="78" font-size="11.5" fill="#b91c1c">in the lungs' blood vessels</text>
<path d="M195,92 L325,92" stroke="#16a34a" stroke-width="4" marker-end="url(#ag)"/>
<text x="260" y="84" font-weight="700" fill="#15803d">oxygen</text>
<path d="M325,128 L195,128" stroke="#64748b" stroke-width="4" marker-end="url(#ak)"/>
<text x="260" y="148" font-weight="700" fill="#334155">carbon dioxide</text>
<text x="105" y="100" font-size="12" fill="#075985">⬇ breathe IN</text><text x="105" y="118" font-size="12" fill="#075985">⬆ breathe OUT</text>
<text x="415" y="110" font-size="11.5" fill="#475569">→ heart → body</text><text x="415" y="128" font-size="11.5" fill="#475569">← back from the body</text>
<text x="260" y="186" font-size="11.5" fill="#475569">The body uses up oxygen and makes carbon dioxide.</text>
</svg>
