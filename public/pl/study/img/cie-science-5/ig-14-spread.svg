<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 152" font-size="13" text-anchor="middle">
<text x="260.0" y="20" font-weight="700" fill="#0f172a">Diseases spread in four ways (p.27)</text>
<rect x="8" y="30" width="120" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="68" y="70" font-size="30">🤝</text><text x="68" y="98" font-weight="700" fill="#0f172a">body contact</text><text x="68" y="116" font-size="11.5" fill="#475569">touching, open</text><text x="68" y="131" font-size="11.5" fill="#475569">wounds</text>
<rect x="136" y="30" width="120" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="196" y="70" font-size="30">🍲</text><text x="196" y="98" font-weight="700" fill="#0f172a">food</text><text x="196" y="116" font-size="11.5" fill="#475569">dirty or</text><text x="196" y="131" font-size="11.5" fill="#475569">uncovered food</text>
<rect x="264" y="30" width="120" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="324" y="70" font-size="30">💧</text><text x="324" y="98" font-weight="700" fill="#0f172a">water</text><text x="324" y="116" font-size="11.5" fill="#475569">unsafe water</text><text x="324" y="131" font-size="11.5" fill="#475569">from rivers</text>
<rect x="392" y="30" width="120" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="452" y="70" font-size="30">🤧</text><text x="452" y="98" font-weight="700" fill="#0f172a">air</text><text x="452" y="116" font-size="11.5" fill="#475569">coughs and</text><text x="452" y="131" font-size="11.5" fill="#475569">sneezes</text>
</svg>
