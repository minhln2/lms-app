<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 330" font-size="13" text-anchor="middle">
<defs>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
 <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
 <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
 <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
 <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
</defs>

<text x="260" y="20" font-weight="700" fill="#0f172a">The pathway of blood — always the same (p.5)</text>
<rect x="190" y="34" width="140" height="44" rx="12" fill="#fce7f3" stroke="#db2777"/><text x="260" y="62" font-weight="700" fill="#9d174d">🫁 LUNGS</text>
<rect x="190" y="268" width="140" height="44" rx="12" fill="#f1f5f9" stroke="#64748b"/><text x="260" y="296" font-weight="700" fill="#334155">THE BODY</text>
<!-- tim: hai nửa, nhìn như sách: nửa TRÁI hình = bên PHẢI tim -->
<rect x="178" y="138" width="80" height="70" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<rect x="262" y="138" width="80" height="70" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="218" y="165" font-weight="700" fill="#1d4ed8" font-size="12">right side</text><text x="218" y="182" font-size="11" fill="#1d4ed8">of the heart</text><text x="218" y="198" font-size="10.5" fill="#1d4ed8">no oxygen</text>
<text x="302" y="165" font-weight="700" fill="#b91c1c" font-size="12">left side</text><text x="302" y="182" font-size="11" fill="#b91c1c">of the heart</text><text x="302" y="198" font-size="10.5" fill="#b91c1c">with oxygen</text>
<text x="260" y="226" font-size="10.5" fill="#64748b">(drawn as if the heart faces you)</text>
<!-- 1 tim phải → phổi (động mạch, máu không oxy) -->
<path d="M190,140 C120,120 120,70 186,58" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#ab)"/>
<circle cx="120" cy="96" r="11" fill="#2563eb"/><text x="120" y="101" fill="#fff" font-weight="700" font-size="12">1</text>
<text x="70" y="88" font-size="11" fill="#1d4ed8">artery</text><text x="70" y="102" font-size="11" fill="#1d4ed8">to the lungs</text>
<!-- 2 phổi → tim trái (tĩnh mạch, máu có oxy) -->
<path d="M334,58 C400,70 400,120 330,140" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#ar)"/>
<circle cx="400" cy="96" r="11" fill="#dc2626"/><text x="400" y="101" fill="#fff" font-weight="700" font-size="12">2</text>
<text x="418" y="90" font-size="11" fill="#b91c1c" text-anchor="start">vein: back to the</text><text x="418" y="104" font-size="11" fill="#b91c1c" text-anchor="start">heart, with oxygen</text>
<!-- 3 tim trái → cơ thể (động mạch, có oxy) -->
<path d="M330,206 C400,226 400,270 334,286" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#ar)"/>
<circle cx="400" cy="248" r="11" fill="#dc2626"/><text x="400" y="253" fill="#fff" font-weight="700" font-size="12">3</text>
<text x="418" y="242" font-size="11" fill="#b91c1c" text-anchor="start">artery: oxygen</text><text x="418" y="256" font-size="11" fill="#b91c1c" text-anchor="start">to the body</text>
<!-- 4 cơ thể → tim phải (tĩnh mạch, ít oxy) -->
<path d="M186,286 C120,270 120,226 190,206" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#ab)"/>
<circle cx="120" cy="248" r="11" fill="#2563eb"/><text x="120" y="253" fill="#fff" font-weight="700" font-size="12">4</text>
<text x="62" y="242" font-size="11" fill="#1d4ed8">vein: back to</text><text x="62" y="256" font-size="11" fill="#1d4ed8">the heart</text>
<text x="260" y="326" font-size="11" fill="#64748b">red = blood with oxygen · blue = blood without oxygen</text>
</svg>
