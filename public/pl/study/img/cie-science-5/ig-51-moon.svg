<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 230" font-size="13" text-anchor="middle">
<defs>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
 <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
 <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
 <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
 <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
</defs>

<text x="260" y="20" font-weight="700" fill="#0f172a">The same astronaut on the Earth and on the Moon (p.113)</text>
<!-- Trái Đất -->
<path d="M20,210 Q130,170 240,210 Z" fill="#60a5fa"/><text x="130" y="205" fill="#fff" font-weight="700">EARTH</text>
<text x="130" y="100" font-size="40">🧑‍🚀</text>
<path d="M175,70 L175,175" stroke="#dc2626" stroke-width="6" marker-end="url(#ar)"/>
<text x="205" y="120" font-size="12" fill="#b91c1c" text-anchor="start">weight</text><text x="205" y="135" font-size="12" fill="#b91c1c" text-anchor="start">bigger</text>
<!-- Mặt Trăng -->
<path d="M280,210 Q390,170 500,210 Z" fill="#cbd5e1"/><text x="390" y="205" fill="#334155" font-weight="700">MOON</text>
<text x="390" y="100" font-size="40">🧑‍🚀</text>
<path d="M435,110 L435,150" stroke="#dc2626" stroke-width="6" marker-end="url(#ar)"/>
<text x="460" y="125" font-size="12" fill="#b91c1c" text-anchor="start">weight</text><text x="460" y="140" font-size="12" fill="#b91c1c" text-anchor="start">smaller</text>
<rect x="160" y="34" width="200" height="26" rx="13" fill="#ecfdf5" stroke="#10b981"/>
<text x="260" y="52" font-weight="700" fill="#047857">mass: the SAME on both</text>
<text x="260" y="226" font-size="11" fill="#64748b">The Moon has less mass than the Earth, so its gravity is weaker.</text>
</svg>
