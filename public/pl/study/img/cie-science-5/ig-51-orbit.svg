<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 250" font-size="13" text-anchor="middle">
<defs>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
 <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
 <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
 <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
 <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
</defs>

<text x="260" y="20" font-weight="700" fill="#0f172a">Why astronauts float in the Space Station (p.116)</text>
<circle cx="150" cy="165" r="58" fill="#60a5fa"/><text x="150" y="170" fill="#fff" font-weight="700">EARTH</text>
<circle cx="150" cy="165" r="98" fill="none" stroke="#94a3b8" stroke-dasharray="5 5"/>
<text x="150" y="74" font-size="22">🛰️</text>
<path d="M172,67 L250,67" stroke="#16a34a" stroke-width="4" marker-end="url(#ag)"/>
<text x="258" y="72" font-size="12" fill="#15803d" font-weight="700" text-anchor="start">moves forward</text>
<path d="M150,80 L150,104" stroke="#dc2626" stroke-width="4" marker-end="url(#ar)"/>
<text x="112" y="98" font-size="12" fill="#b91c1c" font-weight="700">falls</text>
<rect x="290" y="96" width="220" height="132" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g text-anchor="start" font-size="12" fill="#334155">
<text x="302" y="118">• gravity pulls the station</text><text x="312" y="134">towards the Earth</text>
<text x="302" y="156">• its forward motion just about</text><text x="312" y="172">equals the speed of its fall</text>
<text x="302" y="194">• so it goes round and round,</text><text x="312" y="210">and astronauts are not pulled</text><text x="312" y="224">any one way → they float</text>
</g>
</svg>
