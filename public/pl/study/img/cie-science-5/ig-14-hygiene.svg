<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 272" font-size="13" text-anchor="middle">
<text x="260.0" y="20" font-weight="700" fill="#0f172a">Good hygiene: keep yourself and things around you clean (p.27)</text>
<rect x="8" y="30" width="163" height="112" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="89" y="70" font-size="30">🧼</text><text x="89" y="98" font-weight="700" fill="#0f172a">wash your hands</text><text x="89" y="116" font-size="11.5" fill="#475569">soap + water: before food,</text><text x="89" y="131" font-size="11.5" fill="#475569">after the toilet and animals</text>
<rect x="179" y="30" width="163" height="112" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="260" y="70" font-size="30">🥕</text><text x="260" y="98" font-weight="700" fill="#0f172a">wash fruit + veg</text><text x="260" y="116" font-size="11.5" fill="#475569">raw, unpeeled fruit</text><text x="260" y="131" font-size="11.5" fill="#475569">and vegetables</text>
<rect x="349" y="30" width="163" height="112" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="431" y="70" font-size="30">🍱</text><text x="431" y="98" font-weight="700" fill="#0f172a">cover food</text><text x="431" y="116" font-size="11.5" fill="#475569">do not leave it out</text><text x="431" y="131" font-size="11.5" fill="#475569">when it is hot</text>
<rect x="8" y="150" width="163" height="112" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="89" y="190" font-size="30">🚰</text><text x="89" y="218" font-weight="700" fill="#0f172a">safe water</text><text x="89" y="236" font-size="11.5" fill="#475569">boil or treat</text><text x="89" y="251" font-size="11.5" fill="#475569">river water</text>
<rect x="179" y="150" width="163" height="112" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="260" y="190" font-size="30">💪</text><text x="260" y="218" font-weight="700" fill="#0f172a">cough into elbow</text><text x="260" y="236" font-size="11.5" fill="#475569">or a tissue —</text><text x="260" y="251" font-size="11.5" fill="#475569">not your hand</text>
<rect x="349" y="150" width="163" height="112" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="431" y="190" font-size="30">🩹</text><text x="431" y="218" font-weight="700" fill="#0f172a">cover wounds</text><text x="431" y="236" font-size="11.5" fill="#475569">with a plaster</text><text x="431" y="251" font-size="11.5" fill="#475569"></text>
</svg>
