<text x="260" y="20" font-weight="700" fill="#0f172a">A vector passes a parasite from person to person (p.29)</text>
<g font-size="40"><text x="70" y="88">🤒</text><text x="260" y="88">🦟</text><text x="450" y="88">🧍</text></g>
<path d="M110,72 L215,72" stroke="#ea580c" stroke-width="3" marker-end="url(#ao)"/>
<path d="M305,72 L410,72" stroke="#ea580c" stroke-width="3" marker-end="url(#ao)"/>
<text x="162" y="62" font-size="11.5" fill="#9a3412">1 bites, takes in</text><text x="162" y="94" font-size="11.5" fill="#9a3412">the parasite</text>
<text x="357" y="62" font-size="11.5" fill="#9a3412">3 bites, passes on</text><text x="357" y="94" font-size="11.5" fill="#9a3412">the parasite</text>
<text x="70" y="120" font-weight="700" fill="#0f172a">has the disease</text>
<text x="260" y="120" font-weight="700" fill="#0f172a">2 does NOT get sick</text>
<text x="260" y="136" font-size="11.5" fill="#475569">and does not cause the disease</text>
<text x="450" y="120" font-weight="700" fill="#b91c1c">now gets sick</text>
<rect x="60" y="150" width="400" height="30" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="260" y="170" font-size="12" fill="#9a3412">best protection: do not get bitten — nets, long sleeves, repellent</text>
</svg>
