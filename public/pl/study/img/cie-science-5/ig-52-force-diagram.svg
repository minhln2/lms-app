<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 200" font-size="13" text-anchor="middle">
<defs>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
 <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
 <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
 <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
 <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
</defs>

<text x="260" y="20" font-weight="700" fill="#0f172a">A force diagram: a ball rolling along a table</text>
<rect x="60" y="138" width="300" height="10" fill="#a16207"/>
<circle cx="210" cy="112" r="24" fill="#fff" stroke="#334155" stroke-width="2"/>
<path d="M236,112 L340,112" stroke="#ea580c" stroke-width="5" marker-end="url(#ao)"/><text x="300" y="102" font-weight="700" fill="#c2410c">push</text>
<path d="M184,112 L140,112" stroke="#2563eb" stroke-width="5" marker-end="url(#ab)"/><text x="150" y="102" font-weight="700" fill="#1d4ed8">friction</text>
<path d="M210,138 L210,186" stroke="#dc2626" stroke-width="5" marker-end="url(#ar)"/><text x="248" y="180" font-weight="700" fill="#b91c1c">gravity</text>
<rect x="378" y="46" width="134" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<g text-anchor="start" font-size="12" fill="#334155"><text x="388" y="68">each arrow shows:</text>
<text x="388" y="90">• <tspan font-weight="700">name</tspan> — the label</text><text x="388" y="110">• <tspan font-weight="700">size</tspan> — its length</text><text x="388" y="130">• <tspan font-weight="700">direction</tspan> — where</text><text x="398" y="144">it points</text></g>
<text x="190" y="60" font-size="11.5" fill="#475569">longer arrow = bigger force</text>
</svg>
