<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 170" font-size="13" text-anchor="middle">
  <text x="260" y="20" font-weight="700" fill="#0f172a">Two ways to make sugar dissolve FASTER (p.53–54)</text>
  <rect x="20" y="35" width="230" height="120" rx="12" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="135" y="75" font-size="30">🥄</text>
  <text x="135" y="105" font-weight="700">Stir</text>
  <text x="135" y="125" font-size="11" fill="#475569">spreads sugar particles into the</text>
  <text x="135" y="140" font-size="11" fill="#475569">spaces between water particles</text>
  <rect x="270" y="35" width="230" height="120" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <text x="385" y="75" font-size="30">♨️</text>
  <text x="385" y="105" font-weight="700">Use hot water</text>
  <text x="385" y="125" font-size="11" fill="#475569">particles gain energy and move</text>
  <text x="385" y="140" font-size="11" fill="#475569">faster → stopwatch time is shorter</text>
</svg>
