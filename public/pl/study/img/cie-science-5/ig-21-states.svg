<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 210">
  <defs>
    <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  </defs>
  <!-- boxes -->
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">
    <rect x="10" y="50" width="130" height="110" rx="12" fill="#eef2ff" stroke="#6366f1"/>
    <text x="75" y="180">SOLID</text>
    <rect x="195" y="50" width="130" height="110" rx="12" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="260" y="180">LIQUID</text>
    <rect x="380" y="50" width="130" height="110" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="445" y="180">GAS</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#475569">
    <text x="75" y="198">packed, fixed shape</text><text x="260" y="198">close, slide past</text><text x="445" y="198">far apart, fast</text>
  </g>
  <!-- particles -->
  <g fill="#6366f1"><circle cx="45" cy="80" r="9"/><circle cx="75" cy="80" r="9"/><circle cx="105" cy="80" r="9"/><circle cx="45" cy="105" r="9"/><circle cx="75" cy="105" r="9"/><circle cx="105" cy="105" r="9"/><circle cx="45" cy="130" r="9"/><circle cx="75" cy="130" r="9"/><circle cx="105" cy="130" r="9"/></g>
  <g fill="#0ea5e9"><circle cx="225" cy="88" r="9"/><circle cx="252" cy="82" r="9"/><circle cx="290" cy="95" r="9"/><circle cx="222" cy="115" r="9"/><circle cx="258" cy="110" r="9"/><circle cx="292" cy="122" r="9"/><circle cx="235" cy="140" r="9"/><circle cx="268" cy="138" r="9"/></g>
  <g fill="#f59e0b"><circle cx="402" cy="70" r="9"/><circle cx="480" cy="78" r="9"/><circle cx="440" cy="105" r="9"/><circle cx="405" cy="140" r="9"/><circle cx="485" cy="138" r="9"/></g>
  <!-- heat arrows top -->
  <g font-size="12" font-weight="600" text-anchor="middle">
    <path d="M100,45 Q167,5 230,45" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#ah-r)"/>
    <text x="167" y="18" fill="#dc2626">🔥 melting</text>
    <path d="M290,45 Q352,5 415,45" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#ah-r)"/>
    <text x="352" y="18" fill="#dc2626">🔥 boiling · evaporation</text>
    <!-- cool arrows bottom, drawn inside gaps -->
    <path d="M190,135 L146,135" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ah-b)"/>
    <text x="167" y="125" fill="#2563eb" font-size="11">❄ freezing</text>
    <path d="M375,135 L331,135" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ah-b)"/>
    <text x="352" y="125" fill="#2563eb" font-size="11">❄ condensing</text>
  </g>
</svg>
