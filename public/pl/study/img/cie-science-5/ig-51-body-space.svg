<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 272" font-size="13" text-anchor="middle">
<text x="260.0" y="20" font-weight="700" fill="#0f172a">What weightlessness does to the body (p.116–117)</text>
<rect x="8" y="30" width="248" height="112" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="132" y="70" font-size="30">🧭</text><text x="132" y="98" font-weight="700" fill="#0f172a">up and down?</text><text x="132" y="116" font-size="11.5" fill="#475569">the sense of up and down</text><text x="132" y="131" font-size="11.5" fill="#475569">gets confused</text>
<rect x="264" y="30" width="248" height="112" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="388" y="70" font-size="30">🦴</text><text x="388" y="98" font-weight="700" fill="#0f172a">weaker bones</text><text x="388" y="116" font-size="11.5" fill="#475569">calcium is lost</text><text x="388" y="131" font-size="11.5" fill="#475569">→ break more easily</text>
<rect x="8" y="150" width="248" height="112" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="132" y="190" font-size="30">🏋️</text><text x="132" y="218" font-weight="700" fill="#0f172a">weaker muscles</text><text x="132" y="236" font-size="11.5" fill="#475569">astronauts exercise</text><text x="132" y="251" font-size="11.5" fill="#475569">two hours a day</text>
<rect x="264" y="150" width="248" height="112" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="388" y="190" font-size="30">🏥</text><text x="388" y="218" font-weight="700" fill="#0f172a">back on Earth</text><text x="388" y="236" font-size="11.5" fill="#475569">after six months in space:</text><text x="388" y="251" font-size="11.5" fill="#475569">months of rehabilitation</text>
</svg>
