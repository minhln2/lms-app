<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 520 200" font-size="13" text-anchor="middle">
  <text x="260" y="18" font-weight="700" fill="#0f172a">Air is matter: it takes up space and has mass (p.39–40)</text>
  <!-- before -->
  <line x1="40" y1="70" x2="220" y2="70" stroke="#92400e" stroke-width="5"/><path d="M130,70 L130,40" stroke="#334155" stroke-width="2"/>
  <ellipse cx="55" cy="110" rx="18" ry="24" fill="#f472b6"/><line x1="55" y1="70" x2="55" y2="86" stroke="#334155"/>
  <ellipse cx="205" cy="110" rx="18" ry="24" fill="#f472b6"/><line x1="205" y1="70" x2="205" y2="86" stroke="#334155"/>
  <text x="130" y="165">two full balloons → balanced</text>
  <!-- after: phía quả bóng CÒN hơi nặng hơn → chìm xuống (trái) -->
  <line x1="300" y1="85" x2="480" y2="55" stroke="#92400e" stroke-width="5"/><path d="M390,70 L390,40" stroke="#334155" stroke-width="2"/>
  <ellipse cx="315" cy="122" rx="18" ry="24" fill="#f472b6"/><line x1="315" y1="83" x2="315" y2="98" stroke="#334155"/>
  <ellipse cx="465" cy="81" rx="9" ry="11" fill="#fbcfe8"/><line x1="465" y1="57" x2="465" y2="70" stroke="#334155"/>
  <text x="465" y="110" font-size="11" fill="#64748b">air let out</text>
  <text x="390" y="165">the full balloon side goes DOWN</text>
  <text x="260" y="192" font-size="12" fill="#475569">so the air inside has mass</text>
</svg>
