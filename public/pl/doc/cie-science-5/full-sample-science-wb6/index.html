<script>
  function docStore() {
    // ⚠ Tài liệu PDF.js phải nằm NGOÀI state của Alpine. Alpine 3 bọc mọi thứ
    // trong `x-data` bằng Proxy phản ứng, còn `PDFDocumentProxy` đọc trường
    // riêng tư `#…` của chính nó — qua một Proxy thì JS ném
    // "Cannot read private member #qs from an object whose class did not
    // declare it" và trang chỉ hiện "Chưa mở được bản PDF". Để trong closure
    // thì Alpine không với tới. Cùng lý do cho IntersectionObserver.
    let _pdf = null, _oq = null, _kho = null;
    let _sp = null, _kq = [];        // danh sách span + kết quả tìm
    return {
      
      che: "pdf",
      chiDoc: false,
      // Giá trị đi vào STATE, không nhúng thẳng `|tojson` vào thuộc tính HTML:
      // `tojson` sinh chuỗi bọc nháy kép, mà thuộc tính cũng đóng bằng nháy kép
      // → đứt thuộc tính và chết cả Alpine. Đã dính BA lần trong dự án này.
      pdfGoc: "https://minhln2.github.io/lms/pl/materials/cie-science-5/books-grade-5/FULL_SAMPLE_Science_WB6.pdf",
      pdfJsUrl: "../../../../assets/pdf.e73f3ce5.mjs",
      pdfWorkerUrl: "../../../../assets/pdf.worker.490b29ce.mjs",
      tiLe: 1.2, soTrang: 0, pdfLoi: '', srcNang: '',
      mlMo: false, trangDang: 0, moUnit: {},
      // Trang bắt đầu của từng unit — để tự mở đúng unit đang đọc.
      unitTr: [],
      tim: '', soKq: 0, viTri: 0,
      user: "pl", course: "cie-science-5",
      secret: localStorage.getItem('lms_key') || '',

      // Nút loa trong popup tra cứu cần `canSpeak` + `speak`. Thiếu là popup
      // dựng ra nhưng Alpine ném "canSpeak is not defined" mỗi lần vẽ lại.
      get canSpeak() { return typeof window !== 'undefined' && ('speechSynthesis' in window || 'Audio' in window); },
      _player: null, _blobs: {}, _blobKeys: [], _BLOB_MAX: 50,
      _chamBlob(t) { const i = this._blobKeys.indexOf(t);
        if (i >= 0) { this._blobKeys.splice(i, 1); this._blobKeys.push(t); } },
      _nhoBlob(t, s) { this._blobs[t] = s; this._blobKeys.push(t);
        while (this._blobKeys.length > this._BLOB_MAX) {
          const cu = this._blobKeys.shift(); URL.revokeObjectURL(this._blobs[cu]); delete this._blobs[cu]; } },
      async speak(text, tinCay) {
        text = (text || '').trim(); if (!text) return;
        if (this._player) { this._player.pause(); this._player = null; }
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        try {
          let src = this._blobs[text];
          if (src) { this._chamBlob(text); } else {
            const h = (tinCay && this.traKhoa()) ? { headers: { 'x-progress-key': this.traKhoa() } } : undefined;
            const r = await fetch('/api/tts?user=' + this.user + '&course=' + this.course
                                  + '&text=' + encodeURIComponent(text), h);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            src = URL.createObjectURL(await r.blob()); this._nhoBlob(text, src);
          }
          this._player = new Audio(src); await this._player.play();
        } catch (e) { this.speakLocal(text); }
      },
      speakLocal(text) {
        if (!('speechSynthesis' in window)) return;
        const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
        const v = window.speechSynthesis.getVoices().find(x => /^en[-_]US/i.test(x.lang));
        if (v) u.voice = v;
        window.speechSynthesis.speak(u);
      },
      init() {
        // Nhớ lựa chọn, nhưng CHỈ khi người dùng tự bấm. Bản quét không có chế
        // độ đọc nên bị ép sang PDF; ghi lựa chọn đó xuống thì một cuốn SGK đầu
        // độc mọi tài liệu sau — đã đo: 7/9 tài liệu mở nhầm sang PDF.
        if (this.chiDoc) { this.che = 'doc'; }
        else if (this.che === null) {
          let nho = null;
          try { nho = localStorage.getItem('lms_doc_mode'); } catch (e) {}
          this.che = nho === 'pdf' ? 'pdf' : 'doc';
        }
        if (this.che === 'pdf') this.moPdf();
        this.$nextTick(() => { this.canhChuLuoi(); this.theoDoiTrang(); });
        addEventListener('resize', () => { clearTimeout(this._h); this._h = setTimeout(() => this.canhChu(), 150); });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.canhChu());
      },
      doiCheDo(c, luu) {
        this.che = c;
        if (c === 'pdf') this.moPdf();
        if (luu) { try { localStorage.setItem('lms_doc_mode', c); } catch (e) {} }
        if (c === 'doc') this.$nextTick(() => this.canhChuLuoi());
      },

      /** ── Tìm trong tài liệu ────────────────────────────────────────────
       *
       * Tìm THẲNG trên DOM, không dựng index và không tải thêm gì. Lớp chữ vốn
       * đã nằm đủ trong DOM — đó là điều kiện bắt buộc để `getSelection()` với
       * tới được — nên dữ liệu để tìm đã có sẵn, miễn phí.
       *
       * ⚠ Gom danh sách span MỘT LẦN rồi giữ lại. Một quyển 260 trang có
       * 12.940 span; đọc `textContent` của từng cái ở mỗi lần gõ phím là bắt
       * trình duyệt duyệt lại cả cây DOM cho từng ký tự.
       *
       * ⚠ Đánh dấu bằng CLASS, không chèn thẻ `<mark>`. Chèn thẻ là sửa DOM ở
       * hàng trăm chỗ và dựng hình lại cả trang — đúng cái bẫy đã làm `canhChu`
       * mất 115 giây. Chữ vốn trong suốt nên tô nền là đủ thành vệt đánh dấu.
       *
       * ⚠ Có TRẦN kết quả. Gõ một chữ cái trên sách 260 trang là hàng nghìn
       * kết quả — đánh dấu hết thì vô nghĩa với người đọc mà lại nặng máy.
       *
       * Hạn chế đã biết: mỗi span là MỘT DÒNG của bản gốc, nên cụm từ bị ngắt
       * qua hai dòng sẽ không khớp. Chấp nhận — đổi lại không tốn byte nào.
       */
      timKiem() {
        if (!_sp) {
          _sp = Array.from(document.querySelectorAll('.chu span'))
                     .map((e) => [e, (e.textContent || '').toLowerCase()]);
        }
        for (const e of _kq) e.classList.remove('tim', 'tim-nay');
        _kq = [];
        const q = (this.tim || '').trim().toLowerCase();
        this.viTri = 0;
        if (q.length < 2) { this.soKq = 0; return; }   // 1 ký tự thì vô nghĩa
        for (const [e, t] of _sp) {
          if (t.includes(q)) {
            _kq.push(e);
            if (_kq.length >= 300) break;              // trần
          }
        }
        for (const e of _kq) e.classList.add('tim');
        this.soKq = _kq.length;
        if (_kq.length) this.toiKetQua(0);
      },

      /** Nhảy tới kết quả kế tiếp (`b`=1), trước đó (-1), hoặc chính nó (0). */
      toiKetQua(b) {
        if (!_kq.length) return;
        _kq[this.viTri]?.classList.remove('tim-nay');
        this.viTri = (this.viTri + b + _kq.length) % _kq.length;
        const e = _kq[this.viTri];
        e.classList.add('tim-nay');
        // Mở trang chứa nó ra trước đã: ảnh nạp lười nên khung có thể chưa cao
        // đúng, và lớp chữ của trang đó có thể chưa được nắn.
        const k = e.closest('.khung');
        if (k) this.canhChu(k);
        const h = document.querySelector('nav.sticky');
        const off = h ? h.getBoundingClientRect().height : 0;
        const r = e.getBoundingClientRect();
        window.scrollTo({ top: Math.max(0, r.top + window.scrollY - off - 80),
                          behavior: 'smooth' });
      },

      /** Mục lục → nhảy tới trang N, chạy ở CẢ hai chế độ.
       *  Ở 📄 phải chờ PDF.js dựng xong khung, không thì chưa có gì để nhảy tới. */
      async toiTrang(p) {
        this.mlMo = false;
        this.trangDang = p;
        if (this.che === 'pdf') {
          await this.moPdf();
          await this.$nextTick();
        }
        const el = this.che === 'pdf'
          ? document.querySelector('#pdfjs [data-trang="' + p + '"]')
          : document.getElementById('tr-' + p);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      },

      /** Tô đậm mục đang xem. Không có thì cây mục lục chỉ là danh sách link,
       *  cuộn một lúc là không biết mình đang ở đâu. */
      theoDoiTrang() {
        const q = new IntersectionObserver((muc) => {
          const thay = muc.filter((m) => m.isIntersecting)
                          .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
          if (!thay) return;
          this.trangDang = Number(thay.target.dataset.tr || thay.target.dataset.trang);
          // Mở sẵn unit chứa trang đang đọc. Không làm thì cuộn tới unit 5 mà
          // cột mục lục vẫn đang mở unit 1 — cây nói một đằng, trang đi một nẻo.
          let u = 0;
          for (let i = 0; i < this.unitTr.length; i++) {
            if (this.unitTr[i] <= this.trangDang) u = i + 1;
          }
          if (u && !this.moUnit[u]) this.moUnit[u] = true;
        }, { rootMargin: '-10% 0px -80% 0px' });
        document.querySelectorAll('.trang[data-tr], #pdfjs [data-trang]')
                .forEach((e) => q.observe(e));
      },

      /** Nạp PDF.js và dựng khung trang. Chỉ chạy MỘT lần, lúc bấm 📄. */
      async moPdf() {
        // Nhánh file nặng: không có #pdfjs, chỉ gắn src cho iframe rồi thôi.
        if (!document.getElementById('pdfjs')) { this.srcNang = this.pdfGoc; return; }
        if (_pdf || this.pdfLoi) return;
        try {
          const pdfjs = await import(this.pdfJsUrl);
          pdfjs.GlobalWorkerOptions.workerSrc = this.pdfWorkerUrl;
          _pdf = await pdfjs.getDocument({ url: this.pdfGoc }).promise;
          this.soTrang = _pdf.numPages;
          // `await` chứ không phải $nextTick rồi bỏ đó: `toiTrang()` gọi
          // `moPdf()` xong là đi tìm khung trang ngay, mà `dungKhung()` còn
          // phải chờ `getPage(1)`. Không chờ thì mục lục bấm vào không nhảy đi
          // đâu cả — đo được ở tài liệu 18 trang.
          await this.$nextTick();
          await this.dungKhung();
        } catch (e) {
          // Nói đúng loại trục trặc, đừng chìa nguyên văn lỗi thư viện ra cho trẻ.
          console.warn('PDF.js hỏng:', e);
          this.pdfLoi = 'Chưa mở được bản PDF ngay trong trang';
        }
      },

      /** Một khung trống cho mỗi trang; VẼ khi cuộn tới.
       *  Vẽ hết ngay thì một cuốn 192 trang là 192 canvas trong bộ nhớ. */
      async dungKhung() {
        const ct = document.getElementById('pdfjs');
        if (!ct || !_pdf) return;
        ct.innerHTML = '';
        if (_oq) _oq.disconnect();
        _oq = new IntersectionObserver((muc) => {
          muc.forEach((m) => { if (m.isIntersecting) this.veTrang(m.target); });
        }, { rootMargin: '800px 0px' });
        // ⚠ Ô giữ chỗ phải mang sẵn TỈ LỆ KHUNG. Để rỗng thì mọi ô cao 0px,
        // cả tài liệu 96 trang dồn thành một vệt, và mục lục nhảy tới trang 40
        // sẽ trượt sang chỗ khác — thanh cuộn còn giật mỗi lần vẽ xong một
        // trang. Lấy khổ trang ĐẦU: một tài liệu hiếm khi trộn nhiều khổ, và
        // lệch chút thì cũng chỉ lệch trước khi trang đó kịp vẽ.
        const vp1 = (await _pdf.getPage(1)).getViewport({ scale: 1 });
        _kho = [vp1.width, vp1.height];
        for (let i = 1; i <= _pdf.numPages; i++) {
          const d = document.createElement('div');
          d.className = 'bg-white border border-slate-200 rounded-lg overflow-hidden mx-auto';
          d.dataset.trang = String(i);
          ct.appendChild(d);
          _oq.observe(d);
        }
        this.coKhung();
        this.theoDoiTrang();   // khung 📄 dựng sau init, phải đăng ký lại
      },

      /** Đặt kích thước ô giữ chỗ.
       *
       * ⚠ Phải rộng ĐÚNG bằng canvas sẽ vẽ ra, không phải rộng bằng cả cột.
       * Canvas hiển thị ở `khổ trang × tiLe`, còn ô rỗng thì giãn hết cột — nên
       * mỗi trang vẽ xong LẠI CO LẠI, đẩy mọi trang dưới nó lên. Đo được: mục
       * lục nhảy tới trang 5 thì trượt 429px, trang 7 trượt 915px, và càng
       * nhiều trang đã vẽ thì càng lệch. Thanh cuộn cũng giật theo.
       */
      coKhung() {
        if (!_kho) return;
        document.querySelectorAll('#pdfjs [data-trang]').forEach((e) => {
          if (e.firstChild) return;             // đã vẽ, canvas tự quyết
          e.style.width = (_kho[0] * this.tiLe) + 'px';
          e.style.maxWidth = '100%';
          e.style.aspectRatio = _kho[0] + ' / ' + _kho[1];
        });
      },

      async veTrang(el) {
        if (el.dataset.xong === '1' && el.dataset.tiLe === String(this.tiLe)) return;
        el.dataset.xong = '1'; el.dataset.tiLe = String(this.tiLe);
        const tr = await _pdf.getPage(Number(el.dataset.trang));
        // Nhân theo devicePixelRatio để chữ không rỗ trên màn hình nét cao.
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const vp = tr.getViewport({ scale: this.tiLe * dpr });
        const cv = document.createElement('canvas');
        cv.width = vp.width; cv.height = vp.height;
        cv.style.width = (vp.width / dpr) + 'px';
        cv.style.height = 'auto';
        cv.style.display = 'block';
        cv.style.maxWidth = '100%';
        await tr.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        el.style.aspectRatio = ''; el.style.width = '';   // canvas tự quyết
        el.replaceChildren(cv);
      },

      _veLai() {
        document.querySelectorAll('#pdfjs [data-trang]').forEach((e) => {
          e.dataset.xong = '';
          const r = e.getBoundingClientRect();
          if (r.top < innerHeight * 2 && r.bottom > -innerHeight) this.veTrang(e);
        });
      },
      phongTo()   { this.tiLe = Math.min(4, +(this.tiLe + 0.25).toFixed(2)); this.coKhung(); this._veLai(); },
      thuNho()    { this.tiLe = Math.max(0.5, +(this.tiLe - 0.25).toFixed(2)); this.coKhung(); this._veLai(); },
      async vuaBeRong() {
        if (!_pdf) return;
        const w = (document.getElementById('pdfjs') || {}).clientWidth || 800;
        const vp = (await _pdf.getPage(1)).getViewport({ scale: 1 });
        this.tiLe = +(w / vp.width).toFixed(2);
        this.coKhung();
        this._veLai();
      },
      /* Kéo giãn từng đoạn cho khớp đúng bề rộng của nó trong ảnh. Cỡ chữ suy từ
         PDF không bao giờ ra đúng bề rộng (font trong PDF khác font máy); không
         sửa thì sai số dồn dần và cuối dòng lệch hẳn một hai từ.
         ⚠ Đo bằng `offsetWidth`, KHÔNG phải `getBoundingClientRect()` — cái sau
         đã tính cả transform của tổ tiên nên tỉ lệ ra sai hệ quy chiếu. */
      /** Nắn bề rộng từng đoạn chữ cho khớp bản gốc.
       *
       * ⚠ BA LƯỢT tách bạch — ghi hết, ĐỌC hết, rồi ghi hết. Bản đầu ghi rồi
       * đọc XEN KẼ từng span (`style.transform = ''` rồi `offsetWidth`), mà
       * mỗi lần đọc sau một lần ghi là ép trình duyệt dựng lại bố cục ngay tại
       * chỗ đó. Với một quyển sách 260 trang thì đó là **13.000 lượt dựng
       * hình**. Đo trên hồ sơ điện thoại (CPU chậm 4×): mở sách mất **115
       * giây**. Tách ba lượt thì chỉ còn ~3 lượt dựng hình cho mỗi trang.
       */
      /** Chỉ nắn những trang SẮP NHÌN THẤY, phần còn lại chờ cuộn tới.
       *
       * Một quyển 260 trang có 12.940 đoạn chữ; nắn hết ngay lúc mở là làm một
       * đống việc cho 259 trang chưa ai đọc. Ảnh trang vốn đã nạp lười
       * (`loading="lazy"`) — chỗ này chỉ là cho lớp chữ theo cùng nguyên tắc.
       */
      canhChuLuoi() {
        if (this._ql) this._ql.disconnect();
        this._ql = new IntersectionObserver((muc) => {
          for (const m of muc) if (m.isIntersecting) this.canhChu(m.target);
        }, { rootMargin: '1200px 0px' });
        document.querySelectorAll('.khung').forEach((k) => this._ql.observe(k));
      },

      canhChu(chi) {
        const ds = chi ? [chi] : Array.from(document.querySelectorAll('.khung'));
        ds.forEach((k) => {
          const w = k.clientWidth; if (!w) return;
          const sp = Array.from(k.querySelectorAll('.chu span'));
          for (const s of sp) s.style.transform = '';           // ghi hết
          const rong = sp.map((s) => s.offsetWidth);            // ĐỌC hết
          for (let i = 0; i < sp.length; i++) {                 // ghi hết
            const dich = parseFloat(sp[i].dataset.w) * w;
            if (dich && rong[i]) sp[i].style.transform = 'scaleX(' + (dich / rong[i]) + ')';
          }
        });
      },
      // Video YouTube: dựng khung LÚC BẤM, miền youtube-nocookie. Nhúng sẵn là
      // mỗi lần mở trang lại gọi sang Google cho từng video dù không ai xem.
      moVideo(e) {
        const b = e.target.closest('.lk[data-vid]'); if (!b) return;
        e.preventDefault();
        const k = b.closest('.khung'); if (!k) return;
        const o = (b.dataset.o || '0,0,100,100').split(',').map(Number);
        const f = document.createElement('iframe');
        f.className = 'yt';
        f.allow = 'accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen';
        f.allowFullscreen = true;
        f.src = 'https://www.youtube-nocookie.com/embed/' + b.dataset.vid + '?autoplay=1&rel=0';
        const w = Math.max(o[2], 56), h = Math.max(o[3], 42);
        const x = Math.min(Math.max(o[0], 0), 100 - w), y = Math.min(Math.max(o[1], 0), 100 - h);
        f.style.cssText = 'left:' + x + '%;top:' + y + '%;width:' + w + '%;height:' + h + '%';
        b.remove(); k.appendChild(f);
      },
      // ── Năm hàm móc của `_tracuu.html` ────────────────────────────────────
      // Trang đọc không có khái niệm/phạm vi; ngữ cảnh là tên môn + tên tài liệu.
      traTen() { return 'Môn: ' + "CIE Science 5" + '. Đang đọc tài liệu: ' + "FULL_SAMPLE_Science_WB6.pdf" + '.'; },
      traMucCtx() { return []; },
      traDoc() { return null; },
      traSec() { return ''; },
      traKhoa() { return this.secret; },

        // ── Tra cứu: bôi đen → nút 🔎 → popup ─────────────────────────────────
        // Nghĩa của một từ phụ thuộc CÂU chứa nó và BÀI đang học, nên không dựng
        // sẵn được: `sedimentary` trong bài về đá không giống ở chỗ khác. Vì vậy
        // gọi Gemini lúc bấm, kèm thuật ngữ của mục đang mở.
        tra: { btn: null, show: false, mode: 'word', text: '', sent: '',
               loading: false, err: '', ly_do: '', data: null },

        /** Nới vùng chọn ra nguyên từ: kéo lệch nửa chữ vẫn tra đúng từ. */
        _noRong(r) {
          const W = /[A-Za-z0-9'’-]/;
          try {
            let n = r.startContainer, o = r.startOffset;
            if (n.nodeType === 3) { while (o > 0 && W.test(n.data[o - 1])) o--; r.setStart(n, o); }
            n = r.endContainer; o = r.endOffset;
            if (n.nodeType === 3) {
              // ⚠ Chrome trên WINDOWS gộp luôn KHOẢNG TRẮNG CUỐI vào vùng chọn
              // khi nháy đúp — đó là quy ước chọn chữ của Windows; Chrome trên
              // Linux/macOS thì không. Không cắt nó đi trước khi nới thì phép
              // nới thấy ký tự kế tiếp là chữ và nuốt luôn từ sau: nháy đúp
              // `Properties` trong "2.1 Properties of substances" ra
              // **"Properties of"**. Người dùng báo; chạy trên Linux KHÔNG tái
              // hiện được, phải tự đặt vùng chọn có kèm dấu cách mới thấy.
              while (o > r.startOffset && /\s/.test(n.data[o - 1])) o--;
              while (o < n.data.length && W.test(n.data[o])) o++;
              r.setEnd(n, o);
            }
          } catch (e) { /* vùng chọn xuyên nhiều thẻ: giữ nguyên */ }
          return r;
        },

        /** Câu chứa vùng chọn — để Gemini biết từ đó đang mang nghĩa nào. */
        _cauChua(r, text) {
          const h = r.commonAncestorContainer;
          const t = ((h.nodeType === 3 ? h.parentElement : h)?.textContent || '').replace(/\s+/g, ' ');
          const i = t.indexOf(text);
          if (i < 0) return '';
          let a = i, b = i + text.length;
          while (a > 0 && !/[.!?]/.test(t[a - 1])) a--;
          while (b < t.length && !/[.!?]/.test(t[b])) b++;
          return t.slice(a, b + 1).trim().slice(0, 300);
        },

        /** Thuật ngữ của PHẠM VI đang mở. Đây là toàn bộ lý do dùng Gemini thay
            vì một máy dịch thường: thiếu nó thì `igneous rock` ra "đá nham thạch"
            chứ không phải "đá mácma" — vẫn trôi chảy, vẫn không ai thấy sai.

            Dùng `scopedSummary` chứ KHÔNG so `x.concept === this.scope`: `scope`
            là một UNIT, còn các mục tóm tắt là CON của unit đó. So bằng thì không
            khớp mục nào, `ctx` còn trơ mỗi dòng tiêu đề, và tính năng lặng lẽ tụt
            xuống đúng bằng một máy dịch thường. */
        _traCtx() {
          // Tên môn LUÔN có, kể cả khi chưa có học liệu ôn tập. Bản đầu thoát
          // sớm khi thiếu học liệu và trả về ctx RỖNG — 11/17 môn rơi vào đó, và
          // Gemini không biết đang học môn gì. Chỉ phần glossary mới phụ thuộc
          // vào học liệu.
          const tat = [];
          for (const s of this.traMucCtx()) {
            for (const g of s.glossary || []) tat.push([g.term, g.def || '']);
            for (const w of s.words || []) for (const it of w.items || [])
              tat.push([it.word, it.def || '']);
          }
          // Ưu tiên thuật ngữ CÓ MẶT ngay trong chỗ đang tra. Một unit có thể có
          // hàng trăm thuật ngữ mà chỉ 20 dòng đầu lọt vào ctx; cắt theo thứ tự
          // gốc thì đúng cái từ đang hỏi lại hay bị cắt mất.
          const cho = (this.tra.sent + ' ' + this.tra.text).toLowerCase();
          const hop = [], con = [];
          for (const x of tat) (cho.includes((x[0] || '').toLowerCase()) ? hop : con).push(x);
          // Dấu hai chấm, KHÔNG phải dấu bằng — và nhãn nói thẳng đây là ĐỊNH
          // NGHĨA TIẾNG ANH. Bản đầu viết `crystal = The particular shaped
          // structure of a mineral.` và trong một danh sách thuật ngữ thì `=`
          // đọc ra là "dịch thành", nên Gemini dịch nguyên câu định nghĩa vào ô
          // nghĩa: `crystal` ra "cấu trúc hình dạng đặc biệt của một loại khoáng
          // vật" thay vì "tinh thể". Bỏ hẳn ctx đi thì lại ra đúng — tức ngữ
          // cảnh đang LÀM HỎNG chính thứ nó sinh ra để cứu.
          const ds = [...hop, ...con].slice(0, 20).map((x) => x[0] + ': ' + x[1]);
          const dau = this.traTen();
          return (dau + (ds.length
            ? '\nĐịnh nghĩa TIẾNG ANH của các thuật ngữ trong mục (KHÔNG phải bản dịch):\n' + ds.join('\n')
            : '')).slice(0, 1200);
        },

        /** Không có mạng / không có mã: vẫn tra được nếu từ đó là thuật ngữ của
            bài. Lùi thầm, không báo lỗi — đúng nếp của cả dự án. */
        _traOffline() {
          const k = (this.tra.text || '').toLowerCase();
          // Trả về ĐÚNG hình dạng mà Gemini trả về (`phan[]`), không phải một
          // hình dạng riêng. Hai hình dạng thì phải có hai bộ vẽ, và hai bộ vẽ
          // thì sớm muộn lệch nhau — mà nhánh offline là nhánh ít ai mở ra xem
          // nhất, nên nó sẽ là cái lệch trước và lệch lâu nhất.
          const khoi = (td, nd, en, vi) => ({
            tieu_de: td, noi_dung: nd || '',
            vi_du: en ? [{ en: en, vi: vi || '' }] : [],
          });
          for (const s of (this.traDoc()?.summary || [])) {
            for (const g of s.glossary || []) if ((g.term || '').toLowerCase() === k)
              return { tu: g.term, phan: [khoi('Trong học liệu', g.def, g.example, '')],
                       _offline: true };
            for (const w of s.words || []) for (const it of w.items || [])
              if ((it.word || '').toLowerCase() === k)
                return { tu: it.word, loai: it.pos || '', ipa: it.ipa || '',
                         phan: [khoi('Trong học liệu', it.def, it.example, it.example_vi)],
                         _offline: true };
          }
          return null;
        },

        /** Chạy mỗi lần vùng chọn đổi. Quyết định CÓ hiện nút hay không. */
        chonDoi() {
          const sel = window.getSelection();
          this.tra.btn = null;
          if (this.tra.show || !sel || sel.isCollapsed || !sel.rangeCount) return;
          const r0 = sel.getRangeAt(0);
          const h = r0.commonAncestorContainer;
          const el = h.nodeType === 3 ? h.parentElement : h;
          // Chỉ bắt trong vùng nội dung: bôi đen ở ô tìm kiếm hay thanh chế độ
          // mà cũng hiện nút thì nút chắn mất đúng thứ người ta đang gõ.
          if (!el || !el.closest || !el.closest('[data-tra]')) return;
          const r = this._noRong(r0);
          const text = (r.toString() || '').replace(/\s+/g, ' ').trim();
          if (!text || !/[A-Za-z]/.test(text) || text.length > 600) return;
          const b = r.getBoundingClientRect();
          if (!b.width && !b.height) return;
          this.tra.text = text;
          this.tra.sent = this._cauChua(r, text);
          this.tra.mode = text.split(/\s+/).length <= 3 ? 'word' : 'text';
          // Không có mã bí mật thì chỉ hiện nút khi tra offline ra được cái gì.
          if (!this.traKhoa() && !this._traOffline()) return;
          this.tra.btn = { x: Math.min(Math.max(b.left + b.width / 2, 60), innerWidth - 60),
                           y: Math.min(b.bottom + 8, innerHeight - 44) };
        },

        async traMo(mode) {
          if (mode) this.tra.mode = mode;
          this.tra.show = true; this.tra.btn = null;
          this.tra.err = ''; this.tra.ly_do = ''; this.tra.data = null; this.tra.loading = true;
          // Trang có thể cần nạp học liệu trước (trang môn nạp LƯỜI, vì file
          // study JSON tới ~200KB và phần lớn lượt vào trang môn không tra từ nào).
          if (this.traSanSang) { try { await this.traSanSang(); } catch (e) {} }
          if (!this.traKhoa()) {                      // chế độ chỉ đọc, không gọi API
            this.tra.data = this._traOffline(); this.tra.loading = false; return;
          }
          // Có nhận được phản hồi HTTP hay không — dùng để nói ĐÚNG LOẠI trục
          // trặc. Ném từ `fetch` là hỏng mạng; phản hồi không ok là dịch vụ lỗi.
          let coPhanHoi = false;
          try {
            const r = await fetch('/api/lookup', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-progress-key': this.traKhoa() },
              // `user`/`course`/`sec` chỉ để ghi dòng lịch sử trong D1 — Worker
              // KHÔNG đưa chúng vào prompt gửi Google (test_lookup_route chốt).
              body: JSON.stringify({ mode: this.tra.mode, text: this.tra.text,
                                     sent: this.tra.sent, ctx: this._traCtx(),
                                     user: this.user, course: this.course, sec: this.traSec() }),
            });
            coPhanHoi = true;
            const b = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(b.error || ('HTTP ' + r.status));
            this.tra.data = b.data;
          } catch (e) {
            // Lùi về glossary có sẵn. Chỉ báo lỗi khi lùi cũng không ra gì.
            this.tra.data = this._traOffline();
            // Hai yêu cầu kéo ngược nhau, và cả hai đều đúng:
            //  · đừng chìa câu lỗi kỹ thuật ("Gemini lỗi 412") ra cho một đứa trẻ;
            //  · đừng nói cứng "không có mạng" khi mạng vẫn tốt — nói sai lý do
            //    còn tệ hơn không nói, vì người ta đi kiểm wifi thay vì kiểm dịch vụ.
            // Giải bằng cách tách: hiện đúng LOẠI trục trặc bằng lời thường, còn
            // nguyên văn thì đẩy ra console cho người lớn soi.
            this.tra.ly_do = coPhanHoi ? 'tra cứu đang bận' : 'chưa có mạng';
            console.warn('tra cứu hỏng:', String(e.message || e));
            if (!this.tra.data) this.tra.err = 'Chưa tra được lúc này, thử lại sau nhé.';
          }
          this.tra.loading = false;
        },

        /** Đang có chữ được bôi đen? Thẻ ghi nhớ và ô đáp án là thẻ BẤM ĐƯỢC
            bọc quanh chính phần chữ, nên kéo chọn trên đó sẽ lật thẻ lộ đáp án —
            tức bôi đen để tra từ lại phá mất bài đang làm. */
        dangBoiDen() {
          const s = window.getSelection();
          return !!(s && !s.isCollapsed && (s.toString() || '').trim());
        },

        /** Đăng ký nghe vùng chọn. Trang phải TỰ GỌI (trong `init()` hoặc
            `x-init`) — để trong macro mà không gọi thì mọi thứ khác đều dựng
            đúng, nút chỉ đơn giản không bao giờ hiện, và không có lỗi nào. */
        traGan() {
          if (typeof document === 'undefined' || this._traDaGan) return;
          this._traDaGan = true;
          let hen = null;
          // Gộp nhịp 120ms: kéo chọn trên điện thoại bắn hàng chục lượt mỗi giây.
          // `selectionchange` bắn trên `document` và KHÔNG nổi lên window ở mọi
          // trình duyệt, nên đừng thay bằng @selectionchange.window.
          document.addEventListener('selectionchange', () => {
            clearTimeout(hen);
            hen = setTimeout(() => this.chonDoi(), 120);
          });
        },

        traDong() { this.tra.show = false; this.tra.btn = null; this.tra.data = null;
                    this.tra.err = ''; this.tra.ly_do = ''; },

    };
  }
  document.addEventListener('click', (e) => {
    const d = Alpine.$data(document.body);
    if (d && d.moVideo) d.moVideo(e);
  });
</script>
