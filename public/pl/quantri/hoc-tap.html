<script>
window.LS = (function () {
  var ve = null, goc = '', dang = 0, henCuon = null, cho = null;
  // `popstate` kế tiếp do CHÍNH LS.dong() gây ra (code đóng lớp phủ) → KHÔNG khôi phục `cuon`.
  // Lớp phủ là `fixed`, trang dưới đứng yên; `cuon` của mục nền chỉ là ảnh cũ. Đóng xong trang
  // thường tự cuộn (bấm mục lục: `toiMuc(i); menuMo = false`) — popstate tới SAU, khôi phục là
  // kéo trang về chỗ cũ, đè lên cú cuộn đó (máy chậm: luôn thua; 2026-10-16). Back của người dùng
  // không qua đây ⇒ vẫn khôi phục như ADR 0067.
  var boCuon = 0;
  function token() {
    try { return decodeURI((location.hash || '').replace(/^#/, '')); } catch (e) { return ''; }
  }
  function url(tk) { return tk ? '#' + encodeURI(tk) : location.pathname + location.search; }
  function luuCuon() {
    var st = history.state;
    if (!st || !st.ls || st.cuon === window.scrollY) return;
    st.cuon = window.scrollY;
    history.replaceState(st, '', location.href);
  }
  function henLuu() {
    if (henCuon) return;
    henCuon = setTimeout(function () { henCuon = null; luuCuon(); }, 200);
  }
  function cuonLai(st) {
    if (!st || typeof st.cuon !== 'number') return;
    var y = st.cuon;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { window.scrollTo(0, y); });
    });
  }
  function chayVe(req) {
    dang++;
    Promise.resolve().then(function () { return ve(req.tk, req.st || {}); }).then(
      function () { dang--; cuonLai(req.st); tiep(); },
      function () { dang--; tiep(); });
  }
  function tiep() { if (cho) { var r = cho; cho = null; chayVe(r); } }
  function veLai(tk, st) {
    if (!ve) { cuonLai(st); return; }
    if (dang) { cho = { tk: tk, st: st }; return; }
    chayVe({ tk: tk, st: st });
  }
  function di(tk, day) {
    if (dang) return;
    if (tk === token()) return;
    var truoc = history.state || {};
    var sau = (truoc.ls ? (truoc.sau || 0) : 0) + (day ? 1 : 0);
    var st = { ls: 1, cuon: window.scrollY, token: tk, sau: sau };
    (day ? history.pushState : history.replaceState).call(history, st, '', url(tk));
  }
  addEventListener('popstate', function (e) {
    var st = e.state;
    if (boCuon) { boCuon = 0; if (st) { st = Object.assign({}, st); delete st.cuon; } }
    veLai(token(), st);
  });
  addEventListener('scroll', henLuu, { passive: true });
  addEventListener('load', function () { if (!ve) cuonLai(history.state); });
  return {
    ham: function () {
      try { history.scrollRestoration = 'manual'; } catch (e) {}
      try {
        var st = history.state;
        if (!st || !st.ls) {
          history.replaceState({ ls: 1, cuon: window.scrollY, token: token(), sau: 0 }, '', location.href);
        }
      } catch (e) {}
    },
    di: function (tk) { di(tk, true); },
    thay: function (tk) { di(tk, false); },
    mo: function (tk) { di(tk, true); },
    dong: function (tk) {
      var st = history.state || {};
      if (st.ls && (st.sau || 0) > 0) { boCuon = 1; history.back(); }
      else di(tk === undefined ? goc : tk, false);
    },
    nghe: function (fn, g0) { ve = fn; goc = g0 || ''; veLai(token(), history.state); },
    dang: function () { return dang > 0; },
  };
})();
window.LS.ham();
</script>
<script>
  window.QT_KHOA = 'quantri_qt';
  // Nhóm lọc — thứ tự = thứ tự chip (spec §4.7; `lop` = bảng lớp học thêm, quyết định 2026-10-16).
  window.QT_LOAI = { lms: 'Nội dung LMS', lop: 'Lớp học thêm', doc: 'Đọc sách', on: 'Ôn tập', bo_me: 'Bố mẹ', tra: 'Tra từ' };
  function qtChipLoai(ds) {
    const co = new Set(ds.map((x) => x.loai));
    return Object.keys(QT_LOAI).filter((k) => co.has(k)).map((k) => ({ k, ten: QT_LOAI[k] }));
  }
  function qtChipMon(ds, ten) {
    return [...new Set(ds.map((x) => x.mon).filter(Boolean))].map((k) => ({ k, ten: ten[k] || k }))
      .sort((p, q) => p.ten.localeCompare(q.ten, 'vi'));
  }
  function qtLoc(ds, loai, mon) { return ds.filter((x) => (!loai || x.loai === loai) && (!mon || x.mon === mon)); }
  // Tiến độ theo môn: mục xong = có khoá KV và KHÔNG redo; phần xong = mọi mục xong (như syncSecBox / chonTick).
  function qtTienDo(tienDo, items, user) {
    const xong = (cid, iid) => { const v = items[user + '/' + cid + '/' + iid]; return !!v && !v.redo; };
    return tienDo.map((m) => ({ slug: m.slug, ten: m.ten, muc_tong: m.muc.length,
      muc_xong: m.muc.filter((i) => xong(m.cid, i)).length, nhom_tong: m.nhom.length,
      nhom_xong: m.nhom.filter((g) => g.length && g.every((i) => xong(m.cid, i))).length }));
  }
  function phienQT() {
    return {
      qt: null, ma: '', loiQt: '', dangMo: false,
      docPhien() {
        try {
          const o = JSON.parse(localStorage.getItem(QT_KHOA) || 'null');
          if (o && typeof o.token === 'string' && Number.isInteger(o.het) && o.het > Date.now() / 1000) return o;
        } catch (e) { /* hỏng → coi như chưa có */ }
        localStorage.removeItem(QT_KHOA);
        return null;
      },
      async moPhien() {
        const v = this.ma.trim();
        if (!v || this.dangMo) return;
        this.dangMo = true; this.loiQt = '';
        try {
          const r = await fetch('/api/quantri/phien', { method: 'POST', headers: { 'content-type': 'application/json' },
                                                       body: JSON.stringify({ ma: v }) });
          if (r.status === 401) { this.loiQt = 'Mã bố mẹ không đúng.'; return; }
          if (!r.ok) { this.loiQt = 'Chưa mở được phiên (HTTP ' + r.status + ').'; return; }
          const d = await r.json();
          this.qt = { token: d.token, het: d.het };
          localStorage.setItem(QT_KHOA, JSON.stringify(this.qt));
          this.ma = '';
          await this.taiTrang();
        } catch (e) { this.loiQt = 'Không kết nối được máy chủ.'; }
        finally { this.dangMo = false; }
      },
      thoat() { localStorage.removeItem(QT_KHOA); this.qt = null; },
      hetPhien() { this.thoat(); this.loiQt = 'Phiên bố mẹ đã hết hạn — mở lại.'; },
      hetLuc() {
        return this.qt ? this.gio(this.qt.het) + ' ' + new Date(this.qt.het * 1000).toLocaleDateString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' }) : '';
      },
      // GET (body undefined) hoặc POST JSON, kèm x-quantri. 401 → hết phiên + Error{het}; lỗi khác → Error(lời của máy chủ).
      async api(path, body) {
        const init = { headers: { 'x-quantri': this.qt ? this.qt.token : '' } };
        if (body !== undefined) { init.method = 'POST'; init.headers['content-type'] = 'application/json'; init.body = JSON.stringify(body); }
        let r;
        try { r = await fetch(path, init); } catch (e) { throw new Error('Không kết nối được máy chủ.'); }
        const d = await r.json().catch(() => ({}));
        if (r.status === 401) {
          this.hetPhien();
          const e = new Error('Phiên bố mẹ đã hết hạn — mở lại phiên (ô mã ở đầu trang) rồi làm lại.');
          e.het = true;
          throw e;
        }
        if (!r.ok) throw new Error(d.error || ('Lỗi máy chủ (HTTP ' + r.status + ').'));
        return d;
      },
      ngay(ts) {
        return new Date(ts * 1000).toLocaleDateString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
      },
      gio(ts) {
        return new Date(ts * 1000).toLocaleTimeString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit' });
      },
    };
  }
</script>

          if (!TOAN_MUC) {
            console.warn('hoc-tap: có ../toan/kho.json nhưng TOAN_MUC rỗng — builder không chép được toan_muc.js (lỗi dựng trang Toán)');
            return { loi: 'Lỗi dựng trang Toán: trang này thiếu mô-đun tính mức (toan_muc.js). Dựng lại trang rồi mở lại.' };
          }
          if (!kho.cd || typeof kho.cd !== 'object' || !Object.keys(kho.cd).length) return { trong: true };
          let M;
          try { M = await import(TOAN_MUC); } catch (e) {
            console.warn('hoc-tap: không nạp được ' + TOAN_MUC, e);
            // Trình duyệt NHỚ import hỏng của một địa chỉ tới khi tải lại trang — thử lại tại chỗ vô ích, nên nút là "Tải lại trang".
            const loi = new Error('Không tải được mô-đun tính mức Toán (toan_muc.js). Kiểm tra mạng rồi tải lại trang.');
            loi.taiTrang = true;
            throw loi;
          }
          const d = await this.api('/api/quantri/hoc-tap?phan=toan&user=' + encodeURIComponent(this.user));
          const cols = Array.isArray(d.cols) ? d.cols : [];
          const luot = (Array.isArray(d.rows) ? d.rows : []).map((r) => Object.fromEntries(cols.map((k, j) => [k, r[j]])));
          return qtToan(M, kho, luot, Math.floor(Date.now() / 1000));
        },
        thuLaiToan() {
          if (this.du.toan && this.du.toan.tai_trang) { location.reload(); return; }
          this.du.toan = null;
          this.nap('toan', true);
        },
        moDangToan(id) {
          this.moDang = id;
          this.$nextTick(() => { const e = document.querySelector('[data-qt-toan-dang="' + id + '"]'); if (e) e.scrollIntoView({ block: 'center' }); /* center: header dính không che */ });
        },
        mucToan(m) { return MUC_TOAN[m] || MUC_TOAN[0]; },
        async napChu(mon) {
          if (this.chu[mon]) return;
          const m = {};
          try {
            const r = await fetch('../study/' + encodeURIComponent(mon) + '.json', { headers: { accept: 'application/json' } });
            if (r.ok) {
              const d = await r.json();
              if (mon === 'so-tay') for (const [k, v] of Object.entries(d.nhan || {})) if (typeof v === 'string' && v) m[k] = v;
              for (const q of [...(d.flashcards || []), ...(d.quiz || [])]) if (q && q.id) m[q.id] = q.front_en || q.stem_en || q.id;
              for (const sec of d.summary || []) {
                for (const [khoi, truong] of Object.entries(MARK_KEYS)) {
                  for (const x of (sec && sec[khoi]) || []) {
                    if (!x || !x.mark) continue;
                    const c = truong.map((k) => x[k]).find((v) => typeof v === 'string' && v.trim());
                    if (c) m[x.mark] = c.trim();
                  }
                }
              }
            }
          } catch (e) { /* không có học liệu → hiện id */ }
          this.chu[mon] = m;
        },
        chuThe(x) { return (this.chu[x.mon] || {})[x.i] || (x.mon === 'so-tay' ? String(x.i).replace(/^st\./, '').replace('.', ' · ') : x.i); },
        ds() { return this.du[this.tab] || []; },
        loc() { return qtLoc(this.ds(), this.tab === 'dong' ? this.locLoai : '', this.locMon); },
        chipLoai() { return this.tab === 'dong' ? qtChipLoai(this.ds()) : []; },
        chipMon() { return ['dong', 'on', 'tu'].includes(this.tab) ? qtChipMon(this.ds(), TEN_MON) : []; },
        tenMon(s) { return TEN_MON[s] || s || ''; },
        bieuTuong(l) { return { lms: '✅', lop: '📋', doc: '📖', on: '🧠', bo_me: '📝', tra: '🔎' }[l] || '⭐'; },
        hoiThuoc(x) {
          this.bao = '';
          this.hoi = { viec: 'thuoc', tieu: 'Bỏ đã thuộc?', x, loi: '', het: false,
            chu: x.mon === 'so-tay'
              ? 'Bỏ đánh dấu "đã thuộc" của "' + this.chuThe(x) + '" (' + this.tenMon(x.mon) + '): không trừ ⭐.'
              : 'Bỏ cờ "đã thuộc" của thẻ "' + this.chuThe(x) + '" (' + this.tenMon(x.mon) + '): thẻ quay lại lịch ôn; không trừ ⭐.' };
        },
        // Tab Toán: gỡ MỘT lần làm. `x` = dòng của bảng (i, ts, g, kq, x…); `d` = dạng chứa nó (bảng dạng) hoặc null (lần làm bài kiểm tra chuyên đề,
        // `cd` = chuyên đề). Hộp nêu bài + giờ + kết quả; khoá gửi lên là (i, ts, g) — đúng ba trường mà máy chủ dùng để chọn hàng attempt.
        hoiGoToan(x, d, cd) {
          const luc = this.ngay(x.ts).split(', ').pop() + ' ' + this.gio(x.ts);
          const hau = ' Lần này bị xoá khỏi sổ như chưa từng làm; ⭐ / mốc / Đạt chỉ nhờ lần này bị trừ. Chỉ trừ, không tự cộng bù: điểm mà các lần còn lại lẽ ra được thì con làm lại mới có.';
          this.bao = '';
          this.hoi = { viec: 'toan', tieu: 'Gỡ lần làm này?', x, loi: '', het: false,
            chu: d ? 'Bài "' + x.de + '" (' + d.chu + ') lúc ' + luc + ': ' + x.kq + ', con ghi "' + x.x + '".' + hau
                   : 'Bài kiểm tra chuyên đề "' + cd.chu + '" lúc ' + luc + ': ' + x.kq + ', đúng ' + x.x + '.' + hau };
        },
        dongHoi() { if (!this.dang) this.hoi = null; },
        async xacNhan() {
          const h = this.hoi;
          if (!h || this.dang) return;
          this.dang = true; h.loi = '';
          try {
            if (h.viec === 'toan') {
              const d = await this.api('/api/quantri/toan/go', { user: this.user, i: h.x.i, ts: h.x.ts, g: h.x.g });
              this.hoi = null;
              const n = Number(d.tru) || 0;
              this.bao = !d.xoa ? 'Lần làm này đã được gỡ trước đó.' : n > 0 ? 'Đã gỡ lần làm — −' + n + ' ⭐.' : 'Đã gỡ lần làm (không có ⭐ nào phải trừ).';
              await this.nap('toan', true);
              return;
            }
            await this.api('/api/quantri/thuoc/go', { user: this.user, mon: h.x.mon, i: h.x.i, c: h.x.c });
            this.hoi = null;
            this.bao = 'Đã bỏ cờ "đã thuộc".';
            await this.nap('on', true);
          } catch (e) {
            h.loi = e.message;
            if (e.het) h.het = true;
            else if (h.viec === 'toan') await this.nap('toan', true);   // máy chủ có thể ĐÃ gỡ mà câu trả lời không về: nạp lại cho bảng khớp sổ
          }
          finally { this.dang = false; }
        },
      };
    }
  </script>

                        <p :data-qt-toan-lt="t.id" class="bg-white rounded-2xl shadow px-4 py-3 text-sm">
                          <b x-text="'🗺 ' + t.chu"></b><br>
                          <span x-text="'đã xong ' + t.xong + '/' + t.tong + ' buổi' + (t.dang_o ? ' · đang ở buổi ' + t.dang_o : '')"></span>
                        </p>
                      </template>

                      <div class="bg-white rounded-2xl shadow px-4 py-3">
                        <p class="font-semibold">Cần giảng lại</p>
                        <template x-if="!du.toan.giang_lai.length">
                          <p data-qt-toan-gl-trong class="mt-1 text-sm text-slate-500">Không có dạng nào — con chưa vướng chỗ nào.</p>
                        </template>
                        <ul class="mt-1 divide-y divide-slate-100">
                          <template x-for="g in du.toan.giang_lai" :key="g.id">
                            <li :data-qt-toan-gl="g.id">
                              <button type="button" @click="moDangToan(g.id)" class="w-full min-h-10 py-1.5 text-left text-sm">
                                <span class="font-semibold" x-text="g.chu"></span>
                                <span class="text-slate-500" x-text="'· ' + g.cd_chu"></span>
                                <span class="block text-rose-700" x-text="g.ly_do"></span>
                              </button>
                            </li>
                          </template>
                        </ul>
                      </div>

                      <p class="text-xs text-slate-500">
                        <template x-for="(m, k) in MUC_TOAN" :key="k"><span class="mr-2 whitespace-nowrap" x-text="m.icon + ' ' + m.ten"></span></template>
                      </p>
                      <template x-for="g in du.toan.mang" :key="g.id">
                        <section :data-qt-toan-mang="g.id" class="bg-white rounded-2xl shadow px-4 py-3">
                          <p class="text-xs font-semibold uppercase tracking-wide text-slate-500" x-text="g.chu"></p>
                          <template x-for="c in g.cd" :key="c.id">
                            <div :data-qt-toan-cd="c.id" :data-muc="c.muc" class="mt-2">
                              <p data-qt-toan-cd-ten class="font-semibold">
                                <span x-text="mucToan(c.muc).icon + ' ' + c.chu"></span>
                                <span data-qt-toan-cd-ghi class="text-xs font-normal text-slate-500" x-text="c.ghi"></span>
                              </p>
                              <ul class="mt-1 space-y-1">
                                <template x-for="d in c.dang" :key="d.id">
                                  <li>
                                    <button type="button" :data-qt-toan-dang="d.id" :data-muc="d.muc" @click="moDang = moDang === d.id ? '' : d.id"
                                            :class="mucToan(d.muc).lop" class="w-full min-h-10 px-3 py-1.5 rounded-lg text-left text-sm flex items-center gap-2">
                                      <span x-text="mucToan(d.muc).icon"></span>
                                      <span class="flex-1 min-w-0"><span x-text="d.chu"></span>
                                        <template x-if="d.nang_cao"><span data-qt-toan-nang-cao class="ml-1 inline-block text-xs font-semibold rounded-full px-2 py-0.5 bg-white border border-amber-400 text-amber-900">⭐ Nâng cao</span></template></span>
                                      <span class="text-xs" x-text="d.ti"></span>
                                      <span class="text-xs" x-text="moDang === d.id ? '▴' : '▾'"></span>
                                    </button>
                                    <template x-if="moDang === d.id">
                                      <div :data-qt-toan-chi="d.id" class="mt-1 mb-2 ml-2 pl-3 border-l-2 border-slate-200">
                                        <p class="text-xs text-slate-500" x-text="mucToan(d.muc).ten + ' · bài giảng: ' + d.buoc + ' · ' + d.lan.length + ' lần làm bài'"></p>
                                        <template x-if="!d.lan.length"><p class="text-sm text-slate-500">Chưa làm bài nào của dạng này.</p></template>
                                        <ul class="divide-y divide-slate-100">
                                          <template x-for="(x, k) in d.lan" :key="k">
                                            <li data-qt-toan-lan :data-i="x.i" :data-ts="x.ts" :data-g="x.g" class="py-1.5 text-sm">
                                              <p data-de class="text-slate-700 break-words" x-text="x.de"></p>
                                              <p class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs">
                                                <span data-kq class="font-semibold" :class="x.kq_lop" x-text="x.kq"></span>
                                                <template x-if="x.khong"><span data-khong-tinh class="text-slate-500">(không tính vào mức)</span></template>
                                                <span>con ghi: <b data-x x-text="x.x"></b></span>
                                                <span class="text-slate-400" x-show="x.dap" x-text="'đáp số: ' + x.dap"></span>
                                                <span class="text-slate-400" x-text="ngay(x.ts).split(', ').pop() + ' ' + gio(x.ts)"></span>
                                                <button type="button" data-qt-toan-go @click="hoiGoToan(x, d, null)" :disabled="dang"
                                                        class="ml-auto shrink-0 px-3 py-2 -my-1 rounded-full border border-rose-300 bg-white text-xs font-semibold text-rose-700">↩ Gỡ</button>
                                              </p>
                                            </li>
                                          </template>
                                        </ul>
                                      </div>
                                    </template>
                                  </li>
                                </template>
                              </ul>
                              <template x-if="c.kt_lan.length">
                                <div :data-qt-toan-kt="c.id" class="mt-2 ml-2 pl-3 border-l-2 border-slate-200">
                                  <p class="text-xs text-slate-500" x-text="'Làm bài kiểm tra chuyên đề: ' + c.kt_lan.length + ' lần'"></p>
                                  <ul class="divide-y divide-slate-100">
                                    <template x-for="(x, k) in c.kt_lan" :key="k">
                                      <li data-qt-toan-kt-lan :data-i="x.i" :data-ts="x.ts" :data-g="x.g" class="py-1.5 text-sm flex flex-wrap items-center gap-x-3 gap-y-1">
                                        <span data-kq class="font-semibold" :class="x.kq_lop" x-text="x.kq"></span>
                                        <span>đúng <b data-x x-text="x.x"></b></span>
                                        <span class="text-xs text-slate-400" x-text="ngay(x.ts).split(', ').pop() + ' ' + gio(x.ts)"></span>
                                        <button type="button" data-qt-toan-go @click="hoiGoToan(x, null, c)" :disabled="dang"
                                                class="ml-auto shrink-0 px-3 py-2 -my-1 rounded-full border border-rose-300 bg-white text-xs font-semibold text-rose-700">↩ Gỡ</button>
                                      </li>
                                    </template>
                                  </ul>
                                </div>
                              </template>
                            </div>
                          </template>
                        </section>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </section>
          </div>
        </template>

        
        <template x-if="hoi">
          <div data-qt-hoi role="dialog" aria-modal="true" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 px-4">
            <div class="w-full max-w-md bg-white rounded-2xl shadow-xl px-5 py-4">
              <p data-qt-hoi-tieu class="font-bold text-slate-800" x-text="hoi.tieu"></p>
              <p data-qt-hoi-chu class="mt-2 text-sm text-slate-700" x-text="hoi.chu"></p>
              <p data-qt-hoi-loi x-show="hoi.loi" x-text="hoi.loi" role="alert" class="mt-2 text-sm font-semibold text-rose-700"></p>
              <div class="mt-4 flex justify-end gap-2">
                <button type="button" data-qt-hoi-thoi @click="dongHoi()" :disabled="dang" class="h-10 px-4 rounded-lg border border-slate-300 bg-white text-sm"
                        x-text="hoi.het ? 'Đóng' : 'Thôi'"></button>
                <button type="button" data-qt-hoi-go x-show="!hoi.het" @click="xacNhan()" :disabled="dang"
                        class="h-10 px-4 rounded-lg bg-rose-600 text-white text-sm font-semibold">Xác nhận</button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>
  </main>
</body>
</html>
