window.LS = (function () {
  var ve = null, goc = '', dang = 0, henCuon = null, cho = null;
  // `popstate` kế tiếp do CHÍNH LS.dong() gây ra (code đóng lớp phủ) → KHÔNG khôi phục `cuon`.
  // Lớp phủ là `fixed`, trang dưới đứng yên; `cuon` của mục nền chỉ là ảnh cũ. Đóng xong trang
  // thường tự cuộn (bấm mục lục: `toiMuc(i); menuMo = false`) — popstate tới SAU, khôi phục là
  // kéo trang về chỗ cũ, đè lên cú cuộn đó (máy chậm: luôn thua; 2026-10-16). Back của người dùng
  // không qua đây ⇒ vẫn khôi phục như ADR 0067.
  var boCuon = 0;
  function token() {
    try { return decodeURI((location.hash || '').replace(/^#/, '')); } catch (e) { return ''; }
  }
  function url(tk) { return tk ? '#' + encodeURI(tk) : location.pathname + location.search; }
  function luuCuon() {
    var st = history.state;
    if (!st || !st.ls || st.cuon === window.scrollY) return;
    st.cuon = window.scrollY;
    history.replaceState(st, '', location.href);
  }
  // Lượt hẹn chưa chạy phải huỷ ở `popstate`: chạy SAU nó thì ghi scrollY của màn vừa rời vào mục vừa quay về
  // (Back trong 200 ms sau khi mở truyện → thư viện mất vị trí cuộn, `cuon` 600 → 0; tests/test_lichsu.py).
  // KHÔNG lưu cuộn trong `di()`: trang thường cuộn về đầu TRƯỚC khi gọi LS.di → sẽ ghi 0 vào mục cũ.
  function huyHen() { if (henCuon) { clearTimeout(henCuon); henCuon = null; } }

    if (henCuon) return;

    dang++;
    Promise.resolve().then(function () { return ve(req.tk, req.st || {}); }).then(
      function () { dang--; cuonLai(req.st); tiep(); },
      function () { dang--; tiep(); });
  }
  function tiep() { if (cho) { var r = cho; cho = null; chayVe(r); } }
  function veLai(tk, st) {
    if (!ve) { cuonLai(st); return; }
    if (dang) { cho = { tk: tk, st: st }; return; }

<script>
  window.QT_KHOA = 'quantri_qt';
  // Nhóm lọc — thứ tự = thứ tự chip (spec §4.7; `lop` = bảng lớp học thêm, quyết định 2026-10-16).
  window.QT_LOAI = { lms: 'Nội dung LMS', lop: 'Lớp học thêm', doc: 'Đọc sách', on: 'Ôn tập', bo_me: 'Bố mẹ', tra: 'Tra từ' };
  function qtChipLoai(ds) {
    const co = new Set(ds.map((x) => x.loai));
    return Object.keys(QT_LOAI).filter((k) => co.has(k)).map((k) => ({ k, ten: QT_LOAI[k] }));
  }
  function qtChipMon(ds, ten) {
    return [...new Set(ds.map((x) => x.mon).filter(Boolean))].map((k) => ({ k, ten: ten[k] || k }))
      .sort((p, q) => p.ten.localeCompare(q.ten, 'vi'));
  }
  function qtLoc(ds, loai, mon) { return ds.filter((x) => (!loai || x.loai === loai) && (!mon || x.mon === mon)); }
  // Tiến độ theo môn: mục xong = có khoá KV và KHÔNG redo; phần xong = mọi mục xong (như syncSecBox / chonTick).
  function qtTienDo(tienDo, items, user) {
    const xong = (cid, iid) => { const v = items[user + '/' + cid + '/' + iid]; return !!v && !v.redo; };
    return tienDo.map((m) => ({ slug: m.slug, ten: m.ten, muc_tong: m.muc.length,
      muc_xong: m.muc.filter((i) => xong(m.cid, i)).length, nhom_tong: m.nhom.length,
      nhom_xong: m.nhom.filter((g) => g.length && g.every((i) => xong(m.cid, i))).length }));
  }
  function phienQT() {
    return {
      qt: null, ma: '', loiQt: '', dangMo: false,
      docPhien() {
        try {
          const o = JSON.parse(localStorage.getItem(QT_KHOA) || 'null');
          if (o && typeof o.token === 'string' && Number.isInteger(o.het) && o.het > Date.now() / 1000) return o;
        } catch (e) { /* hỏng → coi như chưa có */ }
        localStorage.removeItem(QT_KHOA);
        return null;
      },
      async moPhien() {
        const v = this.ma.trim();
        if (!v || this.dangMo) return;
        this.dangMo = true; this.loiQt = '';
        try {
          const r = await fetch('/api/quantri/phien', { method: 'POST', headers: { 'content-type': 'application/json' },
                                                       body: JSON.stringify({ ma: v }) });
          if (r.status === 401) { this.loiQt = 'Mã bố mẹ không đúng.'; return; }
          if (!r.ok) { this.loiQt = 'Chưa mở được phiên (HTTP ' + r.status + ').'; return; }
          const d = await r.json();
          this.qt = { token: d.token, het: d.het };
          localStorage.setItem(QT_KHOA, JSON.stringify(this.qt));
          this.ma = '';
          await this.taiTrang();
        } catch (e) { this.loiQt = 'Không kết nối được máy chủ.'; }
        finally { this.dangMo = false; }
      },
      thoat() { localStorage.removeItem(QT_KHOA); this.qt = null; },
      hetPhien() { this.thoat(); this.loiQt = 'Phiên bố mẹ đã hết hạn — mở lại.'; },
      hetLuc() {
        return this.qt ? this.gio(this.qt.het) + ' ' + new Date(this.qt.het * 1000).toLocaleDateString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' }) : '';
      },
      // GET (body undefined) hoặc POST JSON, kèm x-quantri. 401 → hết phiên + Error{het}; lỗi khác → Error(lời của máy chủ).
      async api(path, body) {
        const init = { headers: { 'x-quantri': this.qt ? this.qt.token : '' } };
        if (body !== undefined) { init.method = 'POST'; init.headers['content-type'] = 'application/json'; init.body = JSON.stringify(body); }
        let r;
        try { r = await fetch(path, init); } catch (e) { throw new Error('Không kết nối được máy chủ.'); }
        const d = await r.json().catch(() => ({}));
        if (r.status === 401) {
          this.hetPhien();
          const e = new Error('Phiên bố mẹ đã hết hạn — mở lại phiên (ô mã ở đầu trang) rồi làm lại.');
          e.het = true;
          throw e;
        }
        if (!r.ok) throw new Error(d.error || ('Lỗi máy chủ (HTTP ' + r.status + ').'));
        return d;
      },
      ngay(ts) {
        return new Date(ts * 1000).toLocaleDateString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
      },
      gio(ts) {
        return new Date(ts * 1000).toLocaleTimeString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit' });
      },
    };
  }
</script>

        const ds = (g.cd || []).filter((c) => kho.cd[c] && !daXep.has(c));
        ds.forEach((c) => daXep.add(c));
        if (ds.length) mang.push({ id: g.id, chu: g.chu || g.id, cd: ds.map(veCd) });
      }
      const con = Object.keys(kho.cd).filter((c) => !daXep.has(c));
      if (con.length) mang.push({ id: '_khac', chu: 'Chuyên đề khác', cd: con.map(veCd) });
      // Lộ trình (R22 — cùng luật trang con, worker/toan_muc.js): "đang ở" = buổi "dang_hoc" đầu tiên, không có thì buổi "chua_toi"
      // đầu tiên (buổi "sắp có" — chuyên đề chưa duyệt / buổi kiểm tra — không phải chỗ con đang ở); buổi gộp so:[a,b] nặng b−a+1.
      // Không ngày tháng: lộ trình không xếp lịch.
      const loTrinh = Object.values(kho.lo_trinh || {}).map((t) => {
        const b = M.buoiHienTai(t, kho, luot, now), x = M.soBuoiXong(t, kho, luot, now);
        return { id: t.id, chu: t.chu || t.id, tong: x.tong, xong: x.xong,
                 dang_o: b ? (Array.isArray(b.so) ? b.so.join('–') : String(b.so)) : '' };
      });
      return { trong: false, mang, giang_lai: giangLai, lo_trinh: loTrinh };
    }
    // Kết quả cuối của một nhóm bài tập suy từ g (thang của attempt): 3 đúng ngay · 2 đúng sau khi sai · 1 sai · 0 xem lời giải.
    const KQ_BT = { 3: ['✅ Đúng ngay', 'text-emerald-700'], 2: ['✅ Đúng sau khi sai', 'text-emerald-700'], 1: ['❌ Sai', 'text-rose-700'],
                    0: ['👀 Xem lời giải', 'text-amber-700'] };
    const TIER_BT = [['focus', 'Focus'], ['practice', 'Practice'], ['challenge', 'Challenge']];
    // Câu viết (ý `viet`): MỌI lượt có chữ của MỘT nhóm, MỚI TRƯỚC — để bố mẹ đọc câu của con, thấy bằng chứng máy trích, nhận xét, và đổi kết luận
    // (POST /api/quantri/bt/sua). M = bai_tap.js (docXViet, tachDoan); ls = lượt của nhóm, cũ trước mới sau ({g, ts, x}); yy = ý trong `ys` (tu_kiem, tu_kiem_ma).
    // Mỗi lượt: {ts, l (lượt thứ mấy | null), g, dat (g ≥ 2), loai ('may' | 'tu' | 'cu' | 'mau'), tc: [{nhan, dat}], doan: [{t, mark}], nx, bm, dan, nut: [{chu, dat}]}.
    //   tc    chip tiêu chí theo thứ tự tài liệu rồi mã lạ; nhãn = phần trước dấu «:» đầu của tu_kiem (không có thì cả câu); mã không còn trong tài liệu: «(tiêu chí cũ)»
    //   doan  câu của con cắt theo vùng máy đã trích (chỉ tiêu chí ĐẠT của lượt máy); trích không tìm thấy thì không tô
    //   nut   lượt máy: MỘT nút lật kết luận · tự kiểm / chữ trần: «Đạt» + «Chưa đạt» · đã sửa (bm): MỘT nút đổi lại · «mở bài mẫu»: không nút
    function qtVietLuot(M, ls, yy) {
      const ma = yy.tu_kiem_ma || [];
      const nhanTc = (m) => {
        const i = ma.indexOf(m);
        if (i < 0) return '(tiêu chí cũ)';
        const t = String((yy.tu_kiem || [])[i] == null ? '' : yy.tu_kiem[i]);
        const k = t.indexOf(':');
        return (k > 0 ? t.slice(0, k) : t).trim() || '(tiêu chí cũ)';
      };
      const ra = [];
      for (const a of ls) {
        if (typeof a.x !== 'string' || !a.x.trim()) continue;
        const x = M.docXViet(a.x);
        if (x.loai === 'trong') continue;
        const dat = a.g >= 2, bm = x.bm;
        const khoa = x.loai === 'may' ? x.k : x.loai === 'tu' ? x.tk : {};
        const maTc = [...ma.filter((m) => Object.hasOwn(khoa, m)), ...Object.keys(khoa).filter((m) => !ma.includes(m))];
        const tc = maTc.map((m) => ({ nhan: nhanTc(m), dat: khoa[m] === 1 }));
        const trich = x.loai === 'may' ? maTc.filter((m) => x.k[m] === 1 && x.q[m]).map((m) => x.q[m]) : [];
        const doan = x.loai === 'mau' ? [] : M.tachDoan(x.t == null ? '' : x.t, trich);
        // Kết luận đang có hiệu lực = bố mẹ sửa (bm.d) nếu có, không thì theo g (g ≥ 2 = đạt) — KHÔNG theo kết luận của máy (m.d): lượt máy cho đạt mà con đã xem bài mẫu có g 0,
        // chip hiện «Chưa đạt» thì nút phải là «Đánh là đạt» (cùng chiều chip). Worker trả đúng g gốc khi bố mẹ đổi về kết luận gốc.
        const hienHanh = bm ? bm.d === 1 : dat;
        let dan = '', nut = [];
        if (x.loai === 'mau') { /* không có gì để chấm */ }
        else if (bm) { dan = 'Bố mẹ đã sửa kết luận — đổi lại được:'; nut = [{ chu: hienHanh ? 'Đổi lại: chưa đạt' : 'Đổi lại: đạt', dat: !hienHanh }]; }
        else if (x.loai === 'may') { dan = 'Bố mẹ thấy máy chấm sai?'; nut = [{ chu: hienHanh ? 'Đánh là chưa đạt' : 'Đánh là đạt', dat: !hienHanh }]; }
        else {
          const b = Object.keys(x.tk).length, d = Object.values(x.tk).filter((v) => v === 1).length;
          dan = x.loai === 'tu' ? 'Con tự tick ' + d + '/' + (b || ma.length) + ' — bố mẹ chấm:' : 'Bố mẹ chấm:';
          nut = [{ chu: 'Đạt', dat: true }, { chu: 'Chưa đạt', dat: false }];
        }
        ra.push({ ts: a.ts, l: x.l, g: a.g, dat, loai: x.loai, tc, doan, nx: x.n || '', bm, dan, nut });
      }
      return ra.reverse();
    }
    // ═══ Tab Bài tập trên KHUNG CHUNG (A9, quyết định chủ dự án 2026-11-06) ═══
    // Mỗi môn một BỘ CHUYỂN dựng MỘT hình dữ liệu; template vẽ chung, KHÔNG rẽ nhánh theo môn. Chọn bộ chuyển theo `doc.loai_tep` ("esl" → qtBtEsl; còn lại → qtBtMath).
    // Thêm môn sau = thêm một bộ chuyển + một nhánh ở qtBaiTap (Toán 6 sẽ cắm vào `kt[].con`).
    //   THẺ MÔN  {slug, tien_do, chu_giai, nhom} — hoặc {slug, loi, tai_trang} khi bộ chuyển / mô-đun của môn không dựng được (lỗi nằm TRONG thẻ đó, thẻ khác vẫn vẽ)
    //   nhom     [{id, ten, kt, hang, de}]        nhóm dòng dưới MỘT tiêu đề `ten` (ESL: mỗi Unit một nhóm — «Unit 3 — Living things»; Math có `doc.unit`: mỗi Unit một nhóm — «Averages 1»; Math cũ không có Unit: MỘT nhóm, `ten` rỗng = không tiêu đề)
    //   tien_do  [{id, ten, xong, tong, don_vi}]  thanh tiến độ (Math: Focus · Practice · Challenge «x/y bài», có đề thì thêm Đề gốc · Đề mới «x/y đề»; ESL: Đề gốc · Đề mới «x/y đề», Luyện «x/y câu»)
    //   chu_giai [{ten, cham}]                    năm mức = bộ nhãn CHUNG mọi môn (worker/muc_ten.js, `M.TEN_MUC`) kèm số chấm
    //   kt       [{id, ten, muc, ten_muc, cham, dung, da_lam, dv, tong, ghi, yeu, y: [Y], con?: [kt]}]   (trong nhóm) dòng kiến thức (Math: kiến thức; ESL: mảng); `dv` = đơn vị sau «đúng x/y»
    //            (' câu' ở ESL, rỗng ở Math). `con` (nhiều tầng) CHƯA ai dùng — chỗ cắm Toán 6 (mảng → chuyên đề → dạng); `hang` = kt trải phẳng kèm `cap` (độ sâu) — template vẽ `hang`
    //   Y        {id, tieu, phu, canh, tit_luot, so_lan, ts, g, kq, kq_lop, cho, luot: [LUOT], dien: [SEG], dap: [SEG]}   một ý (Math) / một câu (ESL) đã làm
    //   SEG      {t} | {anh, alt}                 mảnh chữ, hoặc ẢNH NHỎ (câu có tranh — thay chữ «hình N»)
    //   LUOT     như qtVietLuot: {ts, l, g, dat, loai, tc, doan, nx, bm, dan, nut: [{chu, dat}]} — `nut` do bộ chuyển khai; template chỉ vẽ nút rồi gọi suaViet(mon, y, l, dat)
    //   de       [{key, ma, tieu, ts, lan, phu: [chữ], phan: [{ten, diem}], y: [Y]}]   (trong nhóm) lượt làm đề của nhóm, mới trước (Math cũ không đề: rỗng). Dựng bằng `qtLuotDe` — MỘT hàm cho cả hai môn; đề ở nhiều Unit (Math) hiện ở mọi Unit đó, khoá `key` thêm đuôi Unit để mở một lượt không mở lượt kia
    // Dùng chung của hai bộ chuyển: lượt trùng hệt chỉ đếm một; «đúng» = TỪNG có lượt g ≥ 2 (không phải lượt cuối); mức = M.mucKt (CÙNG hàm trang con); ghi chú «chưa làm» / «⚠ yếu» (đã làm, mức ≤ 1).
    const dungRoi = (ls) => (ls || []).some((a) => a.g >= 2);
    const nhomTheo = (luot, khoa) => {   // → Map khoá → các lượt, cũ trước mới sau
      const m = new Map();
      for (const a of luot) { const k = khoa(a); if (!m.has(k)) m.set(k, []); m.get(k).push(a); }
      return m;
    };
    const traiPhang = (ds, cap = 0) => ds.flatMap((k) => { k.cap = cap; return [k, ...traiPhang(k.con || [], cap + 1)]; });

    // ── Bộ chuyển MATH: M = bai_tap.js; E = bai_tap_esl.js (CHỈ để tính điểm lượt đề; null khi không nạp được → mất riêng phần đề); doc = tài liệu dựng Math ({muc, kien_thuc, unit?, de?}); luotTat = lượt "b.%" của học sinh (mọi môn); now = epoch giây.
    //   bài xong (tiến độ) = MỌI nhóm của MỌI ý trong bài có ít nhất một lượt g ≥ 2; biến thể "bài tương tự" không tính vào tổng bài.
    //   đúng / đã làm = số NHÓM có lượt g ≥ 2 / số nhóm có lượt (kể cả nhóm của biến thể); lượt trùng hệt (ts, i, g) chỉ đếm một.
    //   `doc.unit` VẮNG (tài liệu cũ, chưa có đề) → hành vi CŨ: MỘT nhóm `m` không tiêu đề, ba chỉ số Focus · Practice · Challenge, không lượt đề.
    //   `doc.unit` CÓ (đợt «Làm trọn đề», plan 2026-11-08):
    //     Unit   mỗi Unit một nhóm (thứ tự = doc.unit); `kt` của nhóm = kiến thức có bài trong các mục của Unit (thứ tự doc.kien_thuc); kiến thức KHÔNG có bài ở mục nào (chỉ ở đề, vd ft.*) vào Unit ĐẦU của đề đầu tiên
    //            có nó (`de.unit[0]`); không đề nào có thì vào Unit đầu. Dòng kiến thức chỉ có ở đề, mức 0 thì hiện «Chưa học · chưa làm» như mọi dòng.
    //     nhóm của ĐỀ tính vào đúng / đã làm và danh sách ý của kiến thức như câu của đề ở ESL (mức đã gồm chúng: M.cacNhom(doc) có đề) — bài Focus/Practice/Challenge «x/y bài» chỉ đếm bài của mục Luyện.
    //     lượt đề  `qtLuotDe` (CÙNG khối với ESL): mỗi Ý một dòng «Con điền … → đúng là …» (nhóm cùng ý gộp một dòng), ý viết qua qtVietLuot (chip · 🤖 · nút bt/sua). Cần E: thiếu E thì không lượt đề, không hai chỉ số Đề.
    function qtBtMath(M, E, slug, doc, luotTat, now) {
      const theoUnit = Array.isArray(doc.unit) && doc.unit.length > 0;
      const deList = theoUnit && Array.isArray(doc.de) ? doc.de.filter((d) => d && d.id) : [];
      const ys = [];   // mỗi ý: {nguon, nhan, kieu, tier, bt (biến thể), nhom: [{id, kt}]}
      const tienDo = Object.fromEntries(TIER_BT.map(([t]) => [t, { tong: 0, xong: 0 }]));
      const baiGoc = [];   // [tier, [id nhóm…]]
      const deNhom = new Set();   // id nhóm của bài GỐC trong đề (bài tương tự của đề chỉ làm ở Luyện: không vào lượt đề)
      const duyet = (b, bt, trongDe) => {
        const ids = [];
        for (const y of b.y || []) {
          // Ý trong đề: `x` của dòng sổ là «Con điền» của MỌI kiểu (xY), không chỉ kiểu điều kiện — trừ ý viết (JSON chấm câu viết)
          ys.push({ nguon: b.nguon || '', nhan: y.nhan || '', kieu: y.kieu, tier: b.tier, bt, nhom: y.nhom || [], co_x: trongDe ? y.kieu !== 'viet' : M.coXDien(y),
                    tu_kiem: Array.isArray(y.tu_kiem) ? y.tu_kiem : [], tu_kiem_ma: Array.isArray(y.tu_kiem_ma) ? y.tu_kiem_ma : [] });
          for (const n of y.nhom || []) { ids.push(n.id); if (trongDe && !bt) deNhom.add(n.id); }
        }
        return ids;
      };
      for (const m of doc.muc) for (const b of m.bai || []) {
        baiGoc.push([b.tier, duyet(b, false, false)]);
        for (const v of b.bien_the || []) duyet(v, true, false);
      }
      for (const d of deList) for (const p of d.phan || []) for (const b of p.bai || []) {
        duyet(b, false, true);
        for (const v of b.bien_the || []) duyet(v, true, true);
      }
      const nhomKt = new Map();   // id nhóm → kiến thức
      for (const y of ys) for (const n of y.nhom) nhomKt.set(n.id, n.kt);
      const thay = new Set();
      const luot = luotTat.filter((a) => a && a.course === slug && a.ts <= now && nhomKt.has(a.i))
        .filter((a) => { const k = a.ts + '/' + a.i + '/' + a.g; if (thay.has(k)) return false; thay.add(k); return true; })
        .sort((p, q) => p.ts - q.ts);
      const theoNhom = nhomTheo(luot, (a) => a.i);   // id nhóm → các lượt, cũ trước mới sau
      for (const [tier, ids] of baiGoc) {
        if (!tienDo[tier]) continue;
        tienDo[tier].tong++;
        if (ids.length && ids.every((id) => dungRoi(theoNhom.get(id)))) tienDo[tier].xong++;
      }
      const mucCua = M.mucKt(luot, M.cacNhom(doc), now);
      const dongKt = (k) => {
        const ids = [...nhomKt].filter(([, c]) => c === k.id).map(([id]) => id);
        const lam = ids.filter((id) => theoNhom.has(id));
        const dung = lam.filter((id) => dungRoi(theoNhom.get(id))).length;
        const muc = mucCua[k.id] || 0;
        const y = [];
        let viet = 0;
        for (const yy of ys) for (const n of yy.nhom) {
          if (n.kt !== k.id || !theoNhom.has(n.id)) continue;
          const ls = theoNhom.get(n.id), cuoi = ls[ls.length - 1];
          const kq = KQ_BT[cuoi.g] || ['g = ' + cuoi.g, 'text-slate-500'];
          const luotViet = yy.kieu === 'viet' ? qtVietLuot(M, ls, yy) : [];
          if (luotViet.length) viet++;
          // Kiểu ý ĐIỀU KIỆN (cot · o_dk · the_o · noi_nhom) và ý `o` / `bang` thuộc `M.coXDien` (ô số ÂM `am` · ô CHỮ `dap_chu` · ô liệt kê không-mode; Unit 1/2/4/6): `x` của sổ = chữ con đã điền
          // (phép tính, «−4», «8, 4, 2, 1», chữ thường — không phải JSON chấm câu viết; dấu trừ U+2212 do trang con đã đổi). Vẽ ở `dien` (một mảnh chữ), cạnh `luot`; KHÔNG qua qtVietLuot / docXViet và KHÔNG cộng vào `viet` («N câu tự viết»).
          const co = (M.KIEU_DIEN || []).includes(yy.kieu) || yy.co_x ? ls.filter((a) => typeof a.x === 'string' && a.x.trim()) : [];
          const dien = co.length ? co[co.length - 1].x : '';
          y.push({ id: n.id, tieu: yy.nguon + (yy.nhan ? ' (' + yy.nhan + ')' : ''), phu: yy.bt ? 'bài tương tự' : '', canh: '',
                   tit_luot: yy.nguon + (yy.nhan ? ' · ý ' + yy.nhan : ''), so_lan: ls.length, ts: cuoi.ts, g: cuoi.g, kq: kq[0], kq_lop: kq[1], cho: false,
                   luot: luotViet, dien: dien ? [{ t: dien }] : [], dap: [] });
        }
        y.sort((p, q) => q.ts - p.ts);
        const ghi = [!lam.length ? 'chưa làm' : muc <= 1 ? '⚠ yếu' : '', viet ? viet + ' câu tự viết' : ''].filter(Boolean).join(' · ');
        return { id: k.id, ten: k.ten || k.id, muc, ten_muc: M.TEN_MUC[muc] || '', cham: muc, dung, da_lam: lam.length, dv: '',
                 tong: ids.length, ghi, yeu: !!lam.length && muc <= 1, y };
      };
      const tienDoThe = TIER_BT.map(([t, ten]) => ({ id: t, ten, ...tienDo[t], don_vi: 'bài' }));
      const chuGiai = M.TEN_MUC.map((ten, cham) => ({ ten, cham }));
      if (!theoUnit) return { slug, tien_do: tienDoThe, chu_giai: chuGiai, nhom: [{ id: 'm', ten: '', kt: (doc.kien_thuc || []).map(dongKt), de: [] }] };

      // Kiến thức của từng Unit (xem khối chú thích ở đầu hàm)
      const units = doc.unit;
      const mucTheo = new Map(doc.muc.map((m) => [m.concept, m]));
      const ktUnit = units.map((u) => {
        const s = new Set();
        for (const c of u.muc || []) for (const b of (mucTheo.get(c) || {}).bai || []) for (const v of [b, ...(b.bien_the || [])]) for (const y of v.y || []) for (const n of y.nhom || []) s.add(n.kt);
        return s;
      });
      const coBai = new Set(ktUnit.flatMap((s) => [...s]));
      const chiSoUnit = (d) => (d.unit || []).map((c) => units.findIndex((u) => u.concept === c)).find((i) => i >= 0);
      const unitDauDe = new Map();   // kiến thức chỉ có ở đề → chỉ số Unit đầu của đề đầu tiên có nó
      for (const d of deList) for (const p of d.phan || []) for (const b of p.bai || []) for (const y of b.y || []) for (const n of y.nhom || []) {
        const i = chiSoUnit(d);
        if (!coBai.has(n.kt) && !unitDauDe.has(n.kt) && i !== undefined) unitDauDe.set(n.kt, i);
      }
      for (const k of doc.kien_thuc || []) if (!coBai.has(k.id)) ktUnit[unitDauDe.has(k.id) ? unitDauDe.get(k.id) : 0].add(k.id);

      // Lượt làm đề: dòng sổ của nhóm đề + dòng tổng (mỗi lần nộp một dòng, c = 'de'); lượt trùng hệt (cả x) chỉ đếm một
      let lanDe = [], nopDe = null;
      if (E && deList.length) {
        const deMap = new Map(deList.map((d) => [d.id, d]));
        const thayDe = new Set();
        const rs = luotTat.filter((a) => a && a.course === slug && a.ts <= now && (deNhom.has(a.i) || (a.c === 'de' && deMap.has(a.i))))
          .filter((a) => { const k = a.ts + '/' + a.i + '/' + a.g + '/' + (a.x == null ? '' : a.x); if (thayDe.has(k)) return false; thayDe.add(k); return true; })
          .sort((p, q) => p.ts - q.ts);
        const rMuc = rs.filter((a) => deNhom.has(a.i));
        const gocY = (m) => ({ id: m.ids[0], tieu: (m.b.nguon || '') + (m.y.nhan ? ' (' + m.y.nhan + ')' : ''), phu: '', canh: '', tit_luot: (m.b.nguon || '') + (m.y.nhan ? ' · ý ' + m.y.nhan : '') });

      };
      const seg = (inf, chu) => (chu === '' ? [] : inf.b.kieu === 'noi' ? segNoi(inf, chu) : [{ t: chu }]);
      const dapDung = (inf) => {   // đáp án đúng ở CÙNG khuôn chữ với «Con điền»: dựng trả lời đúng rồi qua E.xCau
        const { c, b } = inf, d = Array.isArray(c.dap) ? c.dap : [];
        switch (b.kieu) {
          case 'abc': case 'hoi_thoai': case 'noi': return E.xCau(c, c.dap, b);
          case 'o': case 'khung': case 'chuoi': case 'viet_lai': return d.length ? E.xCau(c, d[0], b) : '';
          case 'sua_loi': return d.length ? E.xCau(c, { chon: true, sua: d[0] }, b) : '';
          case 'sap_xep': return d.length ? gonX(d[0]) : '';
          case 'mo': return '';   // câu mở: nhiều cách đúng, không có «đúng là …» (câu mẫu chỉ là MỘT cách viết, và con đã thấy nó ở trang con)
          default: return '';
        }
      };
      const laMay = (a) => laMayDong(M, a);
      // Một câu từ các lượt `ls` (cũ trước mới sau)
      const yCau = (inf, ls) => {
        const cuoi = ls[ls.length - 1], kq = KQ_BT[cuoi.g] || ['g = ' + cuoi.g, 'text-slate-500'];
        const may = ls.filter(laMay);
        const luotMay = may.length ? qtVietLuot(M, may, { tu_kiem: inf.b.tu_kiem || [], tu_kiem_ma: inf.b.tu_kiem_ma || [] }) : [];
        const thuong = typeof cuoi.x === 'string' && !xJson(cuoi.x);   // dòng cuối là chữ con gõ (không phải kết luận máy)
        const chu = thuong ? gonX(cuoi.x) : '';
        const dien = thuong ? (chu === '' && cuoi.g <= 1 ? [{ t: '(bỏ trống)' }] : seg(inf, chu)) : [];
        const dap = cuoi.g <= 1 && inf.b.kieu !== 'viet' ? seg(inf, dapDung(inf)) : [];
        return { id: inf.c.id, tieu: tieuCau(inf), phu: '', canh: canhCau(inf), tit_luot: tieuCau(inf), so_lan: ls.length, ts: cuoi.ts, g: cuoi.g, kq: kq[0], kq_lop: kq[1], cho: false,
                 luot: luotMay, dien, dap };
      };
      const yCho = (inf, ts) => ({ id: inf.c.id, tieu: tieuCau(inf), phu: '', canh: canhCau(inf), tit_luot: tieuCau(inf), so_lan: 0, ts, g: -1, kq: '⏳ Đang chờ máy chấm — chưa tính điểm',
                                   kq_lop: 'text-amber-700', cho: true, luot: [], dien: [], dap: [] });

      // Mảng của MỘT Unit (câu của Unit khác không lọt vào dù trùng id mảng)
      const ktUnit = (ui) => (units[ui].mang || []).map((m) => {
        const ids = [...cau].filter(([, i]) => i.u === ui && i.kt === m.id).map(([id]) => id);
        const lam = ids.filter((id) => theoCau.has(id));
        const muc = mucCua[m.id] || 0;
        const y = lam.map((id) => yCau(cau.get(id), theoCau.get(id))).sort((p, q) => q.ts - p.ts);
        return { id: m.id, ten: m.ten || m.id, muc, ten_muc: M.TEN_MUC[muc] || '', cham: muc, dung: lam.filter((id) => dungRoi(theoCau.get(id))).length, da_lam: lam.length, dv: ' câu',
                 tong: ids.length, ghi: !lam.length ? 'chưa làm' : muc <= 1 ? '⚠ yếu' : '', yeu: !!lam.length && muc <= 1, y };
      });

      // Lượt làm đề — khối DÙNG CHUNG với Math (qtLuotDe); phần riêng của ESL: mục = một câu (`b.cau[]` của phần), viết lại có kết luận bố mẹ sửa được
      const khoiDe = qtLuotDe(E, {
        slug, deMap, rTong, rMuc: rCau, theoMuc: theoCau, laMay,
        cacMuc: (d) => (d.phan || []).flatMap((p, pi) => { const b = p && p.bai; return b ? (b.cau || []).map((c) => ({ ids: [c.id], pi, viet: b.kieu === 'viet' })) : []; }),
        vietLai: (d) => new Set((d.phan || []).filter((p) => p && p.bai && p.bai.kieu === 'viet_lai').flatMap((p) => (p.bai.cau || []).map((c) => c.id))),
        tenPhan: (d, pi) => { const p = d.phan[pi]; return { ten: p && p.ten ? p.ten : 'Phần ' + (pi + 1), viet: !!(p && p.bai && p.bai.kieu === 'viet') }; },
        yDong: (m, rs) => yCau(cau.get(m.ids[0]), rs),
        yCho: (m, ts) => yCho(cau.get(m.ids[0]), ts),
      });
      const de = khoiDe.de, nopMoi = khoiDe.nop;

      const goc = [...deMap.values()].filter((d) => d.loai === 'goc'), moi = [...deMap.values()].filter((d) => d.loai === 'moi');
      return { slug,
               tien_do: [{ id: 'goc', ten: 'Đề gốc', xong: goc.filter((d) => nopMoi(d.id)).length, tong: goc.length, don_vi: 'đề' },
                         { id: 'moi', ten: 'Đề mới', xong: moi.filter((d) => nopMoi(d.id)).length, tong: moi.length, don_vi: 'đề' },
                         { id: 'luyen', ten: 'Luyện', xong: luyenIds.filter((id) => theoCau.has(id)).length, tong: luyenIds.length, don_vi: 'câu' }],
               chu_giai: M.TEN_MUC.map((ten, cham) => ({ ten, cham })),
               nhom: units.map((u, ui) => ({ id: 'u' + ui, ten: u.ten || 'Unit ' + (ui + 1), kt: ktUnit(ui), de: de.filter((l) => deUnit.get(l.deId) === ui) })) };
    }

    // Dựng màn hình tab Bài tập — dữ liệu phẳng, Alpine chỉ vẽ. M = bai_tap.js; E = {mod: bai_tap_esl.js} | {loi, tai_trang} | null (không có môn ESL, không có đề Math); docs = [[slug, tài liệu dựng | null]];
    // luotTat = lượt "b.%" của học sinh (mọi môn, {course, i, c, g, ts, x}); now = epoch giây. Môn nào dựng hỏng → thẻ {slug, loi}, môn khác vẫn vẽ.
    function qtBaiTap(M, E, docs, luotTat, now) {
      const mon = [];
      for (const [slug, doc] of docs) {
        if (!doc || typeof doc !== 'object') continue;
        let the = null;
        try {
          if (doc.loai_tep === 'esl') {
            the = E && E.mod ? qtBtEsl(M, E.mod, slug, doc, luotTat, now) : { slug, loi: (E && E.loi) || 'Không dựng được thẻ môn này.', tai_trang: !!(E && E.tai_trang) };
          } else if (Array.isArray(doc.muc)) {
            the = qtBtMath(M, E && E.mod ? E.mod : null, slug, doc, luotTat, now);   // E hỏng / không nạp → Math mất riêng phần đề (kiến thức theo Unit vẫn vẽ)
          }
        } catch (e) {
          console.warn('hoc-tap: không dựng được thẻ bài tập ' + slug, e);
          the = { slug, loi: 'Lỗi dựng thẻ môn này: ' + (e && e.message ? e.message : e) };
        }
        if (!the) continue;
        for (const g of the.nhom || []) g.hang = traiPhang(g.kt);
        mon.push(the);
      }
      return { trong: !mon.length, mon };
    }
    function trangQtHoc() {
      return {
        ...phienQT(),
        user: "pl",
        ready: false, tab: 'dong', loi: '', bao: '', dang: false,
        du: { dong: null, tapdoc: null, on: null, tu: null, mon: null, toan: null, bt: null },   // null = chưa nạp
        moDang: '',             // tab Toán: dạng đang bung bảng từng lần làm (bung tại chỗ, không vào lịch sử — như hàng lọc)
        moBt: '',               // tab Bài tập: dòng đang bung — kiến thức/mảng ("<môn>/<kiến thức>") hoặc lượt đề ("<môn>/de/…")
        suaKhoa: '', suaLoi: '', // tab Bài tập: lượt vừa sửa kết luận hỏng ("<id nhóm>/<ts>") + lời máy chủ, hiện ngay dưới lượt đó
        chu: {},                // môn → {id: chữ thẻ}
        locLoai: '', locMon: '', moLoc: '',   // moLoc: hàng lọc đang bung (kiểu B)
        hoi: null, dangVe: false,
        async init() {
          this.qt = this.docPhien();
          this.$watch(() => this.tokenCua(), (moi, cu) => {
            if (this.dangVe) return;
            const moMoi = moi.endsWith('~hoi'), moCu = String(cu).endsWith('~hoi');
            if (moMoi && !moCu) LS.mo(moi);
            else if (!moMoi && moCu) {
              // Back lúc đang gửi đã lấy mất mục `~hoi` mà hộp vẫn giữ (ve): hash không còn `~hoi` thì KHÔNG LS.dong —
              // nó history.back() khi sâu > 0 và văng người dùng về tab trước. Mục lớp phủ còn thì mới đóng bằng Back.
              let h = '';
              try { h = decodeURI((location.hash || '').replace(/^#/, '')); } catch (e) { /* hash hỏng → coi như không còn */ }
              if (h.endsWith('~hoi')) LS.dong(moi);
            } else LS.di(moi);
          });
          LS.nghe((tk) => this.ve(tk), 'dong');
          this.ready = true;
        },
        tokenCua() { return this.tab + (this.hoi ? '~hoi' : ''); },
        async ve(tk) {
          this.dangVe = true;
          try {
            const [t, lop] = String(tk || 'dong').split('~');
            // Đang gửi (dang) thì GIỮ hộp: Back giữa chừng mà xoá hộp thì lỗi trả về sau đó ghi vào hộp đã tách khỏi trang, mất.
            if (lop !== 'hoi' && !this.dang) this.hoi = null;
            if (TAB.includes(t) && t !== this.tab) { this.tab = t; this.locLoai = ''; this.locMon = ''; this.moLoc = ''; this.bao = ''; this.loi = ''; }
            if (this.qt) await this.nap(this.tab);
          } finally { this.$nextTick(() => { this.dangVe = false; }); }
        },
        // Đổi tab xoá báo / lỗi của tab trước (không để "Đã bỏ cờ…" hay lỗi nạp tab Ôn tập treo ở tab khác).
        doiTab(t) { if (t === this.tab) return; this.tab = t; this.locLoai = ''; this.locMon = ''; this.moLoc = ''; this.bao = ''; this.loi = ''; this.nap(t); },
        async taiTrang() { this.du = { dong: null, tapdoc: null, on: null, tu: null, mon: null, toan: null, bt: null }; await this.nap(this.tab); },
        async nap(t, lai = false) {
          if (this.du[t] !== null && !lai) return;
          try {
            if (t === 'mon') {
              const p = await fetch('/api/progress').then((r) => (r.ok ? r.json() : { items: {} })).catch(() => ({ items: {} }));
              this.du.mon = qtTienDo(TIEN_DO, p.items || {}, this.user);
            } else if (t === 'toan') {
              this.du.toan = await this.napToan();
            } else if (t === 'bt') {
              this.du.bt = await this.napBt();
            } else {
              const d = await this.api('/api/quantri/hoc-tap?phan=' + t + '&user=' + encodeURIComponent(this.user));
              const ds = Array.isArray(d) ? d : [];
              if (t === 'on') await Promise.all([...new Set(ds.map((x) => x.mon))].map((m) => this.napChu(m)));
              this.du[t] = ds;
            }
            this.loi = '';
          } catch (e) {
            if (e.het) return;
            // Tab Toán: lỗi nằm NGAY trong tab (kèm "Thử lại"); du.toan hết null nên không treo "Đang tải…".
            if (t === 'toan') this.du.toan = { loi: e.message, thu_lai: true, tai_trang: !!e.taiTrang };
            else if (t === 'bt') this.du.bt = { loi: e.message, thu_lai: true, tai_trang: !!e.taiTrang };   // như Toán: lỗi nằm trong tab, không treo "Đang tải…"
            else this.loi = e.message;
          }
        },
        async napToan() {
          let kho = null;
          try {
            const r = await fetch('../toan/kho.json', { headers: { accept: 'application/json' } });
            if (r.ok) kho = await r.json();
          } catch (e) { /* chưa dựng Toán → chưa có nội dung */ }
          if (!kho || typeof kho !== 'object') return { trong: true };
          // Có kho.json thì builder đã dựng Toán, nên TOAN_MUC KHÔNG được rỗng (toan.dung ném khi không chép được toan_muc.js).
          // Rỗng = bản dựng hỏng — nói rõ, đừng giả làm "chưa có nội dung".
          if (!TOAN_MUC) {
            console.warn('hoc-tap: có ../toan/kho.json nhưng TOAN_MUC rỗng — builder không chép được toan_muc.js (lỗi dựng trang Toán)');
            return { loi: 'Lỗi dựng trang Toán: trang này thiếu mô-đun tính mức (toan_muc.js). Dựng lại trang rồi mở lại.' };
          }
          if (!kho.cd || typeof kho.cd !== 'object' || !Object.keys(kho.cd).length) return { trong: true };
          let M;
          try { M = await import(TOAN_MUC); } catch (e) {
            console.warn('hoc-tap: không nạp được ' + TOAN_MUC, e);
            // Trình duyệt NHỚ import hỏng của một địa chỉ tới khi tải lại trang — thử lại tại chỗ vô ích, nên nút là "Tải lại trang".
            const loi = new Error('Không tải được mô-đun tính mức Toán (toan_muc.js). Kiểm tra mạng rồi tải lại trang.');
            loi.taiTrang = true;
            throw loi;
          }
          const d = await this.api('/api/quantri/hoc-tap?phan=toan&user=' + encodeURIComponent(this.user));
          const cols = Array.isArray(d.cols) ? d.cols : [];
          const luot = (Array.isArray(d.rows) ? d.rows : []).map((r) => Object.fromEntries(cols.map((k, j) => [k, r[j]])));
          return qtToan(M, kho, luot, Math.floor(Date.now() / 1000));
        },
        thuLaiToan() {
          if (this.du.toan && this.du.toan.tai_trang) { location.reload(); return; }
          this.du.toan = null;
          this.nap('toan', true);
        },
        // Tab Bài tập: tài liệu dựng của từng môn (../study/<môn>.bai-tap.json — cùng tệp con dùng) + mọi lượt "b.%" của học sinh.
        // Không tệp nào đọc được → "chưa có bài tập" và KHÔNG gọi API. Mô-đun bai_tap.js không import được → lỗi trong tab (nút "Tải lại trang").
        // Mô-đun riêng của một môn (bai_tap_esl.js, chỉ nạp khi có môn ESL hoặc đề Math) hỏng → lỗi nằm TRONG thẻ môn ESL; thẻ Math chỉ mất phần đề, môn khác vẫn vẽ (`napEsl`).
        async napBt() {
          if (!BAI_TAP_JS) {
            console.warn('hoc-tap: có môn bài tập nhưng BAI_TAP_JS rỗng — builder không chép được bai_tap.js (lỗi dựng trang)');
            return { loi: 'Lỗi dựng trang: thiếu mô-đun tính mức bài tập (bai_tap.js). Dựng lại trang rồi mở lại.' };
          }
          const [M, docs] = await Promise.all([
            import(BAI_TAP_JS).catch((e) => {
              console.warn('hoc-tap: không nạp được ' + BAI_TAP_JS, e);
              const loi = new Error('Không tải được mô-đun tính mức bài tập (bai_tap.js). Kiểm tra mạng rồi tải lại trang.');
              loi.taiTrang = true;   // trình duyệt nhớ import hỏng tới khi tải lại trang
              throw loi;
            }),
            Promise.all(BAI_TAP.map(async (slug) => {
              try {
                const r = await fetch('../study/' + encodeURIComponent(slug) + '.bai-tap.json', { headers: { accept: 'application/json' } });
                if (r.ok) return [slug, await r.json()];
              } catch (e) { /* không đọc được tệp → coi như môn này chưa có bài tập */ }
              return [slug, null];
            })),
          ]);
          if (!docs.some(([, d]) => d && (Array.isArray(d.muc) || d.loai_tep === 'esl'))) return { trong: true };
          // Mô-đun ESL cũng tính điểm lượt đề của Math (E.diemLuotBm · chamMuon): nạp khi có môn ESL HOẶC tài liệu Math có đề
          const E = docs.some(([, d]) => d && (d.loai_tep === 'esl' || (Array.isArray(d.de) && d.de.length))) ? await this.napEsl() : null;
          const d = await this.api('/api/quantri/hoc-tap?phan=bt&user=' + encodeURIComponent(this.user));
          const cols = Array.isArray(d.cols) ? d.cols : [];
          const luot = (Array.isArray(d.rows) ? d.rows : []).map((r) => Object.fromEntries(cols.map((k, j) => [k, r[j]])));
          return qtBaiTap(M, E, docs, luot, Math.floor(Date.now() / 1000));
        },
        // Mô-đun chấm của ESL 5: {mod} | {loi, tai_trang}. Lỗi KHÔNG ném — chỉ thẻ ESL báo lỗi (thẻ Maths vẫn vẽ).
        async napEsl() {
          if (!BAI_TAP_ESL_JS) {
            console.warn('hoc-tap: có môn ESL nhưng BAI_TAP_ESL_JS rỗng — builder không chép được bai_tap_esl.js (lỗi dựng trang)');
            return { loi: 'Lỗi dựng trang: thiếu mô-đun bài tập ESL (bai_tap_esl.js). Dựng lại trang rồi mở lại.', tai_trang: false };
          }
          try { return { mod: await import(BAI_TAP_ESL_JS) }; } catch (e) {
            console.warn('hoc-tap: không nạp được ' + BAI_TAP_ESL_JS, e);
            return { loi: 'Không tải được mô-đun chấm bài tập ESL (bai_tap_esl.js). Kiểm tra mạng rồi tải lại trang.', tai_trang: true };   // trình duyệt nhớ import hỏng tới khi tải lại trang
          }
        },
        // Tab Bài tập: bố mẹ đổi kết luận MỘT lượt chấm câu viết (máy / tự kiểm / chữ cũ). Đổi được lại bằng nút «Đổi lại». KHÔNG đụng ⭐ (máy chủ không cộng / trừ).
        // Xong nạp lại tab (`nap('bt', true)`) để chấm, mức thành thạo và nhãn «Bố mẹ đã sửa» tính lại từ sổ.
        async suaViet(mon, y, l, dat) {
          if (this.dang) return;
          this.dang = true; this.bao = ''; this.suaLoi = ''; this.suaKhoa = y.id + '/' + l.ts;
          try {
            await this.api('/api/quantri/bt/sua', { user: this.user, mon, i: y.id, ts: l.ts, dat });
            this.bao = 'Đã đổi kết luận lượt chấm — ⭐ không đổi (muốn trừ ⭐ thì vào trang Điểm).';
            await this.nap('bt', true);
          } catch (e) {
            if (!e.het) this.suaLoi = e.message;      // hết phiên: api() đã báo ở ô mã
          } finally { this.dang = false; }
        },
        thuLaiBt() {
          if (this.du.bt && this.du.bt.tai_trang) { location.reload(); return; }
          this.du.bt = null;
          this.nap('bt', true);
        },
        moDangToan(id) {
          this.moDang = id;
          this.$nextTick(() => { const e = document.querySelector('[data-qt-toan-dang="' + id + '"]'); if (e) e.scrollIntoView({ block: 'center' }); /* center: header dính không che */ });
        },
        mucToan(m) { return MUC_TOAN[m] || MUC_TOAN[0]; },
        async napChu(mon) {
          if (this.chu[mon]) return;
          const m = {};
          try {
            const r = await fetch('../study/' + encodeURIComponent(mon) + '.json', { headers: { accept: 'application/json' } });
            if (r.ok) {
              const d = await r.json();
              if (mon === 'so-tay') for (const [k, v] of Object.entries(d.nhan || {})) if (typeof v === 'string' && v) m[k] = v;
              for (const q of [...(d.flashcards || []), ...(d.quiz || [])]) if (q && q.id) m[q.id] = q.front_en || q.stem_en || q.id;
              for (const sec of d.summary || []) {
                for (const [khoi, truong] of Object.entries(MARK_KEYS)) {
                  for (const x of (sec && sec[khoi]) || []) {
                    if (!x || !x.mark) continue;
                    const c = truong.map((k) => x[k]).find((v) => typeof v === 'string' && v.trim());
                    if (c) m[x.mark] = c.trim();
                  }
                }
              }
            }
          } catch (e) { /* không có học liệu → hiện id */ }
          this.chu[mon] = m;
        },
        chuThe(x) { return (this.chu[x.mon] || {})[x.i] || (x.mon === 'so-tay' ? String(x.i).replace(/^st\./, '').replace('.', ' · ') : x.i); },
        ds() { return this.du[this.tab] || []; },
        loc() { return qtLoc(this.ds(), this.tab === 'dong' ? this.locLoai : '', this.locMon); },
        chipLoai() { return this.tab === 'dong' ? qtChipLoai(this.ds()) : []; },
        chipMon() {
          if (this.tab === 'bt') return qtChipMon(((this.du.bt && this.du.bt.mon) || []).map((m) => ({ mon: m.slug })), TEN_MON);   // chip theo THẺ MÔN (có từ 2 môn)
          return ['dong', 'on', 'tu'].includes(this.tab) ? qtChipMon(this.ds(), TEN_MON) : [];
        },
        theBt() { return ((this.du.bt && this.du.bt.mon) || []).filter((m) => !this.locMon || m.slug === this.locMon); },   // thẻ môn đang hiện của tab Bài tập
        ngayGio(ts) { return this.ngay(ts).split(', ').pop().replace(/\/\d{4}$/, '') + ' ' + this.gio(ts) + ' giờ VN'; },   // «dd/mm HH:MM giờ VN»

        bieuTuong(l) { return { lms: '✅', lop: '📋', doc: '📖', on: '🧠', bo_me: '📝', tra: '🔎' }[l] || '⭐'; },
        hoiThuoc(x) {
          this.bao = '';
          this.hoi = { viec: 'thuoc', tieu: 'Bỏ đã thuộc?', x, loi: '', het: false,
            chu: x.mon === 'so-tay'
              ? 'Bỏ đánh dấu "đã thuộc" của "' + this.chuThe(x) + '" (' + this.tenMon(x.mon) + '): không trừ ⭐.'
              : 'Bỏ cờ "đã thuộc" của thẻ "' + this.chuThe(x) + '" (' + this.tenMon(x.mon) + '): thẻ quay lại lịch ôn; không trừ ⭐.' };
        },
        // Tab Toán: gỡ MỘT lần làm. `x` = dòng của bảng (i, ts, g, kq, x…); `d` = dạng chứa nó (bảng dạng) hoặc null (lần làm bài kiểm tra chuyên đề,
        // `cd` = chuyên đề). Hộp nêu bài + giờ + kết quả; khoá gửi lên là (i, ts, g) — đúng ba trường mà máy chủ dùng để chọn hàng attempt.
        hoiGoToan(x, d, cd) {
          const luc = this.ngay(x.ts).split(', ').pop() + ' ' + this.gio(x.ts);
          const hau = ' Lần này bị xoá khỏi sổ như chưa từng làm; ⭐ / mốc / Đạt chỉ nhờ lần này bị trừ. Chỉ trừ, không tự cộng bù: điểm mà các lần còn lại lẽ ra được thì con làm lại mới có.';
          this.bao = '';
          this.hoi = { viec: 'toan', tieu: 'Gỡ lần làm này?', x, loi: '', het: false,
            chu: d ? 'Bài "' + x.de + '" (' + d.chu + ') lúc ' + luc + ': ' + x.kq + ', con ghi "' + x.x + '".' + hau
                   : 'Bài kiểm tra chuyên đề "' + cd.chu + '" lúc ' + luc + ': ' + x.kq + ', đúng ' + x.x + '.' + hau };

              const n = Number(d.tru) || 0;

              await this.nap('toan', true);
              return;
            }
            await this.api('/api/quantri/thuoc/go', { user: this.user, mon: h.x.mon, i: h.x.i, c: h.x.c });
            this.hoi = null;
            this.bao = 'Đã bỏ cờ "đã thuộc".';

          } catch (e) {
            h.loi = e.message;
            if (e.het) h.het = true;
            else if (h.viec === 'toan') await this.nap('toan', true);   // máy chủ có thể ĐÃ gỡ mà câu trả lời không về: nạp lại cho bảng khớp sổ

              <template x-for="(n, ni) in l.nut" :key="ni">
                <button type="button" data-qt-bt-sua-nut :data-dat="n.dat ? '1' : '0'" @click="suaViet(m.slug, y, l, n.dat)" :disabled="dang"
                        class="min-h-9 px-3 rounded-lg border border-slate-300 bg-white text-xs font-semibold text-slate-700 disabled:opacity-50" x-text="n.chu"></button>
              </template>
            </div>
          </template>
          <p data-qt-bt-sua-loi x-show="suaLoi && suaKhoa === y.id + '/' + l.ts" x-text="suaLoi" role="alert" class="mt-1 text-xs font-semibold text-rose-700"></p>
        </li>
      </template>
    </ul>
  </template>
  <template x-if="y.dien && y.dien.length">
    <p data-qt-bt-dien class="mt-1 whitespace-pre-wrap break-words rounded-lg bg-slate-50 px-3 py-2 text-slate-800">Con điền: <template x-for="(s, si) in y.dien" :key="si"><span><template x-if="s.anh"><img :src="s.anh" :alt="s.alt" class="inline-block h-10 w-10 rounded object-cover align-middle"></template><template x-if="!s.anh"><span x-text="s.t"></span></template></span></template></p>
  </template>
  <template x-if="y.dap && y.dap.length">
    <p data-qt-bt-dap class="mt-1 whitespace-pre-wrap break-words rounded-lg bg-emerald-50 px-3 py-2 text-emerald-900">→ đúng là <template x-for="(s, si) in y.dap" :key="si"><span><template x-if="s.anh"><img :src="s.anh" :alt="s.alt" class="inline-block h-10 w-10 rounded object-cover align-middle"></template><template x-if="!s.anh"><span x-text="s.t"></span></template></span></template></p>
  </template>
</li>
                                              </template>
                                            </ul>
                                          </div>
                                        </template>
                                      </li>
                                    </template>
                                  </ul>
                                </div>
                              </template>
                            </div>
                          </template>
                        </div>
                      </template>
                    </section>
                  </template>
                </div>
              </template>
            </section>
          </div>
        </template>

        
        <template x-if="hoi">
          <div data-qt-hoi role="dialog" aria-modal="true" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 px-4">
            <div class="w-full max-w-md bg-white rounded-2xl shadow-xl px-5 py-4">
              <p data-qt-hoi-tieu class="font-bold text-slate-800" x-text="hoi.tieu"></p>
              <p data-qt-hoi-chu class="mt-2 text-sm text-slate-700" x-text="hoi.chu"></p>
              <p data-qt-hoi-loi x-show="hoi.loi" x-text="hoi.loi" role="alert" class="mt-2 text-sm font-semibold text-rose-700"></p>
              <div class="mt-4 flex justify-end gap-2">
                <button type="button" data-qt-hoi-thoi @click="dongHoi()" :disabled="dang" class="h-10 px-4 rounded-lg border border-slate-300 bg-white text-sm"
                        x-text="hoi.het ? 'Đóng' : 'Thôi'"></button>
                <button type="button" data-qt-hoi-go x-show="!hoi.het" @click="xacNhan()" :disabled="dang"
                        class="h-10 px-4 rounded-lg bg-rose-600 text-white text-sm font-semibold">Xác nhận</button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>
  </main>
</body>
</html>
